[package]
name = "dsa-guest-channeld"
version = "0.1.0"
description = "The guest's control channel daemon: connects to the host, passes the handshake, carries frames"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Runs the daemon over vsock loopback (CID 1); needs the vsock_loopback kernel module.
vsock-loopback-tests = []

[[bin]]
name = "dsa-channeld"
path = "src/main.rs"

[[bin]]
name = "su"
path = "src/su.rs"

[dependencies]
dsa-transport.workspace = true
dsa-protocol.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
dsa-guest-transport = { path = "../transport" }
libc = "0.2"

[dev-dependencies]
dsa-protocol-schema.workspace = true
# The host's DNS service, which the guest's DNS stub is tested against.
dsa-host-core.workspace = true
