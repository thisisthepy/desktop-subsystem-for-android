[package]
name = "dsa-guest-transport"
version = "0.1.0"
description = "The guest side of the control channel: vsock"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Runs the conformance suite over vsock loopback (CID 1). Needs the vsock_loopback kernel
# module, so it is opt-in; CI loads the module and turns this on.
vsock-loopback-tests = []

[dependencies]
dsa-transport.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
dsa-transport = { workspace = true, features = ["conformance"] }
