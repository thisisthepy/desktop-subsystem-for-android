# The Rust workspace. It lives here rather than at the repository root because a root
# manifest has not been approved; every Rust crate in the project is a member.
[workspace]
resolver = "2"
members = [
    "protocol/transport",
    "protocol/schema",
    "protocol/codegen",
    "protocol/rust",
    "host/core",
    "host/platform/windows",
    "host/platform/unix",
    "guest/transport",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"
publish = false

[workspace.dependencies]
dsa-transport = { path = "protocol/transport" }
dsa-protocol-schema = { path = "protocol/schema" }
dsa-protocol = { path = "protocol/rust" }
dsa-host-core = { path = "host/core" }
prost = "0.14"
