// The local API between the DSA service and the apps in a user's session.
//
// The service does what needs privileges (starting the Android VM); the apps (the start
// menu entries, the compositor, the settings screen, the command line tool) ask it over
// this API. This file is the only definition of its messages; the codecs are generated
// from it (see README.md).
//
// A connection carries requests and their responses, until the client sends WatchTasks.
// From the answer to that request on, the connection carries only TaskEvent frames from
// the service; a client that sends anything more on it is disconnected. In the same way,
// from the answer to StreamInput on, the connection carries only PointerEvent, KeyEvent and
// text input frames (ImeComposition, ImeCommit, ImeDeleteSurrounding, ImeSetSelection and
// ImeSetComposingRegion) from the client, and the service answers none of them.
// From the answer to WatchLog on, the connection carries only LogEntries frames from the
// service, and from the answer to CollectDiagnostics on, only DiagnosticsData frames.
//
// The caller's identity is the user the operating system reports for the connection.
// Nothing in these messages names a user, so a client cannot claim to be someone else, and
// every request acts on the caller's own Android only.
//
// The same rules as control.proto keep the handshake readable across versions: Envelope
// fields 1 to 3, and every field of Hello, HelloAccepted, HelloRejected and RejectReason,
// keep their numbers and types forever.

syntax = "proto3";

package dsa.hostapi.v1;

option java_package = "io.github.thisisthepy.dsa.hostapi.v1";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// The protocol version. CURRENT goes up when the meaning of existing messages changes.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

// Which end of the connection a peer is.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_SERVICE = 1;
  ROLE_CLIENT = 2;
}

// The first frame on a new connection, sent by the client.
message Hello {
  uint32 protocol_version = 1;
  // SHA-256 of the normalised definition the sender was generated from (32 bytes).
  bytes schema_hash = 2;
  Role role = 3;
  // Free text naming the sender's build, for error reports only.
  string build = 4;
}

// The service's answer when the client's Hello matches.
message HelloAccepted {
  Hello service = 1;
}

// Why the service refused a connection.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_PROTOCOL_VERSION_MISMATCH = 1;
  REJECT_REASON_SCHEMA_HASH_MISMATCH = 2;
  REJECT_REASON_UNEXPECTED_ROLE = 3;
  REJECT_REASON_MALFORMED_HELLO = 4;
}

// The service's answer when it refuses the client. It closes the connection after it.
message HelloRejected {
  RejectReason reason = 1;
  // A sentence a person can act on, naming both sides' values.
  string detail = 2;
  Hello service = 3;
}

// Where the caller's Android is in its life.
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_STOPPED = 1;
  SESSION_STATE_STARTING = 2;
  SESSION_STATE_ACTIVE = 3;
  SESSION_STATE_DOZING = 4;
  SESSION_STATE_FROZEN = 5;
  SESSION_STATE_STOPPING = 6;
  // The guest runs but is not ready and has taken too long; Status.problem says why. It
  // leaves this state by itself when the cause goes away.
  SESSION_STATE_STALLED = 7;
}

// Asks for the state of the caller's Android.
message GetStatus {}

// Starts the caller's Android. Returns at once; the state moves on its own.
message StartSession {}

// Stops the caller's Android. Returns at once; the state moves on its own.
message StopSession {}

// Installs the newest version of DSA now instead of waiting until no Android is running.
// It downloads that version first when it has not been downloaded yet, stops every user's
// Android, and starts setup, which stops the service and starts the new one. It returns
// once setup has started, or says that DSA is up to date.
message UpdateProgram {}

// Asks for the runtime ID of the caller's Android VM.
message GetVmId {}

// Asks for the app tasks of the caller's Android, each of which the compositor shows as one
// window.
message ListTasks {}

// Asks for the app tasks of the caller's Android, and for every change to them from then
// on. The service answers with Tasks, then sends a TaskEvent for each change. The watch
// lasts across restarts of the Android: when it stops, its tasks are removed.
message WatchTasks {}

// Asks for the apps installed in the caller's Android that a launcher lists, as the host's
// start menu shows them. With `refresh`, the caller's Android must be running: it reads the
// apps again, sizes included, and the answer waits for that fresh list.
message ListApps {
  bool refresh = 1;
}

// Opens Android's own settings for an app (its permissions, storage and notifications) in a
// window of its own. An empty `package_name` opens Android's list of every installed app.
// Answered with Done once Android has been asked.
message OpenAppSettings {
  string package_name = 1;
  // Which of Android's pages for the app. Ignored without a package.
  AppSettingsPage page = 2;
}

// One of Android's settings pages for an app.
enum AppSettingsPage {
  // The app's info: its permissions, storage and notifications.
  APP_SETTINGS_PAGE_DETAILS = 0;
  // The app's aspect ratio, which the user may override.
  APP_SETTINGS_PAGE_ASPECT_RATIO = 1;
  // Whether the links the app supports open in the app or in the browser.
  APP_SETTINGS_PAGE_OPEN_BY_DEFAULT = 2;
}

// Uninstalls an app the user installed in the caller's Android. Android must be running. The
// answer is UninstallResult.
message UninstallApp {
  // An Android package name, such as "com.example.notes".
  string package_name = 1;
}

// Whether an app was uninstalled, and if not, why.
enum UninstallStatus {
  UNINSTALL_STATUS_UNSPECIFIED = 0;
  // The app is gone.
  UNINSTALL_STATUS_SUCCESS = 1;
  // No app of that package is installed.
  UNINSTALL_STATUS_NOT_INSTALLED = 2;
  // The app is part of the Android image; only apps the user installed can be uninstalled.
  UNINSTALL_STATUS_SYSTEM_APP = 3;
  // Android refused: the app is a device administrator, or a policy keeps it.
  UNINSTALL_STATUS_BLOCKED = 4;
  // Anything else. The message says what.
  UNINSTALL_STATUS_OTHER = 5;
}

// The answer to UninstallApp.
message UninstallResult {
  string package_name = 1;
  UninstallStatus status = 2;
  // Android's own words, for the log and a bug report.
  string message = 3;
}

// The user closed a task's window: asks the caller's Android to end the task.
message CloseTask {
  int32 task_id = 1;
}

// Asks the caller's Android to start an app's launcher activity as a new task in its own
// window.
message LaunchApp {
  string package_name = 1;
  // Start another task of the app even when it has one, in a window of its own. Only for an
  // app that supports several windows (AppInfo.multiple_windows).
  bool new_window = 2;
}

// The user's Stop: asks the caller's Android to end every process of an app and give its
// memory back, even one a placed widget or a foreground service keeps running.
message StopApp {
  string package_name = 1;
}

// The user resized a task's window: asks the caller's Android to give the task the
// window's client size, in Android display pixels. `live` is true while the user is still
// dragging the window's edge: the task takes the size without being reconfigured, and the
// request with `live` false at the end of the drag reconfigures it once.
message ResizeTask {
  int32 task_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bool live = 4;
}

// A task's window moved to a monitor of another scale: asks the caller's Android to draw
// the task at `density_dpi` (130 at a scale of 100%, where a dp is 0.819 of a host pixel).
message SetTaskDensity {
  int32 task_id = 1;
  uint32 density_dpi = 2;
}

// A task's window draws its title bar over the top `height` pixels of the task: asks the
// caller's Android to give the task a top system bar inset of that height. 0 removes it.
//
// `start_width` and `end_width` are how far the window's icon and its caption buttons reach
// into the band from its left and right ends, in Android display pixels, which an app that
// draws its own title bar keeps its controls out of.
message SetTaskCaption {
  int32 task_id = 1;
  uint32 height = 2;
  uint32 start_width = 3;
  uint32 end_width = 4;
}

// Turns the connection into a stream of input for the caller's Android: after the answer
// (Done), the client sends only PointerEvent, KeyEvent and text input frames, which the
// service passes on as they come, without answering them. Input is never waited on, so a pointer that moves
// fast is not held back by the answers.
message StreamInput {}

// Says whether any task window of the caller's Android is shown: open and not minimized. The
// window manager sends it on each change. Once no window has been shown for a while, the
// caller's Android turns its screen off and goes into Doze; it wakes as soon as a window is
// shown again. The service keeps the latest value while the Android is not running, for its
// next start.
message SetWindowsShown {
  bool shown = 1;
}

// Says whether the caller's window manager can turn the host's three- and four-finger touch
// gestures off (Settings.touch_gestures_off): `state` is "unsupported", "available" or
// "failed", and `problem` says why while it is "failed". The window manager sends it when
// it connects and whenever it changes. The service keeps the latest for the caller until it
// stops, and reports it in Settings. The service answers Done.
message ReportTouchGestures {
  string state = 1;
  string problem = 2;
}

// Freezes the caller's Android: its processes stop until a task window is shown again. Its
// notifications, alarms and widgets stop with them. Returns at once with the status.
message FreezeSession {}

// Turns the connection into the web links the caller's Android opens: after the answer
// (Done), the service sends an OpenLink each time an app in it opens an http or https link
// while the user has links open on the host (Settings.links_in_android off), and the client
// opens it in the user's default browser. Nothing is answered. The connection lasts across
// restarts of the Android.
message WatchLinks {}

// A web link an app in the caller's Android opened, on a connection that carries links
// (WatchLinks). The service sends only http and https links; the client checks again.
message OpenLink {
  string url = 1;
}

// What the user wants done with a file sent to their Android.
enum FileAction {
  FILE_ACTION_UNSPECIFIED = 0;
  // Open it in an app the user picks.
  FILE_ACTION_VIEW = 1;
  // Share it with an app the user picks.
  FILE_ACTION_SEND = 2;
}

// Sends a file from the host to the caller's Android, which asks the user which app opens or
// takes it. The service answers at once: Done when it takes a file of this name and size, or
// an error. After Done the client sends the file's `size` bytes in FileChunk frames, which
// are not answered, and the service answers the same request id once more: Done once Android
// has the whole file and has asked the user, or an error. The connection then ends.
message OpenFile {
  // The file's name, without any folder.
  string name = 1;
  // The file's length in bytes.
  uint64 size = 2;
  FileAction action = 3;
  // The app to share the file with, as when the user drops the file on that app's window.
  // Empty to let the user pick.
  string package = 4;
}

// Asks where the host's file manager shows the caller's Android shared storage. The service
// starts the caller's Android when it is not running, has it serve its shared storage, and
// answers with AndroidFilesLocation.
message GetAndroidFiles {}

// Where the caller's Android shared storage can be opened, such as
// "\localhost@52714f9a...". It changes when the service or Android restarts.
message AndroidFilesLocation {
  string location = 1;
}

// Part of a file's content, on a connection that sends a file (OpenFile).
message FileChunk {
  bytes data = 1;
}

// One thing an app drags out of its window: a file or text. Only the file's name, never a
// path in Android, reaches the host.
message DragItem {
  // The file's name, without any folder. Empty for text.
  string name = 1;
  // The file's length in bytes, when Android says (`size_known`).
  uint64 size = 2;
  bool size_known = 3;
  string mime_type = 4;
  // Whether this item is text rather than a file, and the text itself.
  bool is_text = 5;
  string text = 6;
}

// The pointer left the window of task `task_id` with a button held, at (`x`, `y`) relative
// to the task. If an app in the caller's Android is dragging something the host can take,
// Android ends its drag and the service answers DragOffer with what it carries, which the
// client then drags on the host; otherwise DragOffer with no items. Android must be running.
message DragOut {
  int32 task_id = 1;
  float x = 2;
  float y = 3;
  PointerTool tool = 4;
  uint32 pointer_id = 5;
}

// What a drag out of a window carries. No items: nothing to drag on the host.
message DragOffer {
  // Names the drag in ReadDrag and EndDrag.
  uint32 drag_id = 1;
  repeated DragItem items = 2;
}

// Reads up to `length` bytes (at most 256 KiB) of item `item` of drag `drag_id`, from
// `offset`. The service answers DragData.
message ReadDrag {
  uint32 drag_id = 1;
  uint32 item = 2;
  uint64 offset = 3;
  uint32 length = 4;
}

// Part of a dragged file. `end` says the file ends after `data`.
message DragData {
  bytes data = 1;
  bool end = 2;
}

// Ends drag `drag_id`, dropped or cancelled, so Android closes what it read and gives back
// its access to the drag's content. The service answers Done.
message EndDrag {
  uint32 drag_id = 1;
  bool dropped = 2;
}

// Turns the connection into the caller's clipboard: after the answer (Done), the client sends
// a ClipboardText each time the user's host clipboard gets new text, and the service sends a
// ClipboardText each time the caller's Android copies text, which the client puts on the host
// clipboard. Neither is answered. The service passes on nothing while the user has turned
// clipboard sharing off. The connection lasts across restarts of the Android: the service keeps
// the host's latest text and gives it to the Android when it is next ready.
message WatchClipboard {}

// Text on a clipboard, on a connection that carries the clipboard (WatchClipboard).
message ClipboardText {
  string text = 1;
}

// Turns the connection into a watch of the notifications of the caller's Android: after the
// answer (Done), the service sends a Notification each time an app posts one or changes one,
// and a NotificationRemoved when one is gone, including every one that was shown when the
// Android stops. The client sends nothing more on it. The watch lasts across restarts of the
// Android.
message WatchNotifications {}

// Turns the connection into the location of the caller's Android: after the answer (Done),
// the service sends a LocationWanted at once and each time the Android starts or stops
// wanting locations. While one is wanted, the client runs the host's location service in the
// user's session, where the user's privacy settings apply, and sends a LocationFix for each
// position and a LocationStatus each time access changes. Neither is answered. The
// connection lasts across restarts of the Android, which wants no location while stopped.
message WatchLocation {}

// Whether the caller's Android wants locations now, and how often.
message LocationWanted {
  bool active = 1;
  // In milliseconds; 0 lets the client choose.
  uint32 interval_ms = 2;
}

// Whether the user's host lets DSA read its location.
enum LocationAccess {
  LOCATION_ACCESS_UNSPECIFIED = 0;
  LOCATION_ACCESS_ALLOWED = 1;
  // Location is off for DSA, or for the whole computer, in the privacy settings.
  LOCATION_ACCESS_DENIED = 2;
  // No location device, or the location service failed.
  LOCATION_ACCESS_UNAVAILABLE = 3;
}

// Whether the client can give locations, on a connection that carries the location.
message LocationStatus {
  LocationAccess access = 1;
  string detail = 2;
}

// One position from the host's location service, on a connection that carries the location.
// Each `has_` flag says whether the value after it is known.
message LocationFix {
  double latitude_degrees = 1;
  double longitude_degrees = 2;
  // In meters; 0 when unknown.
  float horizontal_accuracy_meters = 3;
  bool has_altitude = 4;
  double altitude_meters = 5;
  // In meters; 0 when unknown.
  float vertical_accuracy_meters = 6;
  bool has_speed = 7;
  float speed_meters_per_second = 8;
  bool has_bearing = 9;
  float bearing_degrees = 10;
  // Milliseconds since the Unix epoch (UTC).
  uint64 unix_time_ms = 11;
}

// Turns the connection into the speech and spelling of the caller's Android: after the
// answer (Done), the service sends a LanguageServiceFrame for each request the Android's
// text-to-speech engine, speech recognition service or spell checker makes (ListSpeechVoices,
// SpeakText, StopSpeaking, StartRecognition, StopRecognition, CancelRecognition and
// CheckSpelling), and the client answers each with LanguageServiceFrame messages of its own
// (SpeechVoices, SpeechAudio, SpeechDone, RecognitionEvent and SpellingResult), which the
// service passes to the Android. The client runs the host's speech synthesis, speech
// recognition and spell checker in the user's session, where the user's voices, dictionaries
// and privacy settings are. Requests go to the first client still connected; when its
// connection ends, every request it had not finished fails in the Android. The connection
// lasts across restarts of the Android.
message ServeLanguageServices {}

// One message of control.proto (an encoded Envelope of dsa.control.v1), on a connection that
// serves speech and spelling. The service checks each one the client sends is an answer and
// passes it on unchanged, so the messages are defined once, where the Android reads them.
message LanguageServiceFrame {
  bytes control = 1;
}

// A notification of the caller's Android, on a connection that watches them
// (WatchNotifications). One with the key of an earlier one replaces it.
message Notification {
  string key = 1;
  string package_name = 2;
  string app_label = 3;
  string title = 4;
  string text = 5;
  // A PNG image; empty for none.
  bytes icon_png = 6;
  // As Android numbers it: 1 minimum, 2 low, 3 default, 4 high.
  int32 importance = 7;
  bool high_priority = 8;
  // Whether the user may dismiss it.
  bool clearable = 9;
  int64 when_millis = 10;
}

// The notification with this key is gone, on a connection that watches them.
message NotificationRemoved {
  string key = 1;
}

// What the user did with a notification on the host.
enum NotificationAction {
  NOTIFICATION_ACTION_UNSPECIFIED = 0;
  // Clicked it: the app opens it, and its task shows as a window. Android leaves Doze first.
  NOTIFICATION_ACTION_OPEN = 1;
  // Dismissed it: it is removed in Android too, unless the app made it one the user cannot
  // dismiss.
  NOTIFICATION_ACTION_DISMISS = 2;
}

// Passes what the user did with a notification of the caller's Android to it. Answered with
// Done.
message ActOnNotification {
  string key = 1;
  NotificationAction action = 2;
}

// Turns the connection into a watch of the print jobs of the caller's Android: after the
// answer (Done), the service sends a PrintJobOffer for each document an app prints, followed
// by its PrintJobData pieces, and a PrintJobWithdrawn when a job is canceled in Android or
// Android stops before the job is answered. Each job goes to one watcher only. The client
// answers each job with ReportPrintJob, on another connection, and sends nothing on this
// one. The watch lasts across restarts of the Android.
message WatchPrintJobs {}

// A print job of the caller's Android, on a connection that watches them. Its PDF document of
// `size` bytes follows in PrintJobData pieces, in order. The settings are what the user chose
// in Android's print dialog.
message PrintJobOffer {
  // The service's number for the job, unique while the service runs.
  uint32 job_id = 1;
  string package_name = 2;
  string app_label = 3;
  string document_name = 4;
  uint64 size = 5;
  // 0 when the app did not say.
  uint32 page_count = 6;
  uint32 copies = 7;
  bool color = 8;
  bool duplex = 9;
  bool landscape = 10;
  // The paper's size, in thousandths of an inch; 0 when unknown.
  uint32 media_width_mils = 11;
  uint32 media_height_mils = 12;
}

// One piece of a print job's document, at most 1 MiB. The piece that reaches the job's size
// ends it.
message PrintJobData {
  uint32 job_id = 1;
  uint64 offset = 2;
  bytes data = 3;
}

// The job is gone from Android, canceled there or ended with it; it is not to be printed.
message PrintJobWithdrawn {
  uint32 job_id = 1;
}

// What became of a print job on the host.
enum PrintOutcome {
  PRINT_OUTCOME_UNSPECIFIED = 0;
  PRINT_OUTCOME_PRINTED = 1;
  // The user canceled the print dialog.
  PRINT_OUTCOME_CANCELED = 2;
  // It could not be printed; the message says why.
  PRINT_OUTCOME_FAILED = 3;
}

// Tells the caller's Android what became of one of its print jobs. Answered with Done, also
// for a job Android no longer has.
message ReportPrintJob {
  uint32 job_id = 1;
  PrintOutcome outcome = 2;
  string message = 3;
}

// Turns the connection into the geocoding of the caller's Android: after the answer (Done),
// the service sends a GeocodeQuery each time an app in the Android looks up an address. Each
// query goes to one watcher only. The client looks it up with the host's geocoding service,
// in the user's session, and answers each query with ReportGeocode on another connection. It
// sends nothing on this one. The watch lasts across restarts of the Android.
message WatchGeocoding {}

// One lookup of an app in the caller's Android, on a connection that watches them.
message GeocodeQuery {
  // The service's number for the query, unique while the service runs.
  uint32 query_id = 1;
  // True for a reverse lookup (a position to addresses), false for a forward one.
  bool reverse = 2;
  string query = 3;
  double latitude_degrees = 4;
  double longitude_degrees = 5;
  bool has_bounds = 6;
  double lower_left_latitude = 7;
  double lower_left_longitude = 8;
  double upper_right_latitude = 9;
  double upper_right_longitude = 10;
  // From 1.
  uint32 max_results = 11;
  // A BCP 47 tag; empty for the host's own language.
  string language = 12;
}

// How a lookup ended on the host.
enum GeocodeStatus {
  GEOCODE_STATUS_UNSPECIFIED = 0;
  GEOCODE_STATUS_OK = 1;
  // No network, or the geocoding service failed.
  GEOCODE_STATUS_UNAVAILABLE = 2;
  // The user turned geocoding off on the host.
  GEOCODE_STATUS_REFUSED = 3;
  // Too many lookups in a short time.
  GEOCODE_STATUS_BUSY = 4;
  // The query cannot be answered as it is.
  GEOCODE_STATUS_INVALID = 5;
}

// One address a lookup found. Empty strings are parts the service did not give.
message GeocodeAddress {
  repeated string address_lines = 1;
  string feature_name = 2;
  string premises = 3;
  string sub_thoroughfare = 4;
  string thoroughfare = 5;
  string sub_locality = 6;
  string locality = 7;
  string sub_admin_area = 8;
  string admin_area = 9;
  string postal_code = 10;
  // ISO 3166-1 alpha-2, upper case.
  string country_code = 11;
  string country_name = 12;
  bool has_position = 13;
  double latitude_degrees = 14;
  double longitude_degrees = 15;
}

// Tells the caller's Android what a lookup found. Answered with Done, also for a query the
// Android no longer waits for.
message ReportGeocode {
  uint32 query_id = 1;
  GeocodeStatus status = 2;
  repeated GeocodeAddress addresses = 3;
  string message = 4;
}

// Turns the connection into a watch of what apps in the caller's Android share with the
// host ("Share on PC" in Android's share sheet): after the answer (Done), the service sends a
// ShareOffer for each share. Each share goes to one watcher only. The client reads its files
// with ReadDrag (the share's ID is the drag's), ends it with EndDrag, shows the host's share
// UI, and answers with ReportShare on another connection. It sends nothing on this one. The
// watch lasts across restarts of the Android.
message WatchShares {}

// Content an app in the caller's Android shares with the host, on a connection that watches
// shares.
message ShareOffer {
  // The drag ID its files are read with, unique among the Android's shares and drags.
  uint32 share_id = 1;
  // The subject or title the app gave; empty when none.
  string title = 2;
  string package_name = 3;
  string app_label = 4;
  repeated DragItem items = 5;
}

// What became of a share on the host.
enum ShareOutcome {
  SHARE_OUTCOME_UNSPECIFIED = 0;
  SHARE_OUTCOME_SHARED = 1;
  // The user closed the share UI without sharing.
  SHARE_OUTCOME_CANCELED = 2;
  // It could not be shared; the message says why.
  SHARE_OUTCOME_FAILED = 3;
}

// Tells the caller's Android what became of one of its shares. Answered with Done.
message ReportShare {
  uint32 share_id = 1;
  ShareOutcome outcome = 2;
  string message = 3;
}

// An app in the caller's Android that runs a foreground service, so it keeps running with no
// window: music playback, a download, a VPN. One per package.
message BackgroundApp {
  string package_name = 1;
  string app_label = 2;
  // The app's icon, a PNG image; empty for none.
  bytes icon_png = 3;
  // The title and text of the notification the service keeps shown.
  string title = 4;
  string text = 5;
  // The titles of that notification's actions, in its order ("Pause", "Next").
  repeated string actions = 6;
}

// The state of a media session's playback.
enum MediaPlayback {
  MEDIA_PLAYBACK_UNSPECIFIED = 0;
  MEDIA_PLAYBACK_STOPPED = 1;
  MEDIA_PLAYBACK_PLAYING = 2;
  MEDIA_PLAYBACK_PAUSED = 3;
}

// An app's active media session in the caller's Android. One per package.
message MediaSession {
  string package_name = 1;
  string app_label = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  // The album art, a PNG image; empty for none.
  bytes art_png = 6;
  MediaPlayback playback = 7;
  bool can_play = 8;
  bool can_pause = 9;
  bool can_next = 10;
  bool can_previous = 11;
}

// Asks for the apps that run in the background in the caller's Android and their media
// sessions. The answer is BackgroundApps; an Android that is not running has none.
message ListBackgroundApps {}

// The apps that run in the background, and the active media sessions.
message BackgroundApps {
  repeated BackgroundApp apps = 1;
  repeated MediaSession media = 2;
}

// Watches the apps that run in the background. The answer is BackgroundApps, and the
// connection then carries a BackgroundAppEvent for each change. The client sends nothing
// more on it. When the Android stops, every app and session is removed. The watch lasts
// across restarts of the Android.
message WatchBackgroundApps {}

message BackgroundAppRemoved {
  string package_name = 1;
}

message MediaSessionRemoved {
  string package_name = 1;
}

// A change to the apps that run in the background, on a connection that watches them.
message BackgroundAppEvent {
  oneof body {
    // An app started to run in the background, or its notification changed.
    BackgroundApp app = 1;
    BackgroundAppRemoved app_removed = 2;
    // A session became active, or its metadata or playback changed.
    MediaSession media = 3;
    MediaSessionRemoved media_removed = 4;
  }
}

// What the user does with an app that runs in the background.
enum BackgroundAppCommand {
  BACKGROUND_APP_COMMAND_UNSPECIFIED = 0;
  // Opens the app's window, as clicking its notification does. Android leaves Doze first.
  BACKGROUND_APP_COMMAND_OPEN = 1;
  // Runs the notification's action with the index in `action`.
  BACKGROUND_APP_COMMAND_ACTION = 2;
  // Stops the app: Android force-stops it, which ends its services and frees its memory.
  BACKGROUND_APP_COMMAND_STOP = 3;
}

// Acts on an app of the caller's Android that runs in the background. Answered with Done.
message ActOnBackgroundApp {
  string package_name = 1;
  BackgroundAppCommand command = 2;
  int32 action = 3;
}

// A command for a media session.
enum MediaCommand {
  MEDIA_COMMAND_UNSPECIFIED = 0;
  MEDIA_COMMAND_PLAY = 1;
  MEDIA_COMMAND_PAUSE = 2;
  MEDIA_COMMAND_NEXT = 3;
  MEDIA_COMMAND_PREVIOUS = 4;
  MEDIA_COMMAND_STOP = 5;
}

// Runs a command on the package's media session, as a media key does. Answered with Done.
message ControlMedia {
  string package_name = 1;
  MediaCommand command = 2;
}

// One output of the caller's Android's sound, and the app it plays. Android sends every
// output at full scale; the host plays it at `volume`, under the app's name and icon.
message AppAudioStream {
  // The output, as the audio port names it ("app 0", "primary").
  string stream = 1;
  // Empty for the shared output, which every sound of an app without its own plays on.
  string package_name = 2;
  string app_label = 3;
  // From 0 (silent) to 1 (full).
  float volume = 4;
  bool muted = 5;
}

// The outputs of the caller's Android's sound, the whole list.
message AppAudio {
  repeated AppAudioStream streams = 1;
}

// Watches which app each output of the caller's Android's sound plays, and its volume. The
// answer is AppAudio, and the connection then carries an AppAudio each time it changes; an
// Android that stops gives an empty one. The client sends nothing more on it. The watch lasts
// across restarts of the Android.
message WatchAppAudio {}

// The user set an app's volume or mute in the host's volume mixer: it becomes the volume
// Android gives the app. Empty `package_name` is the shared output. Answered with Done.
message SetAppVolume {
  string package_name = 1;
  // From 0 to 1.
  float volume = 2;
  bool muted = 3;
}

// Asks for the widgets the apps in the caller's Android offer. The answer is WidgetProviders.
// Needs the caller's Android to be running.
message ListWidgetProviders {}

// One widget an app in the caller's Android offers.
message WidgetProvider {
  // The provider's component, as `package/class`. AddWidget names it.
  string provider = 1;
  string package_name = 2;
  string label = 3;
  // A PNG image of at most 160 pixels on a side; empty for none.
  bytes preview_png = 4;
  // Sizes in density-independent pixels (dp), which are the host's device-independent
  // pixels: a dp is one pixel at a scale of 100%. A maximum of 0 means no limit.
  uint32 min_width_dp = 5;
  uint32 min_height_dp = 6;
  uint32 default_width_dp = 7;
  uint32 default_height_dp = 8;
  uint32 max_width_dp = 9;
  uint32 max_height_dp = 10;
  // 1 horizontally, 2 vertically, 3 both, 0 not at all.
  uint32 resize_mode = 11;
  // Whether the app asks the user to set the widget up when it is placed.
  bool needs_configuration = 12;
  // The name of the app that offers the widget, as a launcher shows it. Empty when unknown.
  string app_label = 13;
  // Whether a placed widget can be set up again (ReconfigureWidget): its app says so and it
  // has a setup. Its menu offers its settings only then.
  bool reconfigurable = 14;
}

// The answer to ListWidgetProviders, in label order.
message WidgetProviders {
  repeated WidgetProvider providers = 1;
}

// Places a new widget of `provider` on the caller's desktop. When the app asks the user to set
// it up, its setup shows as a window first, and the answer waits for the user. The answer is
// the new Widget, or ERROR_CODE_WIDGET_REFUSED with the reason.
message AddWidget {
  string provider = 1;
}

// Removes a widget: Android forgets it, its window closes, and its place is forgotten.
message RemoveWidget {
  int32 widget_id = 1;
}

// Opens the setup of a placed widget whose app says it can be set up again, as the app's
// window, for the same widget. The answer waits for the user: the Widget once they finish the
// setup, which the widget then shows, or ERROR_CODE_WIDGET_REFUSED with the reason when they
// cancel it, when it could not start, or when the widget cannot be set up again. The widget
// stays where it is either way.
message ReconfigureWidget {
  int32 widget_id = 1;
}

// Where a widget's window is on the caller's desktop. The position is in the host's
// physical screen pixels; the size is in dp, so it stays the same on a monitor of another
// scale.
message WidgetPlacement {
  int32 x = 1;
  int32 y = 2;
  uint32 width_dp = 3;
  uint32 height_dp = 4;
}

// One widget placed on the caller's desktop.
message Widget {
  int32 widget_id = 1;
  WidgetProvider provider = 2;
  // Where its window goes: where the user left it, else a place the service picked.
  WidgetPlacement placement = 3;
}

// Asks for the widgets placed on the caller's desktop. The answer is Widgets.
message ListWidgets {}

// The answer to ListWidgets: the widgets Android has placed, in ID order.
message Widgets {
  repeated Widget widgets = 1;
  // How many widgets the service remembers a place for. Above 0 while Android is stopped,
  // its widgets come back once it runs.
  uint32 remembered = 2;
}

// Watches the caller's widgets. The answer is Widgets, and the connection then carries a
// WidgetEvent for each change. The client sends nothing more on it.
message WatchWidgets {}

// What a widget shows now: a PNG image of `width` by `height` pixels with an alpha channel.
message WidgetFrame {
  int32 widget_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  bytes png = 4;
}

// A widget was removed.
message WidgetRemoved {
  int32 widget_id = 1;
}

// A change to the caller's widgets, on a connection that watches them.
message WidgetEvent {
  oneof body {
    // A widget was placed, or Android described it again, as when it starts.
    Widget placed = 1;
    WidgetFrame frame = 2;
    WidgetRemoved removed = 3;
  }
}

// The user moved or resized a widget's window. The service remembers the placement and
// tells Android the window's size, which the widget then draws at.
message PlaceWidget {
  int32 widget_id = 1;
  WidgetPlacement placement = 2;
  // The window's size in its monitor's pixels, and Android's density for it (130 at a scale
  // of 100%).
  uint32 width = 3;
  uint32 height = 4;
  uint32 density_dpi = 5;
}

// Pointer input in a widget's window, in the pixels the widget is drawn at.
message WidgetPointer {
  int32 widget_id = 1;
  PointerAction action = 2;
  uint32 pointer_id = 3;
  float x = 4;
  float y = 5;
}

// One file of an install made of several: an APK of an app that comes as a base APK and
// split APKs, or an expansion (OBB) file of that app.
message InstallPart {
  // The file's name, without any folder. An APK's ends in ".apk", an expansion file's in ".obb".
  string name = 1;
  // The file's length in bytes.
  uint64 size = 2;
  // True for an expansion file, which Android gets in the app's folder under Android/obb/ once
  // the app is installed.
  bool obb = 3;
}

// Installs an APK, or an app made of several APKs, in the caller's Android. The service answers
// at once: Done when it takes an install of this name, size and parts, or an error. After Done
// the client sends the `size` bytes in ApkChunk frames, which are not answered, and the service
// answers the same request id once more: InstallResult once Android has installed the app or
// refused it, or an error when the files did not reach Android. The connection then ends. A
// second install waits for the first.
message InstallApk {
  // The file's name, without any folder. With no parts it ends in ".apk"; with parts it is the
  // name of the bundle the parts come from, such as "notes.xapk".
  string name = 1;
  // The APK's length in bytes, or with parts the sum of their sizes.
  uint64 size = 2;
  // The native libraries the APK holds, by ABI, as the client read them from the file's
  // `lib/` folder. The service chooses the ABI the app is installed for from them: arm64-v8a
  // when translation is on and the x86_64 libraries leave out some of the arm64 ones,
  // otherwise what Android chooses. Empty for an APK without native code.
  repeated NativeLibraries native_libraries = 3;
  // Empty for one APK. Otherwise the files of the install, in the order their bytes follow one
  // another in the ApkChunk frames: the APKs first, then any expansion files. The native
  // libraries are then those of the APKs among them, together.
  repeated InstallPart parts = 4;
}

// The native libraries of one ABI: the file names under `lib/<abi>/` of an APK, or of an APK
// and its splits together.
message NativeLibraries {
  // Such as "x86_64" or "arm64-v8a".
  string abi = 1;
  // The library file names, such as "libmain.so", in name order, each once.
  repeated string names = 2;
}

// Part of an APK's content, on a connection that installs one (InstallApk).
message ApkChunk {
  bytes data = 1;
}

// Whether an APK was installed, and if not, why. The reasons are stable, so a client can say
// in the user's language what went wrong.
enum InstallStatus {
  INSTALL_STATUS_UNSPECIFIED = 0;
  INSTALL_STATUS_SUCCESS = 1;
  // The app does not run on this Android: its ABI, its minimum version or a feature it needs.
  INSTALL_STATUS_INCOMPATIBLE = 2;
  // The app is installed already, signed with another key.
  INSTALL_STATUS_CONFLICTING_SIGNATURE = 3;
  // The file is not an APK Android can read, or it is not signed.
  INSTALL_STATUS_INVALID_APK = 4;
  INSTALL_STATUS_INSUFFICIENT_STORAGE = 5;
  // A newer version of the app is installed.
  INSTALL_STATUS_DOWNGRADE = 6;
  // A policy of the Android does not allow the app.
  INSTALL_STATUS_BLOCKED = 7;
  INSTALL_STATUS_OTHER = 8;
}

// The second answer to InstallApk: how the install ended.
message InstallResult {
  InstallStatus status = 1;
  // The package that was installed, or that the APK is, when Android says.
  string package_name = 2;
  // Android's own words on what happened; empty when it gave none.
  string message = 3;
}

// Asks whether a package is installed in the caller's Android, and at which version and with
// which signing certificates. Android must be running; the answer is PackageState.
message GetPackage {
  // An Android package name, such as "com.example.notes".
  string package_name = 1;
}

// The answer to GetPackage.
message PackageState {
  // False when the package is not installed; the fields below are then empty.
  bool installed = 1;
  int64 version_code = 2;
  string version_name = 3;
  // The SHA-256 digest of each certificate the installed package is signed with.
  repeated bytes signer_sha256 = 4;
}

// What a pointer did.
enum PointerAction {
  POINTER_ACTION_UNSPECIFIED = 0;
  // The pointer touched down, or a mouse's first button went down.
  POINTER_ACTION_DOWN = 1;
  // The pointer moved while down, or a mouse's buttons changed while one stays down.
  POINTER_ACTION_MOVE = 2;
  // The pointer lifted, or a mouse's last button went up.
  POINTER_ACTION_UP = 3;
  // The gesture ended without completing, as when the window lost the pointer.
  POINTER_ACTION_CANCEL = 4;
  // The wheel turned; `scroll_x` and `scroll_y` say how far.
  POINTER_ACTION_SCROLL = 5;
  // The pointer moved over the window without touching it.
  POINTER_ACTION_HOVER_MOVE = 6;
  // The pointer left the window, or a pen went out of range.
  POINTER_ACTION_HOVER_EXIT = 7;
}

// What kind of pointer it is.
enum PointerTool {
  POINTER_TOOL_UNSPECIFIED = 0;
  POINTER_TOOL_MOUSE = 1;
  POINTER_TOOL_TOUCH = 2;
  POINTER_TOOL_PEN = 3;
  // A pen's eraser end.
  POINTER_TOOL_ERASER = 4;
}

// Pointer input in a task's window, sent on a connection that streams input.
message PointerEvent {
  int32 task_id = 1;
  PointerAction action = 2;
  PointerTool tool = 3;
  // Tells the fingers of one touch apart. Stays the same from DOWN to UP.
  uint32 pointer_id = 4;
  // The position relative to the task's top left corner, in Android display pixels.
  float x = 5;
  float y = 6;
  // The buttons held down after this event, as a set of bits: 1 primary, 2 secondary,
  // 4 tertiary (middle), 8 back, 16 forward, 32 a pen's first barrel button, 64 its second.
  uint32 buttons = 7;
  // From 0 to 1.
  float pressure = 8;
  // For SCROLL: how far the wheel turned, in notches. Positive `scroll_y` scrolls up,
  // positive `scroll_x` scrolls right.
  float scroll_x = 9;
  float scroll_y = 10;
  // A pen's tilt, in degrees from upright, from -90 to 90: positive `tilt_x` leans its top
  // toward the right of the screen, positive `tilt_y` toward the bottom (toward the user).
  // 0 for a pointer that does not measure it.
  float tilt_x = 11;
  float tilt_y = 12;
}

// What a key did.
enum KeyAction {
  KEY_ACTION_UNSPECIFIED = 0;
  // The key went down, or, with a `repeat_count` above 0, is repeated while it is held.
  KEY_ACTION_DOWN = 1;
  // The key came up.
  KEY_ACTION_UP = 2;
}

// A key pressed or released in a task's window, sent on a connection that streams input.
message KeyEvent {
  int32 task_id = 1;
  KeyAction action = 2;
  // Android's key code (android.view.KeyEvent.KEYCODE_*).
  uint32 key_code = 3;
  // How many times the key has been repeated since it went down: 0 for the press itself.
  uint32 repeat_count = 4;
  // The modifiers and locks in effect after this event, as Android's meta state bits
  // (android.view.KeyEvent.META_*).
  uint32 meta_state = 5;
  // When the window saw the event, in milliseconds of the host's clock, which wraps around.
  uint32 event_time_ms = 6;
  // Set on an UP the user did not make: the window lost the keyboard focus while the key
  // was held.
  bool canceled = 7;
}

// The text the host's input method is composing in a task's window, sent on a connection that
// streams input. It replaces the whole composition; an empty `text` removes it.
message ImeComposition {
  int32 task_id = 1;
  string text = 2;
  // Where the cursor is in `text`, in UTF-16 code units from its start.
  uint32 cursor = 3;
}

// Text typed in a task's window, sent on a connection that streams input: what the input
// method committed, or a character a key typed without one. It takes the place of the
// composition, which ends.
message ImeCommit {
  int32 task_id = 1;
  string text = 2;
}

// The host's input method deletes text around the cursor of the focused editor in a task,
// sent on a connection that streams input: `before_length` UTF-16 code units before the
// cursor and `after_length` after it.
message ImeDeleteSurrounding {
  int32 task_id = 1;
  uint32 before_length = 2;
  uint32 after_length = 3;
}

// Where the cursor of the editor focused in a task is, in the task's own pixels from its top
// left corner, which are its window's client pixels.
message ImeCursor {
  int32 task_id = 1;
  Rect cursor = 2;
}

// What kind of text the editor focused in a task takes, as its app declared it.
enum ImeInputKind {
  // The guest did not say. Taken as ordinary text.
  IME_INPUT_KIND_UNSPECIFIED = 0;
  // No editor in the task takes text; typed characters reach it as keys.
  IME_INPUT_KIND_NONE = 1;
  IME_INPUT_KIND_TEXT = 2;
  IME_INPUT_KIND_PASSWORD = 3;
  IME_INPUT_KIND_NUMBER = 4;
  // A number that is a password, such as a PIN.
  IME_INPUT_KIND_NUMBER_PASSWORD = 5;
  IME_INPUT_KIND_PHONE = 6;
  IME_INPUT_KIND_EMAIL = 7;
  IME_INPUT_KIND_URL = 8;
  IME_INPUT_KIND_PERSON_NAME = 9;
  IME_INPUT_KIND_DATE = 10;
  IME_INPUT_KIND_TIME = 11;
  IME_INPUT_KIND_SEARCH = 12;
}

// The editor focused in a task, as the input method reads it: its kind, and its text around
// the selection. Offsets are in UTF-16 code units from the start of the editor's whole text;
// the selection and the composition lie within `text`, and there is no composition when its
// start equals its end.
message ImeEditor {
  int32 task_id = 1;
  ImeInputKind kind = 2;
  string text = 3;
  uint32 text_start = 4;
  uint32 selection_start = 5;
  uint32 selection_end = 6;
  uint32 composition_start = 7;
  uint32 composition_end = 8;
}

// The host's input method selects text in the focused editor of a task, sent on a connection
// that streams input: from `start` to `end` in UTF-16 code units from the start of the
// editor's text, or the cursor at `start` when they are equal.
message ImeSetSelection {
  int32 task_id = 1;
  uint32 start = 2;
  uint32 end = 3;
}

// The host's input method makes text already in the focused editor of a task its
// composition, sent on a connection that streams input, as it does when it reconverts a word.
// Equal `start` and `end` end the composition and keep its text.
message ImeSetComposingRegion {
  int32 task_id = 1;
  uint32 start = 2;
  uint32 end = 3;
}

// A rectangle in Android display pixels: left and top inclusive, right and bottom
// exclusive.
message Rect {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

// One app task of the caller's Android. Every field is sent each time, so the latest one
// replaces what came before.
message Task {
  // Android's task ID, unique while the task lives.
  int32 task_id = 1;
  // Where the task is on Android's display.
  Rect bounds = 2;
  // The package of the task's root activity.
  string package_name = 3;
  // The title the task's window shows.
  string label = 4;
  // Whether the task has input focus in Android.
  bool focused = 5;
  // The density the task's app draws at, in dots per inch (130 at a scale of 100%). 0 when
  // unknown.
  uint32 density_dpi = 6;
  // The largest size Android can give the task, in its display pixels. 0 when unknown.
  uint32 max_width = 7;
  uint32 max_height = 8;
  // The smallest size Android gives the task, in its display pixels. 0 when unknown.
  uint32 min_width = 9;
  uint32 min_height = 10;
  // Whether the task's app asked for a light status bar (dark icons) or a dark one, which
  // the window's caption buttons follow.
  StatusBarAppearance status_bar_appearance = 11;
  // The status bar color the app set, as 0xAARRGGBB; 0 when none. Used only while the
  // appearance is unspecified.
  fixed32 status_bar_color = 12;
  // The orientation the task's top activity is locked to, if any.
  TaskOrientation orientation = 20;
  // Whether the task's app asked to fill the screen.
  bool fullscreen = 21;
  // Whether the task's app went into picture-in-picture.
  bool picture_in_picture = 22;
  // Whether the task's app draws its own title bar (it asked for a transparent caption bar
  // background): the window then draws only its caption buttons and the app's icon.
  bool transparent_caption = 23;
  // While `transparent_caption` is set: where in the title bar band the app has controls,
  // relative to the task's top left corner in Android display pixels. The rest of the band
  // drags the window.
  repeated Rect caption_interactive = 24;
  // Whether the task has somewhere to go back to (it is past its first activity), so the
  // window shows a back button in the place of the app's icon.
  bool can_go_back = 25;
  // Whether the task's top activity says it handles a change of density itself, so it
  // redraws at a new density rather than being relaunched. False when unknown.
  bool handles_density_change = 26;
}

// The orientation a task's top activity asks for.
enum TaskOrientation {
  TASK_ORIENTATION_UNSPECIFIED = 0;
  TASK_ORIENTATION_PORTRAIT = 1;
  TASK_ORIENTATION_LANDSCAPE = 2;
}

// Whether an app asked for dark status bar icons (a light status bar) or light ones.
enum StatusBarAppearance {
  STATUS_BAR_APPEARANCE_UNSPECIFIED = 0;
  STATUS_BAR_APPEARANCE_LIGHT = 1;
  STATUS_BAR_APPEARANCE_DARK = 2;
}

// The task ended.
message TaskRemoved {
  int32 task_id = 1;
}

// The frames of the task now arrive on the graphics stream as posts to `display_id`.
message TaskFrames {
  int32 task_id = 1;
  uint32 display_id = 2;
}

// The name and launcher icon of an app the caller's Android has a task of. Sent before the
// app's first task, and again before the next one once the app has had no task. In the list
// of installed apps it also carries the app's version, dates and sizes; for a task they are
// left empty.
message AppInfo {
  string package_name = 1;
  // The app's own name, as a launcher shows it.
  string label = 2;
  // The app's launcher icon, as a square PNG image of at most 256 pixels on a side. Empty
  // when Android gave none.
  bytes icon_png = 3;
  // The installed version, as the package manager reports it.
  string version_name = 4;
  int64 version_code = 5;
  // When the app was first installed and last updated, in milliseconds since the Unix epoch.
  uint64 first_install_time_ms = 6;
  uint64 last_update_time_ms = 7;
  // True for an app that is part of the Android image, which cannot be uninstalled.
  bool system_app = 8;
  // The storage the app takes, in bytes: its code, its data and its cache. Zero when the
  // agent could not read them.
  uint64 app_bytes = 9;
  uint64 data_bytes = 10;
  uint64 cache_bytes = 11;
  // The ABI the app's native code runs as, such as "x86_64" or "arm64-v8a". Empty for an app
  // without native code.
  string primary_abi = 12;
  // The native libraries the app's APKs on the device hold, base and splits together, by
  // ABI. Empty for an app without native code.
  repeated NativeLibraries native_libraries = 13;
  // The icon a window's title bar shows: an adaptive icon's foreground layer alone, as a
  // square PNG image. Empty for an app whose icon is not adaptive, which shows `icon_png`.
  bytes caption_icon_png = 14;
  // Whether the app supports several windows at once, so its windows offer New window.
  bool multiple_windows = 15;
  // How far the app may elevate to root: "off" (the default, su does not exist
  // for it), "ask" (each su call waits for the host's administrator approval) or "remember"
  // (approved without asking, within the grace). "unavailable" when root elevation is off for
  // the whole computer, so the level cannot be set. Set it with SetAppRoot.
  string root = 16;
  // The app's launcher shortcuts, in the list of installed apps: the static and dynamic ones
  // in rank order, then the pinned ones. Empty for a task's app.
  repeated AppShortcut shortcuts = 17;
  // The user ID the app shares with other apps (its manifest's `android:sharedUserId`), in
  // the list of installed apps. Apps with the same value run under one Android uid and are
  // one group for root elevation: their level and grace apply to all of them, and a settings
  // app shows them together. Empty for an app with a user ID of its own, and for a task's app.
  string shared_user_id = 18;
}

// One of an app's launcher shortcuts in Android: a static one from its manifest, a dynamic
// one it published, or one pinned at its request. The host's jump list (Dock menu, desktop
// entry actions) shows the static and dynamic ones; a pinned one is a desktop shortcut.
message AppShortcut {
  // Unique within its app.
  string id = 1;
  string short_label = 2;
  // Empty when the app gave none.
  string long_label = 3;
  // A square PNG image; empty when the shortcut has none, and the app's icon stands in.
  bytes icon_png = 4;
  // Lowest first.
  uint32 rank = 5;
  bool manifest = 6;
  bool dynamic = 7;
  bool pinned = 8;
}

// Starts one of an app's shortcuts in the caller's Android as a task in its own window, as
// its jump list task or desktop shortcut does. Answered with Done once Android has been
// asked.
message LaunchShortcut {
  string package_name = 1;
  string shortcut_id = 2;
}

// An app of the caller's Android asks for one of its shortcuts on the desktop
// (requestPinShortcut). Sent as a TaskEvent to every watcher of the tasks; the window manager
// asks the user and answers with AnswerPinShortcut. A request nobody answers lapses.
message PinShortcutRequest {
  uint32 request_id = 1;
  string package_name = 2;
  string app_label = 3;
  AppShortcut shortcut = 4;
}

// The user's answer to a PinShortcutRequest. Answered with Done.
message AnswerPinShortcut {
  uint32 request_id = 1;
  bool accepted = 2;
}

// Installs an app of the caller's Android again from the APKs it has there, with its native
// code for arm64-v8a (`on`, run through the ARM translator) or for x86_64. Android must be
// running, with translation on to turn it on. The app keeps its data; when Android cannot
// keep it, the answer is RUN_AS_ARM_STATUS_DATA_WOULD_BE_ERASED and nothing changes, unless
// `erase_data` is set, which reinstalls the app and erases its data. The answer is
// RunAsArmResult.
message SetRunAsArm {
  string package_name = 1;
  bool on = 2;
  bool erase_data = 3;
}

// How a SetRunAsArm went.
enum RunAsArmStatus {
  RUN_AS_ARM_STATUS_UNSPECIFIED = 0;
  // The app is installed again with the ABI asked for.
  RUN_AS_ARM_STATUS_SUCCESS = 1;
  // Android cannot change the app's ABI and keep its data; nothing changed. Asking again
  // with `erase_data` does it and erases the data.
  RUN_AS_ARM_STATUS_DATA_WOULD_BE_ERASED = 2;
  // No app of that package is installed.
  RUN_AS_ARM_STATUS_NOT_INSTALLED = 3;
  // The app is part of the Android image.
  RUN_AS_ARM_STATUS_SYSTEM_APP = 4;
  // The app's APKs on the device hold no native libraries for that ABI.
  RUN_AS_ARM_STATUS_NO_LIBRARIES = 5;
  // ARM translation is not on in the running Android, so the app cannot run as ARM.
  RUN_AS_ARM_STATUS_TRANSLATION_OFF = 6;
  // Anything else. The message says what.
  RUN_AS_ARM_STATUS_OTHER = 7;
}

// The answer to SetRunAsArm.
message RunAsArmResult {
  string package_name = 1;
  RunAsArmStatus status = 2;
  // Android's own words, for the log and a bug report.
  string message = 3;
  // Whether the app's native code runs as arm64-v8a now.
  bool on = 4;
}

// Sets how far one app may elevate to root. `level` is "off", "ask" or
// "remember". Moving an app to "remember" needs the host's administrator approval, as turning
// the whole feature on does; the service refuses a caller who is not an administrator with
// ERROR_CODE_NOT_PERMITTED. A change clears that app's grace. The answer is AppRootResult.
message SetAppRoot {
  string package_name = 1;
  string level = 2;
}

// How a SetAppRoot went.
enum AppRootStatus {
  APP_ROOT_STATUS_UNSPECIFIED = 0;
  // The app's level is set as asked.
  APP_ROOT_STATUS_SUCCESS = 1;
  // Root elevation is off for the whole computer, so no app level can be set.
  APP_ROOT_STATUS_FEATURE_OFF = 2;
  // The caller is not an administrator, and the change needs one ("remember").
  APP_ROOT_STATUS_NOT_PERMITTED = 3;
  // `level` was not "off", "ask" or "remember".
  APP_ROOT_STATUS_INVALID_LEVEL = 4;
  // Anything else. The message says what.
  APP_ROOT_STATUS_OTHER = 5;
}

// The answer to SetAppRoot.
message AppRootResult {
  string package_name = 1;
  AppRootStatus status = 2;
  // The app's level as it stands now: "off", "ask" or "remember".
  string level = 3;
  // Words a person can act on, for the log and the settings app.
  string message = 4;
}

// The apps installed in the caller's Android that a launcher lists. The list is kept while
// the Android is stopped, because its apps stay installed.
message InstalledApps {
  // False until the caller's Android has said which apps it has since the service started.
  // The list is then empty and says nothing about which apps are installed.
  bool known = 1;
  // In package order.
  repeated AppInfo apps = 2;
}

// A change to the tasks of the caller's Android, sent after the answer to WatchTasks.
message TaskEvent {
  oneof body {
    Task updated = 1;
    TaskRemoved removed = 2;
    TaskFrames frames = 3;
    AppInfo app = 4;
    ImeCursor ime_cursor = 5;
    // The editor focused in the task changed, as the input method reads it.
    ImeEditor ime_editor = 7;
    // The apps installed in the caller's Android changed: the whole list, as it is now.
    InstalledApps installed = 6;
    // An app asks for one of its shortcuts on the desktop. It is passed on as it comes and is
    // not part of the tasks a late watcher starts from.
    PinShortcutRequest pin_shortcut = 8;
  }
}

// The answer to ListTasks and WatchTasks: the tasks there are now.
message Tasks {
  // In task ID order.
  repeated Task tasks = 1;
  // The display of each task whose frames have been placed, in task ID order. A task may
  // appear here before it appears in `tasks`.
  repeated TaskFrames frames = 2;
  // The name and icon of each app that has a task, in package order.
  repeated AppInfo apps = 3;
  // The apps installed in the caller's Android. Unset until it has said which apps it has.
  InstalledApps installed = 4;
}

// Asks how much memory the caller's Android takes: inside the guest, as it last reported,
// and on the host, the processes that run it.
message GetMemory {}

// One Android process's share of the guest's memory.
message GuestProcessMemory {
  int32 pid = 1;
  string name = 2;
  // Its proportional set size in KiB: its private pages plus its share of shared pages.
  uint64 pss_kb = 3;
  // How much of it is swapped out to compressed memory, proportionally, in KiB, at the size
  // before compression; it is counted in pss_kb.
  uint64 swap_pss_kb = 4;
  // The process belongs to Google Play services (the Google apps the user installed).
  bool google_play = 5;
}

// How Android uses the guest's memory, as it last reported it. Sizes in KiB; 0 when Android
// could not read the value.
message GuestMemory {
  uint64 mem_total_kb = 1;
  uint64 mem_free_kb = 2;
  uint64 mem_available_kb = 3;
  uint64 buffers_kb = 4;
  uint64 cached_kb = 5;
  uint64 anon_pages_kb = 6;
  uint64 shmem_kb = 7;
  uint64 slab_reclaimable_kb = 8;
  uint64 swap_total_kb = 9;
  uint64 swap_free_kb = 10;
  uint64 zram_original_kb = 11;
  uint64 zram_used_kb = 12;
  // The proportional set size of the apps and the system server together; native daemons
  // are not counted.
  uint64 total_pss_kb = 13;
  // Largest first, at most 10.
  repeated GuestProcessMemory top_processes = 14;
  // How long ago Android sent this report, in seconds.
  uint64 age_seconds = 15;
  // What the guest's kernel itself holds, and the memory it was given, as the control
  // channel's GuestMemory says.
  uint64 slab_unreclaimable_kb = 16;
  uint64 kernel_stack_kb = 17;
  uint64 page_tables_kb = 18;
  uint64 vmalloc_used_kb = 19;
  uint64 percpu_kb = 20;
  uint64 cma_total_kb = 21;
  uint64 hugetlb_kb = 22;
  uint64 mem_online_kb = 23;
  // How much of total_pss_kb is swapped out to zram, at the size before compression.
  uint64 swap_pss_kb = 24;
  // Every process of Google Play services: how many, their proportional set size, and how
  // much of it is swapped out to zram at the size before compression.
  uint32 google_play_processes = 25;
  uint64 google_play_pss_kb = 26;
  uint64 google_play_swap_pss_kb = 27;
}

// One host process that runs the caller's Android: its VM's memory process, the window
// manager, an app window.
message HostProcessMemory {
  // What it is: "vm", "window manager" or "app window".
  string role = 1;
  uint32 pid = 2;
  // The memory of it resident in RAM now, in KiB.
  uint64 working_set_kb = 3;
  // The memory committed to it alone, in KiB.
  uint64 private_kb = 4;
}

// The answer to GetMemory.
message Memory {
  // Absent until Android has sent its first report since it started.
  GuestMemory guest = 1;
  // In the order: the VM, the window manager, the app windows.
  repeated HostProcessMemory host = 2;
}

// The answer to a request that has nothing to report but that it was carried out.
message Done {}

// One tag's least priority in a log filter, as logcat's TAG:P. The tag "*" sets the
// priority of every tag not named.
message LogTagFilter {
  string tag = 1;
  // Android's priority (2 verbose to 7 fatal); 8 silences the tag.
  uint32 min_priority = 2;
}

// Reads the guest log of the caller's Android. The service answers Done, then the
// connection carries only LogEntries frames from the service: the recent records it holds,
// then each new one that passes, until the client closes the connection. With `dump`, the
// service sends what Android's log holds now and ends with a LogEntries whose `end` is set.
// The service reads Android's log only while such a connection is open.
message WatchLog {
  // Bit (1 << buffer) for each buffer to read, with the buffers numbered as LogEntry's;
  // 0 reads main, system and crash, as logcat does.
  uint32 buffers = 1;
  repeated LogTagFilter tags = 2;
  bool dump = 3;
}

// One record of the guest log.
message LogEntry {
  // logd's log ID plus one: 1 main, 2 radio, 3 events, 4 system, 5 crash, 6 stats,
  // 7 security, 8 kernel.
  uint32 buffer = 1;
  uint32 priority = 2;
  // Nanoseconds since the Unix epoch, by Android's clock.
  uint64 time_ns = 3;
  int32 pid = 4;
  int32 tid = 5;
  uint32 uid = 6;
  string tag = 7;
  string message = 8;
  // Not 0: stands for that many records that were dropped, by Android or by the service,
  // because they came faster than they were read.
  uint64 dropped = 9;
}

// Records of the guest log, on a connection that reads it.
message LogEntries {
  repeated LogEntry entries = 1;
  // The last frame of a dump.
  bool end = 2;
  // Why the log could not be read, or why a dump ended early.
  string error = 3;
}

// Gathers the diagnostics of the caller's Android and of DSA on this computer into one zip
// archive. The service answers Done, then the connection carries only DiagnosticsData frames
// from the service, the archive's bytes in order, the last with `end` set.
message CollectDiagnostics {}

// A piece of the diagnostics archive.
message DiagnosticsData {
  bytes data = 1;
  // The archive's last piece.
  bool end = 2;
  // Why the archive could not be made at all. A part that could not be gathered is named in
  // the archive's own summary instead.
  string error = 3;
}

// How far an update of DSA itself has got.
enum ProgramUpdatePhase {
  // No update of DSA is under way.
  PROGRAM_UPDATE_PHASE_UNSPECIFIED = 0;
  // The new version's setup file is being downloaded.
  PROGRAM_UPDATE_PHASE_DOWNLOADING = 1;
  // Every user's Android is being stopped so setup can run.
  PROGRAM_UPDATE_PHASE_STOPPING_ANDROID = 2;
  // Setup is installing the new version. It stops this service and starts the new one.
  PROGRAM_UPDATE_PHASE_INSTALLING = 3;
  // Setup has installed the new version and this service is restarting into it.
  PROGRAM_UPDATE_PHASE_RESTARTING = 4;
  // This service is the version an update has just installed.
  PROGRAM_UPDATE_PHASE_APPLIED = 5;
  // The update failed and the version before it is still installed; the update notice
  // says why.
  PROGRAM_UPDATE_PHASE_FAILED = 6;
}

// Where an update of DSA itself stands.
message ProgramUpdateProgress {
  ProgramUpdatePhase phase = 1;
  // The version being installed, or the one installed or that failed.
  string version = 2;
}

// The caller's Android as the service sees it.
message Status {
  SessionState state = 1;
  // Why the session last stopped, or why stopping it went wrong, in words a person can act
  // on. Empty when it has not stopped yet.
  string last_reason = 2;
  // News about the Android image, for the user: an update downloaded and waiting for the
  // next start, an update applied, or one that did not start and was undone. Empty when
  // there is nothing to tell.
  string update_notice = 3;
  // What keeps a running or starting Android from being ready, and what to do about it, in
  // words a person can act on. Empty when nothing does.
  string problem = 4;
  // Where an update of DSA itself stands. Absent when this service does not update DSA, and
  // from a service older than this field.
  ProgramUpdateProgress program_update = 5;
}

// The answer to UpdateProgram.
message ProgramUpdate {
  // The version setup is installing. Empty when there is nothing newer to install.
  string installing = 1;
  // What happens next, in words for the user.
  string detail = 2;
}

// The answer to GetVmId.
message VmId {
  // The runtime ID of the caller's Android VM. Empty when the VM is not running.
  string vm_id = 1;
}

// Asks for the settings of the caller's DSA.
message GetSettings {}

// Changes the settings of the caller's DSA: each value of `settings` that a client may change
// replaces the current one. The service answers with the settings as they are now. Changing
// an update setting, which applies to every user, needs a caller acting as an administrator
// (on Windows, an elevated process); otherwise nothing changes and the answer is
// ERROR_CODE_NOT_ALLOWED.
message SetSettings {
  Settings settings = 1;
}

// The settings of the caller's DSA. `render_gpu`, `freeze`, `clipboard` and `links_in_android` are
// the caller's own; the update and trace settings are the machine's, shared by every user of it.
message Settings {
  // The GPU the caller's window manager renders on: "display" (the GPU that drives the
  // primary monitor, the default), "integrated", "discrete", or part of a GPU's name. The
  // window manager reads it when it starts.
  string render_gpu = 1;
  // Whether the caller's Android may be frozen when it is idle. Off unless the user turns it
  // on.
  bool freeze = 2;
  // Whether the service updates DSA itself from the signed program list.
  bool program_updates = 3;
  // Whether the service downloads new Android images from the signed release list.
  bool image_updates = 4;
  // Whether this installation can update DSA itself, or the Android image, at all. A client
  // cannot change these.
  bool program_updates_available = 5;
  bool image_updates_available = 6;
  // The version of DSA the service runs. A client cannot change it.
  string version = 7;
  // The folder the service writes its log to. Empty when it keeps none. A client cannot
  // change it.
  string log_dir = 8;
  // Whether the web links apps in the caller's Android open go to apps in it, as on a phone.
  // Off by default: they open in the user's default browser on the host.
  bool links_in_android = 10;
  // Whether text copied on the host can be pasted in the caller's Android, and the reverse.
  // On unless the user turns it off.
  bool clipboard = 9;
  // The version of the Android image the caller's next start boots, such as
  // "17.0.0-16373615-7". Empty when the service does not know it. A client cannot change it.
  string android_version = 13;
  // Whether every DSA process writes the input trace (a click's path from the host to the app
  // and back, on one clock) to its log. Off by default. It applies to the whole computer, so
  // only an administrator may change it; a process reads it when it starts.
  bool input_trace = 11;
  // Whether every DSA process writes a line for each stage of each resize, rather than a
  // summary at the end of a drag. Off by default; the same rules as input_trace.
  bool resize_trace = 12;
  // The most memory the caller's Android may have, in MiB. 0, the default, is automatic: the
  // service's default size. It takes effect
  // the next time Android starts.
  uint32 memory_limit_mb = 16;
  // Whether the caller's Android takes adb connections: the service then listens on
  // 127.0.0.1:adb_port and bridges each connection to the guest's adbd. Off by default, and
  // the caller's own. It applies at once, without restarting Android.
  bool developer_mode = 14;
  // The loopback port adb connects to while developer mode is on. 58526 unless the user
  // chooses another; 0 in a request means the default.
  uint32 adb_port = 15;
  // Whether, while developer mode is on, the service attaches 127.0.0.1:adb_port to the
  // caller's adb server by itself (as `adb connect` would), so adb and Android Studio list it
  // with nothing typed. On unless the user turned it off; a client sends back the value it
  // read. Off, the service sends the adb server nothing.
  bool adb_auto_connect = 21;
  // Where auto-connect stands: "off" (developer mode or auto-connect is off),
  // "waiting-for-server" (no adb server runs), "waiting-for-android" (Android is not running
  // or adb in Android has not answered yet), "attached" (the adb server lists it) or
  // "detached" (the user ran adb disconnect; it is attached again when the adb server
  // restarts). Empty from a service that does not report it. A client cannot change it.
  string adb_auto_connect_state = 22;
  // Whether the caller's Android uses an installed ARM translation package. On unless the
  // user turned it off; a client sends back the value it read. It applies from the next start
  // of Android, because the ABIs Android installs apps for are fixed at boot.
  bool arm_translation = 17;
  // Whether stopping an app that runs in the background skips the question that confirms
  // it. Off by default: the first stop asks, and the user may tick "do not ask again".
  bool stop_without_asking = 18;
  // Whether the caller's host folders show in their Android's shared storage. On unless the
  // user turned it off; a client sends back the value it read. It applies at once.
  bool file_sharing = 30;
  // The folders shared while file sharing is on, by name: any of "Documents", "Downloads",
  // "Pictures", "Music", "Videos" and "Desktop". All of them unless the user chose fewer; a
  // client sends back the list it read. A name the service does not know is refused.
  repeated string shared_folders = 31;
  // Whether the caller's Android joins the host's LAN as a device of its own (advanced
  // networking), so other devices on the LAN reach it and it reaches them directly. Off by
  // default: Android is behind a NAT network the service makes for its VM. It applies from the
  // next start of Android.
  bool advanced_networking = 19;
  // The caller's network as it stands now. Absent when the service cannot say. A client cannot
  // change it.
  NetworkStatus network = 20;
  // Whether DSA is updated to pre-releases as well as stable releases (the pre-release
  // channel). It applies to every user of the computer, so only an administrator may change
  // it. A computer starts on the channel of the installer that put DSA on it and keeps it
  // through upgrades; moving to the stable channel never installs a lower version.
  bool prerelease_updates = 32;
  // Whether this installation follows a release channel at all: the service updates DSA
  // itself, or the package repository entries DSA's package registered follow the channel. A
  // client cannot change it.
  bool update_channel_available = 33;
  // Whether the host's own three- and four-finger touch gestures are turned off while one of
  // the caller's task windows is in front, so apps get every finger, and put back to the
  // user's value when another window comes to the front. On unless the user turned it off; a
  // client sends back the value it read. The caller's window manager applies it.
  bool touch_gestures_off = 34;
  // Whether the caller's window manager can turn those gestures off: "unsupported" (the host
  // has no such gestures, so a client hides the setting), "available", or "failed" (the
  // host refused, so a client shows the setting disabled with touch_gestures_problem). Empty
  // while the window manager has not said. A client cannot change it.
  string touch_gestures_state = 35;
  // Why the host refused, in words, while touch_gestures_state is "failed". A client cannot
  // change it.
  string touch_gestures_problem = 36;
  // Whether apps in the caller's Android may elevate to root through the host's administrator
  // approval. Off by default. It applies to every user of the computer, so only
  // an administrator may change it, and it takes effect from the next start of Android. With
  // it off, su exists for no app and the per-app levels do nothing. A client sends back the
  // value it read.
  bool root_elevation = 37;
  // How far `adb shell` may elevate to root while developer mode is on, like an app's level:
  // "off", "ask" (the default) or "remember". Empty while developer mode is off, because adb
  // is closed and the level does nothing; "unavailable" while root_elevation is off. A client
  // cannot change it here: SetAppRoot with the package "com.android.shell" sets it.
  string adb_shell_root = 38;
  // Whether the caller's Android restarts by itself into an Android image the service has
  // downloaded: at once while no app window is open (Dozing), and otherwise after the user's
  // desktop asks, or once every window is closed and Android dozes. On unless the user turned
  // it off; a client sends back the value it read. Off, a downloaded image is used from the
  // next time the user starts Android.
  bool image_auto_restart = 39;
  // Whether the caller's Android trusts, as system certificates, the root certificates a user
  // or an administrator added to this computer (imported_certificates). On unless the user
  // turned it off; a client sends back the value it read. It applies at once, without
  // restarting Android.
  bool host_certificates = 40;
  // The root certificates the service found added to this computer's trust stores for the
  // caller, whether or not host_certificates is on. Those the operating system ships are left
  // out. A client cannot change it.
  repeated ImportedCertificate imported_certificates = 41;
  // A run mode setting (run_mode, a RunMode enum, stop_after_secs and keep_for_notifications)
  // was here and is gone: an idle Android stays in Doze. Its numbers and names are never
  // used again, so an older peer that still sends them is read without them. The enum name
  // RunMode is not used again either.
  reserved 310, 311, 312;
  reserved "run_mode", "stop_after_secs", "keep_for_notifications";
}

// One root certificate the service found added to the computer's trust stores.
message ImportedCertificate {
  // Who the certificate is for and who signed it, as distinguished names ("CN=Example Root,
  // O=Example").
  string subject = 1;
  string issuer = 2;
  // Where it was found: "machine" (the computer's trusted root store), "machine_group_policy",
  // "machine_enterprise", "user" (the caller's own trusted root store), "user_group_policy",
  // "admin" (the computer's administrator trust settings) or "system" (a certificate added to
  // the system's certificate store).
  string source = 3;
  // The store or file it was found in, as the operating system names it.
  string location = 4;
  // The SHA-256 fingerprint of the certificate, in lower-case hexadecimal.
  string sha256 = 5;
  // When it stops being valid, in seconds since the Unix epoch; 0 when unknown.
  int64 not_after = 6;
}

// How the caller's Android reaches the network.
message NetworkStatus {
  // "nat" (behind the NAT network the service makes for the VM), "advanced" (on the host's
  // LAN) or "off" (Android is not running, so there is no network yet).
  string mode = 1;
  // The guest's addresses, IPv4 and IPv6, as the host's network service gave them out. A host
  // program reaches a server in Android at any of them.
  repeated string addresses = 2;
  // The DNS servers the guest is given.
  repeated string dns_servers = 3;
  // The guest's default gateway.
  string gateway = 4;
  // Why advanced networking is not in use although it is on, or another problem with the
  // network. Empty when there is none.
  string problem = 5;
  // Who answers the guest's DNS queries: "host" while this host's resolver answers them (so
  // the host's hosts file, VPN and DNS filters apply to Android's apps), "network" while the
  // host's resolver does not answer and Android asks `dns_servers` itself. Empty while Android
  // is not running or still booting, and from a service that cannot say.
  string dns_resolver = 6;
}

// Erases the caller's Android data: the apps they installed, their accounts and every app's
// data. The service stops the caller's Android, waits for it to stop, and replaces their data
// disk with a fresh one from the Android image. The system image and DSA's settings stay as
// they are. The answer is Done once the new disk is in place; the next start boots it.
message ResetData {}

// Backs up every app of the caller's Android now, into the caller's backup folder, encrypted
// with the key the host's credential store keeps for them. Android has to be running
// (ERROR_CODE_NOT_RUNNING otherwise). The answer is BackupReport once Android's backup
// manager has finished.
message BackupNow {}

// Asks where the caller's backup stands. The service answers BackupReport. It reads only the
// backup folder, so it answers while Android is stopped too.
message GetBackup {}

// Restores the caller's Android from their backup folder: installs each app the backup holds
// the APKs of and Android does not have, then has Android restore every app's data. It is
// how the data comes back after a data reset, or on another computer once the folder and
// the recovery key are there. Android has to be running (ERROR_CODE_NOT_RUNNING otherwise).
// Answered with BackupReport.
message RestoreBackup {}

// Asks for the caller's backup recovery key: the key their backup folder is encrypted with,
// as text to write down. With it the folder can be restored on another computer or under
// another user. Answered with BackupRecoveryKey.
message GetBackupRecoveryKey {}

message BackupRecoveryKey {
  // Groups of letters and digits with a check at the end, such as `ABCD-EFGH-...`.
  string key = 1;
}

// Keeps `key`, a recovery key GetBackupRecoveryKey gave, as the caller's backup key, so a
// backup folder made on another computer or under another user can be read here. Text that
// is not a recovery key, or one the folder was not made with, is ERROR_CODE_INVALID_SETTING.
// Answered with BackupReport.
message SetBackupRecoveryKey {
  string key = 1;
}

// Where the caller's backup stands.
message BackupReport {
  // Whether backups can be made and read now.
  bool available = 1;
  // Why not, in words a person can act on; empty when they can.
  string problem = 2;
  // The backup folder.
  string folder = 3;
  // When an app was last backed up, in milliseconds since the Unix epoch; 0 for never.
  int64 last_backup_unix_ms = 4;
  // The apps the backup holds, and the bytes their data and APKs take before encryption.
  uint32 packages = 5;
  uint64 size = 6;
  // What went wrong in the last backup or restore; empty when nothing did.
  string last_error = 7;
  // BackupNow and RestoreBackup: the apps backed up or restored, those that failed, and the
  // apps a restore installed.
  uint32 succeeded = 8;
  uint32 failed = 9;
  uint32 installed = 10;
  // When the backup was last restored, in milliseconds since the Unix epoch; 0 for never.
  int64 last_restore_unix_ms = 11;
  // Whether the user turned backup on. Off by default: until the user turns it on, no backup
  // runs, and neither the backup folder nor its key is made. While it is off `available` is
  // false with no problem, and what an earlier backup left in the folder is still counted.
  bool enabled = 12;
}

// Turns the caller's backup on or off. On, Android's backup manager backs the apps' data up to
// the host on its own schedule, and BackupNow and RestoreBackup work. Off, Android's backup
// manager stops backing up to the host, and the host takes no more backups; with
// `delete_backups` the backup folder's files and the backup key are removed as well, else
// they stay for a later restore. Answered with BackupReport.
message SetBackup {
  bool enabled = 1;
  bool delete_backups = 2;
}

// Asks how the root key of the caller's Android's KeyMint is protected on this computer.
// Answered with KeyProtection. It reads only what the key's file records, so it never asks
// for a password and answers while Android is stopped.
message GetKeyProtection {}

// How the root key of the guest's KeyMint is sealed on this computer.
message KeyProtection {
  // Whether a root key is kept yet: one is made the first time Android starts.
  bool kept = 1;
  // What sealed it: "tpm" (the computer's TPM), "secure-enclave" (the Mac's Secure Enclave),
  // "dpapi" (Windows DPAPI under the user's account), "secret-service" (the user's Secret
  // Service keyring) or "keychain" (the user's login keychain). Empty while none is kept.
  string sealed_by = 2;
  // Whether hardware of this computer (a TPM or the Secure Enclave) holds what seals it.
  bool hardware = 3;
  // What sealed it, in words, such as "the computer's TPM 2.0 and DPAPI under your account".
  string description = 4;
  // When it is not sealed by hardware: why this computer's hardware could not be used.
  string fallback_reason = 5;
  // Why the kept key could not be opened for the latest start of Android, and what to do;
  // empty when it opened (or no start has asked for it yet).
  string problem = 6;
}

// Turns the connection into a watch of the passkey ceremonies of the caller's Android: after
// the answer (Done), the service sends a PasskeyCeremony for each request of an app that the
// service has checked (the app's signature against the relying party's Digital Asset Links,
// or a browser's origin against the relying party), and a PasskeyCeremonyWithdrawn when
// Android no longer waits for one. Requests that fail the check never reach a watcher. The
// watcher, which runs in the user's desktop session, brings up the host's passkey prompt and
// answers each ceremony with ReportPasskeyCeremony, on another connection, and sends
// nothing on this one.
message WatchPasskeys {}

// Which passkey ceremony.
enum PasskeyOperation {
  PASSKEY_OPERATION_UNSPECIFIED = 0;
  // Make a new passkey.
  PASSKEY_OPERATION_CREATE = 1;
  // Sign in with a passkey.
  PASSKEY_OPERATION_GET = 2;
}

// A passkey ceremony the host's authenticator is to perform, already checked.
message PasskeyCeremony {
  uint64 ceremony_id = 1;
  PasskeyOperation operation = 2;
  string rp_id = 3;
  // CREATE only: the relying party's name and the account the passkey is for.
  string rp_name = 4;
  bytes user_id = 5;
  string user_name = 6;
  string user_display_name = 7;
  // The client data the authenticator signs the hash of (WebAuthn's CollectedClientData
  // JSON); empty when a browser gave only its hash.
  bytes client_data_json = 8;
  // SHA-256 of client_data_json, or the browser's own hash.
  bytes client_data_hash = 9;
  // CREATE only: the COSE algorithms the relying party takes, the one it prefers first.
  repeated int32 algorithms = 10;
  // CREATE: the passkeys the authenticator must not already hold. GET: the passkeys it may
  // use; empty for any of the relying party's.
  repeated bytes credential_ids = 11;
  // CREATE only: "required", "preferred" or "discouraged".
  string resident_key = 12;
  // "required", "preferred" or "discouraged".
  string user_verification = 13;
  // How long the relying party waits; 0 for the authenticator's own default.
  uint32 timeout_ms = 14;
  // The app that asked, for the prompt.
  string app_label = 15;
  string package = 16;
  // The origin the client data names: the browser's https origin, or the app's
  // android:apk-key-hash origin.
  string origin = 17;
  // CREATE only: "none", "indirect", "direct" or "enterprise".
  string attestation = 18;
}

// The ceremony is no longer wanted: its app went away, or Android stopped.
message PasskeyCeremonyWithdrawn {
  uint64 ceremony_id = 1;
}

// What became of a passkey ceremony on the host.
enum PasskeyResult {
  PASSKEY_RESULT_UNSPECIFIED = 0;
  PASSKEY_RESULT_OK = 1;
  // The person canceled the prompt, or it timed out.
  PASSKEY_RESULT_CANCELED = 2;
  // The host has no authenticator, or the person turned passkeys off.
  PASSKEY_RESULT_UNAVAILABLE = 3;
  // The authenticator failed; the message says why.
  PASSKEY_RESULT_ERROR = 4;
  // CREATE: the authenticator already holds an excluded passkey. GET: it holds none allowed.
  PASSKEY_RESULT_NOT_ALLOWED = 5;
}

// Tells the caller's Android what became of a passkey ceremony. Answered with Done.
message ReportPasskeyCeremony {
  uint64 ceremony_id = 1;
  PasskeyResult result = 2;
  string message = 3;
  bytes credential_id = 4;
  // CREATE: the attestation object (CBOR), and the transports the passkey can be reached by.
  bytes attestation_object = 5;
  repeated string transports = 6;
  // GET: the authenticator data, the signature over it and the client data hash, and the
  // passkey's user handle.
  bytes authenticator_data = 7;
  bytes signature = 8;
  bytes user_handle = 9;
}

// Asks which Android version runs and which can be chosen. The service answers
// AndroidVersions.
message GetAndroidVersions {}

// Chooses the Android version this computer follows. Where every user boots the same image,
// only an administrator may choose (ERROR_CODE_NOT_ALLOWED otherwise). A major that is not
// supported is ERROR_CODE_INVALID_SETTING. A major older than the running one erases every
// user's Android data, since Android cannot read data a newer version wrote, so it needs
// erase_data (ERROR_CODE_DATA_WOULD_BE_LOST otherwise). The service answers AndroidVersions
// and downloads the image at once; it is used from the next start.
message UseAndroidVersion {
  // The major version to follow; 0 follows the newest supported one.
  uint32 major = 1;
  bool erase_data = 2;
}

// The Android version: what runs, what is chosen, and what can be.
message AndroidVersions {
  // The image Android starts from.
  string version = 1;
  uint32 android_major = 2;
  uint64 build = 3;
  // The AOSP build ID and the security patch level (YYYY-MM-DD); empty when unknown.
  string build_id = 4;
  string security_patch = 5;
  // The chosen major version; 0 follows the newest supported one.
  uint32 chosen_major = 6;
  // The supported major versions, oldest first.
  repeated uint32 supported_majors = 7;
  // The major the choice leads to; it differs from android_major while a switch waits for
  // its image.
  uint32 target_major = 8;
  // Whether the current image has not finished its first boot yet.
  bool on_trial = 9;
  // The latest news about the image; empty when there is none.
  string notice = 10;
  // The image the caller's running Android waits to restart into: one the service downloaded
  // after it started. Empty when none waits (it is not running, or it already runs the
  // newest image). RestartForUpdate applies it now.
  string restart_pending = 11;
}

// Restarts the caller's Android now into the Android image that waits for it
// (AndroidVersions.restart_pending), as the [Restart now] of the desktop's question and of
// the settings app do. The service answers UpdateRestart at once; the restart then happens on
// its own, with the new image's trial boot and, when it fails, the rollback to the previous
// image.
message RestartForUpdate {}

// The answer to RestartForUpdate.
message UpdateRestart {
  // The image Android restarts into. Empty when none waits, and nothing is restarted.
  string version = 1;
  // What happens next, in words for the user.
  string detail = 2;
}

// What an ARM translation package says of itself, from its arm-translation.json.
message ArmTranslationPackage {
  string name = 1;
  string version = 2;
  // The translator's native bridge library, a file name in the package's system/lib64.
  string library = 3;
  // The ABIs it translates. Only "arm64-v8a" is taken: the guest has no 32-bit zygote.
  repeated string abis = 4;
  // The package's licence, as an SPDX expression.
  string license = 5;
}

// Installs an ARM translation package for the caller's Android. The service answers at once:
// Done when it takes a package with this description and size, or an error. After Done the
// client sends the package's system image, `size` bytes, in ApkChunk frames, and the service
// answers the same request id once more: ArmTranslation once the image is on the caller's
// add-on disk, or an error. The connection then ends. The package is used from Android's next
// start.
message InstallArmTranslation {
  ArmTranslationPackage package = 1;
  uint64 size = 2;
  // The SHA-256 digest of the system image.
  bytes sha256 = 3;
}

// Asks where ARM translation stands for the caller. Answered with ArmTranslation.
message GetArmTranslation {}

// Removes the caller's ARM translation package. Answered with ArmTranslation. Android goes
// on using a package it has mounted until it restarts.
message RemoveArmTranslation {}

// Where ARM translation stands for the caller.
message ArmTranslation {
  // The package the caller installed (their own, or Google's translator); absent when there
  // is none. It is used in place of the default package.
  ArmTranslationPackage package = 1;
  // The arm_translation setting.
  bool enabled = 2;
  // Whether the running Android was asked, and answered: the three fields below hold only
  // then.
  bool guest_known = 3;
  // The package image is on the caller's add-on disk, for Android's next start.
  bool guest_installed = 4;
  // The running Android has a package laid over its system, so ARM64 apps install and run.
  bool guest_active = 5;
  // The ABIs the running Android installs apps for.
  string abilist = 6;
  // What is installed and switched on differs from what the running Android booted with, so
  // it applies once Android starts again.
  bool restart_needed = 7;
  // The default package of the image the caller's Android starts from, which it uses while
  // the caller has installed none. Only an x86_64 image has one; absent otherwise.
  ArmTranslationPackage default_package = 8;
  // The translator the caller's Android uses with these settings, from its next start: "default"
  // (default_package), "user" (package, the caller's own), "google" (package, Google's
  // translator), or empty for none.
  string translator = 9;
  // The running Android still has a package image a DSA from before the add-on disk sent to
  // its own disk, which the service moves onto the add-on disk and then removes. Holds only
  // when guest_known.
  bool guest_left_on_data = 10;
}

// The Widevine module a user installed: the com.google.android.widevine APEX of Google's
// emulator system image for their Android version and architecture, which the client
// downloaded from Google's SDK repository and took out unchanged. DSA does not ship it.
message WidevinePackage {
  // The APEX's file name in the image's /vendor/apex, such as
  // "com.google.android.widevine.apex". The guest's apexd reads it from there.
  string apex = 1;
  // The image it came from: its build, API level and revision, such as
  // "BE2A.250530.026.F3 (API 36, r7)".
  string version = 2;
  // The Android major version and the ABI ("x86_64", "arm64-v8a") of that image, which are
  // the caller's Android's.
  uint32 android_major = 3;
  string abi = 4;
  // The system image archive it was taken from, on Google's download server.
  string source = 5;
  // The APEX's size in bytes and its SHA-256 digest, as the image holds it.
  uint64 size = 6;
  bytes sha256 = 7;
  // The licence Google offers the image under, as its list names it.
  string license = 8;
}

// Installs Widevine for the caller's Android. The service answers at once: Done when it takes
// an APEX with this description, or an error. After Done the client sends the APEX, exactly
// as the image holds it, package.size bytes, in ApkChunk frames, and the service answers the
// same request id once more: Widevine once the APEX is on the caller's add-on disk, or an
// error. The connection then ends. Android need not run: the module is used from its next
// start.
message InstallWidevine {
  WidevinePackage package = 1;
}

// Asks where Widevine stands for the caller. Answered with Widevine.
message GetWidevine {}

// Removes the caller's Widevine module. Answered with Widevine. From Android's next start the
// module is gone, and so are the device certificates Widevine kept in /data/vendor/mediadrm.
// A running Android keeps the module it booted with until it restarts.
message RemoveWidevine {}

// Where Widevine stands for the caller.
message Widevine {
  // The module the caller installed; absent when there is none.
  WidevinePackage package = 1;
  // The caller's add-on disk holds the module, for Android's next start.
  bool on_disk = 2;
  // The caller's Android runs now: the two fields below hold only then.
  bool running = 3;
  // The running Android was started with Widevine.
  bool active = 4;
  // What is installed differs from what the running Android was started with, so it applies
  // once Android starts again.
  bool restart_needed = 5;
}

// The Google apps package a user installed: LiteGapps' Core build for their Android, which the
// service downloaded from LiteGapps' file host.
message GappsPackage {
  // LiteGapps' name for the build: "core".
  string variant = 1;
  // The build's date, yyyymmdd, from its file name.
  string version = 2;
  // The Android version the build is for, as LiteGapps names it ("16.0").
  string android_version = 3;
  // The Android API level the build is for.
  uint32 sdk = 4;
  // The processor architecture the build is for, as LiteGapps names it ("x86_64", "arm64").
  string arch = 5;
  // The file the service downloaded.
  string file = 6;
  // Where it downloaded it from.
  string source = 7;
  // The MD5 digest the file host published for it, which the download matched.
  string md5 = 8;
  // The format of the system image the service made from it; 0 for an image made by a
  // service from before formats were recorded.
  uint32 image_format = 9;
}

// Installs Google Play for the caller's Android: the service finds the newest LiteGapps Core
// build for the Android version and architecture the running Android reports, downloads it,
// checks it, makes a system image of its apps and permission files, and puts the image on
// the caller's add-on disk, from which Android lays it over its system from its next start.
// While it works it answers the request id with GappsProgress, as often as there is news; it
// then answers once more with Gapps, or an error. The connection then ends. Android must be
// running, because it says which Android version and processor the build is for.
message InstallGapps {}

// Asks where Google Play stands for the caller. Answered with Gapps.
message GetGapps {}

// Removes the caller's Google apps. Answered with Gapps. Android goes on using an image it
// has mounted until it restarts.
message RemoveGapps {}

// What an InstallGapps is doing.
enum GappsStage {
  GAPPS_STAGE_UNSPECIFIED = 0;
  // Reading the file host's list of builds.
  GAPPS_STAGE_LISTING = 1;
  // Downloading the build: `done` of `total` bytes.
  GAPPS_STAGE_DOWNLOADING = 2;
  // Checking the build and making the system image.
  GAPPS_STAGE_BUILDING = 3;
  // Putting the image on the add-on disk: `done` of `total` bytes.
  GAPPS_STAGE_SENDING = 4;
}

// News of an InstallGapps under way.
message GappsProgress {
  GappsStage stage = 1;
  uint64 done = 2;
  // 0 when not known.
  uint64 total = 3;
}

// Where Google Play stands for the caller.
message Gapps {
  // The installed package; absent when there is none.
  GappsPackage package = 1;
  // Whether the running Android was asked, and answered: the fields below up to device_id
  // hold only then.
  bool guest_known = 2;
  // The Google apps image is on the caller's add-on disk, for Android's next start.
  bool guest_installed = 3;
  // The running Android has the Google apps laid over its system.
  bool guest_active = 4;
  // The running Android's API level and primary ABI.
  uint32 sdk = 5;
  string abi = 6;
  // The ABIs the running Android installs apps for, in the order it prefers them.
  string abilist = 7;
  // The running Android's Google Services Framework Android ID, in decimal, which Google's
  // page for uncertified devices asks for; empty until Google's apps have one.
  string device_id = 8;
  // What is installed differs from what the running Android booted with, so it applies once
  // Android starts again.
  bool restart_needed = 9;
  // The installed package's image was made by an older DSA, which this one no longer lays
  // over the system, and the downloaded package is not kept to make it again: Android starts
  // without Google's apps until the user installs Google Play again.
  bool reinstall_needed = 10;
  // The running Android still has a Google apps image a DSA from before the add-on disk sent
  // to its own disk, which the service moves onto the add-on disk and then removes. Holds only
  // when guest_known.
  bool guest_left_on_data = 11;
}

// Asks for the device identity of the caller's Android.
message GetDeviceIdentity {}

// Replaces the device identity of the caller's Android with `identity`. Android reads it when
// it starts, so a change applies from its next start. A value the service does not accept
// changes nothing and is answered with ERROR_CODE_INVALID_SETTING.
message SetDeviceIdentity {
  DeviceIdentity identity = 1;
}

// The names and build fingerprint Android reports to apps. An empty value is the default: the
// computer's manufacturer, brand and model, and DSA's own for the rest.
message DeviceIdentity {
  string manufacturer = 1;
  string brand = 2;
  string model = 3;
  string device = 4;
  // The product name.
  string name = 5;
  // ro.build.characteristics: comma-separated words such as "tablet".
  string characteristics = 6;
  // The whole fingerprint, brand/name/device:release/id/incremental:type/tags. When set it is
  // the fingerprint, whatever the parts below say.
  string fingerprint = 7;
  string fingerprint_release = 8;
  string fingerprint_id = 9;
  string fingerprint_incremental = 10;
  string fingerprint_type = 11;
  string fingerprint_tags = 12;
  // The values below follow the computer and are not chosen: a report carries them, and
  // SetDeviceIdentity ignores them. The name the product is sold under, such as
  // "Galaxy Book4 Ultra".
  string model_name = 13;
  // Android's device name: the computer's name.
  string device_name = 14;
  // The chip's maker and model, such as "Intel" and "Core Ultra 7 155H"; empty when the
  // computer does not say.
  string soc_manufacturer = 15;
  string soc_model = 16;
}

// The answer to GetDeviceIdentity and SetDeviceIdentity.
message DeviceIdentityReport {
  // What the user chose; an empty value is the default.
  DeviceIdentity chosen = 1;
  // Every value as Android reports it from its next start. The fingerprint's release, build ID
  // and incremental version are empty when the image does not say them.
  DeviceIdentity effective = 2;
  // Every value as Android reports it when the user chooses nothing.
  DeviceIdentity defaults = 3;
  // The fields whose default is the computer's, named as `dsa settings set device.<name>`
  // names them (and model_name, device_name, soc_manufacturer, soc_model). Every other
  // default is DSA's own.
  repeated string from_computer = 4;
}

// Turns the connection into the accessibility tree of one of the caller's task windows, for a
// host accessibility client (a screen reader, an inspection tool) that reads that window.
// After the answer (Done), the service sends an AccessibilityTree each time the task's tree
// arrives from Android or changes in it (a full tree first), and an AccessibilityActionResult
// for each AccessibilityAction the client sends. Android reads the task's accessibility nodes
// only while at least one such connection for the task is open: closing the last one stops
// it. The connection lasts across restarts of the Android, which sends a full tree again.
message WatchAccessibility {
  int32 task_id = 1;
}

// What can be done to an accessibility node.
enum NodeAction {
  NODE_ACTION_UNSPECIFIED = 0;
  NODE_ACTION_CLICK = 1;
  NODE_ACTION_LONG_CLICK = 2;
  NODE_ACTION_SET_TEXT = 3;
  NODE_ACTION_SCROLL_FORWARD = 4;
  NODE_ACTION_SCROLL_BACKWARD = 5;
  NODE_ACTION_FOCUS = 6;
  NODE_ACTION_ACCESSIBILITY_FOCUS = 7;
  NODE_ACTION_SELECT = 8;
}

// The range a slider or a progress bar has, and where it stands in it.
message NodeRange {
  float min = 1;
  float max = 2;
  float current = 3;
}

// One accessibility node of a task, as Android describes it.
message AccessibilityNode {
  // Unique among the nodes of one tree epoch, never 0.
  uint32 id = 1;
  repeated uint32 child_ids = 2;
  // The Android class the node says it is, from which its role is worked out.
  string class_name = 3;
  string text = 4;
  string content_description = 5;
  string hint = 6;
  string view_id = 7;
  // In pixels of the task's window: (0, 0) is the window's top left.
  Rect bounds = 8;
  bool checkable = 9;
  bool checked = 10;
  bool selected = 11;
  bool enabled = 12;
  bool focusable = 13;
  bool focused = 14;
  bool scrollable = 15;
  bool clickable = 16;
  bool long_clickable = 17;
  bool editable = 18;
  bool password = 19;
  bool heading = 20;
  NodeRange range = 21;
  repeated NodeAction actions = 22;
  string state_description = 23;
}

// A task's accessibility tree, or what changed in it, on a connection that watches it
// (WatchAccessibility). A full tree replaces what came before and starts a new epoch; a change
// names the epoch it applies to, carries each new or changed node whole, and the IDs of the
// nodes that are gone.
message AccessibilityTree {
  int32 task_id = 1;
  uint32 epoch = 2;
  bool full = 3;
  repeated uint32 root_ids = 4;
  repeated AccessibilityNode nodes = 5;
  repeated uint32 removed_ids = 6;
  // The node with the input focus, or 0 for none.
  uint32 focused_id = 7;
}

// Client to service, on a connection that watches a task's tree: do something to one of its
// nodes. Not answered as a request: an AccessibilityActionResult with the same request_id
// follows.
message AccessibilityAction {
  uint32 epoch = 1;
  uint32 node_id = 2;
  NodeAction action = 3;
  string text = 4;
  uint32 request_id = 5;
}

// What came of an AccessibilityAction.
message AccessibilityActionResult {
  uint32 request_id = 1;
  bool done = 2;
  string error = 3;
}

// What went wrong with a request.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // The request named nothing the service understands.
  ERROR_CODE_UNKNOWN_REQUEST = 1;
  // The service could not provide an Android for this user.
  ERROR_CODE_UNAVAILABLE = 2;
  // DSA could not be updated: updates are off, the program list or the setup file did not
  // check out, or setup could not start. The detail says which.
  ERROR_CODE_UPDATE_FAILED = 3;
  // The request needs the caller's Android to be running, and it is not.
  ERROR_CODE_NOT_RUNNING = 4;
  // A setting has a value the service does not accept. The detail says which and why.
  ERROR_CODE_INVALID_SETTING = 5;
  // The request changes something that applies to every user of the machine, and the caller
  // is not acting as an administrator.
  ERROR_CODE_NOT_ALLOWED = 6;
  // A file sent to Android was refused: it is too large, its name cannot be used, it did not
  // arrive whole, or Android could not take it. The detail says which.
  ERROR_CODE_FILE_REFUSED = 7;
  // An APK was not taken: it is too large, its name is not an APK's, or it did not arrive
  // whole. The detail says which. An APK Android refused is answered with InstallResult.
  ERROR_CODE_INSTALL_REFUSED = 8;
  // A widget was not placed: its app offers no such widget, Android did not allow it, or the
  // user canceled its setup. The detail says which.
  ERROR_CODE_WIDGET_REFUSED = 9;
  // Choosing an older Android major version erases user data, and the request did not agree
  // to that. The detail says what would be lost.
  ERROR_CODE_DATA_WOULD_BE_LOST = 10;
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
}

// A request from the client. The service answers each with one Response carrying the same
// id, in the order the requests arrived.
// Gives the caller's Android the system settings of the caller's host session: its time zone,
// languages, regional format, app theme and accent color. The caller's window manager sends
// them when it starts and whenever the user changes one; the Android takes them at once when
// it runs, and when it next starts otherwise. The service answers Done.
message SetSystemSettings {
  SystemSettings settings = 1;
}

// The system settings of a user's host session, which their Android follows.
message SystemSettings {
  // The time zone as an IANA name, such as "Asia/Seoul"; empty when unknown.
  string time_zone = 1;
  // The display languages as BCP 47 tags, preferred first.
  repeated string locales = 2;
  // The locale dates, times and numbers are formatted by; empty when it is the first language.
  string regional_format = 3;
  bool time_24_hour = 4;
  // 1 is Monday through 7, Sunday; 0 when unknown.
  uint32 first_day_of_week = 5;
  // Whether apps use the dark theme.
  bool dark_mode = 6;
  // The accent color as 0xAARRGGBB; 0 when there is none.
  fixed32 accent_color = 7;
  // The size of text the user asked for, in percent of the default: Windows' text size
  // setting (100 to 225), or the desktop's text scaling factor. 0 when unknown, which counts
  // as 100.
  uint32 text_scale_percent = 8;
}

// Turns the connection into the caller's game controllers: after the answer (Done), the client
// sends a GamepadEvent each time a controller is connected, disconnected or changes state, and
// the service sends a GamepadRumble each time an app in the caller's Android plays a rumble
// effect on one. Neither is answered. The service keeps the controllers that are connected and
// gives them to the Android each time it is ready, so a controller connected before Android
// started is there too. When the connection ends, its controllers are disconnected.
message WatchGamepads {}

// A controller changed, on a connection that carries the controllers (WatchGamepads).
message GamepadEvent {
  oneof event {
    GamepadConnected connected = 1;
    GamepadDisconnected disconnected = 2;
    GamepadState state = 3;
  }
}

// A controller was connected.
message GamepadConnected {
  uint32 pad_id = 1;
  string name = 2;
  uint32 vendor_id = 3;
  uint32 product_id = 4;
  bool rumble = 5;
}

// A controller was disconnected.
message GamepadDisconnected {
  uint32 pad_id = 1;
}

// The state of a controller's buttons (the bits of the control protocol's GamepadButton),
// sticks (-32768 to 32767) and triggers (0 to 255).
message GamepadState {
  uint32 pad_id = 1;
  uint32 buttons = 2;
  sint32 left_x = 3;
  sint32 left_y = 4;
  sint32 right_x = 5;
  sint32 right_y = 6;
  uint32 left_trigger = 7;
  uint32 right_trigger = 8;
}

// An app plays a rumble effect on a controller (both strengths 0 stops it), on a connection
// that carries the controllers.
message GamepadRumble {
  uint32 pad_id = 1;
  // From 0 to 65535.
  uint32 strong = 2;
  uint32 weak = 3;
  // How long it lasts, in milliseconds; 0 until the next one.
  uint32 duration_ms = 4;
}

// The user's window settings for one app.
message AppWindowSettings {
  string package_name = 1;
  // Whether the app's windows keep the size they open at: the user cannot resize or maximise
  // them. Off by default.
  bool fixed_size = 2;
  // The size the app's windows open at, in density-independent pixels. 0 by 0, the default,
  // opens them at the size Android gives the task.
  uint32 start_width_dp = 3;
  uint32 start_height_dp = 4;
  // How the app follows its window to a monitor of another scale. No way restarts the app.
  DpiScaling dpi_scaling = 5;
}

// How an app follows its window to a monitor of another scale, as Windows' "high DPI scaling
// performed by" does for a desktop program.
enum DpiScaling {
  // The app's own way: APP for an app whose activity says it handles a change of density
  // itself, SYSTEM for any other.
  DPI_SCALING_AUTO = 0;
  // The task takes the new monitor's density and the app redraws at it.
  DPI_SCALING_APP = 1;
  // The task keeps its density and the host scales the window's picture to the new monitor,
  // so the app keeps its size on the screen.
  DPI_SCALING_SYSTEM = 2;
  // The app is given the new density without a restart, even though it does not say it
  // handles one. It needs a change to Android's framework that is not made yet; until then it
  // works as SYSTEM does.
  DPI_SCALING_SYSTEM_FORCED = 3;
}

// Lists the caller's window settings for every app that has any. The service answers
// AppWindowSettingsList.
message ListAppWindowSettings {}

// Replaces the caller's window settings for one app; the defaults (resizable, opening at
// Android's size) remove the app's entry. The service answers AppWindowSettingsList with
// every app's settings as they are now, or ERROR_CODE_INVALID_SETTING for a package name or
// size it cannot take. Windows that open from now on follow the new settings.
message SetAppWindowSettings {
  AppWindowSettings app = 1;
}

// The caller's window settings for every app that has any, by package name.
message AppWindowSettingsList {
  repeated AppWindowSettings apps = 1;
}

