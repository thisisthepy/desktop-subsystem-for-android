// The connection between the window manager and the app window hosts in a user's session.
//
// The window manager receives every Android task's frames and owns no window. Each app has
// its own small program, its window host, which carries the app's name and icon, so the
// taskbar and the task list show the app as itself. The window host opens the app's task
// windows and shows the frames the window manager hands it on the GPU. This file is the only
// definition of the messages between the two; the codecs are generated from it (see
// README.md).
//
// The window host dials the window manager and sends the Hello, the window manager answers,
// and the window host says which app it is (Attach). From then on the window manager tells
// it which windows to open and what to show in them, and the window host reports what the
// user does to them.
//
// The same rules as control.proto keep the handshake readable across versions: Envelope
// fields 1 to 3, and every field of Hello, HelloAccepted, HelloRejected and RejectReason,
// keep their numbers and types forever.

syntax = "proto3";

package dsa.windowhost.v1;

option java_package = "io.github.thisisthepy.dsa.windowhost.v1";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

// The protocol version. CURRENT goes up when the meaning of existing messages changes.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 1;
}

// Which end of the connection a peer is.
enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_WINDOW_MANAGER = 1;
  ROLE_WINDOW_HOST = 2;
}

// The first frame on a new connection, sent by the window host.
message Hello {
  // ProtocolVersion.PROTOCOL_VERSION_CURRENT of the sender's build.
  uint32 protocol_version = 1;
  // SHA-256 of the normalised definition the sender was generated from (32 bytes).
  bytes schema_hash = 2;
  Role role = 3;
  // Free text naming the sender's build, for error reports only.
  string build = 4;
}

// The window manager's answer when the window host's Hello matches.
message HelloAccepted {
  Hello window_manager = 1;
}

// Why the window manager refused a connection.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_PROTOCOL_VERSION_MISMATCH = 1;
  REJECT_REASON_SCHEMA_HASH_MISMATCH = 2;
  REJECT_REASON_UNEXPECTED_ROLE = 3;
  REJECT_REASON_MALFORMED_HELLO = 4;
}

// The window manager's answer when it refuses the window host. It closes the connection
// after it.
message HelloRejected {
  RejectReason reason = 1;
  // A sentence a person can act on, naming both sides' values.
  string detail = 2;
  Hello window_manager = 3;
}

// Window host to window manager, right after the handshake: which app this window host
// shows.
message Attach {
  // The Android package of the app.
  string package_name = 1;
  // The window host's process ID, which the window manager hands the frames' textures to.
  uint32 process_id = 2;
  // Whether the user started the window host (from the Start menu, say) rather than the
  // window manager: the app is then started in Android if it has no task yet.
  bool launch = 3;
  // With `launch`: start this shortcut of the app (its jump list task or desktop shortcut)
  // rather than the app itself. Empty for the app.
  string shortcut_id = 4;
}

// Window manager to window host: the answer to Attach.
message Attached {
  // The locally unique ID of the GPU the frames' textures are on (8 bytes, little endian),
  // so the window host shows them on the same GPU. Empty when the window manager has no
  // frames to show.
  bytes adapter_luid = 1;
}

// Window manager to window host: open a window for an Android task of the app.
message ShowWindow {
  int32 task_id = 1;
  // The window's title.
  string title = 2;
  // The size of the window's client area in pixels.
  uint32 width = 3;
  uint32 height = 4;
  // Whether the task has input focus in Android, so the window opens active.
  bool focused = 5;
}

// Window manager to window host: the title of a task's window changed.
message SetTitle {
  int32 task_id = 1;
  string title = 2;
}

// Window manager to window host: Android resized the task; the window's client area follows.
message SetSize {
  int32 task_id = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// Window manager to window host: the task ended; close its window.
message CloseWindow {
  int32 task_id = 1;
}

// Window manager to window host: from now on the task's frames arrive in this texture. The
// texture is a Direct3D 11 texture on the GPU Attached named, shared by an NT handle that the
// window manager has already placed in the window host's process. The window host opens
// it, then closes the handle.
message FrameTexture {
  int32 task_id = 1;
  // Names the texture in later Frame messages.
  uint64 texture_id = 2;
  // The handle's value in the window host's process.
  uint64 handle = 3;
  uint32 width = 4;
  uint32 height = 5;
}

// Window manager to window host: a new frame of the task is in the texture. The window
// manager does not write the texture again until the window host answers FramePresented.
message Frame {
  int32 task_id = 1;
  uint64 texture_id = 2;
  // Goes up by one with each frame of the task.
  uint64 sequence = 3;
  // The frame fills only the top-left width x height pixels of the texture, which stays at
  // the largest size the task can have so that resizing the window does not remake it. 0
  // means the frame fills the whole texture.
  uint32 width = 4;
  uint32 height = 5;
}

// Window host to window manager: the frame has been copied out of the texture, so the
// texture may be written again.
message FramePresented {
  int32 task_id = 1;
  uint64 sequence = 2;
}

// Window host to window manager: the user closed the task's window.
message WindowClosed {
  int32 task_id = 1;
}

// Window host to window manager: the user resized the task's window; the size of its client
// area in pixels.
message WindowResized {
  int32 task_id = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// Window host to window manager: the task's window moved to a monitor of another scale.
message WindowDpi {
  int32 task_id = 1;
  // The monitor's dots per inch; 96 is 100%.
  uint32 dpi = 2;
}

// Window host to window manager: the task's window became the active window, or stopped
// being it.
message WindowFocus {
  int32 task_id = 1;
  bool focused = 2;
}

// Window host to window manager: the user started dragging the task's window, to move or
// resize it, or let go. While a drag lasts the window manager never resizes the window.
message WindowDragging {
  int32 task_id = 1;
  bool dragging = 2;
}

// Window manager to window host: the task's size in Android, which its frames and its pointer
// input are measured in, the largest client area its window may have (what Android can draw;
// 0 when unknown), and the smallest (what Android gives the task; 0 when unknown). Sent when
// any of them changes, which a resize the window asked for does without the window itself
// changing.
message TaskSize {
  int32 task_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 max_width = 4;
  uint32 max_height = 5;
  uint32 min_width = 6;
  uint32 min_height = 7;
  // How large the window shows each of the task's pixels: `scale_numerator` window pixels
  // per `scale_denominator` task pixels. The window manager scales a task that keeps its
  // density on a monitor of another scale, so the app keeps its size on the screen; the
  // window then shows its frames, and measures its pointer input, at this scale. 0 by 0, as
  // 1 by 1, is one window pixel per task pixel. The client sizes above are the window's.
  uint32 scale_numerator = 8;
  uint32 scale_denominator = 9;
}

// Window manager to window host: where the cursor of the editor focused in the task is, in the
// window's client pixels, so the window puts the input method's windows beside it.
message ImeCursor {
  int32 task_id = 1;
  int32 left = 2;
  int32 top = 3;
  int32 right = 4;
  int32 bottom = 5;
}

// What kind of text the editor focused in a task takes, as its app declared it.
enum ImeInputKind {
  // The guest did not say. Taken as ordinary text.
  IME_INPUT_KIND_UNSPECIFIED = 0;
  // No editor in the task takes text; typed characters reach it as keys.
  IME_INPUT_KIND_NONE = 1;
  IME_INPUT_KIND_TEXT = 2;
  IME_INPUT_KIND_PASSWORD = 3;
  IME_INPUT_KIND_NUMBER = 4;
  // A number that is a password, such as a PIN.
  IME_INPUT_KIND_NUMBER_PASSWORD = 5;
  IME_INPUT_KIND_PHONE = 6;
  IME_INPUT_KIND_EMAIL = 7;
  IME_INPUT_KIND_URL = 8;
  IME_INPUT_KIND_PERSON_NAME = 9;
  IME_INPUT_KIND_DATE = 10;
  IME_INPUT_KIND_TIME = 11;
  IME_INPUT_KIND_SEARCH = 12;
}

// Window manager to window host: the editor focused in the task, as the window's input method
// reads it: its kind, and its text around the selection, so the input method reconverts and
// predicts from the editor's own text. Offsets are in UTF-16 code units from the start of the
// editor's whole text; there is no composition when its start equals its end.
message ImeEditor {
  int32 task_id = 1;
  ImeInputKind kind = 2;
  string text = 3;
  uint32 text_start = 4;
  uint32 selection_start = 5;
  uint32 selection_end = 6;
  uint32 composition_start = 7;
  uint32 composition_end = 8;
}

// Window host to window manager: the task's window was minimized (`shown` false), or shown
// again after it was. A window that opens is shown until it says otherwise.
message WindowShown {
  int32 task_id = 1;
  bool shown = 2;
}

// Window host to window manager: the task's window draws its title bar over the top
// `height` client pixels, where the app's content continues underneath. Sent when the window
// opens and whenever the height changes (a move to a monitor of another scale, a change of
// the system's caption size). The window manager asks Android to give the task a top inset
// of that height.
//
// `start_width` and `end_width` are how far the app's icon (with the space around it) and
// the caption buttons reach into the band from its left and right ends, in client pixels. An
// app that draws its own title bar is told them, so it keeps its controls out of them.
message WindowCaption {
  int32 task_id = 1;
  uint32 height = 2;
  uint32 start_width = 3;
  uint32 end_width = 4;
}

// A rectangle in client pixels: left and top inclusive, right and bottom exclusive.
message ClientRect {
  int32 left = 1;
  int32 top = 2;
  int32 right = 3;
  int32 bottom = 4;
}

// Window manager to window host: whether the task's app draws its own title bar (it asked
// Android for a transparent caption bar background). While it does, the window draws only its
// caption buttons and the app's icon over the app, not the app's name, and the points of the
// band inside `interactive` (the app's controls there, in client pixels) go to the app; the
// rest of the band still drags the window. Sent when it changes; a window opens with the
// window's own title bar.
message SetCaptionMode {
  int32 task_id = 1;
  bool app_drawn = 2;
  repeated ClientRect interactive = 3;
}

// Window manager to window host: whether the task has somewhere to go back to (it is past
// its first screen). While it has, the title bar shows a back arrow in the place of the app's
// icon, in the same cell, and a click on it sends the task Back; otherwise the cell shows the
// icon and opens the system menu. Sent when it changes; a window opens with the icon.
message SetCaptionBack {
  int32 task_id = 1;
  bool back = 2;
}

// Window manager to window host: what the app's windows offer in their system menu. Sent
// after Attached, and again when the app changes.
message AppMenu {
  // Whether the app supports several windows, so the menu offers New window.
  bool new_window = 1;
}

// Window manager to window host: the app's icon changed since the window host's program was
// made with it (the app was updated, or its icon could not be drawn before). Every window of
// the app shows it at once: on the taskbar, in Alt+Tab and in the title bar. The program's
// own icon takes it the next time the program is made.
message AppIcon {
  // The app's launcher icon, as a square PNG image. Never empty.
  bytes icon_png = 1;
  // The icon a window's title bar shows: an adaptive icon's foreground layer alone, as a
  // square PNG image. Empty for an app whose icon is not adaptive, which shows `icon_png`
  // there too.
  bytes caption_icon_png = 2;
}

// Window manager to window host: the app's media session, for the media buttons (previous,
// play or pause, next) in the taskbar preview of each of its windows. Sent when the window
// host attaches while the app has a session, whenever the session's playback state or allowed
// actions change, and once with `active` false when the session ends, which hides the buttons.
// About the app, like AppIcon.
message AppMedia {
  // Whether the app has an active media session.
  bool active = 1;
  // Whether it plays now: the middle button then pauses, otherwise it plays.
  bool playing = 2;
  // What the session allows now. A button it does not allow is shown disabled.
  bool can_previous = 3;
  bool can_play = 4;
  bool can_pause = 5;
  bool can_next = 6;
}

// A media button of a window's taskbar preview.
enum MediaButton {
  MEDIA_BUTTON_UNSPECIFIED = 0;
  MEDIA_BUTTON_PREVIOUS = 1;
  MEDIA_BUTTON_PLAY = 2;
  MEDIA_BUTTON_PAUSE = 3;
  MEDIA_BUTTON_NEXT = 4;
}

// Window host to window manager: the user clicked a media button in the taskbar preview of the
// task's window. The window manager sends the action to the app's media session.
message MediaButtonPressed {
  int32 task_id = 1;
  MediaButton button = 2;
}

// An item of a task window's system menu that the window manager carries out.
enum MenuAction {
  MENU_ACTION_UNSPECIFIED = 0;
  // Start another task of the app in a window of its own.
  MENU_ACTION_NEW_WINDOW = 1;
  // Android's setting of the app's aspect ratio.
  MENU_ACTION_ASPECT_RATIO = 2;
  // Android's setting of whether the app opens the links it supports.
  MENU_ACTION_OPEN_BY_DEFAULT = 3;
  // The app's page in DSA's settings.
  MENU_ACTION_APP_INFO = 4;
}

// Window host to window manager: the user chose an item of the task window's system menu.
message MenuChosen {
  int32 task_id = 1;
  MenuAction action = 2;
}

// The tone of a window's caption buttons, so they stay readable over the app's status bar.
enum CaptionTone {
  CAPTION_TONE_UNSPECIFIED = 0;
  // Dark glyphs, for a light status bar.
  CAPTION_TONE_DARK_GLYPHS = 1;
  // Light glyphs, for a dark status bar.
  CAPTION_TONE_LIGHT_GLYPHS = 2;
}

// Window manager to window host: the caption buttons of the task's window take this tone.
// Sent when the window opens and whenever the app's status bar changes tone.
message SetCaptionTone {
  int32 task_id = 1;
  CaptionTone tone = 2;
}

// How a task's window is shown.
enum WindowMode {
  // An ordinary window with a title bar, which the user moves and resizes.
  WINDOW_MODE_NORMAL = 0;
  // The app asked to fill the screen: the window covers its whole monitor, with no title bar.
  WINDOW_MODE_FULLSCREEN = 1;
  // The app went into picture-in-picture: a small window that stays above the others.
  WINDOW_MODE_PICTURE_IN_PICTURE = 2;
}

// Window manager to window host: how the task's window is shown, as the app asks and the
// user's settings for the app say. Sent when the window opens unless the window is an
// ordinary resizable one, and on each change. The user's F11 turns full screen on or off
// over what the app asked for, until the app asks again.
message SetWindowMode {
  int32 task_id = 1;
  WindowMode mode = 2;
  // Whether the user may resize the window: off when the user's settings for the app say so.
  bool resizable = 3;
}

// Window manager to window host: the window opened for task `task_id` shows task
// `shown_task_id` from now on. After a GPU reset an app's task can end and the app start
// again; its new task then takes the window over, so the window keeps its place and its size.
// Every message on this connection still names the window by `task_id`. What the window sends
// Android itself, past the window manager (its pointer, key and text input, its accessibility
// watch and actions, a drag out of it), goes to `shown_task_id`, since the task the window
// opened for has ended. Sent again with each later takeover.
message SetShownTask {
  int32 task_id = 1;
  int32 shown_task_id = 2;
}

// The one message type on the wire. Each frame carries exactly one.
message Envelope {
  oneof body {
    Hello hello = 1;
    HelloAccepted hello_accepted = 2;
    HelloRejected hello_rejected = 3;
    Attach attach = 4;
    Attached attached = 5;
    ShowWindow show_window = 6;
    SetTitle set_title = 7;
    SetSize set_size = 8;
    CloseWindow close_window = 9;
    FrameTexture frame_texture = 10;
    Frame frame = 11;
    FramePresented frame_presented = 12;
    WindowClosed window_closed = 13;
    WindowResized window_resized = 14;
    WindowDpi window_dpi = 15;
    WindowFocus window_focus = 16;
    WindowDragging window_dragging = 17;
    TaskSize task_size = 18;
    ImeCursor ime_cursor = 19;
    WindowShown window_shown = 30;
    WindowCaption window_caption = 31;
    SetCaptionTone set_caption_tone = 32;
    SetCaptionMode set_caption_mode = 33;
    AppMenu app_menu = 34;
    MenuChosen menu_chosen = 35;
    SetCaptionBack set_caption_back = 36;
    SetWindowMode set_window_mode = 60;
    ImeEditor ime_editor = 61;
    AppIcon app_icon = 62;
    AppMedia app_media = 63;
    MediaButtonPressed media_button_pressed = 64;
    SetShownTask set_shown_task = 65;
  }
}
