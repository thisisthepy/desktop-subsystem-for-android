<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
<!-- The APK Installer: an open cardboard box, three-quarter view, left flap raised. DSA's own
     drawing, with no DSA mark on it, so it reads as "install a package" at every size. -->
<defs>
<linearGradient id="front" x1="40" y1="70" x2="165" y2="250" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#DEB87F"/><stop offset="1" stop-color="#D3A564"/></linearGradient>
<linearGradient id="side" x1="190" y1="90" x2="195" y2="250" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C38C45"/><stop offset="0.15" stop-color="#CD984F"/><stop offset="1" stop-color="#C9924B"/></linearGradient>
<linearGradient id="back" x1="170" y1="12" x2="160" y2="58" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E2BF8A"/><stop offset="0.8" stop-color="#DAAF71"/><stop offset="1" stop-color="#CFA062"/></linearGradient>
<linearGradient id="lflap" x1="20" y1="15" x2="80" y2="45" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#E2BE88"/><stop offset="1" stop-color="#D8B279"/></linearGradient>
<linearGradient id="rflap" x1="170" y1="95" x2="252" y2="79" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#D9AF72"/><stop offset="1" stop-color="#E2BE88"/></linearGradient>
<linearGradient id="inback" x1="150" y1="45" x2="160" y2="95" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B8823D"/><stop offset="1" stop-color="#C7944D"/></linearGradient>
<linearGradient id="inleft" x1="50" y1="45" x2="95" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#B98240"/><stop offset="1" stop-color="#AD7433"/></linearGradient>
<linearGradient id="flapshade" x1="190" y1="94" x2="197" y2="116" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#5A3510" stop-opacity="0.5"/><stop offset="1" stop-color="#5A3510" stop-opacity="0"/></linearGradient>
<linearGradient id="ground" x1="0" y1="243" x2="0" y2="256" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#000000" stop-opacity="0.12"/><stop offset="1" stop-color="#000000" stop-opacity="0"/></linearGradient>
</defs>
