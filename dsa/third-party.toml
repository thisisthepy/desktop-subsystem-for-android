# Every third-party component DSA ships that Cargo does not list.
#
# Rust crates come from Cargo.lock and are checked against deny.toml. Everything else that
# goes into the installer, the settings app, the setup program or the guest image is listed
# here, with its licence (an SPDX expression), its source and how it is shipped.
# installer/generate-licenses.py checks this file and writes the notices from it, and CI
# fails when a component's licence is not allowed or a package reference in a .csproj or
# the agent's build.gradle.kts is missing from this list.
#
# The licence rule:
# - A component that is linked into, or built into, a DSA program must carry only licences
#   from `policy.allow` (permissive licences that can be distributed beside Apache-2.0).
# - A licence from `policy.weak_copyleft` (file-level reciprocal licences) is allowed for a
#   component DSA ships unmodified, with `modified = false` and a `source` to get it from.
# - A licence from `policy.separate_program` (GPL) is allowed only for a program that runs
#   on its own and is not linked with DSA code (`distribution = "separate-program"`), with
#   a written source offer (`source_offer`). The guest kernel is the one such component:
#   it runs in its own virtual machine, and DSA talks to it only through system calls and
#   devices, never by linking.

[policy]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
weak_copyleft = ["MS-RL"]
separate_program = ["GPL-2.0-only", "GPL-2.0-only WITH Linux-syscall-note"]

# The setup program (setup.exe and DsaSetup.exe).

[[component]]
name = "WiX Toolset Burn engine and bootstrapper runtime"
package = "WixToolset.BootstrapperApplicationApi"
version = "5.0.2"
license = "MS-RL"
part = "setup"
distribution = "linked"
modified = false
source = "https://github.com/wixtoolset/wix"

[[component]]
name = ".NET Framework reference assemblies (build time only)"
package = "Microsoft.NETFramework.ReferenceAssemblies"
version = "1.0.3"
license = "MIT"
part = "setup"
distribution = "build-only"
source = "https://github.com/microsoft/dotnet"

