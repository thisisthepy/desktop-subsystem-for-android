# The guest image: AOSP, DSA's own guest programs and what they are built from.

[[component]]
name = "Android Open Source Project system image"
license = "Apache-2.0"
part = "guest"
distribution = "aggregate"
notice = "Each guest image carries the AOSP NOTICE file (NOTICE.xml.gz) that its build produced, listing every AOSP module and its licence."
source = "https://android.googlesource.com/"

[[component]]
name = "Guest kernel (WSL2 Linux kernel with DSA's configuration)"
license = "GPL-2.0-only WITH Linux-syscall-note"
part = "guest"
distribution = "separate-program"
source = "https://github.com/microsoft/WSL2-Linux-Kernel"
source_offer = "kernel-source-offer.txt"

[[component]]
name = "Protocol Buffers C++ runtime (dsa-hwcomposer, dsa-codec2, dsa power HAL)"
version = "3.21.12"
license = "BSD-3-Clause"
part = "guest"
distribution = "linked"
source = "https://github.com/protocolbuffers/protobuf"

[[component]]
name = "AOSP hardware/interfaces, frameworks/native and frameworks/av generated code (DSA guest HALs)"
license = "Apache-2.0"
part = "guest"
distribution = "linked"
source = "https://android.googlesource.com/"

[[component]]
name = "Protocol Buffers Java lite runtime (DSA agent)"
package = "com.google.protobuf:protobuf-javalite"
version = "3.21.12"
license = "BSD-3-Clause"
part = "guest"
distribution = "linked"
source = "https://github.com/protocolbuffers/protobuf"

[[component]]
name = "Kotlin standard library (DSA agent)"
version = "2.2.20"
