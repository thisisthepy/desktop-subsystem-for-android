[[component]]
name = "WPF UI"
package = "WPF-UI"
version = "3.0.5"
license = "MIT"
part = "settings"
distribution = "linked"
source = "https://github.com/lepoco/wpfui"

[[component]]
name = ".NET runtime and WPF"
version = "8.0"
license = "MIT"
part = "settings"
distribution = "linked"
source = "https://github.com/dotnet/runtime"

