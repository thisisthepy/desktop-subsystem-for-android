# Every third-party component DSA ships that Cargo does not list.
#
# Rust crates come from Cargo.lock and are checked against deny.toml. Everything else that
# goes into the installer, the settings app, the setup program or the guest image is listed
# here, with its licence (an SPDX expression), its source and how it is shipped.
# installer/generate-licenses.py checks this file and writes the notices from it, and CI
# fails when a component's licence is not allowed or a package reference in a .csproj or
# the agent's module.yaml is missing from this list.
#
# The licence rule:
# - A component that is linked into, or built into, a DSA program must carry only licences
#   from `policy.allow` (permissive licences that can be distributed beside Apache-2.0).
# - A licence from `policy.weak_copyleft` (file-level reciprocal licences) is allowed for a
#   component DSA ships unmodified, with `modified = false` and a `source` to get it from.
# - A licence from `policy.separate_program` (GPL) is allowed only for a program that runs
#   on its own and is not linked with DSA code (`distribution = "separate-program"`), with
#   its corresponding source shipped beside it in every release that ships it
#   (`shipped_source`, the notice that says where). The guest kernel is one such component:
#   it runs in its own virtual machine, and DSA talks to it only through system calls and
#   devices, never by linking. passt, the Linux host's user-mode NAT, is the other: it runs as
#   its own process and crosvm reaches it only through a vhost-user socket.
#
# crosvm's own crates are not in Cargo.lock: dsa/host/platform/linux/crosvm/check-licenses.py
# lists them for the build DSA ships and fails on any GPL, LGPL or AGPL one.

[policy]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
weak_copyleft = ["MS-RL"]
separate_program = ["GPL-2.0-only", "GPL-2.0-only WITH Linux-syscall-note", "GPL-2.0-or-later"]
# Map data the host reads, which no program links: allowed with distribution = "data" and the
# attribution the licence asks for in `notice`, which the third-party notice carries.
# LicenseRef-KOGL-Type-1 is the Korea Open Government License Type 1 (source indication);
# LicenseRef-Public-Domain is data its makers put in the public domain.
data = ["CC-BY-4.0", "LicenseRef-KOGL-Type-1", "LicenseRef-Public-Domain"]

