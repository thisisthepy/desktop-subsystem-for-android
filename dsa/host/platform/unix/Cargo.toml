[package]
name = "dsa-host-unix"
version = "0.1.0"
description = "The local API over Unix sockets, for the Linux and macOS hosts"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dsa-transport.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
dsa-transport = { workspace = true, features = ["conformance"] }
dsa-host-core = { workspace = true, features = ["conformance"] }
