[package]
name = "dsa-host-windows"
version = "0.1.0"
description = "The Windows host: WSL launch and the hvsocket transport"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
dsa-transport.workspace = true
dsa-host-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock"] }

[dev-dependencies]
dsa-transport = { workspace = true, features = ["conformance"] }
