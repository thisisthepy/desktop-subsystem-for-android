[package]
name = "dsa-cli"
version = "0.1.0"
description = "dsa, the command line client of the local API"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "dsa"
path = "src/main.rs"

[dependencies]
dsa-transport.workspace = true
dsa-host-core.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
dsa-host-windows = { path = "../platform/windows" }

[target.'cfg(unix)'.dependencies]
dsa-host-unix = { path = "../platform/unix" }

[target.'cfg(target_os = "linux")'.dependencies]
# The launcher entries, which dsa apps desktop-shortcut puts on the desktop.
dsa-host-linux = { path = "../platform/linux" }

[target.'cfg(target_os = "macos")'.dependencies]
dsa-host-macos = { path = "../platform/macos" }

[build-dependencies]
dsa-exe-resources = { path = "../platform/windows/resources" }

[dev-dependencies]
dsa-host-core = { workspace = true, features = ["conformance"] }
