[package]
name = "dsa-host-core"
version = "0.1.0"
description = "The platform-neutral host: the session, its state and the local API service"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The local API test suite, for the crates that implement a local API transport.
conformance = []

[dependencies]
dsa-transport.workspace = true
dsa-protocol.workspace = true

[dev-dependencies]
dsa-host-core = { path = ".", features = ["conformance"] }
