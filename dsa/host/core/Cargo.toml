[package]
name = "dsa-host-core"
version = "0.1.0"
description = "The platform-neutral host: the session, its state, the local API service and image updates"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The local API test suite, for the crates that implement a local API transport.
conformance = []

[dependencies]
dsa-transport.workspace = true
dsa-protocol.workspace = true
ed25519-dalek = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
dsa-host-core = { path = ".", features = ["conformance"] }
