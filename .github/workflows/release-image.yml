# Publishes the Android images: builds the guest kernel, makes each image in
# dsa/guest/image/inputs.json with the project's keys, publishes each one as the GitHub
# release android-<version>, and publishes the signed release lists the service reads as
# the release "images": images.json and images.json.sig for x86_64 hosts, and
# images-arm64.json and images-arm64.json.sig for ARM64 hosts, whose image is 64-bit only. With an installer version it
# also publishes the installer as the release v<version>, and the signed program list the
# service updates DSA itself from, in "images" too, and the ARM64 installer beside it with
# its own program list.
#
# What a run may publish depends on the branch it runs on
# (.github/scripts/release/release-branch-channel.sh), checked before anything is built:
# main publishes reviewed releases, develop publishes pre-releases only, and any other
# branch or a tag fails without publishing anything. Every release's tag names the commit
# the run built (.github/scripts/release/check-release-tag.sh).
#
# Each installer release is on one release channel (the channel input, checked by
# .github/scripts/release/release-channel.sh): every version below 1.0 is a pre-release,
# and from 1.0 the person releasing on main chooses; develop is always a pre-release. A pre-release is published as a GitHub
# pre-release and its list as program-prerelease.json (program-prerelease-arm64.json); a
# stable release as program-stable.json (program-stable-arm64.json). The installer records
# its channel, so a computer starts on it. program.json and program-arm64.json, which the
# services from before the channels read, keep naming the highest version published
# (.github/scripts/release/publish-program-list.sh).
#
# It runs only by hand. It needs these repository secrets:
#   DSA_ANDROID_KEYS_1, _2    the Android key set from dsa/guest/image/make-keys.sh, split
#                             by dsa/guest/image/pack-keys.sh (a secret holds at most 48 KB)
#   DSA_RELEASE_SIGNING_KEY   the lists' Ed25519 key from dsa-release keygen
# The service trusts both lists through the public half of the second one, which
# dsa-release public-key prints.
#
# With rebuild_images off it builds no kernel and no image: the installer takes the kernel
# from the newest published image and the trust key from the published list, after checking
# both. That is for a release that changes only the program.
#
# Each x86_64 image's release also carries the default ARM translation package
# (arm-translation.zip, described in its image.json): the Digitalis package the newest
# passing "Translator build" run on develop made from the pinned lock. Run that workflow
# first when dsa/guest/arm-translation/digitalis-lock.json changes. arm64 images never
# carry one, as ARM apps run on them without translation.
#
# Each image carries the patched SurfaceFlinger, libhwui and libEGL that recover from a GPU
# device loss (described in its image.json under "framework"): the files the newest passing
# "Framework build" run on develop made for that Android version and architecture from the
# pinned lock and patches. Run that workflow first when dsa/guest/framework changes.
#
# The Development build (dev-build.yml) calls this workflow with dev_build set, so a build for
# testing is made by exactly these jobs and steps: the kernel, the image of the newest Android
# for x86_64 and the Windows x64 installer, signed with the same keys. Then it publishes
# nothing (no release, tag, image list, program list or channel) and keeps what it made as
# workflow artifacts for three days: development-image and development-image-list (the image's
# files, and the signed image list that names them), and development-installer (setup.exe).
# Its image's version ends in -dev.<run number> and its installer's version is
# <next release>-dev.<run number>, so neither is taken for a release.
# scripts/install-dev-build.ps1 installs them on a computer.

name: Image release

on:
  workflow_dispatch:
    inputs:
      installer_version:
        description: "Also publish the installer as this version (for example 0.1.0); empty for images only"
        required: false
        default: ""
      rebuild_images:
        description: "Build the kernel and the images again; off to publish only the installer with the published images"
        type: boolean
        required: false
        default: true
      channel:
        description: "The installer's release channel. Every version below 1.0, and every release from develop, is a pre-release; stable is refused for them"
        type: choice
        options:
          - prerelease
          - stable
        required: false
        default: prerelease
      replace_release:
        description: "Replace an installer release of the same version that is already published (its assets and tag)"
        type: boolean
        required: false
        default: false
      arm_translation:
        description: "Release the default ARM translator (from the newest passing Translator build) beside each x86_64 image"
        type: boolean
        required: false
        default: true
      framework:
        description: "Lay the patched framework (from the newest passing Framework build) over each image, so it recovers from a GPU device loss"
        type: boolean
        required: false
        default: true
  # The Development build (dev-build.yml): the same jobs, for Windows x64 and the newest
  # Android only, kept as artifacts and never published.
  workflow_call:
    inputs:
      dev_build:
        description: "Build for testing: Windows x64 and the newest Android only, kept as workflow artifacts, nothing published"
        type: boolean
        required: true
      installer_version:
        description: "Also build the installer as this version; empty for the image only"
        type: string
        required: false
        default: ""
      rebuild_images:
        description: "Build the kernel and the image; off for the installer only"
        type: boolean
        required: false
        default: true
      arm_translation:
        description: "Take the default ARM translator into the image, as a release does"
        type: boolean
        required: false
        default: true
      framework:
        description: "Lay the patched framework over the image, as a release does"
        type: boolean
        required: false
        default: true

# Development builds queue among themselves, never behind a release.
concurrency:
  group: ${{ inputs.dev_build && 'development-build' || 'release-image' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What this run may publish, decided from the branch it runs on before anything is built:
  # main publishes reviewed releases (pre-releases below 1.0, then stable or pre-release as
  # chosen), develop publishes pre-releases only, and any other branch or a tag publishes
  # nothing (.github/scripts/release/release-branch-channel.sh). Every job waits for it, so
  # a refused run builds nothing. With an installer version it also decides its channel.
  channel:
    name: Check the branch and decide the release channel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
      programs_exclude: ${{ steps.matrix.outputs.programs_exclude }}
      images_exclude: ${{ steps.matrix.outputs.images_exclude }}
    steps:
      - uses: actions/checkout@v4
      - id: channel
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.installer_version }}
          REQUESTED: ${{ inputs.channel || 'prerelease' }}
          DEV_BUILD: ${{ inputs.dev_build }}
        run: |
          # A development build publishes nothing, and is made from develop only, where the
          # work is integrated. Its installer goes on the pre-release channel, as every build
          # from develop does.
          if [[ "$DEV_BUILD" == true ]]; then
            branch="$(.github/scripts/release/release-branch-channel.sh "$REF")"
            if [[ "$branch" != develop ]]; then
              echo "::error::A Development build is made from develop only, not from $branch." >&2
              exit 1
            fi
            echo "A Development build of develop${VERSION:+ with the installer $VERSION}; nothing is published"
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$VERSION" ]]; then
            branch="$(.github/scripts/release/release-branch-channel.sh "$REF")"
            echo "The images are released from $branch"
            exit 0
          fi
          channel="$(.github/scripts/release/release-branch-channel.sh "$REF" "$VERSION" "$REQUESTED")"
          echo "DSA $VERSION is released from ${REF#refs/heads/} on the $channel channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # A release builds every architecture and every supported Android. A development build
      # is for one Windows x64 computer: x86_64 only, and the newest supported Android only.
      - name: Choose the architectures and Android versions to build
        id: matrix
        env:
          DEV_BUILD: ${{ inputs.dev_build }}
        run: |
          if [[ "$DEV_BUILD" == true ]]; then
            echo 'programs_exclude=[{"arch":"arm64"}]' >> "$GITHUB_OUTPUT"
            echo "images_exclude=$(jq -c '(.supported_majors | max) as $newest
              | [.supported_majors[] | select(. != $newest) | {android: .}] + [{arch: "arm64"}]' \
              dsa/android-versions.json)" >> "$GITHUB_OUTPUT"
          else
            echo 'programs_exclude=[]' >> "$GITHUB_OUTPUT"
            echo 'images_exclude=[]' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # The guest's own programs for one architecture, built one after another on one runner:
  # the graphics transport, the control daemon, the hwcomposer and the HALs. One job instead
  # of one per program holds two runners instead of eighteen, and sets up the NDK, the
  # fetched sources and the compiler cache once. Each program has its own steps and its own
  # artifact, so a failed step names the program. A failure does not stop the programs after
  # it, so one failure does not hide another, and the job still fails.
  guest-programs:
    name: Build the guest programs (${{ matrix.arch }})
    needs: channel
    if: inputs.rebuild_images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        exclude: ${{ fromJSON(needs.channel.outputs.programs_exclude) }}
    permissions:
      contents: read
      # Deletes the compiler cache a new one replaces.
      actions: write
    env:
      DSA_GUEST_ARCH: ${{ matrix.arch }}
      # What readelf calls the guest's machine.
      GUEST_MACHINE: ${{ matrix.arch == 'arm64' && 'AArch64' || 'Advanced Micro Devices X86-64' }}
      # CMake (and the graphics build's Meson) compile through ccache, whose cache is kept
      # between develop runs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      # The NDK is installed again on each run, so its compilers are told apart by what
      # they say they are, not by their file times.
      CCACHE_COMPILERCHECK: "%compiler% --version"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version | head -1

      # The pinned upstream revisions, the patches and the build scripts decide what the
      # compiler cache holds, so they name it.
      - name: Name the compiler cache
        run: echo "COMPILER_CACHE_KEY=ccache-guest-programs-${{ matrix.arch }}-${{ hashFiles('dsa/graphics/fetch.sh', 'dsa/graphics/build.sh', 'dsa/graphics/patches/**', 'dsa/guest/*/fetch.sh', 'dsa/guest/*/build.sh') }}" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}
          restore-keys: ccache-guest-programs-${{ matrix.arch }}-

      # dsa-channeld is Rust: its dependencies come from the last develop run's target folder.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: guest-programs-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The graphics transport and most HALs build with r26b; the codec and camera HALs with
      # r27c, which is set up after them.
      - name: Set up Android NDK
        id: ndk26
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch gfxstream and guest build dependencies
        id: graphics-fetch
        run: bash dsa/graphics/fetch.sh .scratch/gfxstream

      - name: Build the guest Hyper-V graphics transport
        id: graphics
        if: ${{ !cancelled() && steps.graphics-fetch.outcome == 'success' }}
        run: bash dsa/graphics/build.sh .scratch .scratch/build

      - name: Verify ELF architecture and exported Hyper-V symbols
        id: graphics-verify
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        run: |
          target=".scratch/build/libOpenglSystemCommon.so"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          nm -D "$target" | grep -Fq 'HvSocketStream'
          nm -D "$target" | grep -Fq 'goldfish_get_egl_tls'
          target_vk=".scratch/build/vulkan.ranchu.so"
          readelf -h "$target_vk" | grep -Fq "$GUEST_MACHINE"
          # The Android loader looks up HMI and nothing else; everything else stays hidden.
          exports=$(nm -D --defined-only "$target_vk" | awk '{print $3}')
          test "$exports" = "HMI"
          grep -aFq 'hvsocket' "$target_vk"

      - name: Keep the patched guest library
        if: ${{ !cancelled() && steps.graphics-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-gfxstream-hvsocket${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/build/libOpenglSystemCommon.so
            .scratch/build/vulkan.ranchu.so
          if-no-files-found: error

      - name: Build dsa-channeld for the guest
        id: channeld
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/channeld/build-android.sh .scratch/channeld

      - name: Keep the daemon
        if: ${{ !cancelled() && steps.channeld.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-channeld${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/channeld/dsa-channeld
            .scratch/channeld/su
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-hwcomposer for the guest
        id: hwcomposer
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/hwcomposer/build.sh .scratch .scratch/build-hwcomposer

      - name: Keep the hwcomposer
        if: ${{ !cancelled() && steps.hwcomposer.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-hwcomposer${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-hwcomposer/dsa-hwcomposer
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-power and dsa-health for the guest
        id: power
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/power/build.sh .scratch .scratch/build-power

      - name: Keep the power and health HALs
        if: ${{ !cancelled() && steps.power.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-power-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/build-power/dsa-power
            .scratch/build-power/dsa-health
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-audio for the guest
        id: audio
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/audio/build.sh .scratch .scratch/build-audio

      - name: Keep the audio module
        if: ${{ !cancelled() && steps.audio.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-audio${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-audio/dsa-audio
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-gnss for the guest
        id: gnss
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/gnss/build.sh .scratch .scratch/build-gnss

      - name: Keep the GNSS HAL
        if: ${{ !cancelled() && steps.gnss.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-gnss-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-gnss/dsa-gnss
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-sensors for the guest
        id: sensors
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/sensors/build.sh .scratch .scratch/build-sensors

      - name: Keep the sensors HAL
        if: ${{ !cancelled() && steps.sensors.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-sensors${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-sensors/dsa-sensors
          if-no-files-found: error

      - name: Set up Android NDK r27c
        id: ndk27
        if: ${{ !cancelled() }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-codec2 for the guest
        id: codec2
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk27.outputs.ndk-path }}
        run: bash dsa/guest/codec2/build.sh .scratch .scratch/build-codec2

      - name: Keep the codec HAL
        if: ${{ !cancelled() && steps.codec2.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-codec2${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-codec2/dsa-codec2
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-camera for the guest
        id: camera
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk27.outputs.ndk-path }}
        run: bash dsa/guest/camera/build.sh .scratch .scratch/build-camera

      - name: Keep the camera HAL
        if: ${{ !cancelled() && steps.camera.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-camera${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-camera/dsa-camera
          if-no-files-found: error

      - name: Show what the compiler cache did
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}

      - name: Delete the compiler cache it replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "ccache-guest-programs-${{ matrix.arch }}-" "$COMPILER_CACHE_KEY"

  # The kernel is built once per input: a kernel built from the same dsa/kernel/, merged
  # configuration and build tools (by this workflow or the Kernel test on develop) comes from
  # the cache (.github/actions/guest-kernel). Either way the source it was built from is
  # checked out, and its bundle goes beside it.
  kernel:
    name: Build the guest kernel (x86_64)
    needs: channel
    if: inputs.rebuild_images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      # Deletes the cached kernel a new one replaces.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the kernel, or take the one built from the same inputs
        uses: ./.github/actions/guest-kernel
        with:
          arch: x86_64
          out: ${{ github.workspace }}/.scratch/kernel-out
          save: ${{ github.ref == 'refs/heads/develop' }}
          token: ${{ github.token }}

      # build.sh names the kernel bzImage-<release>; the jobs below take it as bzImage.
      - name: Name the kernel bzImage
        run: mv .scratch/kernel-out/bzImage-* .scratch/kernel-out/bzImage

      # The kernel's corresponding source goes beside it in every release that ships it.
      - name: Bundle the kernel source
        run: dsa/kernel/source-bundle.sh .scratch/kernel-out/kernel-source.tar.gz .scratch/kernel-out/config-*

      - uses: actions/upload-artifact@v4
        with:
          name: guest-kernel
          path: |
            .scratch/kernel-out/bzImage
            .scratch/kernel-out/kernel-source.tar.gz
          if-no-files-found: error

  # The kernel of the arm64 guest, for ARM64 Windows hosts: an EFI stub Image that
  # Hyper-V's UEFI firmware starts.
  kernel-arm64:
    name: Build the guest kernel (arm64)
    needs: channel
    if: inputs.rebuild_images && !inputs.dev_build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      # Deletes the cached kernel a new one replaces.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the kernel, or take the one built from the same inputs
        uses: ./.github/actions/guest-kernel
        with:
          arch: arm64
          out: ${{ github.workspace }}/.scratch/kernel-out
          save: ${{ github.ref == 'refs/heads/develop' }}
          token: ${{ github.token }}

      # build.sh names the kernel Image-<release>; the arm64 image takes it as Image.
      - name: Name the kernel Image
        run: mv .scratch/kernel-out/Image-* .scratch/kernel-out/Image

      # The arm64 image ships this kernel, so its corresponding source goes with it too.
      - name: Bundle the kernel source
        run: dsa/kernel/source-bundle.sh --arch arm64 .scratch/kernel-out/kernel-source.tar.gz .scratch/kernel-out/config-*

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-arm64
          path: |
            .scratch/kernel-out/Image
            .scratch/kernel-out/kernel-source.tar.gz
          if-no-files-found: error

  agent:
    name: Build the guest agent
    needs: channel
    if: inputs.rebuild_images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the agent
        working-directory: dsa/guest/agent
        run: ./kotlin do assembleRelease

      # Unsigned: make-image.py signs it with the platform key.
      - name: Keep the agent
        run: |
          mkdir -p .scratch/agent
          cp dsa/guest/agent/build/outputs/apk/release/dsa-agent-release-unsigned.apk .scratch/agent/DsaAgent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: guest-agent
          path: .scratch/agent/DsaAgent.apk
          if-no-files-found: error

  # What the images take from the newest passing runs of other workflows on develop: the
  # default translator, the packages of the Translator build whose versions are the ones the
  # lock pins now, and the patched framework, the files of the Framework build whose versions
  # are the ones the lock and the patches name now, for every image. Two lookups of a few
  # seconds each, so they share a runner.
  prebuilt:
    name: Find the default ARM translator and the patched framework
    needs: channel
    if: inputs.rebuild_images && (inputs.arm_translation || inputs.framework)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      translator_run_id: ${{ steps.translator.outputs.run_id }}
      framework_run_id: ${{ steps.framework.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the Translator build run with the pinned packages
        id: translator
        if: inputs.arm_translation
        run: |
          wanted=()
          for android in $(python3 dsa/guest/arm-translation/digitalis_lock.py versions | jq -r '.[]'); do
            wanted+=("arm-translation-$android-$(python3 dsa/guest/arm-translation/digitalis_lock.py version "$android")")
          done
          echo "looking for ${wanted[*]}"
          for run in $(gh run list --repo "${{ github.repository }}" --workflow translator.yml --branch develop                          --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            names="$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts?per_page=100"                        --jq '[.artifacts[] | select(.expired | not) | .name]')"
            if jq -e --args '. as $have | $ARGS.positional | all(. as $w | $have | index($w))' "${wanted[@]}" <<<"$names" >/dev/null; then
              echo "run $run has them"
              echo "run_id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No passing Translator build run on develop has ${wanted[*]}. Run the Translator build workflow, or release with arm_translation off."
          exit 1

      - name: Find the Framework build run with the pinned files
        id: framework
        if: ${{ !cancelled() && inputs.framework }}
        run: |
          wanted=()
          for android in $(python3 dsa/guest/framework/framework_lock.py versions | jq -r '.[]'); do
            version="$(python3 dsa/guest/framework/framework_lock.py version "$android")"
            for arch in x86_64 arm64; do
              wanted+=("framework-$android-$arch-$version")
            done
          done
          echo "looking for ${wanted[*]}"
          for run in $(gh run list --repo "${{ github.repository }}" --workflow framework.yml --branch develop \
                         --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            names="$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts?per_page=100" \
                       --jq '[.artifacts[] | select(.expired | not) | .name]')"
            if jq -e --args '. as $have | $ARGS.positional | all(. as $w | $have | index($w))' "${wanted[@]}" <<<"$names" >/dev/null; then
              echo "run $run has them"
              echo "run_id=$run" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No passing Framework build run on develop has ${wanted[*]}. Run the Framework build workflow, or release with framework off."
          exit 1

  image:
    name: ${{ inputs.dev_build && 'Make' || 'Make and publish' }} the guest image (ubuntu-latest, Android ${{ matrix.android }}, ${{ matrix.arch }})
    needs: [channel, kernel, kernel-arm64, guest-programs, agent, prebuilt]
    # The prebuilt job is skipped when the release carries neither a default translator nor
    # a patched framework, and the arm64 kernel for a development build.
    if: inputs.rebuild_images && !cancelled() && !failure()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    strategy:
      fail-fast: true
      matrix:
        android: [17, 16]
        # ARM64 Windows hosts boot the arm64 image, which is 64-bit only.
        arch: [x86_64, arm64]
        # A development build makes the newest Android's x86_64 image only.
        exclude: ${{ fromJSON(needs.channel.outputs.images_exclude) }}
    env:
      GH_TOKEN: ${{ github.token }}
      # The kernel file of the image's architecture: bzImage on x86_64, Image on arm64.
      KERNEL: ${{ matrix.arch == 'arm64' && 'Image' || 'bzImage' }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          # aapt2, which builds the framework overlay, is in the SDK this step deletes.
          tools=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          mkdir -p .scratch
          cp -r "$tools" .scratch/build-tools
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # dsa-release, which describes and signs the images, from the last develop run's target
      # folder. Every Linux job here builds the same tool, so they share one cache entry.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          shared-key: release-tool
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install the disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk qemu-utils

      - name: Restore the Android keys
        env:
          DSA_ANDROID_KEYS_1: ${{ secrets.DSA_ANDROID_KEYS_1 }}
          DSA_ANDROID_KEYS_2: ${{ secrets.DSA_ANDROID_KEYS_2 }}
          DSA_ANDROID_KEYS_3: ${{ secrets.DSA_ANDROID_KEYS_3 }}
        run: dsa/guest/image/unpack-keys.sh .scratch/image-keys

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.arch == 'arm64' && 'kernel-arm64' || 'guest-kernel' }}
          path: .scratch/kernel-out

      - name: Download guest graphics transport
        uses: actions/download-artifact@v4
        with:
          name: guest-gfxstream-hvsocket${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/guest-graphics

      - name: Download the guest control daemon
        uses: actions/download-artifact@v4
        with:
          name: guest-channeld${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/channeld

      - name: Download the guest hwcomposer
        uses: actions/download-artifact@v4
        with:
          name: guest-hwcomposer${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/hwcomposer

      - name: Download the guest power and health HALs
        uses: actions/download-artifact@v4
        with:
          name: guest-power-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/power-hal

      - name: Download the guest codec HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-codec2${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/codec2

      - name: Download the guest audio module
        uses: actions/download-artifact@v4
        with:
          name: guest-audio${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/audio

      - name: Download the guest GNSS HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-gnss-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/gnss-hal

      - name: Download the guest sensors HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-sensors${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/sensors

      - name: Download the guest camera HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-camera${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/camera

      - name: Download the guest agent
        uses: actions/download-artifact@v4
        with:
          name: guest-agent
          path: .scratch/agent

      - name: Fetch the pinned inputs
        run: dsa/guest/image/fetch.sh ${{ matrix.android }} ${{ matrix.arch }}

      # Only an x86_64 image takes a translator; on arm64, ARM apps run as they are.
      - name: Download the default ARM translator
        id: translator
        if: matrix.arch == 'x86_64' && needs.prebuilt.outputs.translator_run_id != ''
        run: |
          android="android${{ matrix.android }}"
          name="arm-translation-$android-$(python3 dsa/guest/arm-translation/digitalis_lock.py version "$android")"
          gh run download "${{ needs.prebuilt.outputs.translator_run_id }}" --repo "${{ github.repository }}"             --name "$name" --dir .scratch/arm-translation
          ls -l .scratch/arm-translation
          echo "args=--arm-translation .scratch/arm-translation" >> "$GITHUB_OUTPUT"

      - name: Download the patched framework
        id: framework
        if: needs.prebuilt.outputs.framework_run_id != ''
        run: |
          android="android${{ matrix.android }}"
          name="framework-$android-${{ matrix.arch }}-$(python3 dsa/guest/framework/framework_lock.py version "$android")"
          gh run download "${{ needs.prebuilt.outputs.framework_run_id }}" --repo "${{ github.repository }}" \
            --name "$name" --dir .scratch/framework
          cat .scratch/framework/framework.json
          echo "args=--framework .scratch/framework" >> "$GITHUB_OUTPUT"

      - name: Verify graphics libraries ELF dependencies
        run: |
          target_zip=$(echo .scratch/aosp-inputs/*/*target_files*.zip)
          for lib in .scratch/guest-graphics/libOpenglSystemCommon.so; do
            echo "Checking ELF dependencies for $lib..."
            needed=$(readelf -d "$lib" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')
            for dep in $needed; do
              if ! unzip -l "$target_zip" | grep -E "(VENDOR|SYSTEM)/lib64/(hw/|egl/)?$dep" >/dev/null 2>&1; then
                echo "Missing dependency $dep for $lib in image!" >&2
                exit 1
              fi
              echo "  OK: $dep found in image"
            done
          done

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Check the guest Vulkan driver loads on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py .scratch/guest-graphics/vulkan.ranchu.so .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the hwcomposer starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/hwcomposer/dsa-hwcomposer .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the codec HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/codec2/dsa-codec2 .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the audio module starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/audio/dsa-audio .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the sensors HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/sensors/dsa-sensors .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the camera HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/camera/dsa-camera .scratch/aosp-inputs/*/*target_files*.zip

      - name: Check the power and health HALs start on the image
        run: |
          for hal in dsa-power dsa-health; do
            uv run dsa/graphics/check-guest-driver.py --executable ".scratch/power-hal/$hal" .scratch/aosp-inputs/*/*target_files*.zip
          done

      - name: Check the GNSS HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/gnss-hal/dsa-gnss .scratch/aosp-inputs/*/*target_files*.zip

      # Every image this workflow makes is new content (this commit's programs, framework and
      # translator), so it gets a revision no release has: one past the highest published for
      # its build and architecture. Reusing a version replaced a published image's files under
      # the hosts that already had it, and they never saw it as an update.
      - name: Choose the image revision
        id: revision
        run: |
          gh api --paginate "repos/${{ github.repository }}/releases?per_page=100" --jq '.[].tag_name' > "$RUNNER_TEMP/tags.txt"
          revision="$(uv run dsa/guest/image/make-image.py --major ${{ matrix.android }} --arch ${{ matrix.arch }} --next-revision < "$RUNNER_TEMP/tags.txt")"
          echo "the image is revision $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      # A restored build cache can bring back the folder of an image an earlier run made (the
      # v0.2.1 run checked 17.0.0-16373615-11 while it had made -12-arm64), and the check and
      # publish steps below take the one folder there is, so only this run's image may be left.
      - name: Clear images an earlier run left
        run: find dsa/target/image -mindepth 1 -maxdepth 1 -type d ! -name '.work-*' -exec rm -rf {} + 2>/dev/null || true

      - name: Make the image
        run: >
          uv run dsa/guest/image/make-image.py --major ${{ matrix.android }} --arch ${{ matrix.arch }}
          --revision ${{ steps.revision.outputs.revision }}
          --keys .scratch/image-keys --kernel .scratch/kernel-out/${{ env.KERNEL }}
          --graphics-dir .scratch/guest-graphics
          --channeld .scratch/channeld/dsa-channeld
          --su-client .scratch/channeld/su
          --hwcomposer .scratch/hwcomposer/dsa-hwcomposer
          --codec2 .scratch/codec2/dsa-codec2
          --audio .scratch/audio/dsa-audio
          --sensors .scratch/sensors/dsa-sensors
          --camera .scratch/camera/dsa-camera
          --power-hal .scratch/power-hal
          --gnss-hal .scratch/gnss-hal/dsa-gnss
          --agent .scratch/agent/DsaAgent.apk
          --aapt2 .scratch/build-tools/aapt2
          ${{ steps.translator.outputs.args }}
          ${{ steps.framework.outputs.args }}
          ${{ inputs.dev_build && format('--dev-build {0}', github.run_number) || '' }}

      # The host makes the direct-mapped mode's uncompressed system disk from system.vhdx
      # itself, so the download stays the size it is (GitHub takes 2 GiB a file). image.json
      # records the hash the host checks that disk against, made here exactly as the host makes
      # it, and the hash of the disk as it is, which hosts that attach raw disks check their copy
      # against; the signed list covers both through image.json's own hash. An image that
      # declares the mode but whose disk cannot be described would ship without it and boot
      # every host on SCSI, so that stops the build. Only an image with no direct_mapped entry
      # at all is meant to go without the mode.
      - name: Record the hashes of the system disk the host makes
        working-directory: dsa
        run: |
          cargo build -q --release -p dsa-host-core --bin dsa-release
          dir="$(echo target/image/*/)"
          if ! jq -e 'has("direct_mapped")' "$dir/image.json" > /dev/null; then
            echo "::notice::the image declares no direct-mapped mode, so it has no system disk for it"
            exit 0
          fi
          if ! target/release/dsa-release direct-mapped "$dir"; then
            echo "::error::the image declares the direct-mapped mode, but its system disk could not be described, so it would boot without the mode"
            exit 1
          fi
          jq '{direct_mapped, system_disk_raw}' "$dir/image.json"
          if ! jq -e '.direct_mapped.system_disk and .system_disk_raw' "$dir/image.json" > /dev/null; then
            echo "::error::image.json lacks direct_mapped.system_disk or system_disk_raw after dsa-release direct-mapped"
            exit 1
          fi

      - name: Check the image
        run: uv run dsa/guest/image/check-image.py dsa/target/image/*/ .scratch/image-keys

      - name: Publish the image
        id: publish
        if: ${{ !inputs.dev_build }}
        run: |
          dir="$(echo dsa/target/image/*/)"
          version="$(jq -r .version "$dir/image.json")"
          tag="android-$version"
          files=()
          for name in image.json $(jq -r '.files | keys[]' "$dir/image.json"); do
            files+=("$dir/$name")
          done
          for n in NOTICE.xml.gz NOTICE.html.gz NOTICE.txt; do
            if [ -f "$dir/$n" ] && [[ ! " ${files[*]} " =~ " $dir/$n " ]]; then
              files+=("$dir/$n")
            fi
          done
          # The image carries the kernel, so its release carries the kernel's source.
          files+=(.scratch/kernel-out/kernel-source.tar.gz)
          # The default ARM translation package, which only x86_64 images have.
          translator="$(jq -r '.arm_translation.file // empty' "$dir/image.json")"
          if [ -n "$translator" ]; then
            files+=("$dir/$translator")
          fi
          # A published image is never replaced; the revision step chose a version no release
          # has.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::$tag is already published; an image is never published twice under one version"
            exit 1
          fi
          # The tag names the commit this run built; gh release create would reuse a stale one.
          .github/scripts/release/check-release-tag.sh "$tag" "$GITHUB_SHA"
          gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" \
            --title "Android image $version" \
            --notes "Android image $version for Desktop Subsystem for Android. The service downloads it through the signed list in the release \"images\"."
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A development build keeps the image as an artifact instead: the files its image.json
      # names, image.json itself and the kernel's source, uncompressed, since the disks
      # compress little and the upload is what takes the time. Hard links, so the disk the
      # runner has left is not halved.
      - name: Keep the image for the Development build
        id: keep
        if: ${{ inputs.dev_build }}
        run: |
          dir="$(echo dsa/target/image/*/)"
          dir="${dir%/}"
          keep=.scratch/development-image
          rm -rf "$keep"
          mkdir -p "$keep"
          for name in image.json $(jq -r '.files | keys[]' "$dir/image.json"); do
            ln "$dir/$name" "$keep/$name"
          done
          ln .scratch/kernel-out/kernel-source.tar.gz "$keep/kernel-source.tar.gz"
          ls -l "$keep"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          # Where the list says the files are: this run. The install script reads them from
          # the downloaded artifact by name; nothing serves them at this address.
          echo "base=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Upload the image for the Development build
        if: ${{ inputs.dev_build }}
        uses: actions/upload-artifact@v4
        with:
          name: development-image
          path: .scratch/development-image
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Describe the image for the list
        working-directory: dsa
        env:
          TAG: ${{ steps.publish.outputs.tag }}
          DIR: ${{ steps.publish.outputs.dir || steps.keep.outputs.dir }}
          DEV_BASE: ${{ steps.keep.outputs.base }}
        run: |
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if [[ -n "$TAG" ]]; then
            base="https://github.com/${{ github.repository }}/releases/download/$TAG"
          else
            base="$DEV_BASE"
          fi
          target/release/dsa-release image-entry "$base" "../$DIR" > ../entry-${{ matrix.android }}-${{ matrix.arch }}.json
          cat ../entry-${{ matrix.android }}-${{ matrix.arch }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: entry-${{ matrix.android }}-${{ matrix.arch }}
          path: entry-${{ matrix.android }}-${{ matrix.arch }}.json
          if-no-files-found: error

  list:
    name: Sign and ${{ inputs.dev_build && 'keep' || 'publish' }} the release list
    # A skipped job before the image (the arm64 kernel, which a development build does not
    # make) would skip this one too under the implicit success() check.
    needs: image
    if: inputs.rebuild_images && !cancelled() && needs.image.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      public_key: ${{ steps.sign.outputs.public_key }}
      newest_major: ${{ steps.write.outputs.newest_major }}
    permissions:
      contents: write
      pull-requests: read
      issues: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # dsa-release, which describes and signs the images, from the last develop run's target
      # folder. Every Linux job here builds the same tool, so they share one cache entry.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          shared-key: release-tool
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - uses: actions/download-artifact@v4
        with:
          pattern: entry-*
          merge-multiple: true
          path: entries

      # One list per host architecture, so a host never picks an image it cannot boot:
      # images.json (x86_64, the list existing hosts read) and images-arm64.json.
      - name: Write the lists
        id: write
        env:
          # A development build made the x86_64 image only.
          ARCHES: ${{ inputs.dev_build && 'x86_64' || 'x86_64 arm64' }}
        run: |
          # The supported versions are written once, in dsa/android-versions.json; an image
          # of another version is a mistake in the inputs, not a version to offer.
          for arch in $ARCHES; do
            list=images.json
            [[ "$arch" == arm64 ]] && list=images-arm64.json
            jq -n --slurpfile versions dsa/android-versions.json \
              --slurpfile images <(jq -s . entries/*-"$arch".json) \
              '{format: 1, supported_majors: ($versions[0].supported_majors | unique), images: $images[0]}' \
              > "$list"
            stray="$(jq '[.supported_majors as $s | .images[] | select(.android_major as $m | $s | index($m) | not) | .version]' "$list")"
            if [[ "$stray" != "[]" ]]; then
              echo "::error::$list has images of unsupported versions: $stray"
              exit 1
            fi
            cat "$list"
          done
          # The installer's first screen names the newest Android the list supports.
          echo "newest_major=$(jq '.supported_majors | max' images.json)" >> "$GITHUB_OUTPUT"

      - name: Sign and check the lists
        id: sign
        working-directory: dsa
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::The DSA_RELEASE_SIGNING_KEY secret is not set; see the top of this workflow." >&2
            exit 1
          fi
          cargo build -q --release -p dsa-host-core --bin dsa-release
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          lists=(../images.json)
          [[ -f ../images-arm64.json ]] && lists+=(../images-arm64.json)
          for list in "${lists[@]}"; do
            target/release/dsa-release sign "$key" "$list"
          done
          public="$(target/release/dsa-release public-key "$key")"
          rm -f "$key"
          for list in "${lists[@]}"; do
            target/release/dsa-release verify "$public" "$list"
          done
          echo "The service trusts these lists with the public key $public"
          echo "public_key=$public" >> "$GITHUB_OUTPUT"

      # The signed list is what the install script hands the service with the image, which
      # checks its signature and every file's hash against it as it does a downloaded update.
      - name: Upload the list for the Development build
        if: ${{ inputs.dev_build }}
        uses: actions/upload-artifact@v4
        with:
          name: development-image-list
          path: |
            images.json
            images.json.sig
          if-no-files-found: error
          retention-days: 3

      - name: Publish the lists
        if: ${{ !inputs.dev_build }}
        run: |
          lists=(images.json images.json.sig images-arm64.json images-arm64.json.sig)
          if gh release view images >/dev/null 2>&1; then
            gh release upload images "${lists[@]}" --clobber
          else
            gh release create images "${lists[@]}" --target "$GITHUB_SHA" \
              --title "Android image list" \
              --notes "The signed list of Android images the Desktop Subsystem for Android service reads."
          fi

  # Instead of kernel, image and list: what the installer needs, from the published release.
  # A development build's installer takes the trust key from here even when the image is
  # rebuilt, so it builds beside the image instead of after it; its kernel then comes from
  # this run's kernel job.
  published:
    name: Take the kernel and the trust key from the published images
    needs: channel
    if: ${{ !inputs.rebuild_images || (inputs.dev_build && inputs.installer_version != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      public_key: ${{ steps.list.outputs.public_key }}
      newest_major: ${{ steps.list.outputs.newest_major }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # dsa-release, which describes and signs the images, from the last develop run's target
      # folder. Every Linux job here builds the same tool, so they share one cache entry.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          shared-key: release-tool
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Check the published list
        id: list
        working-directory: dsa
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::The DSA_RELEASE_SIGNING_KEY secret is not set; see the top of this workflow." >&2
            exit 1
          fi
          gh release download images --pattern 'images.json*' --dir ..
          cargo build -q --release -p dsa-host-core --bin dsa-release
          umask 077
          key="$RUNNER_TEMP/release.key"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          public="$(target/release/dsa-release public-key "$key")"
          rm -f "$key"
          target/release/dsa-release verify "$public" ../images.json
          echo "public_key=$public" >> "$GITHUB_OUTPUT"
          echo "newest_major=$(jq '.supported_majors | max' ../images.json)" >> "$GITHUB_OUTPUT"

      # Every image carries the same kernel; the newest image's is taken and checked
      # against the hash the signed list gives.
      - name: Take the kernel
        if: ${{ !inputs.rebuild_images }}
        run: |
          read -r url sha < <(jq -r '.images | max_by([.android_major, .build])
            | .files[] | select(.name == "bzImage") | "\(.url) \(.sha256)"' images.json)
          if [[ -z "$url" ]]; then
            echo "::error::The newest published image has no bzImage." >&2
            exit 1
          fi
          mkdir -p .scratch/kernel-out
          curl -fsSL -o .scratch/kernel-out/bzImage "$url"
          echo "$sha  .scratch/kernel-out/bzImage" | sha256sum -c -
          # The kernel's source was published beside it in the same image release.
          if ! curl -fsSL -o .scratch/kernel-out/kernel-source.tar.gz "${url%/*}/kernel-source.tar.gz"; then
            echo "::error::The newest published image's release has no kernel-source.tar.gz; rebuild the images." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.rebuild_images }}
        with:
          name: guest-kernel
          path: |
            .scratch/kernel-out/bzImage
            .scratch/kernel-out/kernel-source.tar.gz
          if-no-files-found: error

  installer:
    name: Build and publish the installer (windows-latest)
    # After the list, or after published when the images are not rebuilt.
    if: >-
      ${{ !cancelled() && !inputs.dev_build && inputs.installer_version != '' && needs.channel.result == 'success' &&
          (needs.list.result == 'success' || needs.published.result == 'success') }}
    needs: [kernel, list, published, channel]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      issues: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ needs.channel.outputs.channel }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      # The kernel from this run's guest-kernel artifact; no image inside: the service
      # downloads the newest supported one from the list. The Development build builds
      # through the same action.
      - name: Build the package and setup.exe
        uses: ./.github/actions/windows-installer
        with:
          version: ${{ inputs.installer_version }}
          release-tag: v${{ inputs.installer_version }}
          list-url: https://github.com/${{ github.repository }}/releases/download/images/images.json
          trusted-key: ${{ needs.list.outputs.public_key || needs.published.outputs.public_key }}
          android-major: ${{ needs.list.outputs.newest_major || needs.published.outputs.newest_major }}
          program-list-url: https://github.com/${{ github.repository }}/releases/download/images/program-stable.json
          prerelease-program-list-url: https://github.com/${{ github.repository }}/releases/download/images/program-prerelease.json
          channel: ${{ needs.channel.outputs.channel }}

      - name: Publish the installer
        run: |
          $version = '${{ inputs.installer_version }}'
          # The asset says what it is, its version, and what it runs on. "win" names the
          # system without the Microsoft mark, which no DSA file name carries.
          $asset = "DSA-v$version-win-x64-setup.exe"
          $out = New-Item -ItemType Directory -Force dsa\target\release-assets
          Copy-Item "dsa/target/installer/setup-$version.exe" (Join-Path $out $asset)
          $hash = (Get-FileHash (Join-Path $out $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii (Join-Path $out SHA256SUMS.txt) "$hash  $asset`n"
          # Only setup.exe: it carries the package (dsa-<version>.msi) inside, and
          # wix burn extract takes it out for msiexec-based deployments.
          $notes = @"
          ## Install

          Download **$asset** and run it. Setup installs the DSA service and the ``dsa`` command, and the service then downloads the newest supported Android image in the background.

          - Needs 64-bit Windows 10 1803 or later, or Windows 11, with Virtual Machine Platform turned on.
          - ``dsa status`` shows the download; ``dsa start --wait`` starts Android once it is in.
          - SHA-256: ``$hash`` (also in SHA256SUMS.txt)

          Android is a trademark of Google LLC.
          "@
          gh release view "v$version" *> $null
          if ($LASTEXITCODE -eq 0) {
            if ('${{ inputs.replace_release }}' -ne 'true') {
              throw "v$version is already published; run again with replace_release to replace it"
            }
            gh release delete "v$version" --yes --cleanup-tag
            if ($LASTEXITCODE -ne 0) { throw "removing the published v$version failed" }
          }
          # The tag names the commit this run built; gh release create would reuse a stale one.
          & "$env:ProgramFiles\Git\bin\bash.exe" .github/scripts/release/check-release-tag.sh "v$version" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "the tag v$version does not name the commit this run built" }
          # setup.exe carries the kernel, so this release carries the kernel's source.
          $kernelSource = '.scratch/kernel-out/kernel-source.tar.gz'
          if (-not (Test-Path $kernelSource)) { throw "the kernel source bundle is missing; a release that ships the kernel ships its source" }
          # A pre-release is published as one, so GitHub never shows it as the latest release.
          $channelFlags = @()
          if ($env:CHANNEL -eq 'prerelease') { $channelFlags += '--prerelease' }
          gh release create "v$version" (Join-Path $out $asset) (Join-Path $out SHA256SUMS.txt) $kernelSource --target $env:GITHUB_SHA `
            --title "DSA v$version" --notes $notes --generate-notes @channelFlags
          if ($LASTEXITCODE -ne 0) { throw "publishing the installer failed" }

      # The installed services read this list to update themselves to this version. It
      # names the setup file as published above (and hashes that file), and is signed with the
      # image list's key.
      - name: Write, sign and check the program list
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "The DSA_RELEASE_SIGNING_KEY secret is not set; see the top of this workflow." }
          $version = '${{ inputs.installer_version }}'
          # The asset the step above published, under its release name.
          $asset = "DSA-v$version-win-x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$asset"
          Push-Location dsa
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if ($LASTEXITCODE -ne 0) { throw "building dsa-release failed" }
          Pop-Location
          $tool = "dsa\target\release\dsa-release.exe"
          $list = & $tool program $version $url "dsa\target\release-assets\$asset"
          if ($LASTEXITCODE -ne 0) { throw "writing the program list failed" }
          $dir = (New-Item -ItemType Directory -Force .scratch\program-list).FullName
          $file = Join-Path $dir program.json
          ($list -join "`n") + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM $file
          $key = Join-Path $env:RUNNER_TEMP "release.key"
          Set-Content -NoNewline -Encoding ascii -Path $key -Value $env:SIGNING_KEY
          try {
            & $tool sign $key $file
            if ($LASTEXITCODE -ne 0) { throw "signing the program list failed" }
            $public = & $tool public-key $key
          } finally { Remove-Item -Force $key }
          if ($public -ne '${{ needs.list.outputs.public_key || needs.published.outputs.public_key }}') { throw "the key that signed the program list is not the one the installer trusts" }
          & $tool verify-program $public $file
          if ($LASTEXITCODE -ne 0) { throw "the program list does not verify" }
          Get-Content $file

      # On the list of this release's channel only, and on the list from before the
      # channels while this is the highest version.
      - name: Publish the program list
        shell: bash
        run: .github/scripts/release/publish-program-list.sh "$CHANNEL" x64 .scratch/program-list

  # A development build's installer: built by the same action as the release's, beside the
  # image rather than after it (the trust key comes from the published job), and kept as an
  # artifact. It reads the published lists like any installed DSA, so the computer it is
  # installed on takes the release it leads up to, which is newer, as an update.
  dev-installer:
    name: Build the installer for the Development build (windows-latest)
    needs: [channel, kernel, published]
    if: >-
      ${{ !cancelled() && inputs.dev_build && inputs.installer_version != '' &&
          needs.channel.result == 'success' && needs.published.result == 'success' &&
          (needs.kernel.result == 'success' || needs.kernel.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Build the package and setup.exe
        uses: ./.github/actions/windows-installer
        with:
          version: ${{ inputs.installer_version }}
          list-url: https://github.com/${{ github.repository }}/releases/download/images/images.json
          trusted-key: ${{ needs.published.outputs.public_key }}
          android-major: ${{ needs.published.outputs.newest_major }}
          program-list-url: https://github.com/${{ github.repository }}/releases/download/images/program-stable.json
          prerelease-program-list-url: https://github.com/${{ github.repository }}/releases/download/images/program-prerelease.json
          channel: ${{ needs.channel.outputs.channel }}
          windows-renderer-only: "true"

      # Named as a release names its setup file, with the kernel's source beside it, since
      # setup.exe carries the kernel.
      - name: Keep the installer for the Development build
        run: |
          $version = '${{ inputs.installer_version }}'
          $asset = "DSA-v$version-win-x64-setup.exe"
          $out = (New-Item -ItemType Directory -Force .scratch\development-installer).FullName
          Copy-Item "dsa/target/installer/setup-$version.exe" (Join-Path $out $asset)
          $hash = (Get-FileHash (Join-Path $out $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii (Join-Path $out SHA256SUMS.txt) "$hash  $asset`n"
          $kernelSource = '.scratch/kernel-out/kernel-source.tar.gz'
          if (-not (Test-Path $kernelSource)) { throw "the kernel source bundle is missing; a build that ships the kernel ships its source" }
          Copy-Item $kernelSource $out
          Get-ChildItem $out

      # The program list a release would publish for this setup file, signed with the same
      # key, kept beside it and never published: the install script checks the setup file
      # against it with the installed service's trusted keys before it runs it.
      - name: Write, sign and check the program list for the Development build
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "The DSA_RELEASE_SIGNING_KEY secret is not set; see the top of this workflow." }
          $version = '${{ inputs.installer_version }}'
          $asset = "DSA-v$version-win-x64-setup.exe"
          $out = (Resolve-Path .scratch\development-installer).Path
          # Where the setup file is: this run's artifact. The install script reads it from the
          # downloaded artifact by name.
          $url = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/$asset"
          Push-Location dsa
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if ($LASTEXITCODE -ne 0) { throw "building dsa-release failed" }
          Pop-Location
          $tool = "dsa\target\release\dsa-release.exe"
          $list = & $tool program $version $url (Join-Path $out $asset)
          if ($LASTEXITCODE -ne 0) { throw "writing the program list failed" }
          $file = Join-Path $out program.json
          ($list -join "`n") + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM $file
          $key = Join-Path $env:RUNNER_TEMP "release.key"
          Set-Content -NoNewline -Encoding ascii -Path $key -Value $env:SIGNING_KEY
          try {
            & $tool sign $key $file
            if ($LASTEXITCODE -ne 0) { throw "signing the program list failed" }
            $public = & $tool public-key $key
          } finally { Remove-Item -Force $key }
          if ($public -ne '${{ needs.published.outputs.public_key }}') { throw "the key that signed the program list is not the one the installer trusts" }
          & $tool verify-program $public $file
          if ($LASTEXITCODE -ne 0) { throw "the program list does not verify" }
          Get-Content $file

      - name: Upload the installer for the Development build
        uses: actions/upload-artifact@v4
        with:
          name: development-installer
          path: .scratch/development-installer
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # The ARM64 installer, built natively on an ARM64 runner after the x64 one has made the
  # release v<version>: its setup.exe joins that release, its hash joins SHA256SUMS.txt, and
  # its own signed program list (program-<channel>-arm64.json) lets ARM64 services update to it. It
  # reads the arm64 image list (images-arm64.json), so an ARM64 PC is only offered arm64
  # images. The kernel is the arm64 build's Image: from this run's kernel-arm64 artifact
  # when the images were rebuilt, otherwise from the newest published arm64 image.
  installer-arm64:
    name: Build and publish the ARM64 installer (windows-11-arm)
    if: ${{ !cancelled() && needs.installer.result == 'success' }}
    needs: [kernel, list, published, channel, installer]
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PUBLIC_KEY: ${{ needs.list.outputs.public_key || needs.published.outputs.public_key }}
      CHANNEL: ${{ needs.channel.outputs.channel }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust for ARM64 Windows
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: release-installer-arm64
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install WiX 5
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build the release tool
        run: |
          Push-Location dsa
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if ($LASTEXITCODE -ne 0) { throw "building dsa-release failed" }
          Pop-Location

      - name: Take the arm64 kernel
        run: |
          $dir = (New-Item -ItemType Directory -Force .scratch\kernel-arm64).FullName
          if ('${{ needs.list.result }}' -eq 'success') {
            gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name kernel-arm64 --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "this run has no kernel-arm64 artifact" }
          } else {
            gh release download images --repo ${{ github.repository }} --pattern 'images-arm64.json*' --dir $dir
            if ($LASTEXITCODE -ne 0) { throw "there is no published arm64 image list" }
            & dsa\target\release\dsa-release.exe verify $env:PUBLIC_KEY "$dir\images-arm64.json"
            if ($LASTEXITCODE -ne 0) { throw "the published arm64 image list does not verify" }
            $list = Get-Content -Raw "$dir\images-arm64.json" | ConvertFrom-Json
            $newest = $list.images | Sort-Object android_major, build | Select-Object -Last 1
            $kernel = $newest.files | Where-Object name -eq 'Image'
            if (-not $kernel) { throw "the newest published arm64 image has no Image" }
            Invoke-WebRequest -Uri $kernel.url -OutFile "$dir\Image"
            if ((Get-FileHash "$dir\Image").Hash -ne $kernel.sha256.ToUpperInvariant()) { throw "the arm64 kernel does not match the signed list" }
          }
          $image = Get-ChildItem -Recurse -File $dir -Filter Image | Select-Object -First 1
          if (-not $image -or $image.Length -eq 0) { throw "no arm64 kernel named Image" }
          "KERNEL=$($image.FullName)" >> $env:GITHUB_ENV

      - name: Take the ARM64 graphics library from the newest graphics build
        run: |
          $run = gh run list --repo ${{ github.repository }} --workflow test-graphics.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $run) { throw "no graphics build has succeeded" }
          gh run download $run --repo ${{ github.repository }} --name host-gfxstream-windows-arm64 --dir .scratch\host-gfxstream
          if ($LASTEXITCODE -ne 0) { throw "downloading host-gfxstream-windows-arm64 from run $run failed" }
          $dll = Get-ChildItem -Recurse -File .scratch\host-gfxstream -Filter gfxstream_backend.dll | Select-Object -First 1
          if (-not $dll -or $dll.Length -eq 0) { throw "run $run has no usable ARM64 gfxstream_backend.dll" }
          "GFXSTREAM_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Build the ARM64 package and setup.exe
        run: >
          dsa/host/platform/windows/installer/build.ps1 -Version ${{ inputs.installer_version }} -Arch arm64
          -Kernel $env:KERNEL -GfxstreamBackend $env:GFXSTREAM_DLL
          -ListUrl https://github.com/${{ github.repository }}/releases/download/images/images-arm64.json
          -TrustedKey $env:PUBLIC_KEY
          -AndroidMajor ${{ needs.list.outputs.newest_major || needs.published.outputs.newest_major }}
          -ProgramListUrl https://github.com/${{ github.repository }}/releases/download/images/program-stable-arm64.json
          -PrereleaseProgramListUrl https://github.com/${{ github.repository }}/releases/download/images/program-prerelease-arm64.json
          -Channel $env:CHANNEL

      - name: Add the ARM64 installer to the release
        run: |
          $version = '${{ inputs.installer_version }}'
          $asset = "DSA-v$version-win-arm64-setup.exe"
          $out = (New-Item -ItemType Directory -Force dsa\target\release-assets).FullName
          Copy-Item "dsa/target/installer/setup-$version.exe" (Join-Path $out $asset)
          $hash = (Get-FileHash (Join-Path $out $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          gh release download "v$version" --repo ${{ github.repository }} --pattern SHA256SUMS.txt --dir $out --clobber
          if ($LASTEXITCODE -ne 0) { throw "the release v$version has no SHA256SUMS.txt" }
          Add-Content -NoNewline -Encoding ascii (Join-Path $out SHA256SUMS.txt) "$hash  $asset`n"
          gh release upload "v$version" (Join-Path $out $asset) (Join-Path $out SHA256SUMS.txt) --repo ${{ github.repository }} --clobber
          if ($LASTEXITCODE -ne 0) { throw "adding the ARM64 installer to v$version failed" }
          # gh prints the notes as lines, which PowerShell keeps as an array: passed as is, each
          # line becomes its own argument and a line that starts with "- " reads as a flag. So
          # the lines are joined and handed over as a file.
          $notes = (gh release view "v$version" --repo ${{ github.repository }} --json body --jq .body) -join "`n"
          $notes = $notes -replace '(?m)^- Needs 64-bit Windows', "- On an ARM64 PC (such as Snapdragon), download **$asset** instead (SHA-256 ``$hash``). Its Android runs arm64-v8a apps only.`n- Needs 64-bit Windows"
          $notesFile = Join-Path $out notes.md
          [IO.File]::WriteAllText($notesFile, $notes, [Text.UTF8Encoding]::new($false))
          gh release edit "v$version" --repo ${{ github.repository }} --notes-file $notesFile
          if ($LASTEXITCODE -ne 0) { throw "updating the release notes failed" }

      # The ARM64 services update from this list, which names the ARM64 setup file.
      - name: Write, sign, check and publish the ARM64 program list
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "The DSA_RELEASE_SIGNING_KEY secret is not set; see the top of this workflow." }
          $version = '${{ inputs.installer_version }}'
          $asset = "DSA-v$version-win-arm64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$asset"
          $tool = "dsa\target\release\dsa-release.exe"
          $list = & $tool program $version $url "dsa\target\release-assets\$asset"
          if ($LASTEXITCODE -ne 0) { throw "writing the ARM64 program list failed" }
          $dir = (New-Item -ItemType Directory -Force .scratch\program-list-arm64).FullName
          $file = Join-Path $dir program.json
          ($list -join "`n") + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM $file
          $key = Join-Path $env:RUNNER_TEMP "release.key"
          Set-Content -NoNewline -Encoding ascii -Path $key -Value $env:SIGNING_KEY
          try {
            & $tool sign $key $file
            if ($LASTEXITCODE -ne 0) { throw "signing the ARM64 program list failed" }
            $public = & $tool public-key $key
          } finally { Remove-Item -Force $key }
          if ($public -ne $env:PUBLIC_KEY) { throw "the key that signed the program list is not the one the installer trusts" }
          & $tool verify-program $public $file
          if ($LASTEXITCODE -ne 0) { throw "the ARM64 program list does not verify" }

      - name: Publish the ARM64 program list
        shell: bash
        run: .github/scripts/release/publish-program-list.sh "$CHANNEL" arm64 .scratch/program-list-arm64
