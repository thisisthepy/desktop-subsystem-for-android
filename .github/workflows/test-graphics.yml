# Builds the patched Android guest transport from source.  The ordinary image
# workflow consumes published target files, which cannot compile a replacement
# native graphics library.
name: Graphics test

on:
  pull_request:
    paths:
      - "dsa/graphics/**"
      - ".github/workflows/test-graphics.yml"
      - "scripts/tests/graphics-workflow.test.sh"
  workflow_dispatch:

concurrency:
  group: test-graphics-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guest-transport:
    name: Build the guest Hyper-V graphics transport
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Fetch the Android source tree
        run: |
          mkdir -p .scratch/aosp
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o .scratch/aosp/repo
          chmod +x .scratch/aosp/repo
          cd .scratch/aosp
          ./repo init -u https://android.googlesource.com/platform/manifest -b android-latest-release
          ./repo sync -c -j2 --no-tags

      - name: Apply the DSA gfxstream transport
        run: dsa/graphics/fetch.sh .scratch/aosp/hardware/google/gfxstream

      - name: Build the guest transport
        run: |
          source .scratch/aosp/build/envsetup.sh
          lunch aosp_cf_x86_64_only_phone-userdebug
          m libOpenglSystemCommon

      - name: Keep the patched guest library
        uses: actions/upload-artifact@v4
        with:
          name: guest-gfxstream-hvsocket
          path: .scratch/aosp/out/target/product/vsoc_x86_64/vendor/lib64/libOpenglSystemCommon.so
          if-no-files-found: error
