# Builds the patched Android guest transport and the Windows and macOS host renderers from
# source.
name: Graphics test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  push:
    branches: [develop]
    paths:
      - "dsa/graphics/**"
      - "dsa/host/platform/windows/**"
      - "dsa/host/platform/linux/**"
      - "dsa/host/platform/macos/**"
      - "dsa/host/platform/unix/**"
      - "dsa/host/core/src/renderer.rs"
      - "dsa/protocol/renderer.proto"
      - ".github/workflows/test-graphics.yml"
      - "scripts/tests/graphics-workflow.test.sh"
  workflow_dispatch:

concurrency:
  # On develop a run in progress finishes and only the newest waiting run stays: GitHub
  # keeps one pending run per group, so a newer merge replaces the one still waiting.
  # The newest run tests everything the dropped ones held. Anywhere else, such as a pull
  # request, a newer run still replaces the older one.
  group: test-graphics-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  # File and line tables only in the debug builds of the Rust code: backtraces still name
  # the line, and the cached target folders stay a fraction of their full size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test-apps:
    name: Check the Vulkan CTS subset and build the graphics test apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Every pattern must still name cases of the pinned CTS. The Image test runs the cases,
      # and these apps in task windows, on its booted image with the renderer on Lavapipe;
      # dsa/graphics/verify/README.md says how to run them on a PC's GPU.
      - name: Check the Vulkan CTS subset against the pinned CTS
        run: uv run dsa/graphics/verify/verify.py check-subset

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;4.1.0"

      - name: Build the OpenGL ES and Vulkan test apps
        run: bash dsa/graphics/verify/build-test-apps.sh .scratch/graphics-test-apps

      - name: Keep the test apps and the expanded case list
        uses: actions/upload-artifact@v4
        with:
          name: graphics-test-apps
          path: |
            .scratch/graphics-test-apps/hello-gl2.apk
            .scratch/graphics-test-apps/hello-vulkan.apk
            .scratch/graphics-verify/vk-cts-subset.cases.txt
          if-no-files-found: error

  guest-transport:
    name: Build the guest Hyper-V graphics transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The same build as the x86_64 graphics transport of the Image test, which keeps its
      # compiler cache on develop. This job only reads that cache, so it adds no entry.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: "%compiler% --version"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache

      - name: Restore the Image test's compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ccache-guest-programs-x86_64-${{ hashFiles('dsa/graphics/fetch.sh', 'dsa/graphics/build.sh', 'dsa/graphics/patches/**', 'dsa/guest/*/fetch.sh', 'dsa/guest/*/build.sh') }}
          restore-keys: ccache-guest-programs-x86_64-

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch gfxstream and guest build dependencies
        run: bash dsa/graphics/fetch.sh .scratch/gfxstream

      - name: Test the guest transport on the build machine
        run: bash dsa/graphics/tests/test.sh .scratch

      - name: Build the guest transport
        run: |
          bash dsa/graphics/build.sh .scratch .scratch/build
          ccache --show-stats

      - name: Verify ELF architecture and exported Hyper-V symbols
        run: |
          target=".scratch/build/libOpenglSystemCommon.so"
          readelf -h "$target" | grep -Fq 'Advanced Micro Devices X86-64'
          nm -D "$target" | grep -Fq 'HvSocketStream'
          nm -D "$target" | grep -Fq 'goldfish_get_egl_tls'
          target_vk=".scratch/build/vulkan.ranchu.so"
          readelf -h "$target_vk" | grep -Fq 'Advanced Micro Devices X86-64'
          # The Android loader looks up HMI and nothing else; everything else stays hidden.
          exports=$(nm -D --defined-only "$target_vk" | awk '{print $3}')
          test "$exports" = "HMI"
          grep -aFq 'hvsocket' "$target_vk"

      - name: Keep the patched guest library
        uses: actions/upload-artifact@v4
        with:
          name: guest-gfxstream-hvsocket
          path: |
            .scratch/build/libOpenglSystemCommon.so
            .scratch/build/vulkan.ranchu.so
          if-no-files-found: error

  # x64 on windows-latest, and ARM64 natively on windows-11-arm with MSVC's ARM64 tools.
  # Each runs the renderer on software Vulkan (Mesa Lavapipe) for its own processor.
  # The renderer the Linux host loads, built natively, and run on software Vulkan (Mesa
  # Lavapipe) by the same smoke test as the Windows renderer.
  host-renderer-linux:
    name: Build the host graphics renderer (linux, x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Deletes the compiler cache a new one replaces.
      actions: write
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      COMPILER_CACHE_PREFIX: ccache-renderer-linux-x64-
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install the build tools and software Vulkan
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libvulkan-dev mesa-vulkan-drivers \
            libdrm-dev libx11-dev libxext-dev ccache

      # The renderer's pinned upstream revisions, its patches and its build scripts decide
      # what its compiler cache holds, so they name it.
      - name: Name the compiler cache
        shell: bash
        run: echo "COMPILER_CACHE_KEY=${COMPILER_CACHE_PREFIX}${{ hashFiles('dsa/graphics/host/fetch.sh', 'dsa/graphics/host/fetch.ps1', 'dsa/graphics/host/build.sh', 'dsa/graphics/host/build.ps1', 'dsa/graphics/host/build-macos.sh', 'dsa/graphics/host/CMakeLists.txt', 'dsa/graphics/patches/**') }}" >> "$GITHUB_ENV"

      # The newest entry of an older key still holds most of the upstream code.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}
          restore-keys: ${{ env.COMPILER_CACHE_PREFIX }}

      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: renderer-linux
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Fetch gfxstream and host build dependencies
        run: bash dsa/graphics/host/fetch.sh .scratch

      - name: Build the host graphics renderer
        run: |
          bash dsa/graphics/host/build.sh .scratch .scratch/build-host
          ccache --show-stats

      - name: Keep the compiler cache
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}

      - name: Delete the compiler cache it replaces
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "$COMPILER_CACHE_PREFIX" "$COMPILER_CACHE_KEY"

      - name: Check the renderer hands frames to the Linux host
        run: |
          nm -D --defined-only .scratch/build-host/dist/bin/libgfxstream_backend.so \
            | grep -q ' dsa_gfx_set_display_pixels_callback$'

      - name: Run host renderer smoke test on software Vulkan
        env:
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}/.scratch/build-host/dist/bin/libgfxstream_backend.so
        run: |
          # Mesa names the manifest lvp_icd.json since 25, and lvp_icd.x86_64.json before it.
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          test -f "$icd"
          export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          uv run dsa/graphics/host/test_host_renderer.py

      - name: Check killing the renderer process keeps the windows and frames resume
        working-directory: dsa
        env:
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}/.scratch/build-host/dist/bin/libgfxstream_backend.so
        run: |
          icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
          export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
          cargo test -p dsa-host-unix --test fd_frames
          cargo test -p dsa-host-linux --test renderer_process -- --nocapture

      - name: Keep the host renderer library and headers
        uses: actions/upload-artifact@v4
        with:
          name: host-gfxstream-linux
          path: |
            .scratch/build-host/dist/bin/libgfxstream_backend.so
            .scratch/build-host/dist/include/
          if-no-files-found: error

  host-renderer:
    name: Build the host graphics renderer (windows, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: x64, lavapipe: x64, artifact: host-gfxstream-windows }
          - { runner: windows-11-arm, platform: ARM64, lavapipe: arm64, artifact: host-gfxstream-windows-arm64 }
    runs-on: ${{ matrix.runner }}
    # The x64 job also packages the installer with the renderer it built.
    timeout-minutes: 90
    permissions:
      contents: read
      # Deletes the compiler cache a new one replaces.
      actions: write
    env:
      LVP_ICD: ${{ github.workspace }}\.scratch\lavapipe\lvp_icd.json
      CCACHE_DIR: ${{ github.workspace }}\.scratch\ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      COMPILER_CACHE_PREFIX: ccache-renderer-windows-${{ matrix.platform }}-
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The ARM64 runner image does not always carry these.
      - name: Set up Rust for ARM64 Windows
        if: matrix.platform == 'ARM64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Set up Ninja for ARM64 Windows
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          uv tool install ninja
          uv tool dir --bin >> $env:GITHUB_PATH

      # CMake compiles through it (CMAKE_<LANG>_COMPILER_LAUNCHER), and build.ps1 then keeps
      # each object's debug information in the object, which ccache can cache.
      - name: Install ccache
        shell: pwsh
        run: |
          $version = '4.14.2'
          $name = if ('${{ matrix.platform }}' -eq 'ARM64') { "ccache-$version-windows-aarch64" } else { "ccache-$version-windows-x86_64" }
          Invoke-WebRequest -Uri "https://github.com/ccache/ccache/releases/download/v$version/$name.zip" -OutFile "$env:RUNNER_TEMP\ccache.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\ccache.zip" -DestinationPath "$env:RUNNER_TEMP\ccache"
          $ccache = (Get-ChildItem -Recurse -File "$env:RUNNER_TEMP\ccache" -Filter ccache.exe | Select-Object -First 1).FullName
          if (-not $ccache) { throw "the ccache $version archive has no ccache.exe" }
          & $ccache --version | Select-Object -First 1
          $launcher = $ccache -replace '\\', '/'
          "CMAKE_C_COMPILER_LAUNCHER=$launcher" >> $env:GITHUB_ENV
          "CMAKE_CXX_COMPILER_LAUNCHER=$launcher" >> $env:GITHUB_ENV
          "CCACHE_EXE=$ccache" >> $env:GITHUB_ENV

      # The renderer's pinned upstream revisions, its patches and its build scripts decide
      # what its compiler cache holds, so they name it.
      - name: Name the compiler cache
        shell: bash
        run: echo "COMPILER_CACHE_KEY=${COMPILER_CACHE_PREFIX}${{ hashFiles('dsa/graphics/host/fetch.sh', 'dsa/graphics/host/fetch.ps1', 'dsa/graphics/host/build.sh', 'dsa/graphics/host/build.ps1', 'dsa/graphics/host/build-macos.sh', 'dsa/graphics/host/CMakeLists.txt', 'dsa/graphics/patches/**') }}" >> "$GITHUB_ENV"

      # The newest entry of an older key still holds most of the upstream code.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}
          restore-keys: ${{ env.COMPILER_CACHE_PREFIX }}

      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: renderer-windows-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Fetch gfxstream and host build dependencies
        shell: pwsh
        run: |
          & dsa/graphics/host/fetch.ps1 -ScratchDir .scratch

      - name: Build the host graphics renderer
        shell: pwsh
        run: |
          & dsa/graphics/host/build.ps1 -ScratchDir .scratch -OutDir .scratch/build-host -Platform ${{ matrix.platform }}
          & $env:CCACHE_EXE --show-stats

      - name: Keep the compiler cache
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}

      - name: Delete the compiler cache it replaces
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "$COMPILER_CACHE_PREFIX" "$COMPILER_CACHE_KEY"

      - name: Check the renderer is built for ${{ matrix.platform }}
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .scratch/build-host/dist/bin/gfxstream_backend.dll).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ('${{ matrix.platform }}' -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw "gfxstream_backend.dll is for machine 0x$('{0:X4}' -f $machine), not ${{ matrix.platform }}" }

      - name: Download software Vulkan (Mesa Lavapipe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mmozeiko/build-mesa/releases/download/26.2.5/mesa-lavapipe-${{ matrix.lavapipe }}-26.2.5.7z" -OutFile ".scratch/mesa-lavapipe.7z"
          New-Item -ItemType Directory -Force .scratch/lavapipe | Out-Null
          if (Test-Path "C:\Program Files\7-Zip\7z.exe") {
            & "C:\Program Files\7-Zip\7z.exe" x .scratch/mesa-lavapipe.7z "-o.scratch/lavapipe" -y
          } else {
            tar -xf .scratch/mesa-lavapipe.7z -C .scratch/lavapipe
          }
          if ($LASTEXITCODE -ne 0) { throw "unpacking Lavapipe failed" }
          # The manifest is named for the processor (lvp_icd.x86_64.json, lvp_icd.aarch64.json);
          # it is rewritten under one name below.
          $jsonPath = $env:LVP_ICD
          $dllPath = (Resolve-Path .scratch/lavapipe/vulkan_lvp.dll).Path

          Copy-Item $dllPath -Destination "C:\Windows\System32\vulkan_lvp.dll" -Force
          Copy-Item $dllPath -Destination ".scratch/build-host/dist/bin/vulkan_lvp.dll" -Force

          $jsonObj = [ordered]@{
              ICD = [ordered]@{
                  api_version = "1.4.354"
                  library_path = $dllPath
              }
              file_format_version = "1.0.1"
          }
          $jsonObj | ConvertTo-Json | Set-Content -Path $jsonPath -Encoding utf8

          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $jsonPath -Value 0 -PropertyType DWord -Force | Out-Null

      - name: Run host renderer smoke test on software Vulkan
        shell: pwsh
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          VK_LOADER_DEBUG: all
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          uv run dsa/graphics/host/test_host_renderer.py

      - name: Run the window manager graphics renderer integration test on software Vulkan
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          VK_LOADER_DEBUG: all
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- pr3_compositor_serves_a_gfxstream_client --nocapture

      - name: Check the host renderer survives unknown Vulkan handles on software Vulkan
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- nfr5_unknown_vulkan_image_is_rejected_without_reaching_the_driver --nocapture

      - name: Check a guest command the renderer cannot carry out ends only that guest's stream
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- nfr5_a_guest_command_the_renderer_cannot_carry_out_ends_only_its_stream --nocapture

      - name: Check the renderer survives a lost GPU device and makes it again
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- nfr5_a_lost_device_is_reported_to_the_guest_and_made_again --nocapture

      - name: Check the renderer's memory count follows every device, also after a lost one
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- nfr1_the_renderer_counts_every_device_after_a_lost_device --nocapture

      - name: Check killing the renderer process keeps the windows and frames resume
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test renderer_process -- --nocapture

      - name: Keep the host renderer library and headers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            .scratch/build-host/dist/bin/gfxstream_backend.dll
            .scratch/build-host/dist/include/
          if-no-files-found: error

      - name: Keep the host renderer's symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: .scratch/build-host/dist/symbols/gfxstream_backend.pdb
          if-no-files-found: warn

      # The installer carries the renderer this job just built.
      - name: Install WiX 5
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the package with gfxstream backend
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $dll = (Resolve-Path .scratch/build-host/dist/bin/gfxstream_backend.dll).Path
          dsa/host/platform/windows/installer/build.ps1 -Version 0.1.0 -PlaceholderKernel `
            -GfxstreamBackend $dll

      - name: Verify gfxstream_backend.dll and dsa-gfx.exe are packaged beside dsa-wm.exe
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dsa/target/installer/dsa-test-0.1.0.msi").Path
          Start-Process msiexec -Wait -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$PWD\msi-extracted`""
          $dll = Get-ChildItem -Recurse msi-extracted -Filter "gfxstream_backend.dll"
          if (-not $dll) {
            throw "gfxstream_backend.dll was not found beside dsa-wm.exe in the MSI"
          }
          $renderer = Get-ChildItem -Recurse msi-extracted -Filter "dsa-gfx.exe" | Select-Object -First 1
          if (-not $renderer -or $renderer.DirectoryName -ne $dll.DirectoryName) {
            throw "dsa-gfx.exe is not packaged beside gfxstream_backend.dll and dsa-wm.exe"
          }
          if ($renderer.VersionInfo.FileDescription -cne 'Graphics renderer for Android') {
            throw "dsa-gfx.exe calls itself '$($renderer.VersionInfo.FileDescription)'"
          }
          $lic = Get-ChildItem -Recurse msi-extracted -Filter "gfxstream.txt"
          if (-not $lic) {
            throw "licenses/gfxstream.txt was not found in the MSI"
          }
          Write-Host "Verified gfxstream_backend.dll at $($dll.FullName) and licence at $($lic.FullName)"

  # The same renderer on macOS, on Vulkan through MoltenVK over Metal.
  host-renderer-macos:
    name: Build the host graphics renderer (macos, arm64)
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Deletes the compiler cache a new one replaces.
      actions: write
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
      COMPILER_CACHE_PREFIX: ccache-renderer-macos-arm64-
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install the Vulkan loader, its headers, MoltenVK, Ninja and ccache
        run: brew install vulkan-loader vulkan-headers molten-vk ninja ccache

      # The renderer's pinned upstream revisions, its patches and its build scripts decide
      # what its compiler cache holds, so they name it.
      - name: Name the compiler cache
        shell: bash
        run: echo "COMPILER_CACHE_KEY=${COMPILER_CACHE_PREFIX}${{ hashFiles('dsa/graphics/host/fetch.sh', 'dsa/graphics/host/fetch.ps1', 'dsa/graphics/host/build.sh', 'dsa/graphics/host/build.ps1', 'dsa/graphics/host/build-macos.sh', 'dsa/graphics/host/CMakeLists.txt', 'dsa/graphics/patches/**') }}" >> "$GITHUB_ENV"

      # The newest entry of an older key still holds most of the upstream code.
      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}
          restore-keys: ${{ env.COMPILER_CACHE_PREFIX }}

      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: renderer-macos
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Fetch gfxstream and host build dependencies
        run: bash dsa/graphics/host/fetch.sh .scratch

      - name: Build the host graphics renderer
        env:
          DSA_GRAPHICS_TARGET: host-macos
        run: |
          bash dsa/graphics/build.sh .scratch .scratch/build-host-macos
          ccache --show-stats

      - name: Keep the compiler cache
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}

      - name: Delete the compiler cache it replaces
        if: github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "$COMPILER_CACHE_PREFIX" "$COMPILER_CACHE_KEY"

      - name: Check the renderer is built for arm64 and exports its entry points
        run: |
          library=.scratch/build-host-macos/dist/bin/libgfxstream_backend.dylib
          lipo -archs "$library" | grep -Fq arm64
          nm -gU "$library" | grep -Fq _dsa_gfx_init
          nm -gU "$library" | grep -Fq _dsa_gfx_set_display_pixels_callback
          nm -gU "$library" | grep -Fq _dsa_gfx_set_display_iosurface_callbacks
          nm -gU "$library" | grep -Fq _dsa_gfx_forget_display

      - name: Run host renderer smoke test on MoltenVK
        env:
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}/.scratch/build-host-macos/dist/bin/libgfxstream_backend.dylib
        run: |
          export VK_ICD_FILENAMES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib"
          # gfxstream itself turns on the Vulkan portability the loader needs to show
          # MoltenVK; this names the driver for the parts of gfxstream that ask.
          export ANDROID_EMU_VK_ICD=moltenvk
          # The GPU the selection tests look for: MoltenVK's device on the runner, not Lavapipe.
          export DSA_TEST_GPU_NAME=apple
          uv run dsa/graphics/host/test_host_renderer.py

      - name: Check killing the renderer process keeps the windows and frames resume
        working-directory: dsa
        env:
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}/.scratch/build-host-macos/dist/bin/libgfxstream_backend.dylib
        run: |
          export VK_ICD_FILENAMES="$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix vulkan-loader)/lib:$(brew --prefix molten-vk)/lib"
          export ANDROID_EMU_VK_ICD=moltenvk
          cargo test -p dsa-host-macos --test renderer_process -- --nocapture

      - name: Keep the host renderer library and headers
        uses: actions/upload-artifact@v4
        with:
          name: host-gfxstream-macos
          path: |
            .scratch/build-host-macos/dist/bin/libgfxstream_backend.dylib
            .scratch/build-host-macos/dist/include/
          if-no-files-found: error
