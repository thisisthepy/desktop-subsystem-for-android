# Builds the patched Android guest transport and Windows host renderer from source.
name: Graphics test

on:
  pull_request:
    paths:
      - "dsa/graphics/**"
      - "dsa/host/platform/windows/**"
      - ".github/workflows/test-graphics.yml"
      - "scripts/tests/graphics-workflow.test.sh"
  workflow_dispatch:

concurrency:
  group: test-graphics-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  # A source build consumes the whole runner. A newer revision supersedes it.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-apps:
    name: Check the Vulkan CTS subset and build the graphics test apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # Every pattern must still name cases of the pinned CTS. Running the cases needs a
      # booted DSA guest on a Windows machine with Hyper-V and a GPU, which a hosted runner
      # does not have; dsa/graphics/verify/README.md says how to run them there.
      - name: Check the Vulkan CTS subset against the pinned CTS
        run: uv run dsa/graphics/verify/verify.py check-subset

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;4.1.0"

      - name: Build the OpenGL ES and Vulkan test apps
        run: bash dsa/graphics/verify/build-test-apps.sh .scratch/graphics-test-apps

      - name: Keep the test apps and the expanded case list
        uses: actions/upload-artifact@v4
        with:
          name: graphics-test-apps
          path: |
            .scratch/graphics-test-apps/hello-gl2.apk
            .scratch/graphics-test-apps/hello-vulkan.apk
            .scratch/graphics-verify/vk-cts-subset.cases.txt
          if-no-files-found: error

  guest-transport:
    name: Build the guest Hyper-V graphics transport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch gfxstream and guest build dependencies
        run: bash dsa/graphics/fetch.sh .scratch/gfxstream

      - name: Test the guest transport on the build machine
        run: bash dsa/graphics/tests/test.sh .scratch

      - name: Build the guest transport
        run: bash dsa/graphics/build.sh .scratch .scratch/build

      - name: Verify ELF architecture and exported Hyper-V symbols
        run: |
          target=".scratch/build/libOpenglSystemCommon.so"
          readelf -h "$target" | grep -Fq 'Advanced Micro Devices X86-64'
          nm -D "$target" | grep -Fq 'HvSocketStream'
          nm -D "$target" | grep -Fq 'goldfish_get_egl_tls'
          target_vk=".scratch/build/vulkan.ranchu.so"
          readelf -h "$target_vk" | grep -Fq 'Advanced Micro Devices X86-64'
          # The Android loader looks up HMI and nothing else; everything else stays hidden.
          exports=$(nm -D --defined-only "$target_vk" | awk '{print $3}')
          test "$exports" = "HMI"
          grep -aFq 'hvsocket' "$target_vk"

      - name: Keep the patched guest library
        uses: actions/upload-artifact@v4
        with:
          name: guest-gfxstream-hvsocket
          path: |
            .scratch/build/libOpenglSystemCommon.so
            .scratch/build/vulkan.ranchu.so
          if-no-files-found: error

  # x64 on windows-latest, and ARM64 natively on windows-11-arm with MSVC's ARM64 tools.
  # Each runs the renderer on software Vulkan (Mesa Lavapipe) for its own processor.
  host-renderer:
    name: Build the host graphics renderer (windows, ${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, platform: x64, lavapipe: x64, artifact: host-gfxstream-windows }
          - { runner: windows-11-arm, platform: ARM64, lavapipe: arm64, artifact: host-gfxstream-windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LVP_ICD: ${{ github.workspace }}\.scratch\lavapipe\lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The ARM64 runner image does not always carry these.
      - name: Set up Rust for ARM64 Windows
        if: matrix.platform == 'ARM64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Set up Ninja for ARM64 Windows
        if: matrix.platform == 'ARM64'
        shell: pwsh
        run: |
          uv tool install ninja
          uv tool dir --bin >> $env:GITHUB_PATH

      - name: Fetch gfxstream and host build dependencies
        shell: pwsh
        run: |
          & dsa/graphics/host/fetch.ps1 -ScratchDir .scratch

      - name: Build the host graphics renderer
        shell: pwsh
        run: |
          & dsa/graphics/host/build.ps1 -ScratchDir .scratch -OutDir .scratch/build-host -Platform ${{ matrix.platform }}

      - name: Check the renderer is built for ${{ matrix.platform }}
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path .scratch/build-host/dist/bin/gfxstream_backend.dll).Path)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ('${{ matrix.platform }}' -eq 'ARM64') { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw "gfxstream_backend.dll is for machine 0x$('{0:X4}' -f $machine), not ${{ matrix.platform }}" }

      - name: Download software Vulkan (Mesa Lavapipe)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mmozeiko/build-mesa/releases/download/26.2.5/mesa-lavapipe-${{ matrix.lavapipe }}-26.2.5.7z" -OutFile ".scratch/mesa-lavapipe.7z"
          New-Item -ItemType Directory -Force .scratch/lavapipe | Out-Null
          if (Test-Path "C:\Program Files\7-Zip\7z.exe") {
            & "C:\Program Files\7-Zip\7z.exe" x .scratch/mesa-lavapipe.7z "-o.scratch/lavapipe" -y
          } else {
            tar -xf .scratch/mesa-lavapipe.7z -C .scratch/lavapipe
          }
          if ($LASTEXITCODE -ne 0) { throw "unpacking Lavapipe failed" }
          # The manifest is named for the processor (lvp_icd.x86_64.json, lvp_icd.aarch64.json);
          # it is rewritten under one name below.
          $jsonPath = $env:LVP_ICD
          $dllPath = (Resolve-Path .scratch/lavapipe/vulkan_lvp.dll).Path

          Copy-Item $dllPath -Destination "C:\Windows\System32\vulkan_lvp.dll" -Force
          Copy-Item $dllPath -Destination ".scratch/build-host/dist/bin/vulkan_lvp.dll" -Force

          $jsonObj = [ordered]@{
              ICD = [ordered]@{
                  api_version = "1.4.354"
                  library_path = $dllPath
              }
              file_format_version = "1.0.1"
          }
          $jsonObj | ConvertTo-Json | Set-Content -Path $jsonPath -Encoding utf8

          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $jsonPath -Value 0 -PropertyType DWord -Force | Out-Null

      - name: Run host renderer smoke test on software Vulkan
        shell: pwsh
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          VK_LOADER_DEBUG: all
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          uv run dsa/graphics/host/test_host_renderer.py

      - name: Run the window manager graphics renderer integration test on software Vulkan
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          VK_LOADER_DEBUG: all
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- pr3_compositor_serves_a_gfxstream_client --nocapture

      - name: Check the host renderer survives unknown Vulkan handles on software Vulkan
        shell: pwsh
        working-directory: dsa
        env:
          VK_ICD_FILENAMES: ${{ env.LVP_ICD }}
          VK_DRIVER_FILES: ${{ env.LVP_ICD }}
          GFXSTREAM_BACKEND_PATH: ${{ github.workspace }}\.scratch\build-host\dist\bin\gfxstream_backend.dll
        run: |
          cargo test -p dsa-host-windows --test window_manager -- nfr5_unknown_vulkan_image_is_rejected_without_reaching_the_driver --nocapture

      - name: Keep the host renderer library and headers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            .scratch/build-host/dist/bin/gfxstream_backend.dll
            .scratch/build-host/dist/include/
          if-no-files-found: error

      - name: Keep the host renderer's symbols
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-symbols
          path: .scratch/build-host/dist/symbols/gfxstream_backend.pdb
          if-no-files-found: warn

  installer-package:
    name: Package the installer with the host graphics renderer (windows)
    needs: host-renderer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the host renderer artifact
        uses: actions/download-artifact@v4
        with:
          name: host-gfxstream-windows
          path: .scratch/host-gfxstream

      - name: Install WiX 5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the package with gfxstream backend
        shell: pwsh
        run: |
          $dll = (Get-ChildItem -Recurse .scratch/host-gfxstream -Filter "gfxstream_backend.dll").FullName
          dsa/host/platform/windows/installer/build.ps1 -Version 0.1.0 -PlaceholderKernel `
            -GfxstreamBackend $dll

      - name: Verify gfxstream_backend.dll is packaged beside dsa-wm.exe
        shell: pwsh
        run: |
          $msi = (Resolve-Path "dsa/target/installer/dsa-test-0.1.0.msi").Path
          Start-Process msiexec -Wait -ArgumentList "/a", "`"$msi`"", "/qn", "TARGETDIR=`"$PWD\msi-extracted`""
          $dll = Get-ChildItem -Recurse msi-extracted -Filter "gfxstream_backend.dll"
          if (-not $dll) {
            throw "gfxstream_backend.dll was not found beside dsa-wm.exe in the MSI"
          }
          $lic = Get-ChildItem -Recurse msi-extracted -Filter "gfxstream.txt"
          if (-not $lic) {
            throw "licenses/gfxstream.txt was not found in the MSI"
          }
          Write-Host "Verified gfxstream_backend.dll at $($dll.FullName) and licence at $($lic.FullName)"
