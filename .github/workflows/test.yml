# The fast quality gate. Runs by hand (on its own or as a job of Checks), and on the release
# pull request into main.
#
# The repository checks (the planning documents are present on develop, no em dashes,
# README files do not link documents that main does not have, the release sync script
# behaves) and the Rust workspace under dsa/. Build and test jobs for each further part
# join this workflow as that part lands.

name: Test

on:
  # Features are integrated on develop and fixed there, so develop is what is tested. The
  # release pull request into main is gated by the same run.
  # Paused by the owner's decision (2026-11-14): while memory and resizing are fixed on
  # the owner's PC, tests run only by hand (workflow_dispatch), so a push to develop does
  # not take the runners the Development and Framework builds wait for. Uncomment to resume.
  # push:
  #   branches: [develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Checks (checks.yml) runs it as one of its jobs, with every other test, in one run.
  workflow_call:

concurrency:
  # A run in progress always finishes, and only the newest waiting run stays: GitHub keeps
  # one pending run per group, so a newer run replaces the one still waiting, and the newest
  # tests everything the dropped ones held. The group is the workflow and the branch (or
  # the pull request), never the run, so manual runs replace each other too. Called from
  # Checks, github.workflow names Checks, so a Checks run neither waits on nor replaces a
  # run started on its own.
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # File and line tables only in the debug builds of the Rust code: backtraces still name
  # the line, and the cached target folders stay a fraction of their full size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Which parts a pull request touches, so each job below runs only when its part changed.
  # A change to this workflow, or a run by hand, runs every job. A pull request that only
  # touches documents runs just the repository checks. A skipped job counts as passed, and
  # "Report the test result" always reports, so a skipped job never holds a merge back.
  changes:
    name: Find the parts that changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.find.outputs.rust }}
      unix: ${{ steps.find.outputs.unix }}
      macos: ${{ steps.find.outputs.macos }}
      linux: ${{ steps.find.outputs.linux }}
      agent: ${{ steps.find.outputs.agent }}
      apk: ${{ steps.find.outputs.apk }}
      protocol: ${{ steps.find.outputs.protocol }}
      settings: ${{ steps.find.outputs.settings }}
      hwcomposer: ${{ steps.find.outputs.hwcomposer }}
      codec2: ${{ steps.find.outputs.codec2 }}
      power: ${{ steps.find.outputs.power }}
      gnss: ${{ steps.find.outputs.gnss }}
      sensors: ${{ steps.find.outputs.sensors }}
      camera: ${{ steps.find.outputs.camera }}
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so a push can be compared with the last commit that passed.
          fetch-depth: 0

      - name: Compare with the base
        id: find
        run: |
          # A newer push replaces a run still waiting, so the push before this one may never
          # have been tested: a push is compared with the newest develop commit whose run
          # passed, not with the commit before it.
          before=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            before="$(gh run list --repo "${{ github.repository }}" --workflow test.yml               --branch develop --event push --status success --limit 1               --json headSha --jq '.[0].headSha // ""' || true)"
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed"
          elif [[ "${{ github.event_name }}" == "push" && -n "$before" ]] && git merge-base --is-ancestor "$before" HEAD 2>/dev/null; then
            git diff --name-only "$before" HEAD > "$RUNNER_TEMP/changed"
          else
            echo ".github/workflows/test.yml" > "$RUNNER_TEMP/changed"
          fi
          cat "$RUNNER_TEMP/changed"
          # Prints true when a changed file matches the pattern, or this workflow changed.
          part() {
            if grep -qE "^(\.github/workflows/test\.yml$|$1)" "$RUNNER_TEMP/changed"; then
              echo "$2=true" >> "$GITHUB_OUTPUT"
            else
              echo "$2=false" >> "$GITHUB_OUTPUT"
            fi
          }
          part 'dsa/(Cargo\.(toml|lock)|deny\.toml|protocol/|host/|guest/(transport|channeld)/)' rust
          part 'dsa/(Cargo\.(toml|lock)|protocol/|host/(core|platform/unix|platform/linux|cli)/)' unix
          part 'dsa/(Cargo\.(toml|lock)|protocol/|host/(core|platform/(unix|macos)|cli)/|host/platform/windows/src/(gpt|pstore_disk)\.rs|kernel/)' macos
          part 'dsa/(Cargo\.(toml|lock)|protocol/|host/(core|platform/unix|platform/linux)/)' linux
          part 'dsa/(guest/agent|protocol)/' agent
          part 'dsa/(Cargo\.(toml|lock)|host/(core|cli)/)|\.github/scripts/apk/' apk
          part 'dsa/protocol/' protocol
          # The generated protocol code is checked on every push to develop whatever the
          # comparison found: it takes a minute, and stale code breaks every host build.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "protocol=true" >> "$GITHUB_OUTPUT"
          fi
          part 'dsa/host/platform/windows/settings/' settings
          part 'dsa/(guest/hwcomposer|protocol)/' hwcomposer
          part 'dsa/(guest/codec2|protocol)/' codec2
          part 'dsa/(guest/power|protocol)/' power
          part 'dsa/(guest/gnss|protocol)/' gnss
          part 'dsa/(guest/sensors|protocol)/' sensors
          part 'dsa/(guest/camera|protocol)/' camera

  # The repository rules, and the icons, from the master SVGs in dsa/brand/: they render,
  # every shipped icon file is there, and each holds every size it must, both as committed
  # and as rendered now. Each takes a minute or less on the same setup, so they share a
  # runner; the icons are checked even when a repository rule failed.
  repository:
    name: Check the repository rules and the brand icons
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The release sync test builds throwaway repositories; it needs git, not history.
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run the repository checks
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "CI"
          ./scripts/check.sh

      - name: Check every shipped icon holds every size
        if: ${{ !cancelled() }}
        run: uv run dsa/brand/check.py

      - name: Render every icon from the masters
        if: ${{ !cancelled() }}
        run: |
          uv run dsa/brand/generate.py --out "$RUNNER_TEMP/brand"
          uv run dsa/brand/check.py --out "$RUNNER_TEMP/brand"

      - name: Keep the rendered icons
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: brand-icons
          path: ${{ runner.temp }}/brand

  rust:
    name: Test the Rust code (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm builds and tests the host for aarch64-pc-windows-msvc, the target
        # of ARM64 Windows PCs, next to the x64 build on windows-latest.
        os: [ubuntu-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      # The ARM64 runner image does not always carry a Rust toolchain, so it gets one here,
      # with the components the steps below use.
      - name: Set up Rust for ARM64 Windows
        if: matrix.os == 'windows-11-arm'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Show the host target
        run: rustc -vV

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: rust-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The Linux settings app is a member of the workspace and links GTK 4 and libadwaita.
      # erofs-utils reads back the erofs images the host writes (the Google apps' image), the
      # way the guest's kernel will.
      - name: Install GTK 4, libadwaita and erofs-utils
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev erofs-utils

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check license policy with cargo-deny
        if: runner.os == 'Linux'
        run: |
          curl -sSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.16.4/cargo-deny-0.16.4-x86_64-unknown-linux-musl.tar.gz | tar -xz --strip-components=1 -C /usr/local/bin cargo-deny-0.16.4-x86_64-unknown-linux-musl/cargo-deny
          cargo deny --all-features check --config deny.toml licenses

      # On Windows this includes the transport suite over real Hyper-V sockets (host to
      # host through the loopback partition).
      #
      # The Windows, macOS and Linux hosts each have programs of the same names (dsa-hostd,
      # dsa-wm, dsa-gfx, dsa-app-window, dsa-devices), and the hosts not for this runner's
      # system build them as stand-ins that only say where they run. In one target folder
      # they would write the same files, and whichever links last wins: on the ARM64 runner
      # the Windows tests ran the macOS stand-in of dsa-app-window, which has no name or
      # icon and opens no window. So this runner's own host is tested with the rest of the
      # workspace, and each other host in a target folder of its own.
      - name: Run the tests
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) native=dsa-host-windows ;;
            Linux) native=dsa-host-linux ;;
            macOS) native=dsa-host-macos ;;
          esac
          others=()
          for host in dsa-host-windows dsa-host-macos dsa-host-linux; do
            if [ "$host" != "$native" ]; then others+=("$host"); fi
          done
          excluded=()
          for host in "${others[@]}"; do excluded+=(--exclude "$host"); done
          cargo test --workspace "${excluded[@]}"
          for host in "${others[@]}"; do
            cargo test -p "$host" --target-dir "target/other-hosts/$host"
          done

      # Pictures of the top of a light and a dark app window as the task window draws its
      # title bar, kept with the run.
      - name: Draw the title bar pictures
        if: runner.os == 'Windows'
        env:
          DSA_CAPTION_PICTURES: ${{ github.workspace }}/.scratch/caption-pictures
        run: cargo test -p dsa-host-core --lib fr22_pictures_of_a_light_and_a_dark_app_window

      - name: Keep the title bar pictures
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: caption-pictures
          path: .scratch/caption-pictures

      # Pictures of a widget's menu (the menu and its Resize submenu) and of a widget being
      # edited with its menu under it, in both themes at 100% and 150%, kept with the run.
      - name: Draw the widget menu pictures
        if: runner.os == 'Windows'
        env:
          DSA_WIDGET_MENU_PICTURES: ${{ github.workspace }}/.scratch/widget-menu-pictures
        run: cargo test -p dsa-host-windows --lib fr12_pictures_of_the_widget_menu

      - name: Keep the widget menu pictures
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: widget-menu-pictures-${{ matrix.os }}
          path: .scratch/widget-menu-pictures

      # Registers dsa-hostd as a real Windows service, reaches it through its named pipe and
      # stops it. The runner's account is an administrator, which this needs.
      - name: Run the service test as an installed Windows service
        if: runner.os == 'Windows'
        env:
          DSA_SERVICE_TESTS: "1"
        run: cargo test -p dsa-host-windows --test service --test user_disk_update -- --nocapture

      # The guest transport's suite over real vsock needs the loopback transport, which
      # the runner's kernel ships as a module.
      - name: Run the vsock tests over vsock loopback
        if: runner.os == 'Linux'
        run: |
          sudo modprobe vsock_loopback
          cargo test -p dsa-guest-transport -p dsa-guest-channeld --features vsock-loopback-tests

  # The Linux host's compositor in a real Wayland session: a headless compositor stands in
  # for the desktop. With no DSA service to reach, the compositor connects to the display,
  # takes the seat, says it is waiting for the service and keeps running, as it must on a
  # desktop where the service starts later.
  linux-host:
    name: Run the Linux compositor in a headless Wayland session (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: linux-host
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install a headless Wayland compositor and libxkbcommon
        timeout-minutes: 20
        run: |
          # A stalled download held the job for its whole 30 minutes: each try gets 5 minutes,
          # and man-db's trigger, the slowest part of an install on the runners, is skipped.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo apt-get update
          for try in 1 2 3; do
            timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y weston libxkbcommon0 dbus && break
            test "$try" -lt 3 || exit 1
          done

      - name: Run the Linux host's tests
        run: cargo test --no-fail-fast -p dsa-host-linux

      # A screen reader's view of a task window: a client on a private session bus reads the
      # window's AT-SPI tree and activates its nodes and title bar buttons.
      - name: Run the AT-SPI provider over D-Bus
        run: dbus-run-session -- cargo test -p dsa-host-linux --features atspi-bus-tests --test atspi_bus -- --nocapture

      - name: Build the compositor
        run: cargo build -p dsa-host-linux --bin dsa-compositor

      # The lock file this build resolved, so a change of dependencies can be committed from it.
      - name: Keep the resolved Cargo.lock
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-linux-host
          path: dsa/Cargo.lock

      - name: Run the compositor against the headless session
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-dsa --idle-time=0 &
          for _ in $(seq 50); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-dsa" ]] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-dsa
          export DSA_SOCKET="$RUNNER_TEMP/no-service.sock"
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          set +e
          timeout 5 target/debug/dsa-compositor 2> "$RUNNER_TEMP/compositor.log"
          code=$?
          set -e
          cat "$RUNNER_TEMP/compositor.log"
          if [[ $code -ne 124 ]]; then
            echo "::error::the compositor exited (code $code) instead of waiting for the service"
            exit 1
          fi
          grep -q "waiting for the DSA service" "$RUNNER_TEMP/compositor.log"

      - name: Check a second compositor in the same session leaves the first alone
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime2"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          exec 9> "$XDG_RUNTIME_DIR/dsa-compositor.lock"
          flock -n 9
          timeout 5 target/debug/dsa-compositor

  # The macOS host on Apple silicon: its tests, the vsock transport over socket pairs, and
  # dsa-hostd signed with the virtualization entitlement and checked by the framework itself.
  # GitHub's macOS runners are VMs without nested virtualization, so no Android boots here.
  # DSA Settings for Linux: its view models and translations without a display, its desktop
  # files, and the app itself in a headless Wayland session with no DSA service to reach,
  # where it must open its window, say the service is not running and keep running.
  linux-settings:
    name: Test the Linux settings app (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.unix == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: linux-settings
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install GTK 4, libadwaita, gettext and the desktop file checkers
        timeout-minutes: 20
        run: |
          # A stalled download held the job for its whole 30 minutes: each try gets 5 minutes,
          # and man-db's trigger, the slowest part of an install on the runners, is skipped.
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo apt-get update
          for try in 1 2 3; do
            timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-4-dev libadwaita-1-dev \
              gettext desktop-file-utils appstream weston && break
            test "$try" -lt 3 || exit 1
          done

      - name: Run the settings app's tests
        run: cargo test --no-fail-fast -p dsa-settings-linux

      - name: Lint the settings app
        run: cargo clippy -p dsa-settings-linux --all-targets -- -D warnings

      - name: Build the settings app
        run: cargo build -p dsa-settings-linux --bin dsa-settings

      - name: Check the translations, the desktop entry and the AppStream entry
        working-directory: dsa/host/platform/linux/settings
        run: |
          for po in po/*.po; do
            msgfmt --check --statistics -o /dev/null "$po"
          done
          desktop-file-validate data/io.github.thisisthepy.DSA.Settings.desktop
          # The packages fill in the version and the date (build-packages.sh); the check reads
          # the file as a package ships it.
          sed -e "s|@VERSION@|0.0.0|g" -e "s|@DATE@|$(date -u +%Y-%m-%d)|g"             data/io.github.thisisthepy.DSA.Settings.metainfo.xml > "$RUNNER_TEMP/io.github.thisisthepy.DSA.Settings.metainfo.xml"
          appstreamcli validate --no-net --explain "$RUNNER_TEMP/io.github.thisisthepy.DSA.Settings.metainfo.xml"

      - name: Run the settings app against the headless session
        run: |
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/runtime"
          mkdir -p -m 0700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wayland-dsa --idle-time=0 &
          for _ in $(seq 50); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-dsa" ]] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-dsa GDK_BACKEND=wayland
          export DSA_SOCKET="$RUNNER_TEMP/no-service.sock"
          export XDG_DATA_HOME="$RUNNER_TEMP/data"
          export LANGUAGE=ko
          for page in general memory apps logs about; do
            set +e
            timeout 5 dbus-run-session -- target/debug/dsa-settings --page "$page" \
              2> "$RUNNER_TEMP/settings-$page.log"
            code=$?
            set -e
            cat "$RUNNER_TEMP/settings-$page.log"
            if [[ "$code" -ne 124 ]]; then
              echo "::error::the settings app ended with code $code on the $page page instead of running"
              exit 1
            fi
            if grep -q "panicked\|CRITICAL" "$RUNNER_TEMP/settings-$page.log"; then
              echo "::error::the settings app reported a crash or a GTK critical on the $page page"
              exit 1
            fi
          done

  # Also the local API and dsa over Unix sockets as macOS reads a peer's user (Linux runs
  # them in "Test the Rust code"). macOS runners are the scarcest, so both share one, each in
  # steps that run when their part changed.
  macos-host:
    name: Test the macOS host and the local API over Unix sockets (macos-latest)
    needs: changes
    if: needs.changes.outputs.macos == 'true' || needs.changes.outputs.unix == 'true'
    # macos-14 runners are no longer handed out: every job asking for one was cancelled
    # without ever starting.
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      - name: Show the host target
        run: rustc -vV

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: macos-host
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Run the local API and dsa tests over Unix sockets
        if: needs.changes.outputs.unix == 'true'
        run: cargo test --no-fail-fast -p dsa-transport -p dsa-host-unix -p dsa-cli -p dsa-host-linux

      # "Test the Rust code" fails on formatting already; here it must not hide what the
      # build and the tests say.
      - name: Check formatting
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        continue-on-error: true
        run: cargo fmt -p dsa-host-macos -p dsa-cli --check

      - name: Lint
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: cargo clippy -p dsa-host-macos -p dsa-cli --all-targets -- -D warnings

      - name: Run the tests
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: cargo test --no-fail-fast -p dsa-host-macos -p dsa-cli

      # The lock file as cargo resolved it here, for a change that adds dependencies on
      # a machine that cannot build the macOS host.
      - name: Keep the resolved lock file
        if: always() && needs.changes.outputs.macos == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-macos
          path: dsa/Cargo.lock

      - name: Build and sign dsa-hostd
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: |
          cargo build --release -p dsa-host-macos --bin dsa-hostd
          codesign --force --sign - --options runtime \
            --entitlements host/platform/macos/dsa-hostd.entitlements target/release/dsa-hostd
          codesign --display --entitlements - target/release/dsa-hostd | tee "$RUNNER_TEMP/entitlements"
          grep -q com.apple.security.virtualization "$RUNNER_TEMP/entitlements"
          target/release/dsa-hostd version

      # A stand-in image: an arm64 Image header, an initrd and raw disks. The framework
      # validates the VM made from it, which needs the entitlement and the device set the
      # host uses, without starting it.
      - name: Have the framework validate the VM
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: |
          image="$RUNNER_TEMP/image"
          mkdir -p "$image"
          head -c 4096 /dev/zero > "$image/Image"
          printf 'ARM\x64' | dd of="$image/Image" bs=1 seek=56 conv=notrunc status=none
          head -c 4096 /dev/zero > "$image/initrd.img"
          mkfile -n 64m "$image/system.img"
          mkfile -n 64m "$image/data.img"
          echo '{"version": "0-ci", "arch": "arm64", "kernel_cmdline": "init=/init androidboot.boot_devices=vmbus console=ttyAMA0", "files": {"system.img": {}, "data.img": {}}}' > "$image/image.json"
          echo "{\"image_dir\": \"$image\", \"data_dir\": \"$RUNNER_TEMP/user\"}" > "$RUNNER_TEMP/dsa-hostd.json"
          target/release/dsa-hostd check "$RUNNER_TEMP/dsa-hostd.json"

      # The settings app (SwiftUI): its view models' tests against a fake dsa, then the app
      # as the package builds it, and the committed icon as iconutil reads it.
      - name: Test the settings app
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: swift test --package-path host/platform/macos/settings --scratch-path target/dsa-settings

      - name: Build the settings app
        if: ${{ !cancelled() && needs.changes.outputs.macos == 'true' }}
        run: |
          swift build -c release --package-path host/platform/macos/settings --scratch-path target/dsa-settings
          bin="$(swift build -c release --package-path host/platform/macos/settings --scratch-path target/dsa-settings --show-bin-path)"
          test -x "$bin/dsa-settings"
          iconutil -c iconset -o "$RUNNER_TEMP/DSA.iconset" host/platform/macos/packaging/icon/DSA.icns
          # Every size from 16 to 1024 px, by name: the icon also holds a 64 px image (icp6),
          # so a count of the files proves nothing either way.
          ls "$RUNNER_TEMP/DSA.iconset"
          for size in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x 256x256 256x256@2x 512x512 512x512@2x; do
            test -s "$RUNNER_TEMP/DSA.iconset/icon_$size.png"
          done
          xcrun xcstringstool compile host/platform/macos/settings/Resources/Localizable.xcstrings \
            --output-directory "$RUNNER_TEMP/strings"
          plutil -lint "$RUNNER_TEMP/strings/en.lproj/Localizable.strings" "$RUNNER_TEMP/strings/ko.lproj/Localizable.strings"

  # The Linux host's VM and its ports: the vsock suite over vsock loopback standing in for a
  # guest, and the launcher against the crosvm DSA ships, under KVM: the runner's own kernel
  # for the control socket's commands, and the published Android image until its control
  # daemon connects.
  linux-vm:
    name: Test the Linux host's VM under KVM (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: linux-vm
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Keep the VM programs between runs
        uses: actions/cache@v4
        with:
          path: .scratch/vm-programs
          key: linux-vm-programs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dsa/host/platform/linux/crosvm/**', 'dsa/graphics/host/**', 'dsa/graphics/patches/**', '.github/scripts/linux-vm/**') }}

      - name: Build crosvm, passt and gfxstream's renderer
        working-directory: .
        run: bash .github/scripts/linux-vm/build-vm-programs.sh .scratch/vm-programs

      # Where the package puts them, so the package's AppArmor profile lets crosvm and passt
      # make their sandboxes' user namespaces, as on an installed system.
      - name: Install the VM programs as the package does
        working-directory: .
        run: |
          sudo install -d /usr/lib/dsa/bin
          sudo install -m 0755 .scratch/vm-programs/crosvm .scratch/vm-programs/passt .scratch/vm-programs/libgfxstream_backend.so /usr/lib/dsa/bin/
          sudo install -m 0644 dsa/host/platform/linux/packaging/apparmor/dsa-vm /etc/apparmor.d/dsa-vm
          sudo apparmor_parser -r -W /etc/apparmor.d/dsa-vm
          /usr/lib/dsa/bin/crosvm version
          echo "DSA_CROSVM=/usr/lib/dsa/bin/crosvm" >> "$GITHUB_ENV"

      # The runner's user gets KVM and vhost-vsock, as a desktop user has them.
      - name: Load KVM, vhost-vsock and vsock loopback
        run: |
          sudo modprobe vhost_vsock
          sudo modprobe vsock_loopback
          sudo chmod 666 /dev/kvm /dev/vhost-vsock
          ls -l /dev/kvm /dev/vhost-vsock

      # With an init that loads the virtio balloon driver and idles, so the VM can be
      # resized through its balloon.
      - name: Give crosvm a kernel to boot
        working-directory: .
        run: |
          kernel="$RUNNER_TEMP/vmlinuz"
          sudo cp "/boot/vmlinuz-$(uname -r)" "$kernel"
          sudo chmod 644 "$kernel"
          bash .github/scripts/linux-vm-test/make-test-initrd.sh "$(uname -r)" "$RUNNER_TEMP/test-initrd.img"
          echo "DSA_CROSVM_TEST_KERNEL=$kernel" >> "$GITHUB_ENV"
          echo "DSA_CROSVM_TEST_INITRD=$RUNNER_TEMP/test-initrd.img" >> "$GITHUB_ENV"

      # Images are published by the official repository only, so a fork tests with them too.
      - name: Download the newest published Android image
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_REPOSITORY: thisisthepy/desktop-subsystem-for-android
        run: |
          tag="$(gh release list -R "$OFFICIAL_REPOSITORY" -L 50 --json tagName -q '[.[] | select(.tagName | startswith("android-17") and (endswith("-arm64") | not))][0].tagName')"
          test -n "$tag" || { echo "no published x86_64 Android 17 image release"; exit 1; }
          echo "image release: $tag"
          image="$RUNNER_TEMP/image"
          mkdir -p "$image"
          for file in image.json bzImage initrd.img system.vhdx data.vhdx; do
            gh release download "$tag" -R "$OFFICIAL_REPOSITORY" -p "$file" -D "$image"
          done
          ls -l "$image"
          echo "DSA_CROSVM_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Build the service and dsa
        run: cargo build -p dsa-host-linux -p dsa-cli

      - name: Run the tests
        run: cargo test -p dsa-host-linux --features vsock-loopback-tests -- --nocapture

      - name: Keep the Android VM's console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-vm-console
          path: /tmp/crosvm-test-*/console.log
          if-no-files-found: ignore

  agent:
    name: Test the guest agent (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dsa/guest/agent
    steps:
      - uses: actions/checkout@v4

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The unit tests, and the release build, which compiles the agent against the
      # generated protocol and channel code and packages the APK with the SDK tools.
      - name: Run the tests and build the agent
        run: |
          ./kotlin test
          ./kotlin do assembleRelease

  protocol:
    name: Check the generated protocol code (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.protocol == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # protoc and the runtimes must be the same version as the checked-in generated code
      # (3.21, the version Ubuntu 24.04 ships).
      - name: Install protoc and the protobuf runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libprotobuf-java default-jdk-headless g++
          protoc --version

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: protocol
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Regenerate and compare with what is checked in
        working-directory: dsa
        run: |
          PROTOC="$(command -v protoc)" cargo run -p dsa-protocol-codegen
          if [[ -n "$(git status --porcelain -- protocol)" ]]; then
            git status --short -- protocol
            git diff -- protocol | head -200
            # The whole difference, as a patch to apply, because the generated Java and C++
            # sources are too long to read from the log.
            git add -N -- protocol
            git diff --binary -- protocol > "$RUNNER_TEMP/generated-protocol.patch"
            echo "::error::the generated protocol code does not match control.proto, host_api.proto, window_host.proto or renderer.proto; run dsa-protocol-codegen and commit the result"
            exit 1
          fi

      - name: Keep the generated protocol code that differs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-protocol
          path: ${{ runner.temp }}/generated-protocol.patch
          if-no-files-found: ignore

      - name: Check the Java codec against the vectors
        run: dsa/protocol/java/test.sh

      - name: Check the C++ codec against the vectors
        run: dsa/protocol/cpp/test.sh

  settings-app:
    name: Test and build the settings app and APK Installer (${{ matrix.os }}, ${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.settings == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: dsa/host/platform/windows/settings
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The view models and the reading of dsa's JSON, against a fake dsa.
      - name: Run the view model tests
        run: dotnet test DsaSettings.Core.Tests/DsaSettings.Core.Tests.csproj -c Release

      # The WPF app itself, as the installer publishes it.
      - name: Build the app
        run: dotnet publish DsaSettings/DsaSettings.csproj -c Release -r ${{ matrix.rid }} -o ../../../../target/settings-app

      # The APK Installer, into the same folder, as the installer publishes it.
      - name: Build the APK Installer
        run: dotnet publish DsaApkInstaller/DsaApkInstaller.csproj -c Release -r ${{ matrix.rid }} -o ../../../../target/settings-app

  # The guest HALs' rules on the build machine, each against the generated protobuf-lite
  # codec built with the 3.21 runtime Ubuntu 24.04 ships, and the host's APK reader against
  # APKs the Android SDK's own tools make (aapt2, zipalign, apksigner), not only against the
  # ones its unit tests write. Each takes a minute or less, so they share a runner. Each is
  # a step of its own that runs when its part changed, also when a step before it failed,
  # so a failure names its part and hides no other.
  guest-rules:
    name: Test the guest HALs' rules and read APKs made by the Android SDK (ubuntu-latest)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install the protobuf runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libprotobuf-dev g++

      - name: Test the guest hwcomposer's task rules
        if: ${{ !cancelled() && needs.changes.outputs.hwcomposer == 'true' }}
        run: dsa/guest/hwcomposer/test.sh

      # On every run, as when it had a job of its own.
      - name: Test the guest audio module
        if: ${{ !cancelled() }}
        run: dsa/guest/audio/test.sh

      - name: Test the guest codec HAL's rules
        if: ${{ !cancelled() && needs.changes.outputs.codec2 == 'true' }}
        run: dsa/guest/codec2/test.sh

      - name: Test the guest power and health HALs' rules
        if: ${{ !cancelled() && needs.changes.outputs.power == 'true' }}
        run: dsa/guest/power/test.sh

      - name: Test the guest GNSS HAL's rules
        if: ${{ !cancelled() && needs.changes.outputs.gnss == 'true' }}
        run: dsa/guest/gnss/test.sh

      - name: Test the guest sensors HAL's rules
        if: ${{ !cancelled() && needs.changes.outputs.sensors == 'true' }}
        run: dsa/guest/sensors/test.sh

      - name: Test the guest camera HAL's rules
        if: ${{ !cancelled() && needs.changes.outputs.camera == 'true' }}
        run: dsa/guest/camera/test.sh

      # The dependencies of dsa come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        if: ${{ !cancelled() && needs.changes.outputs.apk == 'true' }}
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: guest-rules
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Make the test APKs
        id: apks
        if: ${{ !cancelled() && needs.changes.outputs.apk == 'true' }}
        run: .github/scripts/apk/make-test-apks.sh .scratch/test-apks

      - name: Build dsa
        id: dsa
        if: ${{ !cancelled() && needs.changes.outputs.apk == 'true' }}
        working-directory: dsa
        run: cargo build -q -p dsa-cli

      - name: Read the APKs with dsa apk-info
        if: ${{ !cancelled() && steps.apks.outcome == 'success' && steps.dsa.outcome == 'success' }}
        run: .github/scripts/apk/check-apk-info.sh dsa/target/debug/dsa .scratch/test-apks

      - name: Keep the APKs and what dsa said of them
        if: always() && needs.changes.outputs.apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-apks
          path: .scratch/test-apks

  # Deletes the Actions caches no run restores any more: on develop every entry but the
  # newest of its kind (its key without the trailing hashes), and the caches of other refs
  # that are stale. Past 10 GB GitHub evicts the entries read least recently, and those are
  # the large compiler caches of the builds that run least often, the slowest to build again.
  caches:
    name: Delete superseded and stale caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Delete the caches no run restores
        run: .github/scripts/cache/prune.sh all

  # One check that always reports: it fails when any job failed or was cancelled, and passes
  # when every job passed or was skipped because its part did not change.
  result:
    name: Report the test result
    if: always()
    needs:
      [changes, repository, rust, macos-host, linux-host, linux-settings, linux-vm, agent, protocol, settings-app, guest-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every job passed or was skipped
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::a test job failed or was cancelled"
            exit 1
          fi
