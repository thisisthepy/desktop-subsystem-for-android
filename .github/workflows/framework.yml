# Builds SurfaceFlinger, libhwui and libEGL with DSA's GPU device loss recovery,
# libandroid_runtime, which gives Google Play the computer's memory, and DSA's KeyMint, whose root key of key blobs comes from the DSA host, and
# services.jar, whose window manager gives a dialog no caption bar inset (the patches in
# dsa/guest/framework/patches), for each Android version in dsa/guest/framework/framework-lock.json
# and each guest architecture, and keeps them as the artifacts the image release lays over the
# published build (make-image.py --framework).
#
# The image takes the framework files in place of the published build's, and the KeyMint
# in place of its KeyMint APEX, beside that build's own libraries, so each is built from the
# exact source of the build the image is made from: the lock pins every project to the commit
# the build's manifest names, and its release configuration, Clang and Rust. It runs on GitHub's
# standard runners: like the translator build, it fetches only the projects the lock lists (each
# at its pinned commit, the large ones in part) and builds only the install paths the image
# takes (framework_lock.py outputs).
#
# It runs only by hand (workflow_dispatch): start it after the lock or the patches change. Each build's compiler
# cache is kept between runs as an artifact of the run (ccache-artifact.sh in
# .github/scripts/framework says why not in the Actions cache), also when a run fails or times
# out, so a run that stops partway makes the next one shorter. With its cache a build takes
# about 20 minutes; without it, up to two and a half hours.
#
# The jobs, in order:
#   1. versions: checks the lock against each build's manifest and the patches against the
#      pinned source, and lists the versions and architectures.
#   2. native (per Android version and architecture) and services (per Android version) start
#      together as soon as it passes. The native build keeps its files as the intermediate
#      artifact framework-native-<android>-<arch>-<version>; the services build keeps
#      services.jar as framework-services-<android>-<version>.
#   3. framework (per Android version and architecture) waits for both, adds services.jar to
#      the native files when the services build made it, and keeps the result as
#      framework-<android>-<arch>-<version>, the artifact the image release takes. It is the
#      only job that keeps that artifact, so the artifact never exists without services.jar
#      while the services build might still make it. A job can wait only for a whole matrix, not
#      one of its jobs, so each framework job waits for every native and services job; that is
#      still sooner than the native builds waiting for the services builds before they start.
#
# The Development build needs only the newest Android's x86_64 files, and takes them as soon as
# the framework job for those has passed, while the others still run (release-image.yml). So the
# newest Android comes first in the matrices, and x86_64 before arm64, which starts those jobs
# first when runners are short.

name: Framework build

on:
  workflow_dispatch:
    inputs:
      android:
        description: "Build only this version (android16 or android17); empty for every version in the lock"
        required: false
        default: ""
      arch:
        description: "Build only this architecture (x86_64 or arm64); empty for both"
        required: false
        default: ""
  # Paused by the owner's decision (2026-11-16): nothing on develop starts on a push, so a
  # change to the lock or the patches needs a run started by hand. The Development build
  # warns when the run it takes is older than the newest such change. Uncomment to resume.
  # push:
  #   branches: [develop]
  #   paths:
  #     - dsa/guest/framework/framework-lock.json
  #     - dsa/guest/framework/patches/**

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  versions:
    name: Check the lock and the patches (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      android: ${{ steps.read.outputs.android }}
      arch: ${{ steps.read.outputs.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: List the versions and architectures
        id: read
        env:
          ONLY_ANDROID: ${{ inputs.android }}
          ONLY_ARCH: ${{ inputs.arch }}
        run: |
          # The newest Android first, so its jobs start first.
          all="$(uv run dsa/guest/framework/framework_lock.py versions | jq -c 'sort_by(ltrimstr("android") | tonumber) | reverse')"
          if [[ -n "$ONLY_ANDROID" ]]; then
            echo "$all" | jq -e --arg v "$ONLY_ANDROID" 'index($v) != null' >/dev/null \
              || { echo "::error::the lock has no $ONLY_ANDROID; it has $all"; exit 1; }
            all="$(jq -cn --arg v "$ONLY_ANDROID" '[$v]')"
          fi
          arches='["x86_64","arm64"]'
          if [[ -n "$ONLY_ARCH" ]]; then
            echo "$arches" | jq -e --arg a "$ONLY_ARCH" 'index($a) != null' >/dev/null \
              || { echo "::error::the architecture must be x86_64 or arm64, not $ONLY_ARCH"; exit 1; }
            arches="$(jq -cn --arg a "$ONLY_ARCH" '[$a]')"
          fi
          echo "android=$all" >> "$GITHUB_OUTPUT"
          echo "arch=$arches" >> "$GITHUB_OUTPUT"

      # Every pinned commit must be the one the published build was made from; a commit that
      # is not would build files that do not match the libraries beside them in the image.
      - name: Check the lock against each build's manifest
        run: |
          for android in $(uv run dsa/guest/framework/framework_lock.py versions | jq -r '.[]'); do
            url="$(jq -r --arg a "$android" '.versions[] | select(.android == $a) | .manifest.url' dsa/guest/framework/framework-lock.json)"
            curl -fsSL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/manifest-$android.xml" "$url"
            uv run dsa/guest/framework/framework_lock.py check-manifest "$android" "$RUNNER_TEMP/manifest-$android.xml"
          done

      - name: Check the patches apply to the pinned source
        run: |
          for android in $(uv run dsa/guest/framework/framework_lock.py versions | jq -r '.[]'); do
            .github/scripts/framework/check-patches.sh "$android" "$RUNNER_TEMP/patch-check-$android"
          done

  # SurfaceFlinger, libhwui, libEGL, libandroid_runtime and the KeyMint, in the reduced tree. It
  # starts with the services build and does not wait for it: services.jar is added to its files
  # afterwards, by the framework job below.
  native:
    name: Build the native framework (ubuntu-24.04, ${{ matrix.android }}, ${{ matrix.arch }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
      # Reads the compiler caches earlier runs kept, and deletes the ones the new one replaces.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        android: ${{ fromJSON(needs.versions.outputs.android) }}
        arch: ${{ fromJSON(needs.versions.outputs.arch) }}
    env:
      ANDROID_BRANCH: ${{ matrix.android }}
      CCACHE_DIR: /tmp/dsa-ccache
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: .github/scripts/translator/free-disk.sh dsa-framework

      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ccache jq
          ccache --version | head -1

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Read the pins
        id: pins
        run: |
          version="$(uv run dsa/guest/framework/framework_lock.py version "$ANDROID_BRANCH")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the framework $version for ${{ matrix.arch }}"

      # The newest one this branch or develop kept, whatever lock it was built from: ccache
      # knows each object by its own source and flags, so after a lock or patch change it still
      # hits on everything else (95 % after the lock change of 2026-11-13).
      - name: Restore the compiler cache
        id: ccache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/framework/ccache-artifact.sh restore "framework-ccache-${{ matrix.android }}-${{ matrix.arch }}" \
            "$CCACHE_DIR" "$DSA_TRANSLATOR_WORK/ccache-download"

      # Runs before the artifacts kept their caches in the Actions cache; one may still be there.
      - name: Restore the compiler cache from the Actions cache
        if: steps.ccache.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/dsa-ccache
          key: framework-ccache-${{ matrix.android }}-${{ matrix.arch }}-${{ hashFiles('dsa/guest/framework/framework-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            framework-ccache-${{ matrix.android }}-${{ matrix.arch }}-

      - name: Fetch the pinned source
        run: |
          start=$SECONDS
          uv run .github/scripts/translator/fetch-source.py --lock dsa/guest/framework/framework-lock.json \
            --android "$ANDROID_BRANCH" --top "$DSA_TRANSLATOR_WORK/aosp"
          echo "fetched in $(( (SECONDS - start) / 60 )) minutes"
          du -sh "$DSA_TRANSLATOR_WORK/aosp"
          du -sh "$DSA_TRANSLATOR_WORK"/aosp/prebuilts/* 2>/dev/null | sort -h | tail -5
          df -h / /mnt

      - name: Build SurfaceFlinger, libhwui, libEGL and the KeyMint
        id: build
        timeout-minutes: 300
        run: |
          start=$SECONDS
          .github/scripts/framework/build.sh "$DSA_TRANSLATOR_WORK/aosp" "$ANDROID_BRANCH" "${{ matrix.arch }}"
          echo "built in $(( (SECONDS - start) / 60 )) minutes"
          du -sh "$DSA_TRANSLATOR_WORK/aosp/out"
          df -h / /mnt

      # Kept whenever the build ran, also when it failed, timed out or was cancelled, as what it
      # compiled is still good. Not when it never ran: the cache would hold nothing new, and an
      # empty one would replace a full one.
      - name: Pack the compiler cache
        id: pack
        if: always() && contains(fromJSON('["success", "failure", "cancelled"]'), steps.build.outcome)
        run: .github/scripts/framework/ccache-artifact.sh pack "$CCACHE_DIR" "$DSA_TRANSLATOR_WORK/ccache-upload/ccache.tar"

      - name: Keep the compiler cache
        id: keep-ccache
        if: always() && steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: framework-ccache-${{ matrix.android }}-${{ matrix.arch }}
          path: ${{ env.DSA_TRANSLATOR_WORK }}/ccache-upload/ccache.tar
          if-no-files-found: error
          # ccache compresses every entry itself.
          compression-level: 0
          # A re-run of the job replaces what its first attempt kept.
          overwrite: true
          # Develop's is replaced by the next run's (the step after this one); a branch's lasts
          # a week.
          retention-days: ${{ github.ref == 'refs/heads/develop' && 90 || 7 }}

      # The artifact just kept holds the one it was restored from and what this run added, so
      # the older ones of this version and architecture are never restored again.
      - name: Delete the compiler caches it replaces
        if: always() && steps.keep-ccache.outcome == 'success' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/framework/ccache-artifact.sh prune "framework-ccache-${{ matrix.android }}-${{ matrix.arch }}" "${{ steps.keep-ccache.outputs.artifact-id }}"

      # Without services.jar, which the framework job adds (collect.py --add-services), so that
      # the folder ends up as one collected with it.
      - name: Collect the files the image takes
        id: collect
        run: |
          out="$DSA_TRANSLATOR_WORK/framework"
          uv run dsa/guest/framework/collect.py --android "$ANDROID_BRANCH" --arch "${{ matrix.arch }}" \
            --product-out "$DSA_TRANSLATOR_WORK/aosp/out/target/product/dsa_framework" \
            --top "$DSA_TRANSLATOR_WORK/aosp" --out "$out"
          find "$out" -type f -exec ls -l {} +
          echo "out=$out" >> "$GITHUB_OUTPUT"

      # Not the artifact the image release takes (that is the framework job's), so a reader never
      # finds the native files before services.jar has had its chance to join them. Only the
      # framework job reads it, in this run or a re-run of that job.
      - name: Keep the native files
        uses: actions/upload-artifact@v4
        with:
          name: framework-native-${{ matrix.android }}-${{ matrix.arch }}-${{ steps.pins.outputs.version }}
          path: ${{ steps.collect.outputs.out }}/
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Keep the build's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-logs-${{ matrix.android }}-${{ matrix.arch }}
          path: |
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/error.log
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/soong.log
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/missing-inputs.txt
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/verbose.log*
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/soong_ui.log*
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/soong/soong.variables
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/.dsa-targets
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/.dsa-sources.json
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/.dsa-patches.json
          if-no-files-found: ignore
          # The .dsa-* files start with a dot, which upload-artifact skips unless told otherwise.
          include-hidden-files: true
          retention-days: 30

  # services.jar, with DSA's window manager, package manager and WebView service changes. The
  # Java framework reaches across most of the platform, so it is built in a tree of every project
  # the published build's manifest syncs by default (framework_lock.py services-lock), with the
  # build's own product and release configuration. A dex file is the same for every
  # architecture, so one build serves the images of both; the framework job below adds it to
  # each architecture's native files. It fits a standard runner's disk (145 GB) only as follows:
  # the runner's unused toolchains go (free-disk.sh --deep), the tree leaves out what only native
  # builds and other devices read (framework_lock.py SERVICES_TREE_SKIPPED), and the build makes
  # services' dex jar alone, not its install path, which would also build its JNI, native and
  # Rust dependencies. Soong's analysis of the whole tree needs more memory than the runner has,
  # so a large swap file is added for it, and build-services.sh gives it back to the disk when
  # the analysis is done.
  #
  # The runner has 4 processors and 16 GiB. When the build took all of them and swapped hard,
  # the runner's own agent stopped answering and GitHub gave the job up ("The hosted runner lost
  # communication with the server", android17 in run 43637660922, 50 minutes into the build). So
  # the build runs with fewer jobs at the lowest priority (build-services.sh), swapped pages are
  # compressed in memory first, and the kernel's OOM killer takes the build before the agent.
  #
  # With all that, android17's analysis still printed nothing for 58 minutes until GitHub took
  # the runner away (run 43644988414), while android16's took 9 minutes in the same run.
  # build-services.sh says what was found and what it does about it: Android 17 turns Soong's
  # incremental analysis on, which a single analysis of a fresh tree only pays for, and the Go
  # memory limit never reached the analysis in either version. It also prints the memory, the
  # swap and the disk every minute, and stops an analysis that takes longer than
  # DSA_ANALYSIS_MINUTES itself, so that a build that does not fit says what it was short of.
  #
  # Even then android17 lost its runner in about half its attempts (runs 43763452008,
  # 43815264913 and 44797323515), each time 58 to 62 minutes into "Build services.jar", with no
  # log left. The runs that passed say where: android17's analysis holds 19 to 20 GiB at its
  # peak (soong_build about 10 GiB in memory and 8 to 10 in swap), against android16's 13. For
  # most of its 19 to 23 minutes the runner has 0.5 to 0.9 GiB available, and in the worst
  # minute every task on it, the runner's own included, waited for memory 96 % of the time and
  # for the disk 91 % (run 44677247350). The build that follows never has less than 4 GiB
  # available. The runner's processes ran in the same memory as the build and in the same
  # cgroup (the step's environment names system.slice/hosted-compute-agent.service), so the
  # OOM score that guards them from being killed never kept their pages from being reclaimed:
  # a page the agent needed back waited behind the build's swapping, on the one disk the tree
  # and the swap share (/dev/mapper/cow-root; these runners have no /mnt), and an analysis that
  # swapped harder than in the runs that passed kept the agent waiting until GitHub gave up. So
  # the build now runs in a cgroup of its own whose memory.high leaves the runner a share the
  # build's reclaim never touches.
  services:
    name: Build services.jar (ubuntu-24.04, ${{ matrix.android }})
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        android: ${{ fromJSON(needs.versions.outputs.android) }}
    env:
      ANDROID_BRANCH: ${{ matrix.android }}
    steps:
      - uses: actions/checkout@v4

      - name: Make room on the runner
        run: .github/scripts/translator/free-disk.sh dsa-services --deep

      # 24 GiB beside free-disk.sh's 12 GiB. It cannot be larger: with both swap files the disk
      # has 99 GB free before the fetch and 17 GB after it (run 43633250360), and the analysis
      # writes its ninja files into that.
      - name: Add swap for the analysis of the whole tree
        run: |
          swap_dir="$(dirname "$(swapon --show=NAME --noheadings | grep dsa-swap | head -1)")"
          sudo fallocate -l 24G "$swap_dir/dsa-swap-services"
          sudo chmod 600 "$swap_dir/dsa-swap-services"
          sudo mkswap "$swap_dir/dsa-swap-services" >/dev/null
          sudo swapon "$swap_dir/dsa-swap-services"
          # build-services.sh turns it off and deletes it once the analysis is done.
          echo "DSA_ANALYSIS_SWAP=$swap_dir/dsa-swap-services" >> "$GITHUB_ENV"
          free -h
          df -h / /mnt

      # The headroom that keeps the runner answering while the build swaps.
      - name: Keep the runner responsive under memory pressure
        run: |
          # zswap keeps pages on their way to swap compressed in memory, in at most 35 % of it
          # (about 5.4 GiB), and writes them to the disk only when that pool is full. Heaps of
          # small objects, as Soong's and the Java tools' are, compress well (lzo held 7.6 GiB
          # in 1.7 during android17's analysis, run 44677247350), so much of the swapping never
          # waits for the disk, whose queue is what stalls every other process. The pool was 20 %
          # (about 3 GiB) when the build could take the whole memory; held to about 1 GiB less by
          # its cgroup below, the analysis swaps that much more, and 35 % keeps it in memory too.
          # The pool is charged to the build's cgroup, so it never takes from the runner's share.
          zswap=/sys/module/zswap/parameters
          if [[ -e "$zswap/enabled" ]]; then
            echo 35 | sudo tee "$zswap/max_pool_percent" >/dev/null || true
            echo 1 | sudo tee "$zswap/enabled" >/dev/null || true
            echo "zswap: enabled $(cat "$zswap/enabled"), pool $(cat "$zswap/max_pool_percent") %, $(cat "$zswap/compressor")"
          fi
          # kswapd starts reclaiming earlier (a gap of 2 % of memory, about 320 MiB, between its
          # watermarks instead of 0.1 %), so a process that needs a page finds a free one rather
          # than reclaiming one itself while the build holds the disk.
          sudo sysctl -q -w vm.watermark_scale_factor=200 || true
          # The runner's own processes are the last the OOM killer may take; build-services.sh
          # makes the build the first.
          for pid in $(pgrep -f 'Runner\.(Listener|Worker)|hosted-compute-agent|provjobd' || true); do
            echo -1000 | sudo tee "/proc/$pid/oom_score_adj" >/dev/null && echo "protected $(ps -o comm= -p "$pid") ($pid)" || true
          done
          # Services the job never uses, whose memory the runner's share below would carry.
          sudo systemctl stop docker.socket docker.service containerd.service 'php*-fpm.service' 2>/dev/null || true
          # The build's own cgroup. Its memory.high is the runner's memory less 2.5 GiB: above
          # it, the kernel reclaims and swaps the build's own pages and slows the build down,
          # and never reaches for the runner's. The runner and the system need about 0.9 GiB
          # (free, after free-disk.sh), so the agent keeps more than 1 GiB to spare however hard
          # the build swaps. The build's kernel memory, page cache and zswap pool count toward
          # it too. There is no memory.max: past memory.high the build waits, it is not killed,
          # and build-services.sh stops an analysis that waits too long. build-services.sh moves
          # soong_ui into it (DSA_BUILD_CGROUP), and nothing else: its per-minute report and the
          # step's own shell stay in the runner's share, so they still print when the build is
          # held back.
          cgroup=/sys/fs/cgroup/dsa-build
          grep -qw memory /sys/fs/cgroup/cgroup.controllers \
            || { echo "::error::this runner has no cgroup v2 memory controller, so the build cannot be kept off the runner's memory"; exit 1; }
          grep -qw memory /sys/fs/cgroup/cgroup.subtree_control \
            || echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          sudo mkdir -p "$cgroup"
          total_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          high=$(( (total_kib - 2621440) * 1024 ))
          echo "$high" | sudo tee "$cgroup/memory.high" >/dev/null
          echo "DSA_BUILD_CGROUP=$cgroup" >> "$GITHUB_ENV"
          echo "the build runs in $cgroup, held to $(( high >> 20 )) MiB of $(( total_kib >> 10 )) MiB"
          # Where the runner itself runs, and what limits that cgroup has, for the next failure.
          for pid in $(pgrep -f 'Runner\.Listener' || true); do
            runner_cgroup="/sys/fs/cgroup$(cut -d: -f3- "/proc/$pid/cgroup" 2>/dev/null || true)"
            echo "Runner.Listener ($pid) runs in $runner_cgroup: memory.high $(cat "$runner_cgroup/memory.high" 2>/dev/null || echo ?), memory.max $(cat "$runner_cgroup/memory.max" 2>/dev/null || echo ?)"
          done

      - name: Install the build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends jq

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Read the pins
        id: pins
        run: echo "version=$(uv run dsa/guest/framework/framework_lock.py version "$ANDROID_BRANCH")" >> "$GITHUB_OUTPUT"

      - name: Fetch the whole pinned tree
        run: |
          start=$SECONDS
          url="$(jq -r --arg a "$ANDROID_BRANCH" '.versions[] | select(.android == $a) | .manifest.url' dsa/guest/framework/framework-lock.json)"
          curl -fsSL --retry 8 --retry-all-errors -o "$RUNNER_TEMP/manifest.xml" "$url"
          uv run dsa/guest/framework/framework_lock.py services-lock "$ANDROID_BRANCH" "$RUNNER_TEMP/manifest.xml" "$RUNNER_TEMP/services-lock.json"
          uv run .github/scripts/translator/fetch-source.py --lock "$RUNNER_TEMP/services-lock.json" \
            --android "$ANDROID_BRANCH" --top "$DSA_TRANSLATOR_WORK/aosp" --jobs 8
          echo "fetched in $(( (SECONDS - start) / 60 )) minutes"
          # The tree leaves the VNDK snapshots out (SERVICES_TREE_SKIPPED), but the board
          # configuration stops with "VNDK version 31 not found" unless each version the product
          # names (PRODUCT_EXTRA_VNDK_VERSIONS) has a build file one folder down
          # (board_config.mk: $(wildcard prebuilts/vndk/v<n>/*/Android.bp)). An empty
          # Android.bp, which defines no module, satisfies that check; the build allows the
          # modules the snapshot would define to be missing.
          { grep -o 'path="prebuilts/vndk/[^"]*"' "$RUNNER_TEMP/manifest.xml" || true; } | cut -d'"' -f2 | sort -u |
            while read -r vndk; do
              mkdir -p "$DSA_TRANSLATOR_WORK/aosp/$vndk/x86_64"
              echo "// Left out of the services.jar tree; this file only passes the VNDK check." \
                > "$DSA_TRANSLATOR_WORK/aosp/$vndk/x86_64/Android.bp"
              echo "stub $vndk"
            done
          du -sh "$DSA_TRANSLATOR_WORK/aosp"
          echo "::group::The largest folders of the tree"
          du -x -h -d 3 "$DSA_TRANSLATOR_WORK/aosp" 2>/dev/null | sort -rh | head -60 || true
          echo "::endgroup::"
          df -h / /mnt

      # build-services.sh stops itself after DSA_BUILD_MINUTES, before the step's limit, so that
      # a build out of time says so; it also says when it ran out of disk or memory.
      # DSA_SERVICES_JOBS is ninja's job count: build-services.sh says why 2 and not the runner's 4.
      # DSA_ANALYSIS_MINUTES bounds the analysis alone: android16's takes 8 to 11 minutes and
      # android17's 19 to 23. It was 45, to stop the analysis while the runner still answered;
      # with the build in its own cgroup the runner answers however long the analysis takes, so
      # the bound now only keeps a slower analysis (it has less memory than before) and the
      # Java build after it (up to 92 minutes so far) within DSA_BUILD_MINUTES.
      - name: Build services.jar
        timeout-minutes: 300
        env:
          DSA_BUILD_MINUTES: 285
          DSA_ANALYSIS_MINUTES: 90
          DSA_SERVICES_JOBS: 2
        run: |
          start=$SECONDS
          .github/scripts/framework/build-services.sh "$DSA_TRANSLATOR_WORK/aosp" "$ANDROID_BRANCH" "$DSA_TRANSLATOR_WORK/services"
          echo "built in $(( (SECONDS - start) / 60 )) minutes"
          df -h / /mnt

      - name: Keep services.jar
        uses: actions/upload-artifact@v4
        with:
          name: framework-services-${{ matrix.android }}-${{ steps.pins.outputs.version }}
          path: ${{ env.DSA_TRANSLATOR_WORK }}/services/
          if-no-files-found: error
          retention-days: 90

      - name: Keep the build's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-services-logs-${{ matrix.android }}
          path: |
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/error.log
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/soong.log
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/verbose.log*
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/out/soong_ui.log*
            ${{ env.DSA_TRANSLATOR_WORK }}/aosp/.dsa-patches.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 30

  # The artifact the image release takes: the native files, with services.jar when the services
  # build made it. Should that build fail, the artifact has no services.jar, and make-image.py
  # edits the published build's as before; the dialogs of that image keep the caption bar inset.
  # Should the native build of this version and architecture fail, this job fails too and keeps
  # nothing. release-image.yml looks for this job by its name.
  framework:
    name: Pack the framework files (ubuntu-24.04, ${{ matrix.android }}, ${{ matrix.arch }})
    needs: [versions, native, services]
    if: ${{ !cancelled() && needs.versions.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        android: ${{ fromJSON(needs.versions.outputs.android) }}
        arch: ${{ fromJSON(needs.versions.outputs.arch) }}
    env:
      ANDROID_BRANCH: ${{ matrix.android }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Read the pins
        id: pins
        run: echo "version=$(uv run dsa/guest/framework/framework_lock.py version "$ANDROID_BRANCH")" >> "$GITHUB_OUTPUT"

      - name: Download the native files
        id: native
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: framework-native-${{ matrix.android }}-${{ matrix.arch }}-${{ steps.pins.outputs.version }}
          path: ${{ runner.temp }}/framework

      - name: Check the native build kept its files
        if: steps.native.outcome != 'success'
        run: |
          echo "::error::the native build of $ANDROID_BRANCH for ${{ matrix.arch }} kept no files; its job, \"Build the native framework (ubuntu-24.04, $ANDROID_BRANCH, ${{ matrix.arch }})\", says why"
          exit 1

      - name: Download services.jar
        id: services
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: framework-services-${{ matrix.android }}-${{ steps.pins.outputs.version }}
          path: ${{ runner.temp }}/services

      - name: Add services.jar to the native files
        id: collect
        env:
          HAVE_SERVICES: ${{ steps.services.outcome == 'success' }}
        run: |
          out="$RUNNER_TEMP/framework"
          if [[ "$HAVE_SERVICES" == true ]]; then
            uv run dsa/guest/framework/collect.py --add-services "$RUNNER_TEMP/services" --out "$out"
          else
            echo "::warning::the services build made no services.jar, so the image edits the published build's and its dialogs keep the caption bar inset"
          fi
          find "$out" -type f -exec ls -l {} +
          echo "out=$out" >> "$GITHUB_OUTPUT"

      - name: Keep the framework files
        uses: actions/upload-artifact@v4
        with:
          name: framework-${{ matrix.android }}-${{ matrix.arch }}-${{ steps.pins.outputs.version }}
          path: ${{ steps.collect.outputs.out }}/
          if-no-files-found: error
          # Re-running a failed native job re-runs every framework job after it, the passed ones
          # too, which keep the same files again.
          overwrite: true
          retention-days: 90
