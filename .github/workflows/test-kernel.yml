# Builds the guest kernel for x86_64 and arm64: the WSL kernel source at the tag in
# dsa/kernel/wsl-kernel.tag, configured with Microsoft/config-wsl (x86_64, bzImage) or
# Microsoft/config-wsl-arm64 (arm64, Image) plus dsa/kernel/android.config, and for arm64
# dsa/kernel/android-arm64.config.
#
# The build takes tens of minutes, so it runs when the kernel inputs change, by hand, and
# once a week to notice a newer WSL kernel tag.

name: Kernel test

on:
  pull_request:
    paths:
      - "dsa/kernel/**"
      - ".github/workflows/test-kernel.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "A WSL kernel tag to build instead of the pinned one, to try a newer tag"
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: kernel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build the guest kernel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: bzImage
            artifact: guest-kernel-x86_64
          # A native arm64 runner; build.sh cross-compiles with aarch64-linux-gnu- on any
          # other machine.
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: Image
            artifact: kernel-arm64
    env:
      DSA_KERNEL_ARCH: ${{ matrix.arch }}
      DSA_KERNEL_OUT: ${{ github.workspace }}/.scratch/kernel-out-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the kernel build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential flex bison bc dwarves libssl-dev libelf-dev cpio file

      - name: Use the requested tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: echo "${{ inputs.tag }}" > dsa/kernel/wsl-kernel.tag

      - name: Test the kernel configuration
        run: python3 dsa/kernel/test_android_config.py

      - name: Configure and check the fragments
        run: dsa/kernel/build.sh --config-only

      - name: Test the merged configuration
        run: |
          DSA_KERNEL_MERGED_CONFIG="$(ls "$DSA_KERNEL_OUT"/config-*)" \
            python3 dsa/kernel/test_android_config.py

      - name: Build
        run: dsa/kernel/build.sh

      - name: Check the kernel image
        run: |
          image="$(ls "$DSA_KERNEL_OUT"/${{ matrix.image }}-*)"
          file "$image"
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            # Hyper-V's UEFI firmware starts the image as an EFI application, so it must be
            # a PE image (MZ) that also carries the arm64 Image magic (ARM\x64 at offset 56).
            [[ "$(head -c 2 "$image")" == MZ ]] || { echo "::error::$image has no EFI stub"; exit 1; }
            magic="$(dd if="$image" bs=1 skip=56 count=4 status=none | od -An -tx1 | tr -d ' \n')"
            [[ "$magic" == 41524d64 ]] || { echo "::error::$image is not an arm64 Image ($magic)"; exit 1; }
          fi

      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.DSA_KERNEL_OUT }}/
          if-no-files-found: error

  newer-tag:
    name: Check for a newer WSL kernel tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pinned tag with the newest one
        run: |
          pinned="$(tr -d '[:space:]' < dsa/kernel/wsl-kernel.tag)"
          newest="$(git ls-remote --tags https://github.com/microsoft/WSL2-Linux-Kernel 'linux-msft-wsl-*' \
            | sed -E 's#.*refs/tags/##; s#\^\{\}$##' | sort -uV | tail -1)"
          echo "pinned: $pinned"
          echo "newest: $newest"
          if [[ "$pinned" != "$newest" ]]; then
            echo "::warning::A newer WSL kernel tag exists: $newest (pinned: $pinned). Run this workflow with tag=$newest, then update dsa/kernel/wsl-kernel.tag."
          fi
