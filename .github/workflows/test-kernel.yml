# Builds the guest kernel for x86_64 and arm64: the WSL kernel source at the tag in
# dsa/kernel/wsl-kernel.tag, configured with Microsoft/config-wsl (x86_64, bzImage) or
# Microsoft/config-wsl-arm64 (arm64, Image) plus dsa/kernel/android.config, and for arm64
# dsa/kernel/android-arm64.config.
#
# The build takes tens of minutes, so it runs when the kernel inputs change, by hand, and
# once a week to notice a newer WSL kernel tag. A kernel built from the same inputs before
# (the same dsa/kernel/, merged configuration and build tools) comes from the cache instead
# (.github/actions/guest-kernel); the configuration is still merged and tested every time.

name: Kernel test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  # Paused by the owner's decision (2026-11-14): while memory and resizing are fixed on
  # the owner's PC, tests run only by hand (workflow_dispatch), so a push to develop does
  # not take the runners the Development and Framework builds wait for. Uncomment to resume.
  # push:
  #   branches: [develop]
  #   paths:
  #     - "dsa/kernel/**"
  #     - ".github/workflows/test-kernel.yml"
  #     - ".github/actions/guest-kernel/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "A WSL kernel tag to build instead of the pinned one, to try a newer tag"
        required: false
        default: ""
  # Checks (checks.yml) runs it as one of its jobs, with every other test, in one run.
  workflow_call:
    inputs:
      tag:
        description: "A WSL kernel tag to build instead of the pinned one, to try a newer tag"
        type: string
        required: false
        default: ""
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  # A run in progress always finishes, and only the newest waiting run stays: GitHub keeps
  # one pending run per group, so a newer run replaces the one still waiting, and the newest
  # tests everything the dropped ones held. The group is the workflow and the branch (or
  # the pull request), never the run, so manual runs replace each other too. Called from
  # Checks, github.workflow names Checks, so a Checks run neither waits on nor replaces a
  # run started on its own.
  group: kernel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the guest kernel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: bzImage
            artifact: guest-kernel-x86_64
          # A native arm64 runner; build.sh cross-compiles with aarch64-linux-gnu- on any
          # other machine.
          - arch: arm64
            runner: ubuntu-24.04-arm
            image: Image
            artifact: kernel-arm64
    permissions:
      contents: read
      # Deletes the cached kernel a new one replaces.
      actions: write
    env:
      DSA_KERNEL_OUT: ${{ github.workspace }}/.scratch/kernel-out-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the requested tag
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        run: echo "${{ inputs.tag }}" > dsa/kernel/wsl-kernel.tag

      - name: Build the kernel, or take the one built from the same inputs
        uses: ./.github/actions/guest-kernel
        with:
          arch: ${{ matrix.arch }}
          out: ${{ env.DSA_KERNEL_OUT }}
          check-config: "true"
          save: ${{ github.ref == 'refs/heads/develop' }}
          token: ${{ github.token }}

      # On one runner only: the tag is the same for both kernels.
      - name: Check for a newer WSL kernel tag
        if: matrix.arch == 'x86_64'
        run: |
          pinned="$(tr -d '[:space:]' < dsa/kernel/wsl-kernel.tag)"
          newest="$(git ls-remote --tags https://github.com/microsoft/WSL2-Linux-Kernel 'linux-msft-wsl-*' \
            | sed -E 's#.*refs/tags/##; s#\^\{\}$##' | sort -uV | tail -1)"
          echo "pinned: $pinned"
          echo "newest: $newest"
          if [[ "$pinned" != "$newest" ]]; then
            echo "::warning::A newer WSL kernel tag exists: $newest (pinned: $pinned). Run this workflow with tag=$newest, then update dsa/kernel/wsl-kernel.tag."
          fi

      - name: Check the kernel image
        run: |
          image="$(ls "$DSA_KERNEL_OUT"/${{ matrix.image }}-*)"
          file "$image"
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            # Hyper-V's UEFI firmware starts the image as an EFI application, so it must be
            # a PE image (MZ) that also carries the arm64 Image magic (ARM\x64 at offset 56).
            [[ "$(head -c 2 "$image")" == MZ ]] || { echo "::error::$image has no EFI stub"; exit 1; }
            magic="$(dd if="$image" bs=1 skip=56 count=4 status=none | od -An -tx1 | tr -d ' \n')"
            [[ "$magic" == 41524d64 ]] || { echo "::error::$image is not an arm64 Image ($magic)"; exit 1; }
          fi

      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.DSA_KERNEL_OUT }}/
          if-no-files-found: error
