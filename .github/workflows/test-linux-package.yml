# Builds the Linux packages (.deb and .rpm) and checks them on real systems: the files and
# the systemd units are where they belong and valid, the package installs and removes on
# Ubuntu (the .deb) and Fedora (the .rpm), and the programs run, crosvm and passt among them,
# built from their pinned revisions with the licence check of everything crosvm links. The
# kernel and the Android
# image are built elsewhere, so the packages here carry a placeholder kernel and a small
# stand-in image laid out like a real one. The signed apt and dnf repositories the packages
# register are built too, with a throwaway key, and served locally, so the package manager
# is seen reading them.

name: Linux package test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  # Paused by the owner's decision (2026-11-14): while memory and resizing are fixed on
  # the owner's PC, tests run only by hand (workflow_dispatch), so a push to develop does
  # not take the runners the Development and Framework builds wait for. Uncomment to resume.
  # push:
  #   branches: [develop]
  #   paths:
  #     - "dsa/**"
  #     - ".github/workflows/test-linux-package.yml"
  #     - ".github/scripts/release/build-linux-repo.sh"
  #     - ".github/scripts/linux-vm/**"
  workflow_dispatch:
  # Checks (checks.yml) runs it as one of its jobs, with every other test, in one run.
  workflow_call:

concurrency:
  # A run in progress always finishes, and only the newest waiting run stays: GitHub keeps
  # one pending run per group, so a newer run replaces the one still waiting, and the newest
  # tests everything the dropped ones held. The group is the workflow and the branch (or
  # the pull request), never the run, so manual runs replace each other too. Called from
  # Checks, github.workflow names Checks, so a Checks run neither waits on nor replaces a
  # run started on its own.
  group: test-linux-package-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    name: Build the Linux packages (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: amd64 }
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Keep the VM programs between runs
        uses: actions/cache@v4
        with:
          path: .scratch/vm-programs
          key: linux-vm-programs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dsa/host/platform/linux/crosvm/**', 'dsa/graphics/host/**', 'dsa/graphics/patches/**', '.github/scripts/linux-vm/**') }}

      # Fails when anything crosvm links is GPL, LGPL or AGPL (check-licenses.py).
      - name: Build crosvm, passt and gfxstream's renderer, and check crosvm's licences
        run: bash .github/scripts/linux-vm/build-vm-programs.sh .scratch/vm-programs

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm desktop-file-utils gnupg dpkg-dev apt-utils createrepo-c appstream \
            libgtk-4-dev libadwaita-1-dev gettext libxml2-utils

      # A key made for this run only. The real one is a repository secret that only the
      # release workflow reads.
      - name: Make a throwaway repository key
        run: |
          export GNUPGHOME="$PWD/.scratch/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 0700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase throwaway \
            --quick-gen-key 'DSA test repository <test@invalid>' rsa3072 sign 1d
          gpg --batch --armor --export > .scratch/repo-key.asc
          gpg --batch --pinentry-mode loopback --passphrase throwaway \
            --armor --export-secret-keys > .scratch/repo-secret.asc
          gpgconf --kill all

      # The release build's dependencies come from this job's target folder of the last
      # develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: package-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Build the host programs
        working-directory: dsa
        run: cargo build --release -p dsa-cli -p dsa-host-linux -p dsa-settings-linux

      # The lock file the build resolved, so a dependency added without one can be checked
      # in from here.
      - name: Keep the resolved lock file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock-${{ matrix.arch }}
          path: dsa/Cargo.lock

      - name: Make the licence bundle with crosvm's crates
        run: |
          uv run dsa/host/platform/windows/installer/generate-licenses.py --workspace dsa \
            --out-dir .scratch/licenses --crosvm-crates .scratch/vm-programs/crosvm-crates.txt
          cp .scratch/vm-programs/libgfxstream_backend.so dsa/target/release/

      - name: Make a stand-in image
        run: |
          dir=.scratch/stand-in-image
          mkdir -p "$dir"
          printf 'a disk' > "$dir/disk.img"
          printf 'a ramdisk' > "$dir/initrd.img"
          printf 'AOSP stand-in notice' > "$dir/NOTICE.txt"
          cat > "$dir/image.json" <<'EOF'
          { "version": "17.0.0-1", "android_major": 17, "build": 1,
            "files": { "disk.img": {}, "initrd.img": {}, "NOTICE.txt": {} } }
          EOF

      - name: Build the packages
        run: |
          version="$(grep -m1 '^version' dsa/host/platform/linux/Cargo.toml | cut -d'"' -f2)"
          dsa/host/platform/linux/packaging/build-packages.sh \
            --bin-dir dsa/target/release --version "$version" --arch "${{ matrix.arch }}" \
            --placeholder-kernel --image-dir .scratch/stand-in-image --out .scratch/packages \
            --repo-key .scratch/repo-key.asc --repo-url http://127.0.0.1:8080 --channel stable \
            --vm-programs .scratch/vm-programs --licenses .scratch/licenses
          ls -l .scratch/packages
          # A first installation writes the entry of the package's channel, and an upgrade
          # keeps the channel the entry has: both channels' entries are in the scripts.
          grep -q 'Suites: stable' .scratch/packages/deb/DEBIAN/postinst
          grep -q 'Suites: prerelease' .scratch/packages/deb/DEBIAN/postinst
          grep -q '/rpm-prerelease/' .scratch/packages/rpmbuild/SPECS/dsa.spec
          grep -q '^channel=stable$' .scratch/packages/deb/DEBIAN/postinst

      - name: Check the package contents
        run: |
          set -x
          deb="$(ls .scratch/packages/*.deb)"
          rpm="$(ls .scratch/packages/*.rpm)"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | tee .scratch/deb-contents
          rpm -qlp "$rpm" | tee .scratch/rpm-contents
          for path in /usr/bin/dsa /usr/lib/dsa/bin/dsa /usr/lib/dsa/bin/dsa-devices \
              /usr/lib/dsa/bin/dsa-compositor /usr/lib/dsa/bin/dsa-gfx \
              /usr/lib/systemd/user/dsa-devices.service /usr/lib/udev/rules.d/70-dsa.rules \
              /usr/lib/modules-load.d/dsa.conf /usr/share/applications/dsa-open.desktop \
              /usr/share/applications/dsa-apk.desktop /etc/geoclue/conf.d/90-dsa.conf \
              /usr/share/mime/packages/io.github.thisisthepy.DSA.apk-bundles.xml \
              /etc/dsa/dsa-hostd.json /usr/lib/dsa/vm/image/image.json \
              /usr/lib/dsa/bin/crosvm /usr/lib/dsa/bin/passt /usr/lib/dsa/bin/libgfxstream_backend.so \
              /etc/apparmor.d/dsa-vm \
              /usr/share/polkit-1/actions/io.github.thisisthepy.DSA.policy \
              /usr/share/doc/desktop-subsystem-for-android/crosvm-crates.txt \
              /usr/share/doc/desktop-subsystem-for-android/passt-source.tar.gz \
              /usr/share/doc/desktop-subsystem-for-android/licenses/crosvm-crates.txt \
              /usr/share/metainfo/io.github.thisisthepy.DSA.metainfo.xml \
              /usr/lib/dsa/bin/dsa-settings \
              /usr/share/applications/io.github.thisisthepy.DSA.Settings.desktop \
              /usr/share/metainfo/io.github.thisisthepy.DSA.Settings.metainfo.xml \
              /usr/share/icons/hicolor/scalable/apps/io.github.thisisthepy.DSA.svg \
              /usr/share/icons/hicolor/symbolic/apps/io.github.thisisthepy.DSA-symbolic.svg \
              /usr/share/icons/hicolor/scalable/apps/io.github.thisisthepy.DSA.Settings.svg \
              /usr/share/icons/hicolor/symbolic/apps/io.github.thisisthepy.DSA.Settings-symbolic.svg \
              /usr/share/icons/hicolor/scalable/apps/io.github.thisisthepy.DSA.ApkInstaller.svg \
              /usr/share/icons/hicolor/symbolic/apps/io.github.thisisthepy.DSA.ApkInstaller-symbolic.svg \
              /usr/share/icons/hicolor/scalable/apps/io.github.thisisthepy.DSA.Files.svg \
              /usr/share/icons/hicolor/symbolic/apps/io.github.thisisthepy.DSA.Files-symbolic.svg \
              /usr/share/locale/ko/LC_MESSAGES/dsa-settings.mo; do
            grep -q "\.$path\$\|\.$path -> " .scratch/deb-contents || { echo "the .deb has no $path"; exit 1; }
            grep -qx "$path" .scratch/rpm-contents || { echo "the .rpm has no $path"; exit 1; }
          done
          case "${{ matrix.arch }}" in
            amd64) kernel=/usr/lib/dsa/vm/bzImage ;;
            arm64) kernel=/usr/lib/dsa/vm/Image ;;
          esac
          grep -qx "$kernel" .scratch/rpm-contents
          grep -q '\./usr/share/keyrings/dsa-archive-keyring.gpg$' .scratch/deb-contents
          grep -qx /etc/pki/rpm-gpg/RPM-GPG-KEY-dsa .scratch/rpm-contents
          # The repository entry is written by the scripts, not shipped as a file, so a
          # removal cannot leave it behind as a conffile.
          ! grep -q 'sources.list.d\|yum.repos.d' .scratch/deb-contents .scratch/rpm-contents
          appstreamcli validate --no-net \
            .scratch/packages/stage/usr/share/metainfo/io.github.thisisthepy.DSA.metainfo.xml
          for desktop in dsa/host/platform/linux/packaging/desktop/*.desktop; do
            desktop-file-validate "$desktop"
          done
          # The polkit action is well formed, as polkit drops a file it cannot read.
          xmllint --noout \
            .scratch/packages/stage/usr/share/polkit-1/actions/io.github.thisisthepy.DSA.policy
          python3 -c "import json,sys; json.load(open('.scratch/packages/stage/etc/dsa/dsa-hostd.json'))"

      - name: Build the signed repositories
        id: repos
        run: |
          DSA_REPO_GPG_KEY="$(cat .scratch/repo-secret.asc)" DSA_REPO_GPG_PASSPHRASE=throwaway \
            .github/scripts/release/build-linux-repo.sh \
            --packages .scratch/packages --out .scratch/linux-repo
          find .scratch/linux-repo -type f | sort
          test -f .scratch/linux-repo/apt/dists/stable/InRelease
          test -f .scratch/linux-repo/apt/dists/stable/Release.gpg
          test -f .scratch/linux-repo/apt/dists/stable/main/binary-${{ matrix.arch }}/Packages.gz
          ls .scratch/linux-repo/rpm/*/repodata/repomd.xml.asc
          gpgv --keyring "$PWD/.scratch/linux-repo/dsa-archive-keyring.gpg" \
            .scratch/linux-repo/apt/dists/stable/InRelease
          # The pre-release channel carries the stable packages too.
          test -f .scratch/linux-repo/apt/dists/prerelease/InRelease
          gpgv --keyring "$PWD/.scratch/linux-repo/dsa-archive-keyring.gpg" \
            .scratch/linux-repo/apt/dists/prerelease/InRelease
          zgrep -q '^Package: desktop-subsystem-for-android$' \
            .scratch/linux-repo/apt/dists/prerelease/main/binary-${{ matrix.arch }}/Packages.gz
          ls .scratch/linux-repo/rpm-prerelease/*/repodata/repomd.xml.asc

      - name: Install the .deb, check it, and remove it
        run: |
          set -x
          (cd .scratch/linux-repo && python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sudo apt-get install -y "./$(ls .scratch/packages/*.deb)"
          # The package registered DSA's repository with its key, and apt trusts it.
          cat /etc/apt/sources.list.d/dsa.sources
          grep -qx 'Signed-By: /usr/share/keyrings/dsa-archive-keyring.gpg' /etc/apt/sources.list.d/dsa.sources
          test -f /usr/share/keyrings/dsa-archive-keyring.gpg
          sudo apt-get update 2>&1 | tee .scratch/apt-update
          ! grep -qi 'NO_PUBKEY\|not signed\|BADSIG\|127.0.0.1.*Err' .scratch/apt-update
          apt-cache policy desktop-subsystem-for-android | tee .scratch/apt-policy
          grep -q '127.0.0.1:8080/apt stable/main' .scratch/apt-policy
          # Choosing pre-releases the way a user does, through the service, points the entry
          # at the pre-release suite. Editing the entry by hand would not do: the service
          # brings the entries back in line with its setting whenever it starts, and the
          # package's scripts restart it on every upgrade.
          if [ -d /run/systemd/system ] && systemctl is-enabled dsa-hostd.service >/dev/null 2>&1; then
            for _ in $(seq 30); do
              sudo dsa settings set prerelease-updates on && break
              sleep 1
            done
            sudo dsa settings --json | grep -q '"prerelease_updates": *true'
          else
            sudo sed -i 's/^Suites: stable$/Suites: prerelease/' /etc/apt/sources.list.d/dsa.sources
          fi
          grep -qx 'Suites: prerelease' /etc/apt/sources.list.d/dsa.sources
          sudo apt-get update 2>&1 | tee .scratch/apt-update-prerelease
          ! grep -qi 'NO_PUBKEY\|not signed\|BADSIG\|127.0.0.1.*Err' .scratch/apt-update-prerelease
          apt-cache policy desktop-subsystem-for-android | grep -q '127.0.0.1:8080/apt prerelease/main'
          # An upgrade keeps the entry; only a removal takes it away.
          sudo apt-get install -y --reinstall "./$(ls .scratch/packages/*.deb)"
          test -f /etc/apt/sources.list.d/dsa.sources
          grep -qx 'Suites: prerelease' /etc/apt/sources.list.d/dsa.sources
          dsa --version || dsa --help || true
          test -x /usr/lib/dsa/bin/dsa-devices
          /usr/lib/dsa/bin/dsa-devices --version
          /usr/lib/dsa/bin/crosvm version
          /usr/lib/dsa/bin/passt --version
          # polkit reads the action the package installed, where the runner has polkit.
          if command -v pkaction >/dev/null; then
            pkaction --action-id io.github.thisisthepy.DSA.root-elevation --verbose
          fi
          ! dpkg-deb --field "$(ls .scratch/packages/*.deb)" Depends | grep -qi qemu
          systemd-analyze verify /usr/lib/systemd/user/dsa-devices.service
          if [ -f /usr/lib/systemd/system/dsa-hostd.service ]; then
            systemd-analyze verify /usr/lib/systemd/system/dsa-hostd.service
          fi
          udevadm verify /usr/lib/udev/rules.d/70-dsa.rules || udevadm test /dev/null >/dev/null 2>&1 || true
          sudo apt-get remove -y desktop-subsystem-for-android
          test ! -e /usr/lib/dsa/bin/dsa
          test ! -e /usr/bin/dsa
          test ! -e /etc/apt/sources.list.d/dsa.sources
          test ! -e /usr/share/keyrings/dsa-archive-keyring.gpg

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            .scratch/packages/*.deb
            .scratch/packages/*.rpm

      - name: Keep the repositories
        uses: actions/upload-artifact@v4
        with:
          name: linux-repo-${{ matrix.arch }}
          path: .scratch/linux-repo
          include-hidden-files: true

      # On Fedora, in a container on this runner: the packages and the repositories are
      # already here, so no second runner downloads them again.
      - name: Install the .rpm, check it, and remove it (fedora 41)
        if: ${{ !cancelled() && steps.repos.outcome == 'success' }}
        run: |
          cat > "$RUNNER_TEMP/rpm-check.sh" <<'SCRIPT'
          set -x
          dnf install -y python3
          (cd linux-repo && python3 -m http.server 8080 --bind 127.0.0.1 >/dev/null 2>&1 &)
          dnf install -y ./packages/*.rpm
          # The package registered DSA's repository; dnf reads it, checking the signed
          # metadata and the signed packages with the key the package installed.
          cat /etc/yum.repos.d/dsa.repo
          grep -qx 'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-dsa' /etc/yum.repos.d/dsa.repo
          grep -qx 'repo_gpgcheck=1' /etc/yum.repos.d/dsa.repo
          dnf -y makecache --repo=dsa
          dnf -y --repo=dsa repoquery desktop-subsystem-for-android | tee repoquery
          grep -q desktop-subsystem-for-android repoquery
          rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-dsa
          rpm -K linux-repo/rpm/*/*.rpm | tee rpm-check
          grep -q 'digests signatures OK' rpm-check
          dnf -y reinstall --repo=dsa desktop-subsystem-for-android
          test -f /etc/yum.repos.d/dsa.repo
          # Pointed at the pre-release repository, dnf reads it, and an upgrade keeps it. The
          # container runs no service, so the package's scripts alone keep the channel here.
          sed -i 's|/rpm/|/rpm-prerelease/|' /etc/yum.repos.d/dsa.repo
          dnf -y makecache --repo=dsa
          dnf -y --repo=dsa repoquery desktop-subsystem-for-android | grep -q desktop-subsystem-for-android
          dnf -y reinstall --repo=dsa desktop-subsystem-for-android
          grep -q '/rpm-prerelease/' /etc/yum.repos.d/dsa.repo
          /usr/lib/dsa/bin/dsa-devices --version
          /usr/lib/dsa/bin/crosvm version
          /usr/lib/dsa/bin/passt --version
          test -L /usr/bin/dsa
          test -f /usr/lib/systemd/user/dsa-devices.service
          rpm -V desktop-subsystem-for-android
          dnf remove -y desktop-subsystem-for-android
          test ! -e /usr/lib/dsa/bin/dsa
          test ! -e /etc/yum.repos.d/dsa.repo
          test ! -e /etc/pki/rpm-gpg/RPM-GPG-KEY-dsa
          SCRIPT
          # bash -e, the shell a run step in a fedora:41 job container has.
          docker run --rm -w / \
            -v "$PWD/.scratch/packages:/packages:ro" \
            -v "$PWD/.scratch/linux-repo:/linux-repo:ro" \
            -v "$RUNNER_TEMP/rpm-check.sh:/rpm-check.sh:ro" \
            fedora:41 bash -e /rpm-check.sh
