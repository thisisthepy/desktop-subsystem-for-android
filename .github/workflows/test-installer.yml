# Builds the Windows installer and checks it on a real Windows machine: takes pictures of
# setup.exe's screens, installs the package, checks the service and the dsa command, lets
# the service update DSA to a newer version from a signed program list, and uninstalls;
# then does the same through setup.exe, quietly and through its screens. The
# kernel and the Android image are built elsewhere, so the package here carries a
# placeholder kernel and a small stand-in image laid out like a real one.
#
# It runs for both platforms: the x64 package on Windows Server 2022 and 2025, and the
# arm64 package on an ARM64 Windows 11 runner. The arm64 package's kernel is named Image
# (the arm64 kernel build's name for it) and its programs are built for
# aarch64-pc-windows-msvc.

name: Installer test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  push:
    branches: [develop]
    paths:
      - "dsa/**"
      - ".github/workflows/test-installer.yml"
      - ".github/scripts/installer/**"
  workflow_dispatch:

concurrency:
  # On develop a run in progress finishes and only the newest waiting run stays: GitHub
  # keeps one pending run per group, so a newer merge replaces the one still waiting.
  # The newest run tests everything the dropped ones held. Anywhere else, such as a pull
  # request, a newer run still replaces the older one.
  group: test-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

jobs:
  installer:
    name: Build, install and uninstall the installer (windows, ${{ matrix.version }}, ${{ matrix.arch }})
    # Server 2022 (build 20348) has the Windows 10 window manager, so setup shows its
    # solid background and square corners there; Server 2025 (build 26100) has the
    # Windows 11 one, with Mica and rounded corners.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "2022", arch: x64, kernel: bzImage, target: x86_64-pc-windows-msvc }
          - { version: "2025", arch: x64, kernel: bzImage, target: x86_64-pc-windows-msvc }
          - { version: 11-arm, arch: arm64, kernel: Image, target: aarch64-pc-windows-msvc }
    runs-on: windows-${{ matrix.version }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    # Somewhere other than the defaults, with spaces, so that the folders chosen at
    # installation are known to reach the service.
    env:
      PROGRAM_DIR: 'C:\DSA Test\Program'
      DATA_DIR: 'C:\DSA Test\Data'
      DSA_ARCH: ${{ matrix.arch }}
      KERNEL_NAME: ${{ matrix.kernel }}
      RUST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4

      # The ARM64 runner image does not always carry these, so they are set up here.
      - name: Set up Rust for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Set up .NET 8 for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release build's dependencies come from this job's target folder of the last
      # develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: installer-${{ matrix.version }}-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Check that this is the machine the package is for
        run: |
          $native = if ($env:PROCESSOR_ARCHITEW6432) { $env:PROCESSOR_ARCHITEW6432 } else { $env:PROCESSOR_ARCHITECTURE }
          Write-Host "runner processor: $native, package: $env:DSA_ARCH"
          if (($env:DSA_ARCH -eq 'arm64') -ne ($native -eq 'ARM64')) { throw "the $env:DSA_ARCH package is tested on a $native runner" }

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix --version

      - name: Make a stand-in image
        run: |
          $dir = New-Item -ItemType Directory -Force .scratch\stand-in-image
          Set-Content -Path "$dir\disk.vhdx" -Value "a disk" -NoNewline
          Set-Content -Path "$dir\initrd.img" -Value "a ramdisk" -NoNewline
          Set-Content -Path "$dir\$env:KERNEL_NAME" -Value "a kernel" -NoNewline
          Set-Content -Path "$dir\NOTICE.txt" -Value "AOSP stand-in notice" -NoNewline
          @{ version = "17.0.0-1"; android_major = 17; build = 1; kernel_cmdline = "console=ttyS0";
             files = @{ "disk.vhdx" = @{}; "initrd.img" = @{}; "$env:KERNEL_NAME" = @{}; "NOTICE.txt" = @{} } } |
            ConvertTo-Json -Depth 4 | Set-Content -Path "$dir\image.json"

      # The lists the installed service reads are files in this folder, signed with a key
      # made for this run.
      - name: Make a signing key and a folder for the lists
        run: |
          Push-Location dsa
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if ($LASTEXITCODE -ne 0) { throw "building dsa-release failed" }
          Pop-Location
          $mirror = (New-Item -ItemType Directory -Force .scratch\update-mirror).FullName
          $public = & dsa\target\release\dsa-release.exe keygen "$mirror\..\test-release.key"
          if ($LASTEXITCODE -ne 0) { throw "making the key failed" }
          "MIRROR=$mirror" >> $env:GITHUB_ENV
          "TEST_PUBLIC_KEY=$public" >> $env:GITHUB_ENV

      # The runner's account is not an interactive user, which the default pipe access
      # would not admit, so the test build also admits authenticated users.
      - name: Build the package and setup.exe
        run: >
          dsa/host/platform/windows/installer/build.ps1 -Version 0.0.9 -PlaceholderKernel -Arch $env:DSA_ARCH
          -ImageDir .scratch\stand-in-image -AndroidMajor 17
          -PipeSddl "D:P(A;;GA;;;SY)(A;;GRGW;;;IU)(A;;GRGW;;;AU)"
          -ListUrl "$env:MIRROR\images.json" -TrustedKey $env:TEST_PUBLIC_KEY
          -ProgramListUrl "$env:MIRROR\program.json"

      # The setting that turns Windows 11's three- and four-finger touch gestures off while a
      # task window is in front: with the gestures on and the setting turned on through the
      # local API, a task window in front makes SystemParametersInfo 0x2030 read 0, another
      # window in front makes it read the user's value again, and so does the window manager
      # stopping. The test puts the gestures back as it found them. Server 2022 has no such
      # gestures, so the test is left out there.
      - name: fr5_touch_gestures_are_off_only_while_a_task_window_is_in_front
        if: matrix.version != '2022'
        working-directory: dsa
        run: |
          cargo test --release --target $env:RUST_TARGET -p dsa-host-windows --test task_windows -- --ignored --test-threads 1 --nocapture real_input::fr5_real_touch_gestures_are_off_only_while_a_task_window_is_in_front
          if ($LASTEXITCODE -ne 0) { throw "the touch gestures were not off only while a task window was in front" }

      # Fingers and a pen put into this machine's input with Windows' synthetic pointer
      # devices, on a task window opened over a fake Android: ten fingers and a pinch reach
      # the task as ten touch pointers, a pen with its pressure, barrel button and eraser, and
      # a finger on the title bar's minimize button minimizes the window. They move the real
      # input, so they are ignored on a developer's machine and run here, where nobody uses
      # the desktop. The release build above already holds most of what they need.
      #
      # With Windows 11's three- and four-finger touch gestures on (Settings, Bluetooth &
      # devices, Touch), Windows keeps three or more fingers from every app: on the Windows 11
      # and Server 2025 runners not one of ten fingers reached the task window, while one finger
      # did, held back until it lifted. Server 2022 has no such gestures and passed. The
      # gestures are turned off for the runner's user, as a user who wants such gestures in
      # apps turns them off. Writing the registry alone takes effect only at the next sign-in,
      # so the script sets them the way Settings does and checks they are off; the shell is
      # then started again so it reads the setting too.
      #
      # DSA_INPUT_TRACE makes each task window log every touch and pen contact that comes
      # down or up in it, so a run that loses fingers says whether Windows delivered them to
      # the window at all.
      - name: fr5_real_fingers_and_a_pen_reach_a_task_window_as_touch_and_a_pen
        working-directory: dsa
        env:
          DSA_INPUT_TRACE: "1"
        run: |
          & ../.github/scripts/installer/touch-gestures-off.ps1
          Get-Process WWAHost, StartMenuExperienceHost -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "running before the tests: $($_.ProcessName) ($($_.Id)) '$($_.MainWindowTitle)'" }
          Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          if (-not (Get-Process explorer -ErrorAction SilentlyContinue)) { Start-Process explorer.exe; Start-Sleep -Seconds 5 }
          cargo test --release --target $env:RUST_TARGET -p dsa-host-windows --test task_windows -- --ignored --test-threads 1 --nocapture real_input --skip fr5_real_touch_gestures
          if ($LASTEXITCODE -ne 0) { throw "touch or pen input on a task window did not reach its task" }

      # The Android VM's network made through this machine's Host Compute Network, as the
      # service makes it: the NAT network and its endpoint are removed when the VM stops,
      # when its start fails and when the service lets go of it; a network left by a service
      # that ended uncleanly is used again, and one left from moving the VM is removed. No
      # guest boots here, so the routes are checked from the host's side: the guest's default
      # route is an address of this computer on its adapter for the network (so the guest's
      # traffic follows this computer's routes, a VPN's included), and this computer sends to
      # the guest's address through that adapter. HCN needs the Host Network Service; a runner
      # image without it says so in a warning.
      - name: fr28_the_vms_network_is_removed_when_it_stops_and_the_host_reaches_the_guest
        working-directory: dsa
        run: |
          $hns = Get-Service hns -ErrorAction SilentlyContinue
          if (-not $hns) {
            Write-Host "::warning::this runner has no Host Network Service, so the VM's network is not checked here"
            exit 0
          }
          Write-Host "Host Network Service: $($hns.Status)"
          cargo test --release --target $env:RUST_TARGET -p dsa-host-windows --test hcn_network -- --ignored --test-threads 1 --nocapture
          if ($LASTEXITCODE -ne 0) { throw "the VM's network was not made, removed or routed as it must be" }
          # Windows takes the host's adapter of a removed network away shortly after.
          $deadline = (Get-Date).AddSeconds(20)
          do {
            $left = Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue | Where-Object Name -like 'vEthernet (DSA dsa-test-fr28*'
            if (-not $left) { break }
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ($left) { throw "host adapters of the test networks are left: $($left.Name -join ', ')" }

      # Nothing is installed yet, so setup.exe opens on its first screen. Pictures of it in
      # the light and the dark theme, of Change, and of the command line help.
      - name: Take pictures of setup.exe's first screens
        run: |
          # What decides the window's look: the display adapter and the transparency setting.
          Get-CimInstance Win32_VideoController | ForEach-Object { Write-Host "display adapter: $($_.Name)" }
          $personalize = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' -ErrorAction SilentlyContinue
          Write-Host "EnableTransparency: $($personalize.EnableTransparency)"
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            $setup = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -ArgumentList '/log', "$PWD\first-$theme.log" -PassThru
            $null = $setup.Handle
            # The first start on a fresh runner can take minutes (the 2025 image took 130 seconds
            # to show its window), so the first screen gets longer than later ones.
            Wait-SetupControl InstallButton -Enabled -Seconds 300 | Out-Null
            Save-SetupScreen "$PWD\screens\$theme-install.png"
            $publisher = Get-SetupText HeroPublisher
            if ($publisher -cne 'ThisIsThePy') { throw "the first screen names the publisher '$publisher', not ThisIsThePy" }
            if ($theme -eq 'light') { Copy-Item "screens\light-install.png" setup-screen.png }
            Invoke-SetupButton ChangeButton
            Wait-SetupControl ProgramFolderBox | Out-Null
            Save-SetupScreen "$PWD\screens\$theme-change.png"
            # Before installation starts, the folders page goes back to the first screen.
            $back = Get-SetupText CancelButton
            if ($back -ne 'Back') { throw "the folders page offers '$back', not Back" }
            Invoke-SetupButton CancelButton
            Wait-SetupControl InstallButton -Enabled | Out-Null
            $cancel = Get-SetupText CancelButton
            if ($cancel -ne 'Cancel') { throw "the first screen offers '$cancel', not Cancel" }
            Invoke-SetupButton CancelButton
            $code = Wait-SetupExit $setup
            if ($code -ne 1602) { throw "closing setup.exe from its first screen returned $code, not 1602" }
          }
          Set-AppTheme
          $setup = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -ArgumentList '/?', '/log', "$PWD\first-help.log" -PassThru
          $null = $setup.Handle
          Wait-SetupControl CloseButton -Enabled | Out-Null
          Save-SetupScreen "$PWD\screens\light-help.png"
          Invoke-SetupButton CloseButton
          Wait-SetupExit $setup | Out-Null

      - name: Stage a user .wslconfig before installation
        run: |
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $content = "[wsl2]`r`nkernel=C:\Test\custom-kernel`r`nmemory=8GB`r`nprocessors=4`r`n"
          [System.IO.File]::WriteAllText($wslconfig, $content, [System.Text.Encoding]::UTF8)
          $hash = (Get-FileHash -Path $wslconfig -Algorithm SHA256).Hash
          "INITIAL_WSLCONFIG_HASH=$hash" >> $env:GITHUB_ENV

      - name: Install the package
        run: |
          # fr29: the "DSA Files" shortcut an earlier version left must go.
          $filesShortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\DSA Files.lnk"
          Set-Content $filesShortcut 'left by an earlier version'
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', 'dsa\target\installer\dsa-test-0.0.9.msi', '/qn', '/l*v', 'install.log', "INSTALLFOLDER=`"$env:PROGRAM_DIR`"", "DATAFOLDER=`"$env:DATA_DIR`""
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "install failed ($($p.ExitCode))" }
          if (Test-Path $filesShortcut) { throw "installing left the DSA Files Start menu shortcut, which Windows search finds" }

      - name: Check the service, the command and the access lists
        run: |
          $service = Get-Service DsaHost
          if ($service.Status -ne 'Running') { throw "DsaHost is $($service.Status)" }
          $entry = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Desktop Subsystem for Android (test package)' } | Select-Object -First 1
          if ($entry.Publisher -cne 'ThisIsThePy') { throw "the package names its publisher '$($entry.Publisher)', not ThisIsThePy" }
          $out = & "$env:PROGRAM_DIR\dsa.exe" status 2>&1
          Write-Host $out
          # The window manager starts a stopped Android at sign-in, so Android may already be
          # starting by the time status is asked for.
          if ($LASTEXITCODE -ne 0 -or -not ($out -match '^Android: (Stopped|Starting|Active|Dozing)')) { throw "dsa status: $out" }
          $acl = (Get-Acl $env:DATA_DIR).Sddl
          Write-Host $acl
          if ($acl -notmatch 'S-1-5-83-0') { throw "the VMs cannot read the data folder" }
          if ($acl -match ';;;BU\)') { throw "users can open the service's data folder" }
          $log = Get-Content "$env:DATA_DIR\logs\dsa-hostd.log"
          $log
          # The programs carry the release's version, which differs from the crates' here.
          if (-not ($log -match '^dsa-hostd 0\.0\.9:')) { throw "the service does not report the release's version" }
          # This package is only for testing the installer, and its service says so.
          if (-not ($log -match 'TEST PACKAGE')) { throw "the service of a test package does not say it is one" }
          # Asking for status made the service set up this user's Android, in their profile.
          if (-not (Test-Path "$env:LOCALAPPDATA\DSA")) { throw "no Android folder in the user's profile" }
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $currentHash = (Get-FileHash -Path $wslconfig -Algorithm SHA256).Hash
          if ($currentHash -ne $env:INITIAL_WSLCONFIG_HASH) { throw ".wslconfig was modified by installation or service startup" }

      # The settings app is installed with a Start menu shortcut, and the settings it shows
      # go through the service, which keeps them in its own folder.
      - name: fr17_settings_app_is_installed_and_settings_go_through_the_service
        run: |
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          if (-not (Test-Path $exe)) { throw "DsaSettings.exe is not installed in $env:PROGRAM_DIR\settings" }
          $info = (Get-Item $exe).VersionInfo
          Write-Host "DsaSettings.exe: $($info.FileDescription) | $($info.ProductName) | $($info.CompanyName) | $($info.ProductVersion)"
          if ($info.FileDescription -cne 'DSA Settings') { throw "DsaSettings.exe calls itself '$($info.FileDescription)'" }
          if ($info.ProductName -cne 'Desktop Subsystem for Android') { throw "DsaSettings.exe names its product '$($info.ProductName)'" }
          if ($info.ProductVersion -notlike '0.0.9*') { throw "DsaSettings.exe says it is version '$($info.ProductVersion)', not 0.0.9" }
          $shortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\DSA Settings.lnk"
          if (-not (Test-Path $shortcut)) { throw "there is no Start menu shortcut $shortcut" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut).TargetPath
          if ($target -ne $exe) { throw "the Start menu shortcut points at '$target', not $exe" }
          # The APK Installer is its own program beside it, with its own name and no shortcut.
          $installer = "$env:PROGRAM_DIR\settings\DsaApkInstaller.exe"
          if (-not (Test-Path $installer)) { throw "DsaApkInstaller.exe is not installed in $env:PROGRAM_DIR\settings" }
          $info = (Get-Item $installer).VersionInfo
          Write-Host "DsaApkInstaller.exe: $($info.FileDescription) | $($info.ProductName) | $($info.ProductVersion)"
          if ($info.FileDescription -cne 'APK Installer') { throw "DsaApkInstaller.exe calls itself '$($info.FileDescription)'" }
          if ($info.ProductVersion -notlike '0.0.9*') { throw "DsaApkInstaller.exe says it is version '$($info.ProductVersion)', not 0.0.9" }
          if (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\APK Installer.lnk") { throw "the APK Installer has a Start menu shortcut" }

          $dsa = "$env:PROGRAM_DIR\dsa.exe"
          $settings = & $dsa settings --json
          if ($LASTEXITCODE -ne 0) { throw "dsa settings failed: $settings" }
          Write-Host $settings
          $settings = $settings | ConvertFrom-Json
          if ($settings.render_gpu -ne 'display') { throw "the render GPU is '$($settings.render_gpu)' by default, not display" }
          if ($settings.freeze) { throw "freeze is on by default" }
          if ($settings.version -ne '0.0.9') { throw "the service reports version '$($settings.version)'" }
          if (-not $settings.program_updates_available) { throw "this package updates DSA, but the service says it cannot" }
          $changed = & $dsa settings set render-gpu discrete --json
          if ($LASTEXITCODE -ne 0) { throw "dsa settings set failed: $changed" }
          if (($changed | ConvertFrom-Json).render_gpu -ne 'discrete') { throw "the render GPU did not change: $changed" }
          if (-not (Test-Path "$env:DATA_DIR\settings\users")) { throw "the service keeps no settings in $env:DATA_DIR\settings" }
          $again = & $dsa settings --json | ConvertFrom-Json
          if ($again.render_gpu -ne 'discrete') { throw "the service did not keep the render GPU" }
          & $dsa settings set render-gpu display --json | Out-Null
          # The device identity is kept by the installed service, per user, and resets.
          $identity = & $dsa settings set device.model "CI tablet" --json | ConvertFrom-Json
          if ($identity.effective.model -ne 'CI tablet') { throw "the service did not keep the device model" }
          $identity = & $dsa settings reset device --json | ConvertFrom-Json
          # The default model is the computer's when its firmware names one (a runner's VM
          # names its own), and DSA's own only when it does not.
          Write-Host "device model after the reset: $($identity.effective.model) (default $($identity.defaults.model), from $($identity.sources.model))"
          if (-not $identity.defaults.model) { throw "the device identity has no default model" }
          if ($identity.sources.model -eq 'dsa' -and $identity.defaults.model -ne 'Desktop Subsystem for Android') { throw "DSA's own default model is '$($identity.defaults.model)'" }
          if ($identity.effective.model -ne $identity.defaults.model) { throw "resetting the device identity did not restore the default model: '$($identity.effective.model)', not '$($identity.defaults.model)'" }
          if ($identity.chosen.model) { throw "the reset kept the chosen model '$($identity.chosen.model)'" }
          $memory = & $dsa memory --json
          if ($LASTEXITCODE -ne 0) { throw "dsa memory failed: $memory" }
          Write-Host $memory
          $gpus = & $dsa gpus --json
          if ($LASTEXITCODE -ne 0) { throw "dsa gpus failed: $gpus" }
          Write-Host $gpus

      # The app starts, shows its window and every page, in the light and the dark theme.
      - name: Take pictures of the settings app's pages
        run: |
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          # Each picture is of one fresh start, on the page its pane item opens through UI Automation.
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            foreach ($page in 'general', 'memory', 'display', 'updates', 'advanced', 'device', 'about', 'logs') {
              $app = Start-Process $exe -PassThru
              $window = Wait-ProcessWindow $app.Id 90
              if (-not $window) {
                Show-Desktop "settings-$theme-$page-timeout"
                $exited = if ($app.HasExited) { "it exited with code $($app.ExitCode)" } else { "it is still running" }
                throw "DSA Settings showed no window within 90 seconds; $exited"
              }
              Open-SettingsPage $window $page
              Start-Sleep -Seconds 5
              Save-WindowScreen $window "$PWD\screens\settings-$theme-$page.png"
              if ($app.HasExited) { throw "DSA Settings exited while showing $page (code $($app.ExitCode))" }
              Stop-Process -Id $app.Id -Force
              $app.WaitForExit(10000) | Out-Null
            }
          }
          Set-AppTheme

      # The pane in Task Manager's layout, open and closed, with an item under the pointer.
      - name: Take pictures of the settings app's navigation pane
        run: |
          . .github/scripts/installer/setup-ui.ps1
          Add-Type -Namespace Dsa -Name Pointer -MemberDefinition '[DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            $app = Start-Process $exe -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) { throw "DSA Settings showed no window within 90 seconds" }
            Start-Sleep -Seconds 5
            $r = $window.Current.BoundingRectangle
            # The third item below the hamburger: rows are 40 px apart, under a 48 px title bar.
            [Dsa.Pointer]::SetCursorPos([int]$r.X + 24, [int]$r.Y + 48 + 40 * 3 + 20) | Out-Null
            Save-WindowScreen $window "$PWD\screens\settings-$theme-pane-open.png"
            $condition = New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::AutomationIdProperty, 'PART_ToggleButton')
            $toggle = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
            if (-not $toggle) { throw "the navigation pane has no toggle button" }
            $toggle.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
            Start-Sleep -Seconds 2
            Save-WindowScreen $window "$PWD\screens\settings-$theme-pane-closed.png"
            if ($app.HasExited) { throw "DSA Settings exited after closing its pane (code $($app.ExitCode))" }
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit(10000) | Out-Null
          }
          Set-AppTheme

      # The Widgets page, in both themes and both languages. The stand-in Android here offers
      # no widget, so a stand-in dsa answers the page's widget commands (widgets-fixture.ps1).
      - name: Take pictures of the settings app's Widgets page
        run: |
          . .github/scripts/installer/setup-ui.ps1
          . .github/scripts/installer/widgets-fixture.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $env:DSA_CLI = New-WidgetsFixture "$env:RUNNER_TEMP\widgets-fixture" "$env:PROGRAM_DIR\dsa.exe"
          try {
            foreach ($lang in 'en-US', 'ko-KR') {
              foreach ($theme in 'light', 'dark') {
                Set-AppTheme -Dark:($theme -eq 'dark')
                $app = Start-Process $exe -ArgumentList '--lang', $lang -PassThru
                $window = Wait-ProcessWindow $app.Id 90
                if (-not $window) {
                  Show-Desktop "settings-$theme-widgets-$lang-timeout"
                  throw "DSA Settings showed no window for the Widgets page within 90 seconds"
                }
                Open-SettingsPage $window 'widgets' $lang
                Start-Sleep -Seconds 5
                Assert-RowsShown $window 'Clock', 'Sticky note', 'Forecast'
                Save-WindowScreen $window "$PWD\screens\settings-$theme-widgets-$lang.png"
                if ($app.HasExited) { throw "DSA Settings exited while showing the Widgets page (code $($app.ExitCode))" }
                Stop-Process -Id $app.Id -Force
                $app.WaitForExit(10000) | Out-Null
              }
            }
          } finally {
            Set-AppTheme
            Remove-Item Env:DSA_CLI
            Get-Process cmd, PING -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            # What the page asked the stand-in dsa, for a page that stayed empty.
            $calls = "$env:RUNNER_TEMP\widgets-fixture\calls.txt"
            if (Test-Path $calls) {
              Write-Host "the page ran dsa with:"
              Get-Content $calls | ForEach-Object { Write-Host "  $_" }
            }
          }

      # The memory limit, the VM's size and the kernel's breakdown (Memory), freezing now
      # (General) and the trace switches (Advanced), in both themes and both languages. A
      # stand-in dsa answers `dsa memory`, since no guest here reports its memory
      # (memory-fixture.ps1); the settings come from the real service.
      - name: Take pictures of the settings app's memory limit, freeze and trace controls
        run: |
          . .github/scripts/installer/setup-ui.ps1
          . .github/scripts/installer/memory-fixture.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $env:DSA_CLI = New-MemoryFixture "$env:RUNNER_TEMP\memory-fixture" "$env:PROGRAM_DIR\dsa.exe"
          try {
            foreach ($lang in 'en-US', 'ko-KR') {
              foreach ($theme in 'light', 'dark') {
                Set-AppTheme -Dark:($theme -eq 'dark')
                foreach ($page in 'memory', 'general', 'advanced') {
                  $app = Start-Process $exe -ArgumentList '--lang', $lang -PassThru
                  $window = Wait-ProcessWindow $app.Id 90
                  if (-not $window) {
                    Show-Desktop "settings-$theme-$page-$lang-timeout"
                    throw "DSA Settings showed no window for the $page page within 90 seconds"
                  }
                  Open-SettingsPage $window $page $lang
                  Start-Sleep -Seconds 5
                  Save-WindowScreen $window "$PWD\screens\settings-$theme-$page-$lang.png"
                  if ($app.HasExited) { throw "DSA Settings exited while showing the $page page (code $($app.ExitCode))" }
                  Stop-Process -Id $app.Id -Force
                  $app.WaitForExit(10000) | Out-Null
                }
              }
            }
          } finally {
            Set-AppTheme
            Remove-Item Env:DSA_CLI
          }

      # The adb card sits below the fold of the Network page, so the page is scrolled to it.
      # Each theme and language gets a picture at rest and one with the port box focused, and
      # the box's height is measured. The Network page's read-only values get a picture too.
      - name: fr17_text_boxes_and_selectable_values_match_winui
        run: |
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          try {
            foreach ($lang in 'en-US', 'ko-KR') {
              foreach ($theme in 'light', 'dark') {
                Set-AppTheme -Dark:($theme -eq 'dark')
                $app = Start-Process $exe -ArgumentList '--lang', $lang -PassThru
                $window = Wait-ProcessWindow $app.Id 90
                if (-not $window) { throw "DSA Settings showed no window for the Network page within 90 seconds" }
                Open-SettingsPage $window 'network' $lang
                Start-Sleep -Seconds 5
                $box = $window.FindFirst($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($Auto::AutomationIdProperty, 'AdbPortBox')))
                if (-not $box) { throw "the Network page has no adb port box" }
                $walker = [System.Windows.Automation.TreeWalker]::ControlViewWalker
                $viewer = $walker.GetParent($box)
                while ($viewer -and -not $viewer.GetCurrentPropertyValue($Auto::IsScrollPatternAvailableProperty)) {
                  $viewer = $walker.GetParent($viewer)
                }
                if (-not $viewer) { throw "the adb port box is not inside anything that scrolls" }
                $scroll = $viewer.GetCurrentPattern([System.Windows.Automation.ScrollPattern]::Pattern)
                $w = $window.Current.BoundingRectangle
                foreach ($percent in 30..100) {
                  $scroll.SetScrollPercent(-1, $percent)
                  Start-Sleep -Milliseconds 50
                  $r = $box.Current.BoundingRectangle
                  if ($r.Top -gt 0 -and $r.Top -lt ($w.Top + $w.Height / 2)) { break }
                }
                Start-Sleep -Seconds 1
                Save-WindowScreen $window "$PWD\screens\settings-$theme-adb-$lang.png"
                $r = $box.Current.BoundingRectangle
                Write-Host "the adb port box measures $($r.Width) by $($r.Height)"
                if ([Math]::Abs($r.Height - 32) -gt 0.5) { throw "the adb port box is $($r.Height) px high, not 32" }
                $box.SetFocus()
                Start-Sleep -Seconds 1
                Save-WindowScreen $window "$PWD\screens\settings-$theme-adb-focused-$lang.png"
                if ($app.HasExited) { throw "DSA Settings exited while showing the adb card (code $($app.ExitCode))" }
                Stop-Process -Id $app.Id -Force
                $app.WaitForExit(10000) | Out-Null
              }
            }
            foreach ($theme in 'light', 'dark') {
              Set-AppTheme -Dark:($theme -eq 'dark')
              $app = Start-Process $exe -ArgumentList '--lang', 'en-US' -PassThru
              $window = Wait-ProcessWindow $app.Id 90
              if (-not $window) { throw "DSA Settings showed no window for the Network page within 90 seconds" }
              Open-SettingsPage $window 'network' 'en-US'
              Start-Sleep -Seconds 5
              # An unknown page name opens General, so this card's title proves the page opened.
              Assert-RowsShown $window "Android's network"
              Save-WindowScreen $window "$PWD\screens\settings-$theme-network.png"
              Stop-Process -Id $app.Id -Force
              $app.WaitForExit(10000) | Out-Null
            }
          } finally {
            Set-AppTheme
          }

      # Every item of the navigation pane, the footer's About too, is a list item named by its
      # label that UI Automation can select, as Narrator does, and selecting it opens its page:
      # the item reports itself selected and the page's title shows beside the pane. Invoking
      # an item opens its page as well.
      - name: fr17_every_settings_page_opens_from_its_pane_item_through_ui_automation
        run: |
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $pages = 'memory', 'apps', 'background', 'widgets', 'display', 'device', 'network', 'updates', 'advanced', 'logs', 'about', 'general'
          foreach ($lang in 'en-US', 'ko-KR') {
            $app = Start-Process $exe -ArgumentList '--lang', $lang -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) { throw "DSA Settings showed no window within 90 seconds" }
            try {
              foreach ($page in $pages) {
                $label = Get-SettingsPageLabel $page $lang
                Open-SettingsPage $window $page $lang
                $others = @($pages | Where-Object { $_ -ne $page } | ForEach-Object {
                  $other = Find-SettingsPaneItem $window (Get-SettingsPageLabel $_ $lang)
                  if (-not $other) { throw "the navigation pane has no selectable item named '$(Get-SettingsPageLabel $_ $lang)'" }
                  if ($other.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Current.IsSelected) { $_ }
                })
                if ($others) { throw "with '$label' open, these items also say they are selected: $($others -join ', ')" }
                $paneEdge = $window.Current.BoundingRectangle.X + 244
                $deadline = (Get-Date).AddSeconds(15)
                $title = $null
                while (-not $title -and (Get-Date) -lt $deadline) {
                  $title = $window.FindAll($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($Auto::NameProperty, $label))) |
                    Where-Object { $_.Current.BoundingRectangle.X -gt $paneEdge -and $_.Current.BoundingRectangle.Width -gt 0 } | Select-Object -First 1
                  if (-not $title) { Start-Sleep -Milliseconds 500 }
                }
                if (-not $title) {
                  Save-WindowScreen $window "$PWD\screens\settings-uia-$page-$lang.png"
                  throw "selecting '$label' did not show a page titled '$label'"
                }
                Write-Host "'$label' opened its page ($lang)"
              }
              # Invoke opens a page too.
              $item = Find-SettingsPaneItem $window (Get-SettingsPageLabel 'about' $lang)
              $item.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
              Start-Sleep -Seconds 2
              if (-not $item.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Current.IsSelected) {
                throw "invoking the About item through UI Automation did not open its page"
              }
              if ($app.HasExited) { throw "DSA Settings exited (code $($app.ExitCode))" }
            } finally {
              Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
              $app.WaitForExit(10000) | Out-Null
            }
          }

      # The "Running in the background" page with apps on it: this runner's Android does not
      # boot, so a stand-in dsa says a music app and a download run in the background.
      - name: fr24_settings_app_lists_the_apps_that_run_in_the_background
        run: |
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $env:DSA_CLI = (Resolve-Path .github/scripts/apk/fake-dsa.cmd).Path
          $env:FAKE_DSA_STATE = "$PWD\.scratch\fake-android-unused"
          $listed = & $env:DSA_CLI background list --json | ConvertFrom-Json
          if ($listed.apps.Count -ne 2) { throw "the stand-in dsa lists $($listed.apps.Count) apps, not 2" }
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            $app = Start-Process $exe -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) {
              Show-Desktop "settings-$theme-background-timeout"
              throw "DSA Settings showed no window within 90 seconds"
            }
            Open-SettingsPage $window 'background'
            Start-Sleep -Seconds 8
            Assert-RowsShown $window 'Music', 'Files' -MinVisible 2
            Save-WindowScreen $window "$PWD\screens\settings-$theme-background.png"
            if ($app.HasExited) { throw "DSA Settings exited while showing the background apps (code $($app.ExitCode))" }
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit(10000) | Out-Null
          }
          Remove-Item Env:DSA_CLI
      # In a window as short as the app allows, some navigation items are out of view at
      # first. The mouse wheel over the pane, and Tab through the pane, bring every item into
      # view; the wheel over the page brings its last card into view.
      - name: fr17_a_short_settings_window_scrolls_to_every_page
        run: |
          . .github/scripts/installer/setup-ui.ps1
          Add-Type -Namespace Dsa -Name Input -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint flags, int dx, int dy, int data, System.UIntPtr extra);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr window);
          [DllImport("user32.dll")] public static extern void keybd_event(byte key, byte scan, uint flags, System.UIntPtr extra);
          '@
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $name = [System.Windows.Automation.AutomationElement]::NameProperty
          $items = 'General', 'Memory', 'Apps', 'Running in the background', 'Widgets', 'Display & GPU', 'Device identity', 'Network', 'Updates', 'Advanced', 'Logs', 'About'

          # The navigation item named $Text: the pane is on the left, so a page title of the
          # same name is not it.
          function Find-Item($Window, [string]$Text) {
            $Window.FindAll($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($name, $Text))) |
              Where-Object { $_.Current.BoundingRectangle.X -lt ($Window.Current.BoundingRectangle.X + 280) } | Select-Object -First 1
          }
          # Whether all of $Element shows inside $Window.
          function Test-InView($Window, $Element) {
            if (-not $Element -or $Element.Current.IsOffscreen) { return $false }
            $w = $Window.Current.BoundingRectangle
            $r = $Element.Current.BoundingRectangle
            ($r.Height -gt 0) -and ($r.Top -ge $w.Top) -and ($r.Bottom -le $w.Bottom)
          }
          function Get-ShownItems($Window) {
            @($items | Where-Object { Test-InView $Window (Find-Item $Window $_) })
          }
          # The runner sometimes opens the Start menu over the window (the ARM64 image does), and
          # then the wheel scrolls the Start menu. The wheel goes only to a point where DSA
          # Settings is under the cursor: a point across the element that nothing covers, or,
          # when every point is covered, one cleared by closing what covers it.
          Add-Type -Namespace Dsa -Name Cover -MemberDefinition @'
          [DllImport("user32.dll")] public static extern System.IntPtr WindowFromPoint(POINT point);
          [DllImport("user32.dll")] public static extern System.IntPtr GetAncestor(System.IntPtr window, uint flags);
          [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(System.IntPtr window, System.Text.StringBuilder name, int size);
          [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(System.IntPtr window, out uint process);
          [DllImport("user32.dll")] public static extern bool PostMessage(System.IntPtr window, uint message, System.IntPtr w, System.IntPtr l);
          [DllImport("user32.dll")] public static extern System.IntPtr GetForegroundWindow();
          [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
          '@
          function Get-Cover([int]$X, [int]$Y) {
            $point = New-Object Dsa.Cover+POINT
            $point.X = $X; $point.Y = $Y
            $root = [Dsa.Cover]::GetAncestor([Dsa.Cover]::WindowFromPoint($point), 2)   # GA_ROOT
            $class = New-Object System.Text.StringBuilder 256
            [Dsa.Cover]::GetClassName($root, $class, 256) | Out-Null
            $id = [uint32]0
            [Dsa.Cover]::GetWindowThreadProcessId($root, [ref]$id) | Out-Null
            $process = Get-Process -Id $id -ErrorAction SilentlyContinue
            @{ Window = $root; Class = $class.ToString(); ProcessId = [int]$id; Process = $process.ProcessName }
          }
          function Wheel-Over($Element, [int]$Notches) {
            $r = $Element.Current.BoundingRectangle
            $owner = $Element.Current.ProcessId
            $y = [int]($r.Y + $r.Height / 2)
            $xs = 0.5, 0.15, 0.3, 0.7, 0.85 | ForEach-Object { [int]($r.X + $r.Width * $_) }
            $found = $null
            for ($try = 0; $try -lt 6 -and -not $found; $try++) {
              foreach ($x in $xs) {
                $cover = Get-Cover $x $y
                if ($cover.ProcessId -eq $owner) { $found = $x; break }
              }
              if ($found) { break }
              $cover = Get-Cover $xs[0] $y
              Write-Host "the point to wheel over is covered by window class '$($cover.Class)' of process $($cover.Process) ($($cover.ProcessId)); closing it"
              [Dsa.Input]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)   # Escape down
              [Dsa.Input]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)   # Escape up
              Get-Process StartMenuExperienceHost, SearchHost, ShellExperienceHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              if ($try -ge 2) {
                # Escape and closing the Start menu's hosts did not clear it: whatever window
                # covers the point is closed, and a shell window is cleared by restarting the shell.
                if ($cover.Process -eq 'explorer') {
                  Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
                } elseif ($cover.Process -notin 'csrss', 'dwm', 'winlogon', 'System', 'Idle', '') {
                  [Dsa.Cover]::PostMessage($cover.Window, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero) | Out-Null   # WM_CLOSE
                  Stop-Process -Id $cover.ProcessId -Force -ErrorAction SilentlyContinue
                }
                Start-Sleep -Seconds 3
              }
              [Dsa.Input]::SetForegroundWindow([IntPtr]$window.Current.NativeWindowHandle) | Out-Null
              Start-Sleep -Seconds 1
            }
            if (-not $found) {
              Save-WindowScreen $window "$PWD\screens\settings-covered.png"
              throw "another window covers DSA Settings where the wheel goes"
            }
            [Dsa.Input]::SetCursorPos($found, $y) | Out-Null
            Start-Sleep -Milliseconds 200
            for ($i = 0; $i -lt $Notches; $i++) {
              [Dsa.Input]::mouse_event(0x0800, 0, 0, -120, [UIntPtr]::Zero)   # wheel down
              Start-Sleep -Milliseconds 100
            }
            Start-Sleep -Milliseconds 500
          }
          # Keys go to the foreground window, and on the ARM64 runner the Start menu opens over
          # DSA Settings and takes the keyboard (Tab then walks the Start menu's tiles). DSA
          # Settings is made the foreground window before any key: the Start menu is closed
          # with Escape, and an Alt tap lets this process move the foreground.
          function Set-Foreground($Window) {
            $handle = [IntPtr]$Window.Current.NativeWindowHandle
            for ($try = 0; $try -lt 6; $try++) {
              if ([Dsa.Cover]::GetForegroundWindow() -eq $handle) { return }
              $front = [Dsa.Cover]::GetForegroundWindow()
              $id = [uint32]0
              [Dsa.Cover]::GetWindowThreadProcessId($front, [ref]$id) | Out-Null
              Write-Host "the keyboard is with process $((Get-Process -Id $id -ErrorAction SilentlyContinue).ProcessName) ($id); bringing DSA Settings to the front"
              [Dsa.Input]::keybd_event(0x1B, 0, 0, [UIntPtr]::Zero)   # Escape down
              [Dsa.Input]::keybd_event(0x1B, 0, 2, [UIntPtr]::Zero)   # Escape up
              if ($try -ge 2) {
                Get-Process StartMenuExperienceHost, SearchHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              }
              [Dsa.Input]::keybd_event(0x12, 0, 0, [UIntPtr]::Zero)   # Alt down
              [Dsa.Input]::keybd_event(0x12, 0, 2, [UIntPtr]::Zero)   # Alt up
              [Dsa.Input]::SetForegroundWindow($handle) | Out-Null
              Start-Sleep -Seconds 1
            }
            Save-WindowScreen $Window "$PWD\screens\settings-not-foreground.png"
            throw "DSA Settings could not be brought to the front for the keyboard"
          }
          function Start-Short([string]$Page) {
            Close-PrivacyExperience
            $app = Start-Process $exe -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) { throw "DSA Settings showed no window within 90 seconds" }
            Open-SettingsPage $window $Page
            Start-Sleep -Seconds 4
            $transform = $window.GetCurrentPattern([System.Windows.Automation.TransformPattern]::Pattern)
            $transform.Move(40, 40)
            $transform.Resize(900, 360)   # the window's least height
            [Dsa.Input]::SetForegroundWindow([IntPtr]$window.Current.NativeWindowHandle) | Out-Null
            Start-Sleep -Seconds 2
            $shown = Get-ShownItems $window
            Write-Host "at first: $($shown -join ', ')"
            if ($shown.Count -eq $items.Count) {
              Save-WindowScreen $window "$PWD\screens\settings-short-all-shown.png"
              throw "every navigation item shows in a 360 px window before any scrolling, so this check proves nothing"
            }
            @{ App = $app; Window = $window }
          }
          function Stop-Short($Run) {
            if ($Run.App.HasExited) { throw "DSA Settings exited (code $($Run.App.ExitCode))" }
            Stop-Process -Id $Run.App.Id -Force
            $Run.App.WaitForExit(10000) | Out-Null
          }

          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')

            # The wheel over the pane: every item that was hidden at first comes into view.
            $run = Start-Short 'general'
            $window = $run.Window
            Save-WindowScreen $window "$PWD\screens\settings-$theme-short-before.png"
            $seen = @{}
            Get-ShownItems $window | ForEach-Object { $seen[$_] = $true }
            for ($i = 0; $i -lt 12; $i++) {
              # The lowest item in view: an item scrolled up out of the pane still lies inside the
              # window, under the title bar, where the wheel does not reach the pane.
              $pane = Find-Item $window ($items | Where-Object { Test-InView $window (Find-Item $window $_) } | Select-Object -Last 1)
              Wheel-Over $pane 3
              Get-ShownItems $window | ForEach-Object { $seen[$_] = $true }
            }
            Save-WindowScreen $window "$PWD\screens\settings-$theme-short-pane-wheel.png"
            $missing = $items | Where-Object { -not $seen[$_] }
            if ($missing) { throw "the mouse wheel over the navigation pane never brought these into view: $($missing -join ', ')" }
            Stop-Short $run

            # The keyboard: Tab from the first item moves the focus down the pane.
            $run = Start-Short 'general'
            $window = $run.Window
            $seen = @{}
            Get-ShownItems $window | ForEach-Object { $seen[$_] = $true }
            Set-Foreground $window
            $r = (Find-Item $window 'General').Current.BoundingRectangle
            [Dsa.Input]::SetCursorPos([int]($r.X + $r.Width / 2), [int]($r.Y + $r.Height / 2)) | Out-Null
            [Dsa.Input]::mouse_event(0x0002, 0, 0, 0, [UIntPtr]::Zero)   # left down
            [Dsa.Input]::mouse_event(0x0004, 0, 0, 0, [UIntPtr]::Zero)   # left up
            Start-Sleep -Seconds 1
            Set-Foreground $window
            # About sits in the pane's footer, and Tab may visit the pane toggle and the page
            # before it, so the presses go on until every item was in view (at most 40).
            for ($i = 0; $i -lt 40; $i++) {
              [System.Windows.Forms.SendKeys]::SendWait('{TAB}')
              Start-Sleep -Milliseconds 500
              $shown = Get-ShownItems $window
              Write-Host "Tab $($i + 1): $($shown -join ', ')"
              $shown | ForEach-Object { $seen[$_] = $true }
              if (-not ($items | Where-Object { -not $seen[$_] })) { break }
            }
            Save-WindowScreen $window "$PWD\screens\settings-$theme-short-pane-keyboard.png"
            $missing = $items | Where-Object { -not $seen[$_] }
            if ($missing) { throw "Tab through the navigation pane never brought these into view: $($missing -join ', ')" }
            Stop-Short $run

            # The wheel over the page reaches its last card.
            $run = Start-Short 'general'
            $window = $run.Window
            # The page title stays put above the scrolling cards, as in Windows Settings, so the
            # wheel goes over the first card's title.
            $text = $window.FindAll($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($name, 'State'))) |
              Where-Object { $_.Current.BoundingRectangle.X -gt ($window.Current.BoundingRectangle.X + 244) } | Select-Object -First 1
            if (-not $text) { throw "no State card on the General page" }
            Wheel-Over $text 25
            $last = $window.FindFirst($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($name, 'Refresh')))
            Save-WindowScreen $window "$PWD\screens\settings-$theme-short-page-wheel.png"
            if (-not (Test-InView $window $last)) { throw "the mouse wheel over the page does not bring its last card (Refresh) into view" }
            Stop-Short $run
          }
          Set-AppTheme

      # The ARM64 runner image has no Android SDK and no JDK, which the APK tools need.
      - name: Set up a JDK for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: Set up the Android SDK for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0 platforms;android-35"

      # APKs made by the Android SDK's own tools, for the APK install window.
      - name: Make the test APKs
        shell: bash
        run: .github/scripts/apk/make-test-apks.sh .scratch/test-apks

      # Double-clicking an APK runs what the .apk association names; the window then shows what
      # the file is, read on the host while Android is not running. The screens a running
      # Android leads to (starting it, an update, a refused downgrade or signer, progress, done,
      # a failure) come from a stand-in dsa, since this runner has no Android that boots.
      - name: fr11_double_clicking_an_apk_opens_the_install_window
        run: |
          . .github/scripts/installer/setup-ui.ps1
          # The APK Installer's window keeps this id.
          $script:WindowId = 'ApkInstallWindow'
          New-Item -ItemType Directory -Force screens | Out-Null
          $apks = (Resolve-Path .scratch/test-apks).Path
          Set-Content -Path "$apks\broken.apk" -Value 'not an apk' -NoNewline
          # As a browser marks a download.
          Set-Content -Path "$apks\many.apk" -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nReferrerUrl=https://apps.example.com/many`r`nHostUrl=https://downloads.example.com/many.apk"
          $command =(Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Dsa.ApkFile\shell\open\command').'(default)'
          Write-Host "the .apk association runs: $command"
          if ($command -notlike "*\settings\DsaApkInstaller.exe`" --install-apk `"%1`"") { throw "the .apk association runs $command" }
          $friendly = (Get-ItemProperty 'Registry::HKEY_LOCAL_MACHINE\SOFTWARE\Classes\Applications\DsaApkInstaller.exe').FriendlyAppName
          if ($friendly -notlike '@*\dsa-app-window.exe,-110') { throw "Open with names the APK Installer '$friendly'" }
          function Open-Apk([string]$Name) {
            # What Explorer runs for a double-clicked APK.
            $line = $command.Replace('%1', "$apks\$Name")
            $exe = $line.Substring(1, $line.IndexOf('"', 1) - 1)
            $process = Start-Process $exe -ArgumentList $line.Substring($exe.Length + 3) -PassThru
            $null = $process.Handle
            $process
          }
          function Close-Apk($Process) {
            if (-not $Process.HasExited) { Stop-Process -Id $Process.Id -Force }
            $Process.WaitForExit(10000) | Out-Null
          }
          # Turns "Launch when ready" on or off; off keeps the window on its done screen.
          function Set-LaunchWhenReady([bool]$On) {
            $box = Wait-SetupControl LaunchWhenReady -Seconds 90
            $toggle = $box.GetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern)
            $want = if ($On) { [System.Windows.Automation.ToggleState]::On } else { [System.Windows.Automation.ToggleState]::Off }
            if ($toggle.Current.ToggleState -ne $want) { $toggle.Toggle() }
          }
          function Expect-Text([string]$Id, [string]$Like) {
            $text = Get-SetupText $Id
            if ($text -notlike $Like) { Show-Desktop "apk-$Id"; throw "$Id says '$text', not '$Like'" }
          }
          $env:REAL_DSA = "$env:PROGRAM_DIR\dsa.exe"
          $env:FAKE_DSA_STATE = "$PWD\.scratch\fake-android-running"
          $fake = (Resolve-Path .github/scripts/apk/fake-dsa.cmd).Path
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            Remove-Item Env:DSA_CLI -ErrorAction SilentlyContinue
            Remove-Item $env:FAKE_DSA_STATE -ErrorAction SilentlyContinue

            # The real dsa: everything comes from the file.
            $app = Open-Apk notes.apk
            try {
              Wait-SetupControl InstallButton -Enabled -Seconds 90 | Out-Null
            } catch {
              if ($app.HasExited) { Write-Host "DsaApkInstaller.exe exited with code $($app.ExitCode)" }
              Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error' } -MaxEvents 4 -ErrorAction SilentlyContinue |
                ForEach-Object { Write-Host $_.Message }
              throw
            }
            Expect-Text HeroTitle 'Install Notes[?]'
            Expect-Text HeroPackage 'Package Name: com.example.notes'
            Expect-Text PublisherText 'Publisher: *'
            Expect-Text VersionChip 'Version: 4.2'
            # No Zone.Identifier here: the folder it is in.
            Expect-Text SourceText "Source: $apks"
            Expect-Text PermissionsHeader 'Capabilities (2):'
            Save-SetupScreen "$PWD\screens\apk-$theme-details.png"
            Close-Apk $app

            # Many permissions, code for another processor and transparent icon corners: the
            # labels, the warning and More, and the labels stay English in Korean.
            foreach ($lang in 'en-US', 'ko-KR') {
              $line = $command.Replace('%1', "$apks\many.apk")
              $exe = $line.Substring(1, $line.IndexOf('"', 1) - 1)
              $app = Start-Process $exe -ArgumentList ($line.Substring($exe.Length + 3) + " --lang $lang") -PassThru
              $null = $app.Handle
              Wait-SetupControl InstallButton -Enabled -Seconds 90 | Out-Null
              Expect-Text HeroTitle 'Install Many[?]'
              Expect-Text HeroPackage 'Package Name: com.example.many'
              Expect-Text VersionChip 'Version: 3.20.8107'
              Expect-Text SourceText 'Source: downloads.example.com'
              Expect-Text PermissionsHeader 'Capabilities (40):'
              Expect-Text MoreLink 'More'
              $title = (Find-SetupWindow).Current.Name
              $want = if ($lang -eq 'ko-KR') { 'APK 설치 관리자' } else { 'APK Installer' }
              if ($title -cne $want) { throw "the window's title is '$title', not '$want'" }
              Wait-SetupControl CompatibilityTitle | Out-Null
              Save-SetupScreen "$PWD\screens\apk-$theme-many-$lang.png"
              # More is a toggle, as App Installer's is: it opens the list and becomes Less,
              # and Less folds it again. UI Automation sees its state.
              function Expect-Expanded([string]$State) {
                $link = Wait-SetupControl MoreLink
                $state = $link.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Current.ExpandCollapseState
                if ("$state" -ne $State) { Show-Desktop "apk-more-$State"; throw "More is $state, not $State" }
              }
              Expect-Expanded 'Collapsed'
              Invoke-SetupButton MoreLink
              Wait-SetupControl PermissionList | Out-Null
              Start-Sleep -Seconds 1
              Expect-Text MoreLink 'Less'
              Expect-Expanded 'Expanded'
              Save-SetupScreen "$PWD\screens\apk-$theme-many-expanded-$lang.png"
              Invoke-SetupButton MoreLink
              Start-Sleep -Seconds 1
              Expect-Text MoreLink 'More'
              Expect-Expanded 'Collapsed'
              Save-SetupScreen "$PWD\screens\apk-$theme-many-collapsed-again-$lang.png"
              Close-Apk $app
            }

            $app = Open-Apk adaptive.apk
            Wait-SetupControl InstallButton -Enabled -Seconds 90 | Out-Null
            Expect-Text HeroTitle 'Install Adaptive[?]'
            Save-SetupScreen "$PWD\screens\apk-$theme-adaptive-icon.png"
            Close-Apk $app
            # An adaptive icon whose foreground is a vector drawable, as Chrome's is: the tile
            # shows the drawing on its background, not a plain square.
            $app = Open-Apk vector.apk
            Wait-SetupControl InstallButton -Enabled -Seconds 90 | Out-Null
            Expect-Text HeroTitle 'Install Vector[?]'
            Save-SetupScreen "$PWD\screens\apk-$theme-vector-icon.png"
            Close-Apk $app
            $app = Open-Apk broken.apk
            Wait-SetupControl ResultTitle -Seconds 90 | Out-Null
            Expect-Text ResultText 'broken.apk is not a valid APK file.'
            Save-SetupScreen "$PWD\screens\apk-$theme-not-an-apk.png"
            Close-Apk $app
            # Bundles are named for what they are, from what is in them.
            $bundle = "$apks\work-bundle"
            New-Item -ItemType Directory -Force $bundle | Out-Null
            Copy-Item "$apks\notes.apk" "$bundle\base.apk"
            Set-Content -Path "$bundle\manifest.json" -Value '{"package_name":"com.example.notes"}'
            Compress-Archive -Force -Path "$bundle\base.apk", "$bundle\manifest.json" -DestinationPath "$apks\split.zip"
            Copy-Item -Force "$apks\split.zip" "$apks\split.xapk"
            Set-Content -Path "$bundle\BundleConfig.pb" -Value 'config' -NoNewline
            Compress-Archive -Force -Path "$bundle\BundleConfig.pb" -DestinationPath "$apks\store.zip"
            Copy-Item -Force "$apks\store.zip" "$apks\store.aab"
            # A split APK bundle installs: the window reads the app from its base APK and says
            # how many of its APKs this PC takes.
            $app = Open-Apk split.xapk
            Wait-SetupControl InstallButton -Enabled -Seconds 90 | Out-Null
            Expect-Text HeroTitle 'Install Notes[?]'
            Expect-Text HeroPackage 'Package Name: com.example.notes'
            Expect-Text SummaryTitle 'Split APK bundle'
            Expect-Text SummaryText 'Notes comes as several APKs. The 1 this PC needs are installed together, * in all.'
            Save-SetupScreen "$PWD\screens\apk-$theme-split-xapk.png"
            Close-Apk $app
            # An App Bundle does not: the window says why and what to get instead.
            $app = Open-Apk store.aab
            Wait-SetupControl ResultTitle -Seconds 90 | Out-Null
            Expect-Text ResultText 'store.aab is an Android App Bundle.*cannot be installed as they are*Get the app as an APK*'
            Save-SetupScreen "$PWD\screens\apk-$theme-store-aab.png"
            Close-Apk $app

            $env:DSA_CLI = $fake
            # Installing starts Android, finds the app installed already, and shows both versions.
            $env:FAKE_DSA_SCENARIO = 'update'
            $app = Open-Apk notes.apk
            Set-LaunchWhenReady $false
            Invoke-SetupButton InstallButton -Seconds 90
            Wait-SetupControl ProgressTitle | Out-Null
            Save-SetupScreen "$PWD\screens\apk-$theme-starting-android.png"
            Wait-SetupControl InstallButton -Enabled -Seconds 60 | Out-Null
            Expect-Text InstallButton 'Update'
            Expect-Text SummaryText '*4.1*4.2*'
            Save-SetupScreen "$PWD\screens\apk-$theme-update.png"
            Invoke-SetupButton InstallButton
            Wait-SetupControl ProgressPercent | Out-Null
            Start-Sleep -Seconds 4
            Save-SetupScreen "$PWD\screens\apk-$theme-progress.png"
            Wait-SetupControl OpenButton -Enabled -Seconds 60 | Out-Null
            Expect-Text ResultTitle 'Notes is updated'
            Save-SetupScreen "$PWD\screens\apk-$theme-done.png"
            Close-Apk $app

            # Android refuses a downgrade and another signer; so does the window.
            New-Item -ItemType File -Force $env:FAKE_DSA_STATE | Out-Null
            foreach ($scenario in 'downgrade', 'signature') {
              $env:FAKE_DSA_SCENARIO = $scenario
              $app = Open-Apk notes.apk
              Wait-SetupControl SummaryText -Seconds 90 | Out-Null
              Start-Sleep -Seconds 2
              if ((Wait-SetupControl InstallButton).Current.IsEnabled) { throw "the window offers to install a $scenario" }
              Save-SetupScreen "$PWD\screens\apk-$theme-$scenario.png"
              Close-Apk $app
            }

            # A refusal by Android shows its reason.
            $env:FAKE_DSA_SCENARIO = 'failure'
            $app = Open-Apk notes.apk
            Invoke-SetupButton InstallButton -Seconds 90
            Wait-SetupControl CloseButton -Enabled -Seconds 60 | Out-Null
            Expect-Text ResultTitle 'Not installed'
            Expect-Text ResultText '*processor type*INSTALL_FAILED_NO_MATCHING_ABIS*'
            Save-SetupScreen "$PWD\screens\apk-$theme-failed.png"
            Close-Apk $app
          }
          Set-AppTheme
          Remove-Item Env:DSA_CLI, Env:FAKE_DSA_SCENARIO -ErrorAction SilentlyContinue

      # The Apps page, in both themes and both languages. Nothing is installed in the stand-in
      # Android here, so a stand-in dsa answers the page's list (apps-fixture.ps1).
      - name: Take pictures of the settings app's Apps page
        run: |
          . .github/scripts/installer/setup-ui.ps1
          . .github/scripts/installer/apps-fixture.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $env:DSA_CLI = New-AppsFixture "$env:RUNNER_TEMP\apps-fixture" "$env:PROGRAM_DIR\dsa.exe"
          try {
            foreach ($lang in 'en-US', 'ko-KR') {
              foreach ($theme in 'light', 'dark') {
                Set-AppTheme -Dark:($theme -eq 'dark')
                $app = Start-Process $exe -ArgumentList '--lang', $lang -PassThru
                $window = Wait-ProcessWindow $app.Id 90
                if (-not $window) {
                  Show-Desktop "settings-$theme-apps-$lang-timeout"
                  throw "DSA Settings showed no window for the Apps page within 90 seconds"
                }
                Open-SettingsPage $window 'apps' $lang
                Start-Sleep -Seconds 5
                Assert-RowsShown $window $AppsFixtureLabels
                Save-WindowScreen $window "$PWD\screens\settings-$theme-apps-$lang.png"
                Set-PageScrolledToEnd $window
                Assert-RowsShown $window $AppsFixtureLabels[-1]
                Save-WindowScreen $window "$PWD\screens\settings-$theme-apps-$lang-end.png"
                if ($app.HasExited) { throw "DSA Settings exited while showing the Apps page (code $($app.ExitCode))" }
                Stop-Process -Id $app.Id -Force
                $app.WaitForExit(10000) | Out-Null

                # The window Windows' list of installed apps opens (its UninstallString). It
                # does not ask again, so it shows the app and the uninstall's progress at once;
                # the stand-in dsa's uninstall is slow and removes nothing.
                $app = Start-Process $exe -ArgumentList '--uninstall-app', 'com.example.notes', '--lang', $lang -PassThru
                $window = Wait-ProcessWindow $app.Id 90
                if (-not $window) {
                  Show-Desktop "uninstall-$theme-$lang-timeout"
                  throw "DSA Settings showed no uninstall window within 90 seconds"
                }
                Start-Sleep -Seconds 4
                Save-WindowScreen $window "$PWD\screens\uninstall-$theme-$lang.png"
                if ($app.HasExited) { throw "the uninstall window exited by itself (code $($app.ExitCode))" }
                Stop-Process -Id $app.Id -Force
                $app.WaitForExit(10000) | Out-Null
              }
            }
          } finally {
            Set-AppTheme
            Remove-Item Env:DSA_CLI -ErrorAction SilentlyContinue
            Get-Process cmd, PING -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      # Every row of the Apps page and of the Android log is laid out with room for its text, and
      # a row's search and actions reach dsa. Pictures alone let a blank list pass: this counts
      # rows through UI Automation and fails on none.
      - name: fr22_settings_apps_page_shows_every_app_and_its_actions_work
        run: |
          . .github/scripts/installer/setup-ui.ps1
          . .github/scripts/installer/apps-fixture.ps1
          Add-Type -Namespace Dsa -Name RowInput -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(uint flags, int dx, int dy, int data, System.UIntPtr extra);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr window);
          '@
          New-Item -ItemType Directory -Force screens | Out-Null
          $exe = "$env:PROGRAM_DIR\settings\DsaSettings.exe"
          $types = [System.Windows.Automation.ControlType]
          $env:DSA_CLI = New-AppsFixture "$env:RUNNER_TEMP\apps-rows" "$env:PROGRAM_DIR\dsa.exe"
          $calls = "$env:RUNNER_TEMP\apps-rows\calls.txt"
          function Find-Typed($Window, $Type) {
            $Window.FindAll($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($Auto::ControlTypeProperty, $Type)))
          }
          function Wait-Call([string]$Pattern) {
            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline) {
              if ((Test-Path $calls) -and (Get-Content $calls | Where-Object { $_ -like $Pattern })) { return }
              Start-Sleep -Milliseconds 250
            }
            Get-Content $calls -ErrorAction SilentlyContinue
            throw "the page did not run dsa $Pattern"
          }
          function Press($Control) {
            $Control.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }
          function Set-Search($Window, [string]$Text) {
            (Find-Typed $Window $types::Edit)[0].GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($Text)
          }
          try {
            Set-AppTheme
            $app = Start-Process $exe -ArgumentList '--lang', 'en-US' -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) { throw "DSA Settings showed no window for the Apps page within 90 seconds" }
            Open-SettingsPage $window 'apps' 'en-US'
            Assert-RowsShown $window $AppsFixtureLabels
            $texts = Find-Typed $window $types::Text
            $sizes = @($texts | Where-Object { $_.Current.Name -match '^[\d.,]+ (KB|MB|GB)$' -and $_.Current.BoundingRectangle.Width -gt 0 })
            if ($sizes.Count -lt 9) { throw "only $($sizes.Count) of the 9 rows show their size" }
            if (-not ($texts | Where-Object { $_.Current.Name -like '*com.example.notes*4.1.2*' -and $_.Current.BoundingRectangle.Width -gt 0 })) { throw "the Notes row does not show its version" }
            $icons = @(Find-Typed $window $types::Image | Where-Object { $_.Current.BoundingRectangle.Height -gt 0 })
            if ($icons.Count -lt 8) { throw "only $($icons.Count) of the 8 apps with an icon show one" }

            # The search narrows the list, and clearing it brings every app back.
            Set-Search $window 'notes'
            Start-Sleep -Seconds 2
            Save-WindowScreen $window "$PWD\screens\settings-apps-search.png"
            Write-Host "the search box holds '$((Find-Typed $window $types::Edit)[0].GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).Current.Value)'"
            Assert-RowsShown $window 'Notes'
            if (Find-RowTexts $window 'Weather') { throw "the search for notes still lists Weather" }

            # A row's actions, on the one row the search left.
            Press (Find-RowControl $window 'Notes' $types::Button 'Open')
            Wait-Call 'launch com.example.notes*'
            Start-Sleep -Seconds 1
            Press (Find-RowControl $window 'Notes' $types::Button 'App info')
            Wait-Call 'apps settings com.example.notes*'
            Start-Sleep -Seconds 1
            $box = Find-RowControl $window 'Notes' $types::ComboBox
            $box.GetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern).Expand()
            Start-Sleep -Seconds 1
            $items = $box.FindAll($Scope::Descendants, (New-Object System.Windows.Automation.PropertyCondition($Auto::ControlTypeProperty, $types::ListItem)))
            if ($items.Count -lt 2) { throw "the start size list offers $($items.Count) sizes" }
            $items[1].GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            Wait-Call 'app-window com.example.notes*--start-size 412x915*'
            Start-Sleep -Seconds 1
            # Automation's toggle raises no Click, which is what the row listens to: the mouse.
            $condition = New-Object System.Windows.Automation.AndCondition(
              (New-Object System.Windows.Automation.PropertyCondition($Auto::HelpTextProperty, 'Notes')),
              (New-Object System.Windows.Automation.PropertyCondition($Auto::IsTogglePatternAvailableProperty, $true)))
            $switch = $window.FindFirst($Scope::Descendants, $condition)
            if (-not $switch) { throw "the Notes row has no switch" }
            [Dsa.RowInput]::SetForegroundWindow([System.IntPtr]$window.Current.NativeWindowHandle) | Out-Null
            $r = $switch.Current.BoundingRectangle
            [Dsa.RowInput]::SetCursorPos([int]($r.Right - 20), [int]($r.Y + $r.Height / 2)) | Out-Null
            Start-Sleep -Milliseconds 300
            [Dsa.RowInput]::mouse_event(2, 0, 0, 0, [System.UIntPtr]::Zero)
            [Dsa.RowInput]::mouse_event(4, 0, 0, 0, [System.UIntPtr]::Zero)
            Wait-Call 'app-window com.example.notes*--fixed-size on*'
            Start-Sleep -Seconds 1

            # Uninstall asks first, then runs; an app that is part of Android cannot be removed.
            Set-Search $window ''
            Assert-RowsShown $window $AppsFixtureLabels
            if ((Find-RowControl $window 'Settings' $types::Button 'Uninstall').Current.IsEnabled) { throw "an app that is part of Android offers to uninstall" }
            Press (Find-RowControl $window 'Reader' $types::Button 'Uninstall')
            $deadline = (Get-Date).AddSeconds(20)
            $confirm = $null
            $sameProcess = New-Object System.Windows.Automation.PropertyCondition($Auto::ProcessIdProperty, $app.Id)
            while (-not $confirm -and (Get-Date) -lt $deadline) {
              foreach ($top in $Auto::RootElement.FindAll($Scope::Children, $sameProcess)) {
                $confirm = Find-Typed $top $types::Button |
                  Where-Object { $_.Current.Name -eq 'Uninstall' -and $_.Current.HelpText -eq '' } | Select-Object -First 1
                if ($confirm) { break }
              }
              if (-not $confirm) { Start-Sleep -Milliseconds 250 }
            }
            if (-not $confirm) { throw "uninstalling asked nothing" }
            Press $confirm
            Wait-Call 'apps uninstall com.example.reader*'
            Assert-RowsShown $window $AppsFixtureLabels
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit(10000) | Out-Null

            # The Android log's list shows its lines.
            $app = Start-Process $exe -ArgumentList '--lang', 'en-US' -PassThru
            $window = Wait-ProcessWindow $app.Id 90
            if (-not $window) { throw "DSA Settings showed no window for the log page within 90 seconds" }
            Open-SettingsPage $window 'logs' 'en-US'
            $deadline = (Get-Date).AddSeconds(30)
            $lines = @()
            while ($lines.Count -eq 0 -and (Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1
              $lines = @(Find-Typed $window $types::Text |
                Where-Object { $_.Current.Name -like '*fixture line*' -and (Test-InWindow $window $_) -and $_.Current.BoundingRectangle.Height -gt 0 })
            }
            Save-WindowScreen $window "$PWD\screens\settings-logs.png"
            if ($lines.Count -eq 0) { throw "the Android log page shows no line of the log it read" }
            Write-Host "log lines in view: $($lines.Count)"
            Stop-Process -Id $app.Id -Force
            $app.WaitForExit(10000) | Out-Null
          } finally {
            Remove-Item Env:DSA_CLI -ErrorAction SilentlyContinue
          }

      # Task Manager and the taskbar name a program by its version information.
      - name: fr3_every_program_carries_its_name_and_version
        run: |
          $expected = [ordered]@{
            'dsa-hostd.exe' = 'Desktop Subsystem for Android Service'
            'dsa-wm.exe' = 'DSA Window Manager'
            'dsa-gfx.exe' = 'Graphics renderer for Android'
            'dsa.exe' = 'Desktop Subsystem for Android command line'
            'dsa-app-window.exe' = 'DSA app window'
          }
          foreach ($name in $expected.Keys) {
            $info = (Get-Item "$env:PROGRAM_DIR\$name").VersionInfo
            Write-Host "$name : $($info.FileDescription) | $($info.ProductName) | $($info.CompanyName) | $($info.ProductVersion)"
            if ($info.FileDescription -cne $expected[$name]) { throw "$name calls itself '$($info.FileDescription)', not '$($expected[$name])'" }
            if ($info.ProductName -cne 'Desktop Subsystem for Android') { throw "$name names its product '$($info.ProductName)'" }
            if ($info.CompanyName -cne 'ThisIsThePy') { throw "$name names its company '$($info.CompanyName)'" }
            if ($info.ProductVersion -cne '0.0.9') { throw "$name says it is version '$($info.ProductVersion)', not 0.0.9" }
          }
          $display = (Get-Service DsaHost).DisplayName
          if ($display -cne 'Desktop Subsystem for Android Service') { throw "the service is called '$display'" }

      - name: fr3_window_manager_installed_and_registered
        run: |
          if (-not (Test-Path "$env:PROGRAM_DIR\dsa-app-window.exe")) {
            throw "dsa-app-window.exe, which each app's window program is made from, is not installed in $env:PROGRAM_DIR"
          }
          if (-not (Test-Path "$env:PROGRAM_DIR\dsa-wm.exe")) {
            throw "dsa-wm.exe is not installed in $env:PROGRAM_DIR"
          }
          # The graphics renderer the window manager starts, beside it with gfxstream.
          if (-not (Test-Path "$env:PROGRAM_DIR\dsa-gfx.exe")) {
            throw "dsa-gfx.exe is not installed in $env:PROGRAM_DIR"
          }
          $runVal = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run').DsaWindowManager
          Write-Host "Run value: $runVal"
          if (-not $runVal) {
            throw "DsaWindowManager value missing from HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run"
          }
          if ($runVal -notmatch 'dsa-wm\.exe') {
            throw "DsaWindowManager Run value does not point to dsa-wm.exe: $runVal"
          }
          $cmdKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015be-facb-11e6-bd58-64006a7986d3'
          $pipeKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015bf-facb-11e6-bd58-64006a7986d3'
          if (-not (Test-Path $cmdKey)) {
            throw "Command stream GuestCommunicationServices key does not exist: $cmdKey"
          }
          $cmdName = (Get-ItemProperty $cmdKey).ElementName
          Write-Host "Command stream ElementName: $cmdName"
          if ($cmdName -ne 'Desktop Subsystem for Android Graphics Command Stream') {
            throw "Command stream ElementName mismatch: $cmdName"
          }
          if (-not (Test-Path $pipeKey)) {
            throw "Process pipe GuestCommunicationServices key does not exist: $pipeKey"
          }
          $pipeName = (Get-ItemProperty $pipeKey).ElementName
          Write-Host "Process pipe ElementName: $pipeName"
          if ($pipeName -ne 'Desktop Subsystem for Android Graphics Process Pipe') {
            throw "Process pipe ElementName mismatch: $pipeName"
          }          $audioKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015c0-facb-11e6-bd58-64006a7986d3'
          if (-not (Test-Path $audioKey)) {
            throw "Audio GuestCommunicationServices key does not exist: $audioKey"
          }
          $audioName = (Get-ItemProperty $audioKey).ElementName
          Write-Host "Audio ElementName: $audioName"
          if ($audioName -ne 'Desktop Subsystem for Android Audio') {
            throw "Audio ElementName mismatch: $audioName"
          }

      - name: nfr5_service_recovery_and_start_type
        run: |
          $qc = sc.exe qc DsaHost | Out-String
          Write-Host $qc
          if ($qc -notmatch 'START_TYPE\s+:\s+2\s+AUTO_START') { throw "DsaHost is not automatic start" }
          $qf = sc.exe qfailure DsaHost | Out-String
          Write-Host $qf
          if ($qf -notmatch 'RESTART') { throw "DsaHost has no restart failure actions" }
          $p = Get-Process dsa-hostd -ErrorAction Stop
          Stop-Process -Id $p.Id -Force
          $deadline = (Get-Date).AddSeconds(30)
          $restarted = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
            $svc = Get-Service DsaHost -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -eq 'Running') {
              $newProc = Get-Process dsa-hostd -ErrorAction SilentlyContinue
              if ($newProc -and $newProc.Id -ne $p.Id) {
                $restarted = $true
                break
              }
            }
          }
          if (-not $restarted) { throw "DsaHost was not restarted after process termination" }
          Write-Host "DsaHost restarted successfully with new process ID $($newProc.Id)"

      - name: nfr5_standard_user_can_start_service_but_cannot_stop_it
        run: |
          $sd = sc.exe sdshow DsaHost | Out-String
          Write-Host "DsaHost SDDL: $sd"

          $tempInf = "$env:TEMP\sec.inf"
          $tempSdb = "$env:TEMP\sec.sdb"
          secedit /export /cfg $tempInf /areas USER_RIGHTS
          $cfg = Get-Content $tempInf -Raw
          if ($cfg -match 'SeBatchLogonRight\s*=\s*(.*)') {
            $cfg = $cfg -replace 'SeBatchLogonRight\s*=\s*(.*)', 'SeBatchLogonRight = $1,*S-1-5-32-545'
          } else {
            $cfg = $cfg + "`r`n[Privilege Rights]`r`nSeBatchLogonRight = *S-1-5-32-545`r`n"
          }
          [System.IO.File]::WriteAllText($tempInf, $cfg, [System.Text.Encoding]::ASCII)
          secedit /configure /db $tempSdb /cfg $tempInf /areas USER_RIGHTS | Out-Null

          net accounts /minpwlen:0
          net user StdTestUser "Z9#kL$2mQ!vP8*wX" /add

          $startLog = "C:\Users\Public\dsa_test_start.log"
          $stopLog = "C:\Users\Public\dsa_test_stop.log"
          Remove-Item $startLog, $stopLog -ErrorAction SilentlyContinue

          try {
            # Stop the service as administrator first
            Stop-Service DsaHost
            (Get-Service DsaHost).WaitForStatus('Stopped', '00:00:30')
            if ((Get-Service DsaHost).Status -ne 'Stopped') { throw "DsaHost did not stop" }

            # Standard user can start the stopped service
            $startAction = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c C:\Windows\System32\sc.exe start DsaHost > $startLog 2>&1"
            $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries
            $startTask = Register-ScheduledTask -TaskName "DsaTestStartTask" -Action $startAction -User "StdTestUser" -Password "Z9#kL$2mQ!vP8*wX" -Settings $settings -Force
            Start-ScheduledTask -TaskName "DsaTestStartTask"
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-ScheduledTask -TaskName "DsaTestStartTask").State -eq 'Running' -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            while ((Get-Service DsaHost).Status -ne 'Running' -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            $out = Get-Content $startLog -Raw -ErrorAction SilentlyContinue
            Write-Host "Start log: $out"
            if ((Get-Service DsaHost).Status -ne 'Running') {
              throw "Standard user failed to start DsaHost: $out"
            }
            Write-Host "Standard user successfully started DsaHost"

            # Standard user cannot stop the running service
            $stopAction = New-ScheduledTaskAction -Execute "cmd.exe" -Argument "/c C:\Windows\System32\sc.exe stop DsaHost > $stopLog 2>&1"
            $stopTask = Register-ScheduledTask -TaskName "DsaTestStopTask" -Action $stopAction -User "StdTestUser" -Password "Z9#kL$2mQ!vP8*wX" -Settings $settings -Force
            Start-ScheduledTask -TaskName "DsaTestStopTask"
            $deadline = (Get-Date).AddSeconds(30)
            while ((Get-ScheduledTask -TaskName "DsaTestStopTask").State -eq 'Running' -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
            }
            Start-Sleep -Seconds 2
            $stopOut = Get-Content $stopLog -Raw -ErrorAction SilentlyContinue
            Write-Host "Stop log: $stopOut"
            if ($stopOut -notmatch 'Access is denied|5:') {
              throw "Standard user was able to stop DsaHost or did not get Access Denied: $stopOut"
            }
            if ((Get-Service DsaHost).Status -ne 'Running') {
              throw "DsaHost was stopped by standard user, but stopping must be denied"
            }
            Write-Host "Stopping DsaHost was correctly denied to standard user"
          } finally {
            Unregister-ScheduledTask -TaskName "DsaTestStartTask" -Confirm:$false -ErrorAction SilentlyContinue
            Unregister-ScheduledTask -TaskName "DsaTestStopTask" -Confirm:$false -ErrorAction SilentlyContinue
            Remove-LocalUser -Name "StdTestUser" -ErrorAction SilentlyContinue
            Remove-Item $startLog, $stopLog, $tempInf, $tempSdb -ErrorAction SilentlyContinue
          }

      - name: nfr7_installed_program_folder_contains_licence_bundle
        run: |
          $licDir = Join-Path $env:PROGRAM_DIR "licenses"
          $noticeFile = Join-Path $env:PROGRAM_DIR "NOTICE.txt"
          if (-not (Test-Path $licDir)) { throw "no licenses folder in $env:PROGRAM_DIR" }
          if (-not (Test-Path $noticeFile)) { throw "no NOTICE.txt in $env:PROGRAM_DIR" }
          foreach ($name in @("NOTICE.txt", "rust-crates.txt", "kernel-GPL-2.0.txt", "wix-MS-RL.txt", "setup-ui.txt", "settings-app.txt", "gfxstream.txt", "aosp-notice.txt", "third-party-components.txt", "kernel-source-offer.txt")) {
            if (-not (Test-Path (Join-Path $licDir $name))) { throw "licence bundle is missing $name" }
          }
          $bundle = Get-Content -Raw (Join-Path $licDir "rust-crates.txt")
          $lock = Get-Content -Raw "dsa\Cargo.lock"
          $crates = [regex]::Matches($lock, 'name = "([^"]+)"') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          $missing = @()
          foreach ($crate in $crates) {
            if ($bundle -notmatch "(?m)^$([regex]::Escape($crate))\s") {
              $missing += $crate
            }
          }
          if ($missing.Count -gt 0) {
            throw "The licence bundle is missing crates from Cargo.lock: $($missing -join ', ')"
          }
          Write-Host "The licence bundle contains all $($crates.Count) crates from Cargo.lock."

      - name: Check the first image and the configuration that names it
        run: |
          $image = "$env:DATA_DIR\images\images\17.0.0-1"
          foreach ($name in 'image.json', 'disk.vhdx', 'initrd.img', $env:KERNEL_NAME, 'NOTICE.txt') {
            if (-not (Test-Path "$image\$name")) { throw "the first image has no $name" }
          }
          $config = Get-Content -Raw "$env:DATA_DIR\dsa-hostd.json" | ConvertFrom-Json
          Write-Host ($config | ConvertTo-Json -Depth 5)
          if ($config.first_image.version -ne '17.0.0-1' -or $config.first_image.android_major -ne 17) {
            throw "the configuration does not name the first image"
          }
          if ($config.update.program_list_url -ne "$env:MIRROR\program.json") {
            throw "the configuration does not name the program list"
          }
          if ($config.update.program_dir -ne '{data}\updates') {
            throw "the configuration does not name the folder for setup files"
          }

      # The same package as a newer version, offered by a signed program list. dsa update
      # makes the installed service download it, run its setup.exe and restart as it. The
      # list is staged beside the mirror and put in place just before dsa update, so the
      # service's own first check (a minute after it started) cannot find it first.
      # 0.0.10 bundles a newer stand-in image, 17.0.0-2, whose disk has a disk's signature, so
      # the service takes its files as complete and must boot it in place of 17.0.0-1.
      # A repair, a reinstall from the command line, and a rebuild of the same version put
      # over the one installed, each as people run them: msiexec /fa, msiexec /i with
      # REINSTALL=ALL REINSTALLMODE=vamus, and a plain msiexec /i (a double-click) or the
      # REINSTALL command on a newer build. None of them may remove what only uninstalling
      # removes, and the service runs after each. Uninstalling, and what it removes, is the
      # Uninstall step below.
      - name: fr1_repair_reinstall_and_same_version_rebuild_keep_the_service_and_user_data
        run: |
          $userRoot = "$env:LOCALAPPDATA\DSA"
          $userMark = "$userRoot\repair-test.txt"
          $machineMark = "$env:DATA_DIR\settings\repair-test.txt"
          New-Item -ItemType Directory -Force $userRoot, "$env:DATA_DIR\settings" | Out-Null
          Set-Content $userMark 'kept'
          Set-Content $machineMark 'kept'
          $displayName = 'Desktop Subsystem for Android (test package)'
          function Get-Entries {
            @(Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*' |
              Where-Object { $_.DisplayName -eq $displayName })
          }
          function Invoke-Step([string] $what, [string] $log, [string[]] $arguments) {
            Write-Host "== $what"
            $p = Start-Process msiexec -Wait -PassThru -ArgumentList ($arguments + @('/qn', '/l*v', $log))
            if ($p.ExitCode -notin 0, 3010) {
              Select-String -Path $log -Pattern 'Error 27|Return value 3' | Select-Object -First 20 | ForEach-Object { $_.Line }
              Get-Content $log -Tail 80
              throw "$what failed ($($p.ExitCode))"
            }
            if (Select-String -Path $log -Pattern 'Action start [0-9:]+: Remove(UserData|MachineData|Images|Updates)\.' -Quiet) {
              throw "$what ran an action that only uninstalling may run"
            }
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Service DsaHost -ErrorAction SilentlyContinue).Status -ne 'Running') {
              if ((Get-Date) -gt $deadline) { throw "after $what the service is $((Get-Service DsaHost -ErrorAction SilentlyContinue).Status)" }
              Start-Sleep -Seconds 2
            }
            foreach ($name in 'dsa.exe', 'dsa-hostd.exe', 'dsa-wm.exe') {
              if (-not (Test-Path "$env:PROGRAM_DIR\$name")) { throw "after $what $name is missing" }
            }
            if (-not (Test-Path $userMark)) { throw "$what removed the user's files" }
            if (-not (Test-Path $machineMark)) { throw "$what removed the service's settings" }
            $entries = Get-Entries
            if ($entries.Count -ne 1) { throw "after $what $($entries.Count) entries are in the list of installed programs" }
            & "$env:PROGRAM_DIR\dsa.exe" status
            if ($LASTEXITCODE -ne 0) { throw "after $what dsa status failed" }
            Write-Host "$what kept the service and the data"
          }
          function Build-Again {
            dsa/host/platform/windows/installer/build.ps1 -Version 0.0.9 -PlaceholderKernel -Arch $env:DSA_ARCH `
              -ImageDir .scratch\stand-in-image -AndroidMajor 17 `
              -PipeSddl "D:P(A;;GA;;;SY)(A;;GRGW;;;IU)(A;;GRGW;;;AU)" `
              -ListUrl "$env:MIRROR\images.json" -TrustedKey $env:TEST_PUBLIC_KEY `
              -ProgramListUrl "$env:MIRROR\program.json"
            if (-not $?) { throw "building 0.0.9 again failed" }
          }
          $msi = (Resolve-Path 'dsa\target\installer\dsa-test-0.0.9.msi').Path
          Invoke-Step 'a repair (msiexec /fa)' 'repair-fa.log' @('/fa', "`"$msi`"")
          Invoke-Step 'a reinstall (REINSTALL=ALL REINSTALLMODE=vamus)' 'repair-vamus.log' @('/i', "`"$msi`"", 'REINSTALL=ALL', 'REINSTALLMODE=vamus')
          # A rebuild of the same version is a new product to Windows Installer, which takes
          # the place of the build before it.
          $before = (Get-Entries)[0].PSChildName
          Build-Again
          Invoke-Step 'a same-version rebuild installed as a double-click does' 'same-version.log' @('/i', "`"$msi`"")
          $after = (Get-Entries)[0].PSChildName
          if ($after -eq $before) { throw "the rebuild did not replace the build before it ($before)" }
          Build-Again
          Invoke-Step 'a same-version rebuild installed with REINSTALL=ALL REINSTALLMODE=vamus' 'same-version-vamus.log' @('/i', "`"$msi`"", 'REINSTALL=ALL', 'REINSTALLMODE=vamus')
          if ((Get-Entries)[0].PSChildName -eq $after) { throw "the second rebuild did not replace the first" }
          Remove-Item -Force $userMark, $machineMark

      - name: Build version 0.0.10 and offer it in the program list
        run: |
          $newer = (New-Item -ItemType Directory -Force .scratch\stand-in-image-2).FullName
          Copy-Item .scratch\stand-in-image\* $newer
          Set-Content -Path "$newer\disk.vhdx" -Value "vhdxfile, a newer stand-in disk" -NoNewline
          $manifest = Get-Content -Raw "$newer\image.json" | ConvertFrom-Json
          $manifest.version = "17.0.0-2"
          $manifest.build = 2
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "$newer\image.json"
          dsa/host/platform/windows/installer/build.ps1 -Version 0.0.10 -PlaceholderKernel -Arch $env:DSA_ARCH `
            -ImageDir .scratch\stand-in-image-2 -AndroidMajor 17 `
            -PipeSddl "D:P(A;;GA;;;SY)(A;;GRGW;;;IU)(A;;GRGW;;;AU)" `
            -ListUrl "$env:MIRROR\images.json" -TrustedKey $env:TEST_PUBLIC_KEY `
            -ProgramListUrl "$env:MIRROR\program.json"
          $setup = "$env:MIRROR\setup-0.0.10.exe"
          Copy-Item dsa\target\installer\setup-test-0.0.10.exe $setup
          $tool = "dsa\target\release\dsa-release.exe"
          $staged = (New-Item -ItemType Directory -Force .scratch\update-staged).FullName
          $list = & $tool program 0.0.10 $setup $setup
          if ($LASTEXITCODE -ne 0) { throw "writing the program list failed" }
          ($list -join "`n") + "`n" | Set-Content -NoNewline -Encoding utf8NoBOM "$staged\program.json"
          & $tool sign "$env:MIRROR\..\test-release.key" "$staged\program.json"
          if ($LASTEXITCODE -ne 0) { throw "signing the program list failed" }
          & $tool verify-program $env:TEST_PUBLIC_KEY "$staged\program.json"
          if ($LASTEXITCODE -ne 0) { throw "the program list does not verify" }
          Get-Content "$staged\program.json"

      - name: Update DSA to 0.0.10 with dsa update
        run: |
          # fr19: an upgrade removes the trace switch files earlier releases used, and keeps
          # the rest of the user's DSA folder.
          $userRoot = "$env:LOCALAPPDATA\DSA"
          New-Item -ItemType Directory -Force "$userRoot\apps\org.example", "$userRoot\logs" | Out-Null
          Set-Content "$userRoot\apps\org.example\Example.exe" 'app'
          Set-Content "$userRoot\logs\dsa-wm.log" 'log'
          Set-Content "$userRoot\monitors.txt" '1920x1080'
          Set-Content "$userRoot\start-menu.json" '{"shortcuts": {}}'
          foreach ($marker in 'input-trace', 'resize-trace') { Set-Content "$userRoot\$marker" '' -NoNewline }
          # An edited configuration must survive the upgrade.
          $configPath = "$env:DATA_DIR\dsa-hostd.json"
          $edited = Get-Content -Raw $configPath | ConvertFrom-Json
          $edited.update | Add-Member -NotePropertyName check_interval_hours -NotePropertyValue 48
          $edited | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM $configPath
          Copy-Item .scratch\update-staged\program.json, .scratch\update-staged\program.json.sig $env:MIRROR
          $out = & "$env:PROGRAM_DIR\dsa.exe" update --wait --timeout 600 2>&1
          $code = $LASTEXITCODE
          $out
          Get-Content "$env:DATA_DIR\logs\dsa-hostd.log" -Tail 40
          if ($code -ne 0) {
            Get-Service DsaHost | Format-List Name, Status
            Get-ChildItem "$env:DATA_DIR\logs" | Format-Table Name, Length, LastWriteTime
            Get-ChildItem "$env:DATA_DIR\logs\setup-*.msi.log" | ForEach-Object {
              "== $($_.Name)"
              Select-String -Path $_ -Pattern 'AppSearch|RegistrySearch|INSTALLFOLDER|DATAFOLDER|FindRelatedProducts|RemoveExistingProducts|StartServices|StopServices|DsaHost|Return value 3|Error 1' |
                Select-Object -First 80 | ForEach-Object { $_.Line }
            }
            sc.exe qc DsaHost
            Get-ItemProperty HKLM:\SOFTWARE\thisisthepy\DSA -ErrorAction SilentlyContinue
            Get-ChildItem "C:\ProgramData\DSA", "C:\Program Files\DSA", "$env:PROGRAM_DIR", "$env:DATA_DIR" -ErrorAction SilentlyContinue | Format-Table FullName, Length
            Get-Content "C:\ProgramData\DSA\logs\dsa-hostd.log" -ErrorAction SilentlyContinue
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; ProviderName = 'Service Control Manager' } -MaxEvents 15 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = 'MsiInstaller' } -MaxEvents 10 -ErrorAction SilentlyContinue |
              Format-List TimeCreated, Id, Message
            throw "dsa update failed ($code)"
          }
          if (-not ($out -match 'Update: DSA was updated to 0\.0\.10')) { throw "the user was not told about the update" }
          $service = Get-Service DsaHost
          if ($service.Status -ne 'Running') { throw "DsaHost is $($service.Status) after the update" }
          $log = Get-Content "$env:DATA_DIR\logs\dsa-hostd.log"
          if (-not ($log -match '^dsa-hostd 0\.0\.10:')) { throw "the service did not restart as 0.0.10" }
          # The upgrade stayed in the folders chosen at installation.
          $path = (Get-CimInstance Win32_Service -Filter "Name='DsaHost'").PathName
          Write-Host $path
          if (-not $path.StartsWith("`"$env:PROGRAM_DIR\")) { throw "the service moved to $path" }
          if (-not (Test-Path "$env:DATA_DIR\logs\setup-0.0.10.log")) { throw "setup left no log where the service said" }
          # setup.exe is still ending when the new service starts, so the file it ran from
          # goes on the service's next round, a minute later.
          $deadline = (Get-Date).AddMinutes(3)
          while ((Test-Path "$env:DATA_DIR\updates\0.0.10") -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 5 }
          if (Test-Path "$env:DATA_DIR\updates\0.0.10") { throw "the setup file was not removed after the update" }
          if ((Get-Content -Raw $configPath | ConvertFrom-Json).update.check_interval_hours -ne 48) {
            throw "the upgrade replaced the edited configuration"
          }
          # fr15: the kept configuration still names 17.0.0-1, but the upgrade's own record
          # names the image it bundled, and the service boots that one, on trial.
          $package = Get-Content -Raw "$env:DATA_DIR\installed-package.json" | ConvertFrom-Json
          if ($package.first_image.version -ne '17.0.0-2') { throw "the upgrade did not record the image it bundled" }
          if (-not (Test-Path "$env:DATA_DIR\images\images\17.0.0-2\image.json")) { throw "the upgrade did not install its image" }
          $state = Get-Content -Raw "$env:DATA_DIR\images\state.json" | ConvertFrom-Json
          Write-Host ($state | ConvertTo-Json -Depth 4)
          if ($state.current.version -ne '17.0.0-2' -or -not $state.on_trial) {
            throw "the service did not switch to the image the upgrade bundled"
          }
          if (-not ((Get-Content "$env:DATA_DIR\logs\dsa-hostd.log") -match 'this installation brought the image 17\.0\.0-2')) {
            throw "the service did not say it switched to the bundled image"
          }
          $status = & "$env:PROGRAM_DIR\dsa.exe" status 2>&1
          $status
          if (-not ($status -match 'Update: DSA was updated to 0\.0\.10')) { throw "dsa status does not tell about the update" }
          foreach ($marker in 'input-trace', 'resize-trace') {
            if (Test-Path "$userRoot\$marker") { throw "the upgrade left the old trace switch file $marker" }
          }
          foreach ($kept in 'apps\org.example\Example.exe', 'logs\dsa-wm.log', 'monitors.txt', 'start-menu.json') {
            if (-not (Test-Path "$userRoot\$kept")) { throw "the upgrade removed $kept from the user's folder" }
          }
          # The switch files turned the traces on; the rest of the run does not need them.
          & "$env:PROGRAM_DIR\dsa.exe" settings set input-trace off | Out-Null
          & "$env:PROGRAM_DIR\dsa.exe" settings set resize-trace off | Out-Null

      - name: Uninstall
        run: |
          $userRoot = "$env:LOCALAPPDATA\DSA"
          $hadDisk = Test-Path "$userRoot\android.vhdx"
          # Files the window manager and the app windows make in the user's folder, which
          # uninstalling must remove along with the rest.
          New-Item -ItemType Directory -Force "$userRoot\logs", "$userRoot\apps\org.example", "$userRoot\notifications" | Out-Null
          Set-Content "$userRoot\logs\dsa-wm.log" 'log'
          Set-Content "$userRoot\monitors.txt" '1920x1080'
          Set-Content "$userRoot\compositor.json" '{}'
          # fr23: an Android app's entry in Windows' list of installed apps, as the window
          # manager makes it, and another program's entry, which must stay.
          $installedApps = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $ours = "$installedApps\Thisisthepy.DSA.org.example"
          $theirs = "$installedApps\Dsa-Test-Another-Program"
          New-Item -Force $ours | Out-Null
          New-ItemProperty -Path $ours -Name DisplayName -Value 'Example' -Force | Out-Null
          New-Item -Force $theirs | Out-Null
          # fr29: the upgrade to this version left no "DSA Files" shortcut, and nor does uninstalling.
          $filesShortcut = "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\DSA Files.lnk"
          if (Test-Path $filesShortcut) { throw "the upgrade left the DSA Files Start menu shortcut" }
          Set-Content $filesShortcut 'left by an earlier version'
          $p = Start-Process 'dsa\target\installer\setup-test-0.0.10.exe' -Wait -PassThru -ArgumentList '/uninstall', '/quiet', '/log', 'uninstall.log'
          if ($p.ExitCode -ne 0) { Get-ChildItem uninstall*.log | ForEach-Object { Get-Content $_ -Tail 80 }; throw "uninstall failed ($($p.ExitCode))" }
          if (Test-Path $filesShortcut) { throw "uninstalling left the DSA Files Start menu shortcut" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (Test-Path "$env:PROGRAM_DIR\dsa.exe") { throw "the program is still there" }
          if (Test-Path "$env:PROGRAM_DIR\dsa-wm.exe") { throw "dsa-wm.exe is still there" }
          if (Test-Path "$env:PROGRAM_DIR\dsa-app-window.exe") { throw "dsa-app-window.exe is still there" }
          if (Test-Path "$env:PROGRAM_DIR\licenses") { throw "the licence folder is still there" }
          if (Test-Path "$env:DATA_DIR\images") { throw "the downloaded images are still there" }
          if (Test-Path "$env:DATA_DIR\updates") { throw "the downloaded setup files are still there" }
          foreach ($made in 'settings', 'logs', 'tmp') {
            if (Test-Path "$env:DATA_DIR\$made") { throw "the service's $made folder is still there" }
          }
          # fr19: everything DSA made in the user's folder goes but the Android disk.
          if ($hadDisk -and -not (Test-Path "$userRoot\android.vhdx")) { throw "the user's Android disk was removed" }
          $left = Get-ChildItem $userRoot -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -notin 'android.vhdx', 'android.image-version' }
          if ($left) { throw "uninstalling left in the user's folder: $($left.Name -join ', ')" }
          if (Test-Path $ours) { throw "uninstalling left an Android app in Windows' list of installed apps" }
          if (-not (Test-Path $theirs)) { throw "uninstalling removed another program's entry in the list of installed apps" }
          Remove-Item -Force $theirs
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $currentHash = (Get-FileHash -Path $wslconfig -Algorithm SHA256).Hash
          if ($currentHash -ne $env:INITIAL_WSLCONFIG_HASH) { throw ".wslconfig was modified during uninstall" }

      - name: fr3_window_manager_and_registry_removed_after_uninstall
        run: |
          if (Test-Path "$env:PROGRAM_DIR\dsa-wm.exe") {
            throw "dsa-wm.exe is still present after uninstall"
          }
          if (Test-Path "$env:PROGRAM_DIR\dsa-gfx.exe") {
            throw "dsa-gfx.exe is still present after uninstall"
          }
          $runVal = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue).DsaWindowManager
          if ($runVal) {
            throw "DsaWindowManager Run value is still present after uninstall: $runVal"
          }
          $cmdKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015be-facb-11e6-bd58-64006a7986d3'
          $pipeKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015bf-facb-11e6-bd58-64006a7986d3'
          if (Test-Path $cmdKey) {
            throw "Command stream GuestCommunicationServices key is still present after uninstall"
          }
          if (Test-Path $pipeKey) {
            throw "Process pipe GuestCommunicationServices key is still present after uninstall"
          }          $audioKey = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Virtualization\GuestCommunicationServices\000015c0-facb-11e6-bd58-64006a7986d3'
          if (Test-Path $audioKey) {
            throw "Audio GuestCommunicationServices key is still present after uninstall"
          }

      # A program file left from another version, or changed by hand after it was installed,
      # is replaced all the same: Windows Installer's own rules would keep a file whose version
      # is higher, or one without a version whose date says it was changed. A window manager
      # left running from it is ended first, and the new one started for the signed-in user.
      - name: fr1_installing_replaces_every_program_file_and_restarts_the_window_manager
        env:
          REPLACE_PROGRAM_DIR: 'C:\DSA Replace\Program'
          REPLACE_DATA_DIR: 'C:\DSA Replace\Data'
        run: |
          $msi = (Resolve-Path 'dsa\target\installer\dsa-test-0.0.9.msi').Path
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$PWD\admin-0.0.9`""
          if ($p.ExitCode -ne 0) { throw "taking the files out of the package failed ($($p.ExitCode))" }
          $packaged = (Get-ChildItem -Recurse -File admin-0.0.9 -Filter dsa-hostd.exe | Select-Object -First 1).DirectoryName
          Write-Host "the package's program folder: $packaged"
          # Stale copies: the newer 0.0.10 programs built since, and other files changed by
          # hand, all dated after they were made.
          $program = $env:REPLACE_PROGRAM_DIR
          New-Item -ItemType Directory -Force "$program\settings", "$program\licenses", "$program\vm" | Out-Null
          foreach ($name in 'dsa-hostd.exe', 'dsa-wm.exe', 'dsa-gfx.exe', 'dsa-app-window.exe', 'dsa.exe') {
            Copy-Item "dsa\target\$env:RUST_TARGET\release\$name" "$program\$name"
          }
          Copy-Item dsa\target\installer\settings-app\DsaSettings.exe "$program\settings\DsaSettings.exe"
          Copy-Item dsa\target\installer\settings-app\DsaApkInstaller.exe "$program\settings\DsaApkInstaller.exe"
          foreach ($name in 'gfxstream_backend.dll', 'NOTICE.txt', 'licenses\NOTICE.txt', 'licenses\gfxstream.txt', "vm\$env:KERNEL_NAME") {
            Set-Content "$program\$name" 'a stale copy' -NoNewline
          }
          Get-ChildItem -Recurse -File $program | ForEach-Object { $_.LastWriteTime = (Get-Date).AddDays(1) }
          $stale = Start-Process "$program\dsa-wm.exe" -PassThru
          Start-Sleep -Seconds 3
          $began = Get-Date
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', 'replace.log', "INSTALLFOLDER=`"$program`"", "DATAFOLDER=`"$env:REPLACE_DATA_DIR`""
          if ($p.ExitCode -ne 0) { Get-Content replace.log -Tail 80; throw "install failed ($($p.ExitCode))" }
          $differ = @()
          Get-ChildItem -Recurse -File $packaged | ForEach-Object {
            $relative = $_.FullName.Substring($packaged.Length + 1)
            $installed = Join-Path $program $relative
            if (-not (Test-Path $installed)) { $differ += "$relative is missing"; return }
            if ((Get-FileHash $installed).Hash -ne (Get-FileHash $_.FullName).Hash) { $differ += "$relative is not the package's" }
          }
          if ($differ) {
            Select-String -Path replace.log -Pattern 'Won''t Overwrite|Disallowing|StopPrograms|StartWindowManagers' | Select-Object -First 40 | ForEach-Object { $_.Line }
            throw "the installation kept files it should have replaced: $($differ -join '; ')"
          }
          Write-Host "every file of the package is in place"
          if (-not $stale.HasExited) { throw "the window manager left running from the old files is still running" }
          $old = Get-Process dsa-wm -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -lt $began }
          if ($old) { throw "a window manager started before the installation is still running" }
          $new = Get-Process dsa-wm -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$program\*" }
          Write-Host "window managers from the new files: $(@($new).Count)"
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', "`"$msi`"", '/qn', '/l*v', 'replace-uninstall.log'
          if ($p.ExitCode -ne 0) { Get-Content replace-uninstall.log -Tail 80; throw "uninstall failed ($($p.ExitCode))" }
          if (Get-Process dsa-wm -ErrorAction SilentlyContinue) { throw "uninstalling left the window manager running" }

      # setup.exe without its screens, into folders named on the command line; then the
      # package copied out of it.
      - name: Install and uninstall quietly with setup.exe, and copy out the package
        env:
          BUNDLE_PROGRAM_DIR: 'C:\DSA Bundle\Program'
          BUNDLE_DATA_DIR: 'C:\DSA Bundle\Data'
        run: |
          $p = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -Wait -PassThru -ArgumentList '/quiet', '/norestart', '/log', "$PWD\bundle-install.log", "InstallFolder=`"$env:BUNDLE_PROGRAM_DIR`"", "DataFolder=`"$env:BUNDLE_DATA_DIR`""
          if ($p.ExitCode -ne 0) { Get-Content bundle-install.log -Tail 80; throw "setup.exe /quiet failed ($($p.ExitCode))" }
          # A release installed over a development build of the same version replaces every
          # file: setup.exe runs the package with the "a" of REINSTALLMODE, not Burn's "muso",
          # whose "o" keeps files of an equal version.
          $applied = Select-String -Path bundle-install.log -Pattern 'Applying execute package: DsaPackage' | Select-Object -First 1
          if (-not $applied) { throw "bundle-install.log does not say how the package was run" }
          if ($applied.Line -notmatch 'REINSTALLMODE="[b-z]*a[b-z]*"') { throw "setup.exe ran the package without the a of REINSTALLMODE: $($applied.Line)" }
          $service = Get-Service DsaHost
          if ($service.Status -ne 'Running') { throw "DsaHost is $($service.Status)" }
          if (-not (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa.exe")) { throw "the program is not in the folder named on the command line" }
          if (-not (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa-wm.exe")) { throw "dsa-wm.exe is not in the folder named on the command line" }
          if (-not (Test-Path "$env:BUNDLE_DATA_DIR\dsa-hostd.json")) { throw "the configuration is not in the folder named on the command line" }
          if (-not (Test-Path "$env:BUNDLE_PROGRAM_DIR\licenses\NOTICE.txt")) { throw "no licence bundle in the quiet installation" }
          $out = & "$env:BUNDLE_PROGRAM_DIR\dsa.exe" status 2>&1
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dsa status: $out" }

          $p = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -Wait -PassThru -ArgumentList '/quiet', '/uninstall', '/norestart', '/log', "$PWD\bundle-uninstall.log"
          if ($p.ExitCode -ne 0) { Get-Content bundle-uninstall.log -Tail 80; throw "setup.exe /quiet /uninstall failed ($($p.ExitCode))" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa.exe") { throw "the program is still there" }
          if (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa-wm.exe") { throw "dsa-wm.exe is still there after quiet uninstall" }
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $currentHash = (Get-FileHash -Path $wslconfig -Algorithm SHA256).Hash
          if ($currentHash -ne $env:INITIAL_WSLCONFIG_HASH) { throw ".wslconfig was modified by setup.exe" }
          if (Test-Path "$env:BUNDLE_PROGRAM_DIR\licenses") { throw "the licence folder is still there after quiet uninstall" }

          # A release ships setup.exe only. /layout copies the bundle (its package is inside
          # it), and wix burn extract takes the package out for msiexec.
          $p = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -Wait -PassThru -ArgumentList '/quiet', '/layout', "$PWD\layout", '/log', "$PWD\bundle-layout.log"
          if ($p.ExitCode -ne 0) { Get-Content bundle-layout.log -Tail 80; throw "setup.exe /layout failed ($($p.ExitCode))" }
          if (-not (Test-Path "layout\setup-test-0.0.9.exe")) { throw "setup.exe /layout did not copy the bundle" }
          wix burn extract dsa\target\installer\setup-test-0.0.9.exe -o extracted
          if ($LASTEXITCODE -ne 0) { throw "wix burn extract failed" }
          Get-ChildItem -Recurse -File extracted | ForEach-Object { Write-Host $_.FullName }
          # The engine keeps payloads under generated names: the package is a0 and its image
          # cabinet a1 (the README says to rename them).
          $head = [System.IO.File]::ReadAllBytes("$PWD\extracted\a0")[0..3]
          if (($head -join ',') -ne '208,207,17,224') { throw "a0 is not the package (an MSI starts D0 CF 11 E0)" }
          $head = [System.IO.File]::ReadAllBytes("$PWD\extracted\a1")[0..3]
          if ([System.Text.Encoding]::ASCII.GetString($head) -ne 'MSCF') { throw "a1 is not the image cabinet" }

      # setup.exe through its screens, the way a person uses it: Install, then Done; then
      # Uninstall from the screen a second start shows. Pictures of each screen on the way.
      - name: Install and uninstall through setup.exe's screens
        run: |
          . .github/scripts/installer/setup-ui.ps1
          Set-AppTheme
          $setup = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -ArgumentList '/log', "$PWD\ui-install.log" -PassThru
          $null = $setup.Handle
          Invoke-SetupButton InstallButton
          # Installing the stand-in package is quick, so the picture of the progress screen
          # is taken when it can be; the result is what the test checks.
          try {
            Wait-SetupControl ProgressBar -Seconds 30 | Out-Null
            Save-SetupScreen "$PWD\screens\light-progress.png"
          } catch { Write-Host "no picture of the progress screen: $_" }
          Wait-SetupControl DoneButton -Seconds 300 | Out-Null
          Save-SetupScreen "$PWD\screens\light-done.png"
          $title = Get-SetupText ResultTitle
          if ($title -ne 'Installed') { throw "setup.exe ended on '$title'" }
          Invoke-SetupButton DoneButton
          $code = Wait-SetupExit $setup
          if ($code -ne 0) { Get-Content ui-install.log -Tail 80; throw "setup.exe returned $code" }
          if ((Get-Service DsaHost).Status -ne 'Running') { throw "DsaHost is not running" }

          Set-AppTheme -Dark
          $setup = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -ArgumentList '/log', "$PWD\ui-uninstall.log" -PassThru
          $null = $setup.Handle
          Wait-SetupControl UninstallButton -Enabled | Out-Null
          Save-SetupScreen "$PWD\screens\dark-maintenance.png"
          Invoke-SetupButton UninstallButton
          Wait-SetupControl DoneButton -Seconds 300 | Out-Null
          Save-SetupScreen "$PWD\screens\dark-uninstalled.png"
          $title = Get-SetupText ResultTitle
          if ($title -ne 'Uninstalled') { throw "setup.exe ended on '$title'" }
          Invoke-SetupButton DoneButton
          $code = Wait-SetupExit $setup
          Set-AppTheme
          if ($code -ne 0) { Get-Content ui-uninstall.log -Tail 80; throw "setup.exe returned $code" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }
          $wslconfig = "$env:USERPROFILE\.wslconfig"
          $currentHash = (Get-FileHash -Path $wslconfig -Algorithm SHA256).Hash
          if ($currentHash -ne $env:INITIAL_WSLCONFIG_HASH) { throw ".wslconfig was modified by setup.exe UI" }
          Remove-Item -Path $wslconfig -Force -ErrorAction SilentlyContinue

      # The upload takes files from the workspace only, and not from hidden folders.
      - name: Collect the service's and setup's logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force dsa\target\service-logs | Out-Null
          Copy-Item "$env:DATA_DIR\logs\*" dsa\target\service-logs -ErrorAction SilentlyContinue

      - name: Keep the installer, the logs and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-${{ matrix.version }}-${{ matrix.arch }}
          path: |
            dsa/target/installer/*.msi
            dsa/target/installer/*.cab
            dsa/target/installer/*.exe
            install.log
            uninstall*.log
            replace*.log
            bundle-*.log
            ui-*.log
            first-*.log
            setup-screen.png
            screens/*.png
            dsa/target/service-logs/
  # The arm64 package, built on an x64 machine (cross-compiled for aarch64-pc-windows-msvc,
  # the settings app for win-arm64), must refuse to install there: its package and its
  # setup.exe both say no, and nothing is left behind.
  arm64-on-x64:
    name: fr27_the_arm64_package_installs_only_on_arm64_windows (windows, 2025)
    runs-on: windows-2025
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Add the ARM64 Rust target
        run: rustup target add aarch64-pc-windows-msvc

      # The release build's dependencies come from this job's target folder of the last
      # develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: arm64-on-x64
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Build the arm64 package and setup.exe
        run: dsa/host/platform/windows/installer/build.ps1 -Version 0.0.9 -PlaceholderKernel -Arch arm64

      - name: Check that the package and its programs are arm64
        run: |
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $info = $installer.GetType().InvokeMember('SummaryInformation', 'GetProperty', $null, $installer, @((Resolve-Path dsa\target\installer\dsa-test-0.0.9.msi).Path, 0))
          $template = $info.GetType().InvokeMember('Property', 'GetProperty', $null, $info, 7)
          Write-Host "the package's platform: $template"
          if ($template -notlike 'Arm64;*') { throw "the arm64 package's platform is '$template'" }
          # IMAGE_FILE_MACHINE_ARM64 is 0xAA64, at the PE header's machine field.
          foreach ($program in Get-ChildItem dsa\target\installer\stage\*.exe, dsa\target\installer\settings-app\DsaSettings.exe, dsa\target\installer\settings-app\DsaApkInstaller.exe) {
            $bytes = [System.IO.File]::ReadAllBytes($program.FullName)
            $pe = [BitConverter]::ToInt32($bytes, 0x3c)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0xAA64) { throw "$($program.Name) is for machine 0x$('{0:X4}' -f $machine), not ARM64" }
          }

      - name: Check that neither installs on x64 Windows
        run: |
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', 'dsa\target\installer\dsa-test-0.0.9.msi', '/qn', '/l*v', 'arm64-msi.log'
          Write-Host "msiexec exit code: $($p.ExitCode)"
          if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { throw "the arm64 package installed on x64 Windows" }
          # An arm64 setup.exe is an ARM64 program, which x64 Windows refuses to start at all;
          # that refusal is as good as the bundle's own.
          try {
            $p = Start-Process 'dsa\target\installer\setup-test-0.0.9.exe' -Wait -PassThru -ArgumentList '/quiet', '/norestart', '/log', "$PWD\arm64-setup.log" -ErrorAction Stop
            Write-Host "setup.exe exit code: $($p.ExitCode)"
            if ($p.ExitCode -eq 0 -or $p.ExitCode -eq 3010) { throw "the arm64 setup.exe installed on x64 Windows" }
          } catch {
            if ($_.FullyQualifiedErrorId -notlike 'InvalidOperationException*') { throw }
            Write-Host "x64 Windows did not start the arm64 setup.exe: $($_.Exception.Message)"
          }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the DsaHost service was installed" }
          if (Test-Path "$env:ProgramFiles\DSA") { throw "the program folder was made" }

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-arm64-on-x64
          path: |
            arm64-msi.log
            arm64-setup.log


  # The package a person installs: the real guest kernel and the trust key of the published
  # images, the graphics library of the newest graphics build, no Android image (the
  # service downloads the newest supported one), and the published lists for updates. It
  # is built, checked and kept, never installed here: its service would download a whole
  # Android image.
  #
  # The x64 package takes its kernel from the newest published image and reads images.json
  # and program.json. The arm64 package takes the arm64 kernel (the artifact kernel-arm64 of
  # the newest kernel build that passed) and reads the arm64 lists, images-arm64.json and
  # program-arm64.json, so an ARM64 PC is never offered an x64 image or setup file.
  real-installer:
    name: Build the real installer (windows, ${{ matrix.runner }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2025, arch: x64, kernel: bzImage, gfxstream: host-gfxstream-windows, lists: "" }
          - { runner: windows-11-arm, arch: arm64, kernel: Image, gfxstream: host-gfxstream-windows-arm64, lists: "-arm64" }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DSA_ARCH: ${{ matrix.arch }}
      KERNEL_NAME: ${{ matrix.kernel }}
      GFXSTREAM_ARTIFACT: ${{ matrix.gfxstream }}
      LISTS: ${{ matrix.lists }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Set up .NET 8 for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Python for ARM64 Windows
        if: matrix.arch == 'arm64'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The release build's dependencies come from this job's target folder of the last
      # develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: real-installer-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2

      - name: Take the graphics library from the newest graphics build
        run: |
          $run = gh run list --repo $env:REPO --workflow test-graphics.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId'
          if (-not $run) { throw "no graphics build has succeeded, so there is no gfxstream_backend.dll to package" }
          gh run download $run --repo $env:REPO --name $env:GFXSTREAM_ARTIFACT --dir .scratch\host-gfxstream
          if ($LASTEXITCODE -ne 0) { throw "downloading $env:GFXSTREAM_ARTIFACT from run $run failed" }
          $dll = Get-ChildItem -Recurse -File .scratch\host-gfxstream -Filter gfxstream_backend.dll | Select-Object -First 1
          if (-not $dll -or $dll.Length -eq 0) { throw "run $run has no usable gfxstream_backend.dll" }
          Write-Host "gfxstream_backend.dll from graphics run $run ($($dll.Length) bytes)"
          "GFXSTREAM_DLL=$($dll.FullName)" >> $env:GITHUB_ENV

      - name: Take the kernel and the trust key from the published images
        env:
          SIGNING_KEY: ${{ secrets.DSA_RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:SIGNING_KEY) { throw "The DSA_RELEASE_SIGNING_KEY secret is not available to this run, so the published list cannot be trusted." }
          $published = (New-Item -ItemType Directory -Force .scratch\published).FullName
          gh release download images --repo $env:REPO --pattern 'images.json*' --dir $published
          if ($LASTEXITCODE -ne 0) { throw "downloading the published image list failed" }
          Push-Location dsa
          cargo build -q --release -p dsa-host-core --bin dsa-release
          if ($LASTEXITCODE -ne 0) { throw "building dsa-release failed" }
          Pop-Location
          $tool = "dsa\target\release\dsa-release.exe"
          $key = Join-Path $env:RUNNER_TEMP 'release.key'
          Set-Content -Path $key -Value $env:SIGNING_KEY
          $public = & $tool public-key $key
          Remove-Item $key
          & $tool verify $public "$published\images.json"
          if ($LASTEXITCODE -ne 0) { throw "the published image list does not verify" }
          $list = Get-Content -Raw "$published\images.json" | ConvertFrom-Json
          $newest = $list.images | Sort-Object android_major, build | Select-Object -Last 1
          if ($env:DSA_ARCH -eq 'x64') {
            $kernel = $newest.files | Where-Object name -eq 'bzImage'
            if (-not $kernel) { throw "the newest published image has no bzImage" }
            Invoke-WebRequest -Uri $kernel.url -OutFile "$published\bzImage"
            if ((Get-FileHash "$published\bzImage").Hash -ne $kernel.sha256.ToUpperInvariant()) { throw "the kernel does not match the signed list" }
            $kernelFrom = "the published image $($newest.version)"
          } else {
            # The arm64 kernel of the newest kernel build that passed.
            $run = gh run list --repo $env:REPO --workflow test-kernel.yml --status success --limit 20 --json databaseId --jq '.[].databaseId' |
              Where-Object { gh api "repos/$env:REPO/actions/runs/$_/artifacts" --jq '.artifacts[].name' | Select-String -SimpleMatch -Quiet 'kernel-arm64' } |
              Select-Object -First 1
            if (-not $run) { throw "no kernel build that passed has a kernel-arm64 artifact, so there is no arm64 kernel to package" }
            gh run download $run --repo $env:REPO --name kernel-arm64 --dir .scratch\kernel-arm64
            if ($LASTEXITCODE -ne 0) { throw "downloading kernel-arm64 from run $run failed" }
            $image = Get-ChildItem -Recurse -File .scratch\kernel-arm64 | Where-Object { $_.Name -like 'Image*' -and $_.Extension -notin '.gz', '.config' } | Select-Object -First 1
            if (-not $image -or $image.Length -eq 0) { throw "kernel-arm64 from run $run has no Image" }
            Copy-Item $image.FullName "$published\Image"
            $kernelFrom = "kernel build $run"
          }
          $major = ($list.supported_majors | Measure-Object -Maximum).Maximum
          # One patch above the newest published DSA, so it installs over that one; the
          # release of the same version later replaces it.
          $tag = gh release list --repo $env:REPO --limit 50 --json tagName --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]'
          $parts = $tag.TrimStart('v').Split('.')
          $version = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          Write-Host "the real $env:DSA_ARCH installer is version $version (the newest published DSA is $tag), Android $major, kernel of $kernelFrom"
          "PUBLIC_KEY=$public" >> $env:GITHUB_ENV
          "ANDROID_MAJOR=$major" >> $env:GITHUB_ENV
          "REAL_VERSION=$version" >> $env:GITHUB_ENV
          "KERNEL=$published\$env:KERNEL_NAME" >> $env:GITHUB_ENV

      - name: Build the real package and setup.exe
        run: >
          dsa/host/platform/windows/installer/build.ps1 -Version $env:REAL_VERSION -Arch $env:DSA_ARCH
          -Kernel $env:KERNEL -GfxstreamBackend $env:GFXSTREAM_DLL -AndroidMajor $env:ANDROID_MAJOR
          -ListUrl "https://github.com/$env:REPO/releases/download/images/images$env:LISTS.json"
          -TrustedKey $env:PUBLIC_KEY
          -ProgramListUrl "https://github.com/$env:REPO/releases/download/images/program$env:LISTS.json"

      # Nothing in it may be a test package's: not its name, not its stand-ins, not its lists.
      - name: Check that the package is the real one
        run: |
          $v = $env:REAL_VERSION
          $msi = (Resolve-Path "dsa\target\installer\dsa-$v.msi").Path
          if (-not (Test-Path "dsa\target\installer\setup-$v.exe")) { throw "there is no setup-$v.exe" }
          if (Get-ChildItem dsa\target\installer -Filter '*test*') { throw "a test package was built beside the real one" }
          if (Test-Path dsa\target\installer\image.cab) { throw "the real package carries an image" }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @("SELECT Value FROM Property WHERE Property='ProductName'"))
          $view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null) | Out-Null
          $record = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)
          $name = $record.GetType().InvokeMember('StringData', 'GetProperty', $null, $record, 1)
          if ($name -cne 'Desktop Subsystem for Android') { throw "the real package is named '$name'" }
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/a', "`"$msi`"", '/qn', "TARGETDIR=`"$PWD\real-admin`""
          if ($p.ExitCode -ne 0) { throw "taking the files out of the package failed ($($p.ExitCode))" }
          $dll = Get-ChildItem -Recurse -File real-admin -Filter gfxstream_backend.dll | Select-Object -First 1
          if ((Get-FileHash $dll.FullName).Hash -ne (Get-FileHash $env:GFXSTREAM_DLL).Hash) { throw "the package's gfxstream_backend.dll is not the graphics build's" }
          $kernel = Get-ChildItem -Recurse -File real-admin -Filter $env:KERNEL_NAME | Select-Object -First 1
          if ((Get-FileHash $kernel.FullName).Hash -ne (Get-FileHash $env:KERNEL).Hash) { throw "the package's kernel is not the published one" }
          if (Get-ChildItem -Recurse -File real-admin -Filter *.vhdx) { throw "the real package carries a disk" }
          $config = Get-Content -Raw (Get-ChildItem -Recurse -File real-admin -Filter dsa-hostd.json | Select-Object -First 1).FullName | ConvertFrom-Json
          Write-Host ($config | ConvertTo-Json -Depth 5)
          if ($config.test_package) { throw "the real package says it is a test package" }
          if ($config.first_image.version -ne 'none') { throw "the real package names a first image" }
          if ($config.pipe_sddl) { throw "the real package widens the pipe's access" }
          foreach ($url in $config.update.list_url, $config.update.program_list_url) {
            if ($url -notlike "https://github.com/$env:REPO/releases/download/*") { throw "the real package reads updates from $url" }
          }

      - name: Keep the real installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-real-windows${{ matrix.lists }}
          path: |
            dsa/target/installer/dsa-*.msi
            dsa/target/installer/setup-*.exe
          if-no-files-found: error
