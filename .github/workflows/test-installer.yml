# Builds the Windows installer and checks it on a real Windows machine: takes pictures of
# setup.exe's screens, installs the package, checks the service and the dsa command, and
# uninstalls; then does the same through setup.exe, quietly and through its screens. The
# kernel and the Android image are built elsewhere, so the package here carries a
# placeholder kernel and a small stand-in image laid out like a real one.

name: Installer test

on:
  pull_request:
    paths:
      - "dsa/**"
      - ".github/workflows/test-installer.yml"
  workflow_dispatch:

concurrency:
  group: test-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  installer:
    name: Build, install and uninstall the installer (windows-latest)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    # Somewhere other than the defaults, with spaces, so that the folders chosen at
    # installation are known to reach the service.
    env:
      PROGRAM_DIR: 'C:\DSA Test\Program'
      DATA_DIR: 'C:\DSA Test\Data'
    steps:
      - uses: actions/checkout@v4

      - name: Install WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix --version

      - name: Make a stand-in image
        run: |
          $dir = New-Item -ItemType Directory -Force .scratch\stand-in-image
          Set-Content -Path "$dir\disk.vhdx" -Value "a disk" -NoNewline
          Set-Content -Path "$dir\initrd.img" -Value "a ramdisk" -NoNewline
          Set-Content -Path "$dir\bzImage" -Value "a kernel" -NoNewline
          @{ version = "17.0.0-1"; android_major = 17; build = 1; kernel_cmdline = "console=ttyS0";
             files = @{ "disk.vhdx" = @{}; "initrd.img" = @{}; "bzImage" = @{} } } |
            ConvertTo-Json -Depth 4 | Set-Content -Path "$dir\image.json"

      # The runner's account is not an interactive user, which the default pipe access
      # would not admit, so the test build also admits authenticated users.
      - name: Build the package and setup.exe
        run: >
          dsa/host/platform/windows/installer/build.ps1 -Version 0.1.0 -PlaceholderKernel
          -ImageDir .scratch\stand-in-image -AndroidMajor 17
          -PipeSddl "D:P(A;;GA;;;SY)(A;;GRGW;;;IU)(A;;GRGW;;;AU)"

      # Nothing is installed yet, so setup.exe opens on its first screen. Pictures of it in
      # the light and the dark theme, of Change, and of the command line help.
      - name: Take pictures of setup.exe's first screens
        run: |
          . .github/scripts/installer/setup-ui.ps1
          New-Item -ItemType Directory -Force screens | Out-Null
          foreach ($theme in 'light', 'dark') {
            Set-AppTheme -Dark:($theme -eq 'dark')
            $setup = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -PassThru
            $null = $setup.Handle
            Wait-SetupControl InstallButton -Enabled | Out-Null
            Save-SetupScreen "$PWD\screens\$theme-install.png"
            if ($theme -eq 'light') { Copy-Item "screens\light-install.png" setup-screen.png }
            Invoke-SetupButton ChangeButton
            Wait-SetupControl ProgramFolderBox | Out-Null
            Save-SetupScreen "$PWD\screens\$theme-change.png"
            Invoke-SetupButton CancelButton
            Invoke-SetupButton CancelButton
            $code = Wait-SetupExit $setup
            if ($code -ne 1602) { throw "closing setup.exe from its first screen returned $code, not 1602" }
          }
          Set-AppTheme
          $setup = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -ArgumentList '/?' -PassThru
          $null = $setup.Handle
          Wait-SetupControl CloseButton -Enabled | Out-Null
          Save-SetupScreen "$PWD\screens\light-help.png"
          Invoke-SetupButton CloseButton
          Wait-SetupExit $setup | Out-Null

      - name: Install the package
        run: |
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', 'dsa\target\installer\dsa-0.1.0.msi', '/qn', '/l*v', 'install.log', "INSTALLFOLDER=`"$env:PROGRAM_DIR`"", "DATAFOLDER=`"$env:DATA_DIR`""
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 80; throw "install failed ($($p.ExitCode))" }

      - name: Check the service, the command and the access lists
        run: |
          $service = Get-Service DsaHost
          if ($service.Status -ne 'Running') { throw "DsaHost is $($service.Status)" }
          $out = & "$env:PROGRAM_DIR\dsa.exe" status 2>&1
          Write-Host $out
          if ($LASTEXITCODE -ne 0 -or -not ($out -match '^Android: Stopped')) { throw "dsa status: $out" }
          $acl = (Get-Acl $env:DATA_DIR).Sddl
          Write-Host $acl
          if ($acl -notmatch 'S-1-5-83-0') { throw "the VMs cannot read the data folder" }
          if ($acl -match ';;;BU\)') { throw "users can open the service's data folder" }
          Get-Content "$env:DATA_DIR\logs\dsa-hostd.log"
          # Asking for status made the service set up this user's Android, in their profile.
          if (-not (Test-Path "$env:LOCALAPPDATA\DSA")) { throw "no Android folder in the user's profile" }

      - name: Check the first image and the configuration that names it
        run: |
          $image = "$env:DATA_DIR\images\images\17.0.0-1"
          foreach ($name in 'image.json', 'disk.vhdx', 'initrd.img', 'bzImage') {
            if (-not (Test-Path "$image\$name")) { throw "the first image has no $name" }
          }
          $config = Get-Content -Raw "$env:DATA_DIR\dsa-hostd.json" | ConvertFrom-Json
          Write-Host ($config | ConvertTo-Json -Depth 5)
          if ($config.first_image.version -ne '17.0.0-1' -or $config.first_image.android_major -ne 17) {
            throw "the configuration does not name the first image"
          }

      - name: Uninstall
        run: |
          $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/x', 'dsa\target\installer\dsa-0.1.0.msi', '/qn', '/l*v', 'uninstall.log'
          if ($p.ExitCode -ne 0) { Get-Content uninstall.log -Tail 80; throw "uninstall failed ($($p.ExitCode))" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (Test-Path "$env:PROGRAM_DIR\dsa.exe") { throw "the program is still there" }
          if (Test-Path "$env:DATA_DIR\images") { throw "the downloaded images are still there" }
          if (-not (Test-Path "$env:LOCALAPPDATA\DSA")) { throw "each user's Android folder must stay" }

      # setup.exe without its screens, into folders named on the command line; then the
      # package copied out of it.
      - name: Install and uninstall quietly with setup.exe, and copy out the package
        env:
          BUNDLE_PROGRAM_DIR: 'C:\DSA Bundle\Program'
          BUNDLE_DATA_DIR: 'C:\DSA Bundle\Data'
        run: |
          $p = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -Wait -PassThru -ArgumentList '/quiet', '/norestart', '/log', "$PWD\bundle-install.log", "InstallFolder=`"$env:BUNDLE_PROGRAM_DIR`"", "DataFolder=`"$env:BUNDLE_DATA_DIR`""
          if ($p.ExitCode -ne 0) { Get-Content bundle-install.log -Tail 80; throw "setup.exe /quiet failed ($($p.ExitCode))" }
          $service = Get-Service DsaHost
          if ($service.Status -ne 'Running') { throw "DsaHost is $($service.Status)" }
          if (-not (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa.exe")) { throw "the program is not in the folder named on the command line" }
          if (-not (Test-Path "$env:BUNDLE_DATA_DIR\dsa-hostd.json")) { throw "the configuration is not in the folder named on the command line" }
          $out = & "$env:BUNDLE_PROGRAM_DIR\dsa.exe" status 2>&1
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "dsa status: $out" }

          $p = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -Wait -PassThru -ArgumentList '/quiet', '/uninstall', '/norestart', '/log', "$PWD\bundle-uninstall.log"
          if ($p.ExitCode -ne 0) { Get-Content bundle-uninstall.log -Tail 80; throw "setup.exe /quiet /uninstall failed ($($p.ExitCode))" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }
          if (Test-Path "$env:BUNDLE_PROGRAM_DIR\dsa.exe") { throw "the program is still there" }

          # A release ships setup.exe only; /layout takes the package out of it for msiexec.
          $p = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -Wait -PassThru -ArgumentList '/quiet', '/layout', "$PWD\layout", '/log', "$PWD\bundle-layout.log"
          if ($p.ExitCode -ne 0) { Get-Content bundle-layout.log -Tail 80; throw "setup.exe /layout failed ($($p.ExitCode))" }
          Get-ChildItem -Recurse layout | ForEach-Object { Write-Host $_.FullName }
          if (-not (Test-Path "layout\dsa-0.1.0.msi")) { throw "setup.exe /layout did not copy out the package" }

      # setup.exe through its screens, the way a person uses it: Install, then Done; then
      # Uninstall from the screen a second start shows. Pictures of each screen on the way.
      - name: Install and uninstall through setup.exe's screens
        run: |
          . .github/scripts/installer/setup-ui.ps1
          Set-AppTheme
          $setup = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -ArgumentList '/log', "$PWD\ui-install.log" -PassThru
          $null = $setup.Handle
          Invoke-SetupButton InstallButton
          # Installing the stand-in package is quick, so the picture of the progress screen
          # is taken when it can be; the result is what the test checks.
          try {
            Wait-SetupControl ProgressBar -Seconds 30 | Out-Null
            Save-SetupScreen "$PWD\screens\light-progress.png"
          } catch { Write-Host "no picture of the progress screen: $_" }
          Wait-SetupControl DoneButton -Seconds 300 | Out-Null
          Save-SetupScreen "$PWD\screens\light-done.png"
          $title = Get-SetupText ResultTitle
          if ($title -ne 'Installed') { throw "setup.exe ended on '$title'" }
          Invoke-SetupButton DoneButton
          $code = Wait-SetupExit $setup
          if ($code -ne 0) { Get-Content ui-install.log -Tail 80; throw "setup.exe returned $code" }
          if ((Get-Service DsaHost).Status -ne 'Running') { throw "DsaHost is not running" }

          Set-AppTheme -Dark
          $setup = Start-Process 'dsa\target\installer\setup-0.1.0.exe' -ArgumentList '/log', "$PWD\ui-uninstall.log" -PassThru
          $null = $setup.Handle
          Wait-SetupControl UninstallButton -Enabled | Out-Null
          Save-SetupScreen "$PWD\screens\dark-maintenance.png"
          Invoke-SetupButton UninstallButton
          Wait-SetupControl DoneButton -Seconds 300 | Out-Null
          Save-SetupScreen "$PWD\screens\dark-uninstalled.png"
          $title = Get-SetupText ResultTitle
          if ($title -ne 'Uninstalled') { throw "setup.exe ended on '$title'" }
          Invoke-SetupButton DoneButton
          $code = Wait-SetupExit $setup
          Set-AppTheme
          if ($code -ne 0) { Get-Content ui-uninstall.log -Tail 80; throw "setup.exe returned $code" }
          if (Get-Service DsaHost -ErrorAction SilentlyContinue) { throw "the service is still there" }

      - name: Keep the installer, the logs and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dsa/target/installer/*.msi
            dsa/target/installer/*.cab
            dsa/target/installer/*.exe
            install.log
            uninstall.log
            bundle-*.log
            ui-*.log
            setup-screen.png
            screens/*.png
