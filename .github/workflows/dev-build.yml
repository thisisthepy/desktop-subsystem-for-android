# Builds DSA for testing on one Windows x64 computer, without testing or publishing it: the
# guest kernel, the x86_64 image of the newest supported Android (with the patched framework
# and the default ARM translator, as a release has them) and the Windows x64 installer,
# signed with the release keys from the same secrets as a release. It makes them with the
# Image release's own jobs (release-image.yml, called with dev_build), so a development build
# is made exactly as a release is.
#
# It publishes nothing: no release, tag, image list, program list or channel, so no installed
# DSA ever sees it. What it made stays as workflow artifacts for three days:
#   development-image        the image's files, image.json and the kernel's source
#   development-image-list   images.json and images.json.sig, the signed list naming them
#   development-installer    DSA-v<version>-win-x64-setup.exe, SHA256SUMS.txt and the
#                            kernel's source
# The installer's version is <next release>-dev.<run number> (0.2.4-dev.12): newer than the
# release before it, older than the release it leads up to, which then reaches the computer
# as an ordinary update. The image's version is the next unpublished revision with
# -dev.<run number> after it (17.0.0-16373615-15-dev.12): newer than the installed image,
# and older than the release of that revision.
#
# By default it makes only what changed since the last Development build that made each
# part (.github/scripts/release/dev-build-plan.sh): a host change makes the installer alone
# (about ten minutes), a guest change the image alone (about twenty-five), both about
# twenty-five, as the installer builds beside the image. A kernel built from the same inputs
# comes from the cache. "build" chooses by hand.
#
# It runs only by hand, on develop, and runs no tests. scripts/install-dev-build.ps1 downloads
# a run's artifacts, checks them as the service would, and installs them:
#
#   gh workflow run dev-build.yml --ref develop
#   pwsh scripts/install-dev-build.ps1            (the newest successful run)
#   pwsh scripts/install-dev-build.ps1 -Run <id>
#
# In a fork
#
# A fork of the repository makes Development builds on its own runners, from its own develop.
# It finds the runs it builds on (Graphics test, Framework build, Translator build, earlier
# Development builds) in itself, so each of those has to have passed on the fork's develop
# once; run them by hand there first (gh workflow run <file> --repo <fork> --ref develop).
# It still reads what only the official repository publishes: the image releases (an image
# revision newer than every published one), and the signed image list, which the installer
# reads and trusts like any installed DSA, so the computer takes the next release as an
# ordinary update. Nothing a fork runs publishes anything: the Image release, the Site
# release and the Release sync run in the official repository only
# (.github/scripts/release/official-repository.sh).
#
# It signs with the fork's own repository secrets, under Settings > Secrets and variables >
# Actions, which must be the official repository's:
#   DSA_ANDROID_KEYS_1, _2 (and _3 if pack-keys.sh made it)   for the image
#   DSA_RELEASE_SIGNING_KEY                                  for the image and the installer
# A missing one fails the run before anything is built, naming it
# (.github/scripts/release/check-signing-secrets.sh). A different DSA_RELEASE_SIGNING_KEY
# fails it too: the official image list would not verify with it, and an installed DSA would
# take neither the image nor the installer.
#
# A fork's build installs from a clone of that fork, or with -Repo naming it:
#   gh workflow run dev-build.yml --repo <owner>/<fork> --ref develop
#   pwsh scripts/install-dev-build.ps1 -Repo <owner>/<fork>
# The script checks that the run is that repository's own Development build of its develop,
# and the installed service then checks the setup file and the image against the keys it
# already trusts, as for a build of the official repository. Being in a fork earns no trust.

name: Development build

on:
  # Started by hand only. GitHub dispatches a workflow once it is on the default branch or
  # has run at least once; this one has run in the official repository, and a fork runs it
  # by hand after its first push (gh workflow run dev-build.yml --ref develop).
  workflow_dispatch:
    inputs:
      build:
        description: "What to make: auto (what changed since the last Development build), all, image or installer"
        type: choice
        options:
          - auto
          - all
          - image
          - installer
        required: false
        default: auto
      next_release:
        description: "The release this build leads up to; the installer's version is <next_release>-dev.<run number>"
        required: false
        default: "0.2.4"

# A build in progress always finishes, and only the newest waiting one stays: GitHub keeps
# one pending run per group, so a newer run replaces the one still waiting. The group is the
# workflow and the branch, never the run. The Image release's jobs it calls keep their own
# group (development-build), which is a different name, so the two never wait on each other.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Decide what to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.plan.outputs.image }}
      installer: ${{ steps.plan.outputs.installer }}
      installer_version: ${{ steps.version.outputs.installer_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the branch and the version
        id: version
        env:
          REF: ${{ github.ref }}
          NEXT: ${{ inputs.next_release || '0.2.4' }}
        run: |
          if [[ "$REF" != refs/heads/develop ]]; then
            echo "::error::A Development build is made from develop only, not from $REF." >&2
            exit 1
          fi
          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::next_release is a release version such as 0.2.4, not $NEXT." >&2
            exit 1
          fi
          echo "installer_version=$NEXT-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decide what changed since the last Development build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD: ${{ inputs.build || 'auto' }}
        run: |
          bash .github/scripts/release/dev-build-plan.sh plan "$BUILD" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"
          if grep -qx 'image=false' "$GITHUB_OUTPUT" && grep -qx 'installer=false' "$GITHUB_OUTPUT"; then
            echo "::notice::Nothing the image or the installer is made from changed since the last Development build; run with build set to all, image or installer to make one anyway."
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.image == 'true' || needs.plan.outputs.installer == 'true'
    # The release's jobs ask for these; with dev_build they publish nothing.
    permissions:
      contents: write
      actions: write
      pull-requests: read
      issues: read
    uses: ./.github/workflows/release-image.yml
    secrets: inherit
    with:
      dev_build: true
      rebuild_images: ${{ needs.plan.outputs.image == 'true' }}
      installer_version: ${{ needs.plan.outputs.installer == 'true' && needs.plan.outputs.installer_version || '' }}
