# Publishes DSA's GitHub Pages site. A Pages deployment replaces the whole site, so this one
# workflow builds every part of it each time:
#   /           the guidebook, docs/site/
#   /apt, /rpm, /rpm-prerelease
#               the signed Linux package repositories, when the signing key is set: the
#               packages of a GitHub pre-release go to the pre-release channel only (the apt
#               suite prerelease and rpm-prerelease/), the others to both channels
#
# It runs when the guidebook changes on main (the release sync brings it there), by hand, and
# from "Linux repository release" after the packages of a version are attached to its
# release. Like every release it publishes only from main or develop
# (.github/scripts/release/release-branch-channel.sh); on any other branch or a tag it fails
# before building anything. The repositories need these repository secrets; without them the site carries the
# guidebook alone:
#   DSA_REPO_GPG_KEY          the ASCII-armored secret GPG key that signs the repositories
#   DSA_REPO_GPG_PASSPHRASE   its passphrase, if it has one
# Pages must be set to deploy from GitHub Actions.

name: Site release

on:
  push:
    branches: [main]
    paths:
      - docs/site/**
      - .github/workflows/release-site.yml
  workflow_dispatch:
  workflow_call:
    secrets:
      DSA_REPO_GPG_KEY:
        required: false
      DSA_REPO_GPG_PASSPHRASE:
        required: false

concurrency:
  group: release-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    # DSA's site and package repositories are published by the official repository only
    # (.github/scripts/release/official-repository.sh); in a fork this workflow does nothing.
    if: github.repository == 'thisisthepy/desktop-subsystem-for-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HAS_REPO_KEY: ${{ secrets.DSA_REPO_GPG_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      # The site carries the package repositories, so it is published only from main or
      # develop, like every release; a run on another branch or a tag fails here.
      - name: Check the branch
        env:
          REF: ${{ github.ref }}
        run: .github/scripts/release/release-branch-channel.sh "$REF"

      - name: Lay out the guidebook
        run: |
          mkdir -p .scratch/site
          cp -R docs/site/. .scratch/site/
          ls -l .scratch/site

      - name: Install the repository tools
        if: env.HAS_REPO_KEY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils rpm createrepo-c gnupg

      - name: Gather the packages of every release
        if: env.HAS_REPO_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .scratch/linux-packages .scratch/linux-prerelease-packages
          gh release list --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.tagName | startswith("v")) | "\(.tagName) \(.isPrerelease)"' \
            | while read -r tag prerelease; do
              if [[ "$prerelease" == true ]]; then
                dir=.scratch/linux-prerelease-packages
              else
                dir=.scratch/linux-packages
              fi
              gh release download "$tag" --dir "$dir" \
                --pattern '*.deb' --pattern '*.rpm' --skip-existing || true
            done
          ls -l .scratch/linux-packages .scratch/linux-prerelease-packages

      - name: Build the repositories into the site
        if: env.HAS_REPO_KEY == 'true'
        env:
          DSA_REPO_GPG_KEY: ${{ secrets.DSA_REPO_GPG_KEY }}
          DSA_REPO_GPG_PASSPHRASE: ${{ secrets.DSA_REPO_GPG_PASSPHRASE }}
        run: |
          .github/scripts/release/build-linux-repo.sh \
            --packages .scratch/linux-packages \
            --prerelease-packages .scratch/linux-prerelease-packages --out .scratch/linux-repo
          cp -R .scratch/linux-repo/. .scratch/site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .scratch/site

  deploy:
    name: Publish the site on GitHub Pages
    needs: build
    if: github.repository == 'thisisthepy/desktop-subsystem-for-android'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
