# Publishes DSA's Linux package repositories on GitHub Pages: the apt repository and the
# dnf and zypper repositories that the .deb and the .rpm register when they are installed.
#
# A Pages deployment replaces the whole site, so the repositories are built by
# "Site release" (release-site.yml) together with the guidebook; this workflow runs it. It
# gathers the .deb and .rpm files attached to every published v<version> release, so every
# published version stays installable, and signs the repositories with
# .github/scripts/release/build-linux-repo.sh.
#
# The packages of a release marked as a GitHub pre-release (every release below 1.0) go to the
# pre-release channel only: the apt suite prerelease and rpm-prerelease/. The others go to the
# stable channel and the pre-release one. Build each version's packages with the --channel
# of its release (build-packages.sh), so a first installation registers that channel.
#
# It runs only by hand, after the packages of a version are attached to its release, and only
# on main or develop: "Site release" refuses any other branch or a tag before it builds. The
# packages must be built with --repo-key set to the public half of the same key. It needs
# these repository secrets:
#   DSA_REPO_GPG_KEY          the ASCII-armored secret GPG key that signs the repositories
#   DSA_REPO_GPG_PASSPHRASE   its passphrase, if it has one
# Pages must be set to deploy from GitHub Actions.

name: Linux repository release

on:
  workflow_dispatch:

# A publication in progress always finishes, and only the newest waiting one stays. The
# group is the workflow and the branch; "Site release", which it calls, keeps its own group
# (release-site), a different name, so the two never wait on each other.
concurrency:
  group: release-linux-repo-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    name: Build and publish the site with the repositories
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/release-site.yml
    secrets:
      DSA_REPO_GPG_KEY: ${{ secrets.DSA_REPO_GPG_KEY }}
      DSA_REPO_GPG_PASSPHRASE: ${{ secrets.DSA_REPO_GPG_PASSPHRASE }}
