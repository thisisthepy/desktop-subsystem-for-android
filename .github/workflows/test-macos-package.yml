# Builds the macOS host, checks its code on macOS (the parts that call the macOS frameworks
# build only there), and packages it: DSA.app signed with the virtualization entitlement,
# in an installer package and a disk image, with the settings app (SwiftUI) as the bundle's own
# program. The package is checked for what it must carry.
name: macOS package test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  push:
    branches: [develop]
    paths:
      - "dsa/host/platform/macos/**"
      - "dsa/host/core/**"
      - "dsa/host/platform/unix/**"
      - "dsa/protocol/**"
      - "dsa/Cargo.toml"
      - "dsa/Cargo.lock"
      - ".github/workflows/test-macos-package.yml"
  workflow_dispatch:

concurrency:
  # On develop a run in progress finishes and only the newest waiting run stays: GitHub
  # keeps one pending run per group, so a newer merge replaces the one still waiting.
  # The newest run tests everything the dropped ones held. Anywhere else, such as a pull
  # request, a newer run still replaces the older one.
  group: test-macos-package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read

env:
  # File and line tables only in the debug builds of the Rust code: backtraces still name
  # the line, and the cached target folders stay a fraction of their full size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  package:
    name: Build and package the macOS host (macos, arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dsa
    steps:
      - uses: actions/checkout@v4

      # The dependencies come from this job's target folder of the last develop run.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: macos-package
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      - name: Lint the macOS host
        run: cargo clippy -p dsa-host-macos --all-targets -- -D warnings

      - name: Run the macOS host's tests
        run: cargo test -p dsa-host-macos

      - name: Build the macOS host's programs
        run: cargo build --release -p dsa-host-macos -p dsa-cli

      - name: Run the settings app's tests
        run: swift test --package-path host/platform/macos/settings --scratch-path target/dsa-settings

      - name: Package DSA.app, the installer package and the disk image
        run: |
          bash host/platform/macos/packaging/build-app.sh 0.1.0 target/release ../.scratch/macos-package

      - name: Check the bundle, its signature and its entitlements
        working-directory: .scratch/macos-package
        run: |
          plutil -lint DSA.app/Contents/Info.plist
          # Opening DSA.app opens the settings app: its window, menu bar item and Dock icon.
          test "$(plutil -extract CFBundleExecutable raw DSA.app/Contents/Info.plist)" = dsa-settings
          test -x DSA.app/Contents/MacOS/dsa-settings
          lipo -archs DSA.app/Contents/MacOS/dsa-settings | grep -Fq arm64
          # The window host each app's bundle copies ships in DSA.app too.
          # It lives in a helper bundle with its own identity, never as DSA.app itself, so opening
          # DSA.app always starts the settings app.
          test ! -e DSA.app/Contents/MacOS/dsa-app-window
          helper="DSA.app/Contents/Helpers/DSA App Window.app"
          test -x "$helper/Contents/MacOS/dsa-app-window"
          plutil -lint "$helper/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$helper/Contents/Info.plist")" = org.thisisthepy.dsa.window-host
          test "$(plutil -extract CFBundleExecutable raw "$helper/Contents/Info.plist")" = dsa-app-window
          test "$(plutil -extract CFBundleIdentifier raw DSA.app/Contents/Info.plist)" != org.thisisthepy.dsa.window-host
          codesign --verify --strict "$helper"
          test -s "$helper/Contents/Resources/DSA.icns"
          # The layered Icon Composer source of the icon, with each layer it names.
          # plutil -lint reads only property lists, so the JSON is checked with jq.
          jq -e .groups DSA.icon/icon.json > /dev/null
          test -s DSA.icon/Assets/window.png
          test -s DSA.icon/Assets/title-bar.png
          grep -Fq window.png DSA.icon/icon.json
          grep -Fq title-bar.png DSA.icon/icon.json
          # The menu bar's template image, at 1x and 2x.
          test -s DSA.app/Contents/Resources/MenuBarTemplate.png
          test -s DSA.app/Contents/Resources/MenuBarTemplate@2x.png
          # The icon holds every size from 16 to 1024 px.
          test "$(plutil -extract CFBundleIconFile raw DSA.app/Contents/Info.plist)" = DSA
          iconutil -c iconset -o icon-check.iconset DSA.app/Contents/Resources/DSA.icns
          for size in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x 256x256 256x256@2x 512x512 512x512@2x; do
            test -s "icon-check.iconset/icon_$size.png"
          done
          # Each companion app has its own icon with every size, none with a badge: Settings
          # and Files are DSA's own icon, the APK Installer the open box.
          for icon in Settings ApkInstaller Files; do
            rm -rf icon-check.iconset
            iconutil -c iconset -o icon-check.iconset "DSA.app/Contents/Resources/$icon.icns"
            for size in 16x16 16x16@2x 32x32 32x32@2x 128x128 128x128@2x 256x256 256x256@2x 512x512 512x512@2x; do
              test -s "icon-check.iconset/icon_$size.png"
            done
          done
          cmp DSA.app/Contents/Resources/Settings.icns DSA.app/Contents/Resources/DSA.icns
          cmp DSA.app/Contents/Resources/Files.icns DSA.app/Contents/Resources/DSA.icns
          if cmp -s DSA.app/Contents/Resources/ApkInstaller.icns DSA.app/Contents/Resources/DSA.icns; then
            echo "ApkInstaller.icns is DSA's own icon, not the open box" >&2
            exit 1
          fi
          # The settings app speaks English and Korean.
          plutil -extract CFBundleLocalizations xml1 -o - DSA.app/Contents/Info.plist | grep -Fq '<string>ko</string>'
          for language in en ko; do
            plutil -lint "DSA.app/Contents/Resources/$language.lproj/Localizable.strings"
          done
          plutil -convert json -o - DSA.app/Contents/Resources/ko.lproj/Localizable.strings | grep -Fq '"NavGeneral.Content"'
          test -x DSA.app/Contents/MacOS/dsa
          # The window manager ships beside the service, which starts it through its agent.
          test -x DSA.app/Contents/MacOS/dsa-wm
          test -x DSA.app/Contents/MacOS/dsa-hostd
          DSA.app/Contents/MacOS/dsa-wm version | grep -Fq dsa-wm
          # The graphics renderer, which the window manager starts in a process of its own, and
          # signed like the other programs.
          test -x DSA.app/Contents/MacOS/dsa-gfx
          codesign --verify --strict DSA.app/Contents/MacOS/dsa-gfx
          # The device lender ships beside them too, with its identity and the reasons for
          # its camera, microphone and location prompts embedded in it.
          test -x DSA.app/Contents/MacOS/dsa-devices
          DSA.app/Contents/MacOS/dsa-devices version | grep -Fq dsa-devices
          otool -s __TEXT __info_plist DSA.app/Contents/MacOS/dsa-devices | grep -Fq '__info_plist'
          codesign -d -vv DSA.app/Contents/MacOS/dsa-devices > devices-sign.txt 2>&1
          grep -Fxq 'Identifier=org.thisisthepy.dsa.devices' devices-sign.txt
          grep -Eq 'Info.plist entries=[1-9]' devices-sign.txt
          devices_plist="$GITHUB_WORKSPACE/dsa/host/platform/macos/packaging/dsa-devices-Info.plist"
          plutil -lint "$devices_plist"
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSLocationWhenInUseUsageDescription; do
            plutil -extract "$key" raw "$devices_plist" > /dev/null
            plutil -extract "$key" raw DSA.app/Contents/Info.plist > /dev/null
          done
          codesign -d --entitlements - --xml DSA.app/Contents/MacOS/dsa-devices > devices-entitlements.plist
          for key in com.apple.security.device.camera com.apple.security.device.audio-input com.apple.security.personal-information.location; do
            # plutil reads dots as a key path, so the keys are found as text.
            tr -d ' \t\n' < devices-entitlements.plist | grep -Fq "<key>$key</key><true/>"
          done
          codesign --verify --strict DSA.app
          codesign -d --entitlements - --xml DSA.app > entitlements.plist
          tr -d ' \t\n' < entitlements.plist \
            | grep -Fq '<key>com.apple.security.virtualization</key><true/>'
          lipo -archs "DSA.app/Contents/Helpers/DSA App Window.app/Contents/MacOS/dsa-app-window" | grep -Fq arm64

      - name: Check the installer package installs DSA.app into Applications
        working-directory: .scratch/macos-package
        run: |
          pkgutil --check-signature DSA-0.1.0.pkg || true
          pkgutil --payload-files DSA-0.1.0.pkg | grep -Fq './DSA.app/Contents/Helpers/DSA App Window.app/Contents/MacOS/dsa-app-window'
          pkgutil --payload-files DSA-0.1.0.pkg | grep -Fq './DSA.app/Contents/Info.plist'
          pkgutil --payload-files DSA-0.1.0.pkg | grep -Fq './DSA.app/Contents/MacOS/dsa-devices'
          pkgutil --payload-files DSA-0.1.0.pkg | grep -Fq './DSA.app/Contents/MacOS/dsa-settings'
          pkgutil --payload-files DSA-0.1.0.pkg | grep -Fq './DSA.app/Contents/Resources/DSA.icns'

      - name: Check the disk image holds DSA.app
        working-directory: .scratch/macos-package
        run: |
          hdiutil verify DSA-0.1.0.dmg
          mount="$(mktemp -d "$RUNNER_TEMP/dsa-dmg.XXXXXX")"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" DSA-0.1.0.dmg
          test -x "$mount/DSA.app/Contents/Helpers/DSA App Window.app/Contents/MacOS/dsa-app-window"
          test -x "$mount/DSA.app/Contents/MacOS/dsa-settings"
          test -s "$mount/DSA.app/Contents/Resources/DSA.icns"
          codesign --verify --strict "$mount/DSA.app"
          hdiutil detach "$mount"

      - name: Keep the package and the disk image
        uses: actions/upload-artifact@v4
        with:
          name: dsa-macos-package
          path: |
            .scratch/macos-package/DSA-0.1.0.pkg
            .scratch/macos-package/DSA-0.1.0.dmg
            .scratch/macos-package/DSA.icon
          if-no-files-found: error
