# Makes the guest images from the pinned AOSP build inputs (dsa/guest/image/inputs.json)
# and checks them: the shell apps are gone, the build is not debuggable, nothing is signed
# with AOSP's test keys, the agent is there and signed with the platform key, and the user
# disk template and ramdisk match image.json. Each run signs with a throwaway key set; a
# release signs with the project's keys.
#
# The Android 17 x86_64 image is then booted by eight boot checks at once, each on a runner of
# its own, with the guest kernel built from the same commit. That image is kept in the Actions
# cache, keyed on everything that decides it, so a run whose inputs did not change takes it
# from there instead of making it again; the checks run on it all the same. A ninth check boots
# the same image made with uncompressed partitions, to measure the host's direct-mapped mode.

name: Image test

on:
  # Only develop is built and tested: features are integrated there and fixed there.
  push:
    branches: [develop]
    paths:
      - "dsa/guest/image/**"
      - "dsa/graphics/**"
      - "dsa/kernel/**"
      - "dsa/guest/channeld/**"
      - "dsa/guest/hwcomposer/**"
      - "dsa/guest/codec2/**"
      - "dsa/guest/audio/**"
      - "dsa/guest/sensors/**"
      - "dsa/guest/camera/**"
      - "dsa/guest/power/**"
      - "dsa/guest/gnss/**"
      - "dsa/guest/aidl/**"
      - "dsa/guest/transport/**"
      - "dsa/guest/agent/**"
      - "dsa/guest/aidl/**"
      - "dsa/protocol/**"
      - "dsa/guest/media-probe/**"
      - "dsa/guest/widget-probe/**"
      - "dsa/guest/arm-probe/**"
      - "dsa/guest/gms-probe/**"
      - "dsa/host/platform/linux/tests/widgets.rs"
      - "dsa/host/platform/linux/tests/media.rs"
      - "dsa/host/platform/linux/tests/system_screens.rs"
      - "dsa/host/platform/linux/tests/graphics.rs"
      - "dsa/host/platform/linux/tests/overlays.rs"
      - "dsa/host/platform/linux/tests/boot_check/**"
      - "dsa/host/platform/linux/tests/idle_reclaim/**"
      - "dsa/host/platform/linux/tests/memory_check/**"
      - ".github/scripts/linux-vm/**"
      - ".github/scripts/cache/prune.sh"
      - ".github/workflows/test-image.yml"
      - "scripts/tests/image-graphics-workflow.test.sh"
      - "scripts/tests/image-audio-workflow.test.sh"
      - "scripts/tests/image-media-workflow.test.sh"
      - "scripts/tests/image-boot-overlays-workflow.test.sh"
      - "scripts/tests/image-boot-check-image-dir.test.sh"
      - "scripts/tests/image-cache-workflow.test.sh"
      - "scripts/tests/image-boot-parallel-workflow.test.sh"
      - "dsa/host/platform/linux/src/config.rs"
      - "dsa/host/platform/linux/src/crosvm.rs"
      - "dsa/host/platform/linux/src/launcher.rs"
      - "dsa/host/core/src/addon_disk.rs"
      - "dsa/host/core/src/direct_mapped.rs"
  workflow_dispatch:
    inputs:
      keep_disk:
        description: "Keep each generated image (its disks, initrd and image.json) as an artifact for a local boot check"
        type: boolean
        required: false
        default: false
      android:
        description: "Android release to make. Use all for the compatibility run."
        type: choice
        required: false
        default: "17"
        options:
          - "17"
          - "16"
          - all
      graphics_run:
        description: "Graphics test run that produced guest-gfxstream-hvsocket"
        type: string
        required: false
        default: ""

concurrency:
  # On develop a run in progress finishes and only the newest waiting run stays: GitHub
  # keeps one pending run per group, so a newer merge replaces the one still waiting.
  # The newest run tests everything the dropped ones held. Anywhere else, such as a pull
  # request, a newer run still replaces the older one.
  group: test-image-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

permissions:
  contents: read
  actions: read

env:
  # File and line tables only in the debug builds of the Rust code: backtraces still name
  # the line, and the cached target folders stay a fraction of their full size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The guest's own programs for one architecture, built one after another on one runner:
  # the graphics transport, the control daemon, the hwcomposer and the HALs. One job instead
  # of one per program holds two runners instead of eighteen, and sets up the NDK, the
  # fetched sources and the compiler cache once. Each program has its own steps and its own
  # artifact, so a failed step names the program. A failure does not stop the programs after
  # it, so one failure does not hide another, and the job still fails.
  guest-programs:
    name: Build the guest programs (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    permissions:
      contents: read
      # Deletes the compiler cache a new one replaces.
      actions: write
    env:
      DSA_GUEST_ARCH: ${{ matrix.arch }}
      # What readelf calls the guest's machine.
      GUEST_MACHINE: ${{ matrix.arch == 'arm64' && 'AArch64' || 'Advanced Micro Devices X86-64' }}
      # CMake (and the graphics build's Meson) compile through ccache, whose cache is kept
      # between develop runs.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_DIR: ${{ github.workspace }}/.scratch/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
      # The NDK is installed again on each run, so its compilers are told apart by what
      # they say they are, not by their file times.
      CCACHE_COMPILERCHECK: "%compiler% --version"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
          ccache --version | head -1

      # The pinned upstream revisions, the patches and the build scripts decide what the
      # compiler cache holds, so they name it.
      - name: Name the compiler cache
        run: echo "COMPILER_CACHE_KEY=ccache-guest-programs-${{ matrix.arch }}-${{ hashFiles('dsa/graphics/fetch.sh', 'dsa/graphics/build.sh', 'dsa/graphics/patches/**', 'dsa/guest/*/fetch.sh', 'dsa/guest/*/build.sh') }}" >> "$GITHUB_ENV"

      - name: Restore the compiler cache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}
          restore-keys: ccache-guest-programs-${{ matrix.arch }}-

      # dsa-channeld is Rust: its dependencies come from the last develop run's target folder.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: guest-programs-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The graphics transport and most HALs build with r26b; the codec and camera HALs with
      # r27c, which is set up after them.
      - name: Set up Android NDK
        id: ndk26
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Fetch gfxstream and guest build dependencies
        id: graphics-fetch
        run: bash dsa/graphics/fetch.sh .scratch/gfxstream

      - name: Build the guest Hyper-V graphics transport
        id: graphics
        if: ${{ !cancelled() && steps.graphics-fetch.outcome == 'success' }}
        run: bash dsa/graphics/build.sh .scratch .scratch/build

      - name: Verify ELF architecture and exported Hyper-V symbols
        id: graphics-verify
        if: ${{ !cancelled() && steps.graphics.outcome == 'success' }}
        run: |
          target=".scratch/build/libOpenglSystemCommon.so"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          nm -D "$target" | grep -Fq 'HvSocketStream'
          nm -D "$target" | grep -Fq 'goldfish_get_egl_tls'
          target_vk=".scratch/build/vulkan.ranchu.so"
          readelf -h "$target_vk" | grep -Fq "$GUEST_MACHINE"
          # The Android loader looks up HMI and nothing else; everything else stays hidden.
          exports=$(nm -D --defined-only "$target_vk" | awk '{print $3}')
          test "$exports" = "HMI"
          grep -aFq 'hvsocket' "$target_vk"

      - name: Keep the patched guest library
        if: ${{ !cancelled() && steps.graphics-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-gfxstream-hvsocket${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/build/libOpenglSystemCommon.so
            .scratch/build/vulkan.ranchu.so
          if-no-files-found: error

      - name: Build dsa-channeld for the guest
        id: channeld
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/channeld/build-android.sh .scratch/channeld

      - name: Keep the daemon
        if: ${{ !cancelled() && steps.channeld.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-channeld${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/channeld/dsa-channeld
            .scratch/channeld/su
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-hwcomposer for the guest
        id: hwcomposer
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/hwcomposer/build.sh .scratch .scratch/build-hwcomposer

      - name: Verify the hwcomposer links only the platform's C libraries
        id: hwcomposer-verify
        if: ${{ !cancelled() && steps.hwcomposer.outcome == 'success' }}
        run: |
          target=".scratch/build-hwcomposer/dsa-hwcomposer"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so"

      - name: Keep the hwcomposer
        if: ${{ !cancelled() && steps.hwcomposer-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-hwcomposer${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-hwcomposer/dsa-hwcomposer
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-power and dsa-health for the guest
        id: power
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/power/build.sh .scratch .scratch/build-power

      - name: Verify the power and health HALs link only the platform's C libraries
        id: power-verify
        if: ${{ !cancelled() && steps.power.outcome == 'success' }}
        run: |
          for target in .scratch/build-power/dsa-power .scratch/build-power/dsa-health; do
            readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
            needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
            echo "$target needs: $needed"
            test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so"
          done

      - name: Keep the power and health HALs
        if: ${{ !cancelled() && steps.power-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-power-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: |
            .scratch/build-power/dsa-power
            .scratch/build-power/dsa-health
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-audio for the guest
        id: audio
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/audio/build.sh .scratch .scratch/build-audio

      - name: Verify the audio module links only the platform's C libraries
        id: audio-verify
        if: ${{ !cancelled() && steps.audio.outcome == 'success' }}
        run: |
          target=".scratch/build-audio/dsa-audio"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so"

      - name: Keep the audio module
        if: ${{ !cancelled() && steps.audio-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-audio${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-audio/dsa-audio
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-gnss for the guest
        id: gnss
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/gnss/build.sh .scratch .scratch/build-gnss

      - name: Verify the GNSS HAL links only the platform's C libraries
        id: gnss-verify
        if: ${{ !cancelled() && steps.gnss.outcome == 'success' }}
        run: |
          target=.scratch/build-gnss/dsa-gnss
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "$target needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so libm.so"

      - name: Keep the GNSS HAL
        if: ${{ !cancelled() && steps.gnss-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-gnss-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-gnss/dsa-gnss
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-sensors for the guest
        id: sensors
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk26.outputs.ndk-path }}
        run: bash dsa/guest/sensors/build.sh .scratch .scratch/build-sensors

      - name: Verify the sensors HAL links only the platform's C libraries
        id: sensors-verify
        if: ${{ !cancelled() && steps.sensors.outcome == 'success' }}
        run: |
          target=".scratch/build-sensors/dsa-sensors"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so"

      - name: Keep the sensors HAL
        if: ${{ !cancelled() && steps.sensors-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-sensors${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-sensors/dsa-sensors
          if-no-files-found: error

      - name: Set up Android NDK r27c
        id: ndk27
        if: ${{ !cancelled() }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-codec2 for the guest
        id: codec2
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk27.outputs.ndk-path }}
        run: bash dsa/guest/codec2/build.sh .scratch .scratch/build-codec2

      - name: Verify the codec HAL links only the platform's C libraries
        id: codec2-verify
        if: ${{ !cancelled() && steps.codec2.outcome == 'success' }}
        run: |
          target=".scratch/build-codec2/dsa-codec2"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so libm.so libnativewindow.so" || \
            test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so libnativewindow.so"

      - name: Keep the codec HAL
        if: ${{ !cancelled() && steps.codec2-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-codec2${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-codec2/dsa-codec2
          if-no-files-found: error

      # aidl comes from the runner's Android SDK build-tools.
      - name: Build dsa-camera for the guest
        id: camera
        if: ${{ !cancelled() }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk27.outputs.ndk-path }}
        run: bash dsa/guest/camera/build.sh .scratch .scratch/build-camera

      - name: Verify the camera HAL links only the platform's C libraries
        id: camera-verify
        if: ${{ !cancelled() && steps.camera.outcome == 'success' }}
        run: |
          target=".scratch/build-camera/dsa-camera"
          readelf -h "$target" | grep -Fq "$GUEST_MACHINE"
          needed=$(readelf -d "$target" | sed -nE 's/.*NEEDED.*\[(.*)\]/\1/p' | sort | xargs)
          echo "needs: $needed"
          test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so libm.so libnativewindow.so" || \
            test "$needed" = "libbinder_ndk.so libc.so libdl.so liblog.so libnativewindow.so"

      - name: Keep the camera HAL
        if: ${{ !cancelled() && steps.camera-verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-camera${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/build-camera/dsa-camera
          if-no-files-found: error

      - name: Show what the compiler cache did
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .scratch/ccache
          key: ${{ env.COMPILER_CACHE_KEY }}

      - name: Delete the compiler cache it replaces
        if: ${{ !cancelled() && github.ref == 'refs/heads/develop' && steps.ccache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "ccache-guest-programs-${{ matrix.arch }}-" "$COMPILER_CACHE_KEY"

  # The agent, and an ordinary app that plays sound and runs codecs in its own process, which
  # the boot check below runs on the booted image with SELinux enforcing. Both are Java
  # builds on the same JDK, so they share one runner.
  agent:
    name: Build the guest agent and the media probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the agent
        id: agent
        working-directory: dsa/guest/agent
        run: ./kotlin do assembleRelease

      # Unsigned: make-image.py signs it with the platform key.
      - name: Keep the agent
        if: ${{ !cancelled() && steps.agent.outcome == 'success' }}
        run: |
          mkdir -p .scratch/agent
          cp dsa/guest/agent/build/outputs/apk/release/dsa-agent-release-unsigned.apk .scratch/agent/DsaAgent.apk

      - if: ${{ !cancelled() && steps.agent.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-agent
          path: .scratch/agent/DsaAgent.apk
          if-no-files-found: error

      - name: Build the media probe
        id: media-probe
        if: ${{ !cancelled() }}
        run: bash dsa/guest/media-probe/build.sh .scratch/media-probe

      - if: ${{ !cancelled() && steps.media-probe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-media-probe
          path: .scratch/media-probe/dsa-media-probe.apk
          if-no-files-found: error

      # An app whose widgets need a setup, which the widget boot check places.
      - name: Build the widget probe
        id: widget-probe
        if: ${{ !cancelled() }}
        run: bash dsa/guest/widget-probe/build.sh .scratch/widget-probe

      - if: ${{ !cancelled() && steps.widget-probe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-widget-probe
          path: .scratch/widget-probe/dsa-widget-probe.apk
          if-no-files-found: error

      # An app whose only code is an ARM64 library, which the overlay check starts through
      # the ARM translator.
      - name: Build the ARM probe
        id: arm-probe
        if: ${{ !cancelled() }}
        run: bash dsa/guest/arm-probe/build.sh .scratch/arm-probe

      - if: ${{ !cancelled() && steps.arm-probe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-arm-probe
          path: .scratch/arm-probe/dsa-arm-probe.apk
          if-no-files-found: error

      # An app named as Google Play services, which the overlay check installs to see the
      # agent keep Play services' desktop-irrelevant components off across an update.
      - name: Build the Play services probe
        id: gms-probe
        if: ${{ !cancelled() }}
        run: bash dsa/guest/gms-probe/build.sh .scratch/gms-probe

      - if: ${{ !cancelled() && steps.gms-probe.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: guest-gms-probe
          path: .scratch/gms-probe/dsa-gms-probe.apk
          if-no-files-found: error


  # What the boot checks below run, built once on a runner of its own while the guest programs
  # and the images are made: the VM programs (crosvm, passt and gfxstream's renderer), and the
  # Linux host's programs with the five boot check binaries. The boot checks take them as
  # artifacts and need no Rust build of their own.
  boot-checks:
    name: Build the boot checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Keep the VM programs between runs
        uses: actions/cache@v4
        with:
          path: .scratch/vm-programs
          key: linux-vm-programs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('dsa/host/platform/linux/crosvm/**', 'dsa/graphics/host/**', 'dsa/graphics/patches/**', '.github/scripts/linux-vm/**') }}

      # crosvm's build script runs a uv script; a cache miss is the only time it runs here.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build crosvm, passt and gfxstream's renderer
        run: bash .github/scripts/linux-vm/build-vm-programs.sh .scratch/vm-programs

      - name: Keep the VM programs
        uses: actions/upload-artifact@v4
        with:
          name: boot-check-vm-programs
          path: |
            .scratch/vm-programs/crosvm
            .scratch/vm-programs/passt
            .scratch/vm-programs/libgfxstream_backend.so
          retention-days: 1
          if-no-files-found: error

      # No image is anywhere near this job: when the cache restored is not an exact match (a
      # changed Cargo.toml), rust-cache cleans Cargo's target folder and deletes every file in
      # it that is not Cargo's.
      - name: Keep the Rust build between runs
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: dsa -> target
          key: image-boot-check
          save-if: ${{ github.ref == 'refs/heads/develop' }}

      # The checks start the host's programs by the paths Cargo built them at
      # (CARGO_BIN_EXE_<name>), so each program is listed with that path and put back there on
      # the runner that boots.
      - name: Build the widget boot check
        working-directory: dsa
        run: |
          cargo test -p dsa-host-linux --test widgets --test system_screens --test media --test graphics --test overlays --no-run \
            --message-format=json-render-diagnostics > "$RUNNER_TEMP/boot-checks.json"
          cargo build -p dsa-host-linux --bin dsa-compositor --message-format=json-render-diagnostics >> "$RUNNER_TEMP/boot-checks.json"
          out="$GITHUB_WORKSPACE/.scratch/boot-checks"
          mkdir -p "$out/tests" "$out/bin"
          jq -r 'select(.reason == "compiler-artifact" and .executable != null and (.target.kind | index("test")) and .profile.test)
                 | "\(.target.name)\t\(.executable)"' "$RUNNER_TEMP/boot-checks.json" | sort -u |
            while IFS=$'\t' read -r name executable; do
              cp "$executable" "$out/tests/$name"
            done
          jq -r 'select(.reason == "compiler-artifact" and .executable != null and (.target.kind | index("bin")))
                 | "\(.target.name)\t\(.executable)"' "$RUNNER_TEMP/boot-checks.json" | sort -u > "$out/bin/programs.tsv"
          while IFS=$'\t' read -r name executable; do
            cp "$executable" "$out/bin/$name"
          done < "$out/bin/programs.tsv"
          for check in widgets system_screens media graphics overlays; do
            test -x "$out/tests/$check" || { echo "cargo built no $check boot check"; exit 1; }
          done
          for program in dsa-linux-hostd dsa-compositor dsa-devices dsa-gfx; do
            grep -q "^$program"$'\t' "$out/bin/programs.tsv" || { echo "cargo built no $program"; exit 1; }
          done
          ls -l "$out/tests" "$out/bin"
          cat "$out/bin/programs.tsv"

      - name: Keep the boot checks
        uses: actions/upload-artifact@v4
        with:
          name: boot-check-programs
          path: .scratch/boot-checks
          retention-days: 1
          if-no-files-found: error

  # Android's NDK samples hello-gl2 (OpenGL ES) and hello-vulkan, at a pinned commit, which
  # the graphics check below installs on the booted image and opens in task windows.
  graphics-test-apps:
    name: Build the graphics test apps
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up a JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "cmake;4.1.0"

      - name: Build the OpenGL ES and Vulkan test apps
        run: bash dsa/graphics/verify/build-test-apps.sh .scratch/graphics-test-apps

      - uses: actions/upload-artifact@v4
        with:
          name: graphics-test-apps
          path: |
            .scratch/graphics-test-apps/hello-gl2.apk
            .scratch/graphics-test-apps/hello-vulkan.apk
          if-no-files-found: error

  # The images. Android 17 on x86_64 is made by the boot-image job below with the same steps,
  # because the boot checks wait for that one image only, not for the whole matrix.
  image:
    name: Make and check the guest image (ubuntu-latest, Android ${{ matrix.android }}, ${{ matrix.arch }})
    needs: [guest-programs, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Pull requests cover both supported releases. A manual boot investigation
        # builds one release first, unless an explicit compatibility run asks for all.
        android: ${{ fromJSON(github.event_name == 'workflow_dispatch' && (inputs.android == 'all' && '["17", "16"]' || format('["{0}"]', inputs.android)) || '["17", "16"]') }}
        # ARM64 Windows hosts boot the arm64 image, which is 64-bit only.
        arch: [x86_64, arm64]
        exclude:
          - android: "17"
            arch: x86_64
    env:
      # Whether a checked image is kept in the Actions cache for the next run with the same
      # inputs. One image is about 3 GB there; the four would not fit in the repository's
      # 10 GB with the other caches, so only the one the boot checks wait for is kept.
      CACHE_IMAGE: "false"
      # Whether the image is handed to the boot checks.
      BOOT_IMAGE: "false"
    steps: &image-steps
      - uses: actions/checkout@v4

      # The inputs and the images take about 20 GB; the runner has less free by default.
      - name: Make room
        run: |
          # aapt2, which builds the system screen overlays, is in the SDK this step deletes.
          tools=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          mkdir -p .scratch
          cp -r "$tools" .scratch/build-tools
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install the disk tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdisk qemu-utils zip

      - name: Fetch the pinned inputs
        run: dsa/guest/image/fetch.sh ${{ matrix.android }} ${{ matrix.arch }}

      # The HCS image has no virtio GPU. Keep the exact Cuttlefish graphics payload in
      # the log while replacing its minigbm path with the Hyper-V gfxstream transport.
      - name: List the guest graphics payload
        run: |
          unzip -l .scratch/aosp-inputs/*/*target_files*.zip | \
            grep -Ei 'graphics|gralloc|mapper|opengl|vulkan|goldfish|ranchu|drm'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Fetch the selected guest graphics transport
        if: inputs.graphics_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.graphics_run }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name guest-gfxstream-hvsocket${{ matrix.arch == 'arm64' && '-arm64' || '' }} \
            --dir .scratch/guest-graphics

      - name: Download guest graphics transport from current commit
        if: inputs.graphics_run == ''
        uses: actions/download-artifact@v4
        with:
          name: guest-gfxstream-hvsocket${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/guest-graphics

      - name: Verify graphics libraries ELF dependencies
        run: |
          target_zip=$(echo .scratch/aosp-inputs/*/*target_files*.zip)
          for lib in .scratch/guest-graphics/libOpenglSystemCommon.so; do
            echo "Checking ELF dependencies for $lib..."
            needed=$(readelf -d "$lib" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')
            for dep in $needed; do
              if ! unzip -l "$target_zip" | grep -E "(VENDOR|SYSTEM)/lib64/(hw/|egl/)?$dep" >/dev/null 2>&1; then
                echo "Missing dependency $dep for $lib in image!" >&2
                exit 1
              fi
              echo "  OK: $dep found in image"
            done
          done

      - name: Check the guest Vulkan driver loads on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py .scratch/guest-graphics/vulkan.ranchu.so .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest control daemon
        uses: actions/download-artifact@v4
        with:
          name: guest-channeld${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/channeld

      - name: Download the guest hwcomposer
        uses: actions/download-artifact@v4
        with:
          name: guest-hwcomposer${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/hwcomposer

      - name: Check the hwcomposer starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/hwcomposer/dsa-hwcomposer .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest codec HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-codec2${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/codec2

      - name: Check the codec HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/codec2/dsa-codec2 .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest sensors HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-sensors${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/sensors

      - name: Check the sensors HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/sensors/dsa-sensors .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest camera HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-camera${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/camera

      - name: Check the camera HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/camera/dsa-camera .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest power and health HALs
        uses: actions/download-artifact@v4
        with:
          name: guest-power-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/power-hal

      - name: Check the power and health HALs start on the image
        run: |
          for hal in dsa-power dsa-health; do
            uv run dsa/graphics/check-guest-driver.py --executable ".scratch/power-hal/$hal" .scratch/aosp-inputs/*/*target_files*.zip
          done

      - name: Download the guest audio module
        uses: actions/download-artifact@v4
        with:
          name: guest-audio${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/audio

      - name: Check the audio module starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/audio/dsa-audio .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest GNSS HAL
        uses: actions/download-artifact@v4
        with:
          name: guest-gnss-hal${{ matrix.arch == 'arm64' && '-arm64' || '' }}
          path: .scratch/gnss-hal

      - name: Check the GNSS HAL starts on the image
        run: |
          uv run dsa/graphics/check-guest-driver.py --executable .scratch/gnss-hal/dsa-gnss .scratch/aosp-inputs/*/*target_files*.zip

      - name: Download the guest agent
        uses: actions/download-artifact@v4
        with:
          name: guest-agent
          path: .scratch/agent

      # The default ARM translator a released x86_64 Android 17 image carries, from the newest
      # release that has one, so the image booted below lays it over its system as a release
      # does and the overlay check has it to look at.
      - name: Download the default ARM translator
        id: translator
        if: matrix.android == '17' && matrix.arch == 'x86_64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          for tag in $(gh release list -R "$repo" -L 50 --json tagName -q '.[] | select(.tagName | startswith("android-17") and (endswith("-arm64") | not)) | .tagName'); do
            if gh release view "$tag" -R "$repo" --json assets -q '.assets[].name' | grep -qx 'arm-translation.zip'; then
              echo "default ARM translator from: $tag"
              gh release download "$tag" -R "$repo" -p arm-translation.zip -D "$RUNNER_TEMP/arm-translation-zip"
              unzip -o "$RUNNER_TEMP/arm-translation-zip/arm-translation.zip" -d .scratch/arm-translation
              rm -rf "$RUNNER_TEMP/arm-translation-zip"
              ls -l .scratch/arm-translation
              echo "args=--arm-translation .scratch/arm-translation" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::no published x86_64 Android 17 image release carries arm-translation.zip"
          exit 1

      # Everything that decides the image names its cache entry: the pinned AOSP build
      # (inputs.json), make-image.py and every file beside it (they name the image's build
      # tag too), the files it lays into the image from the rest of dsa/guest, the framework
      # lock, the guest programs and the agent built above, the default ARM translator, the
      # arguments the image is made with, and the tools that make it. The key set is not an
      # input: each run makes a throwaway one, so the one an image was signed with is kept with
      # it, and the check below reads that one.
      - name: Name the image's inputs
        id: image-key
        run: |
          args=(--major "${{ matrix.android }}" --arch ${{ matrix.arch }} --keys .scratch/image-keys)
          args+=(--graphics-dir .scratch/guest-graphics --graphics-library .scratch/guest-graphics/libOpenglSystemCommon.so)
          args+=(--channeld .scratch/channeld/dsa-channeld)
          args+=(--su-client .scratch/channeld/su)
          args+=(--hwcomposer .scratch/hwcomposer/dsa-hwcomposer)
          args+=(--codec2 .scratch/codec2/dsa-codec2)
          args+=(--audio .scratch/audio/dsa-audio)
          args+=(--sensors .scratch/sensors/dsa-sensors)
          args+=(--camera .scratch/camera/dsa-camera)
          args+=(--power-hal .scratch/power-hal)
          args+=(--gnss-hal .scratch/gnss-hal/dsa-gnss)
          args+=(--agent .scratch/agent/DsaAgent.apk)
          args+=(--aapt2 .scratch/build-tools/aapt2)
          args+=(${{ steps.translator.outputs.args }})
          # The direct-mapped measurement's image: its read-only partitions uncompressed, so
          # that every file of them is mapped.
          if [[ "${UNCOMPRESSED_EROFS:-false}" == true ]]; then
            args+=(--uncompressed-erofs)
          fi
          printf '%s\n' "${args[@]}" > .scratch/image-args
          programs=(.scratch/guest-graphics .scratch/channeld .scratch/hwcomposer .scratch/codec2 .scratch/audio
                    .scratch/sensors .scratch/camera .scratch/power-hal .scratch/gnss-hal .scratch/agent
                    .scratch/build-tools/aapt2)
          [[ -d .scratch/arm-translation ]] && programs+=(.scratch/arm-translation)
          {
            echo "runner: $ImageOS"
            sed 's/^/argument: /' .scratch/image-args
            find "${programs[@]}" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            sgdisk --version | head -1
            qemu-img --version | head -1
          } | tee "$RUNNER_TEMP/image-inputs.txt"
          inputs="$(sha256sum < "$RUNNER_TEMP/image-inputs.txt" | cut -c1-16)"
          prefix="guest-image-android-${{ matrix.android }}-${{ matrix.arch }}-"
          # Braces: the hash is hex, so "$prefix<hash>" would name one unset variable.
          key="${prefix}${{ hashFiles('dsa/android-versions.json', 'dsa/guest/image/**', 'dsa/guest/framework/**', 'dsa/guest/*/*.rc', 'dsa/guest/*/*.xml', '!dsa/guest/**/__pycache__/**') }}-$inputs"
          echo "the image's key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Take the image made from the same inputs
        id: image-cache
        if: env.CACHE_IMAGE == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            dsa/target/image
            .scratch/image-keys
          key: ${{ steps.image-key.outputs.key }}

      - name: Use the image from the cache
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: ls -l dsa/target/image/*/ .scratch/image-keys

      - name: Make a throwaway key set
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: dsa/guest/image/make-keys.sh .scratch/image-keys

      - name: Make the image
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          mapfile -t args < .scratch/image-args
          uv run dsa/guest/image/make-image.py "${args[@]}"

      # Runs on every image, the one from the cache too.
      - name: Check the image
        run: uv run dsa/guest/image/check-image.py dsa/target/image/*/ .scratch/image-keys

      - name: Keep the ramdisk and the manifest
        uses: actions/upload-artifact@v4
        with:
          name: image-android-${{ matrix.android }}-${{ matrix.arch }}${{ env.UNCOMPRESSED_EROFS == 'true' && '-uncompressed' || '' }}
          path: |
            dsa/target/image/*/image.json
            dsa/target/image/*/initrd.img

      - name: Keep the guest disk
        if: inputs.keep_disk
        uses: actions/upload-artifact@v4
        with:
          name: image-disk-android-${{ matrix.android }}-${{ matrix.arch }}${{ env.UNCOMPRESSED_EROFS == 'true' && '-uncompressed' || '' }}
          path: |
            dsa/target/image/*/system.vhdx
            dsa/target/image/*/data.vhdx
            dsa/target/image/*/image.json
            dsa/target/image/*/initrd.img
          if-no-files-found: error

      # What the boot checks boot: the image as a host installs it (no signed build inputs),
      # with the kernel the boot-kernel job builds from the same commit.
      - name: Keep the image for the boot checks
        if: env.BOOT_IMAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BOOT_IMAGE_ARTIFACT || 'boot-image' }}
          path: |
            dsa/target/image/
            !dsa/target/image/*/signed-target_files.zip
          # The disks are compressed already; the time goes to the boot checks instead.
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

      # The partition images in the signed build are what the system disk already holds, and
      # nothing reads them after the disk is made (the check above does not), so the cache
      # keeps the build without them: about 3 GB for the image instead of about 5 GB.
      - name: Leave out the partition images the system disk holds
        if: >-
          env.CACHE_IMAGE == 'true' && steps.image-cache.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/develop'
        run: |
          zip -d dsa/target/image/*/signed-target_files.zip 'IMAGES/*' >/dev/null || test $? -eq 12
          ls -l dsa/target/image/*/

      - name: Keep the image for the next run with the same inputs
        if: >-
          env.CACHE_IMAGE == 'true' && steps.image-cache.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v4
        with:
          path: |
            dsa/target/image
            .scratch/image-keys
          key: ${{ steps.image-key.outputs.key }}

      - name: Delete the image it replaces from the cache
        if: >-
          env.CACHE_IMAGE == 'true' && steps.image-cache.outputs.cache-hit != 'true'
          && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/cache/prune.sh superseded "${{ steps.image-key.outputs.prefix }}" "${{ steps.image-key.outputs.key }}"

  # Android 17 on x86_64: made and checked with the image job's steps, kept in the cache, and
  # handed to the boot checks. One combination is enough to boot, and the runner's KVM is x86_64.
  boot-image:
    name: Make and check the guest image (ubuntu-latest, Android ${{ matrix.android }}, ${{ matrix.arch }})
    needs: [guest-programs, agent]
    if: github.event_name != 'workflow_dispatch' || inputs.android == '17' || inputs.android == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Deletes the cached image a new one replaces.
      actions: write
    strategy:
      matrix:
        android: ["17"]
        arch: [x86_64]
    env:
      CACHE_IMAGE: "true"
      BOOT_IMAGE: "true"
    steps: *image-steps

  # The same image with its read-only partitions uncompressed, which the direct-mapped
  # measurement boots: erofs maps only a file stored whole, so this is the image whose every
  # file the host's direct-mapped mode maps. Not cached: one image fills the cache's share for
  # images. It may fail without holding up the other boot checks, which boot the image above;
  # the measurement then fails for want of its image.
  direct-mapped-image:
    name: Make and check the uncompressed guest image (ubuntu-latest, Android ${{ matrix.android }}, ${{ matrix.arch }})
    needs: [guest-programs, agent]
    if: github.event_name != 'workflow_dispatch' || inputs.android == '17' || inputs.android == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      matrix:
        android: ["17"]
        arch: [x86_64]
    env:
      CACHE_IMAGE: "false"
      BOOT_IMAGE: "true"
      BOOT_IMAGE_ARTIFACT: direct-mapped-boot-image
      UNCOMPRESSED_EROFS: "true"
    steps: *image-steps

  # The kernel the boot checks boot, built from this commit's dsa/kernel/ rather than taken
  # from the newest release, so the checks run on the kernel this change ships (the su guard
  # included). The build runs beside the image's and is cached on its inputs, so a run whose
  # kernel inputs did not change takes it from the cache in about a minute.
  boot-kernel:
    name: Build the guest kernel for the boot checks (x86_64)
    if: github.event_name != 'workflow_dispatch' || inputs.android == '17' || inputs.android == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Deletes the cached kernel a new one replaces.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Build the guest kernel
        uses: ./.github/actions/guest-kernel
        with:
          arch: x86_64
          out: ${{ github.workspace }}/.scratch/kernel-boot
          save: ${{ github.ref == 'refs/heads/develop' }}
          token: ${{ github.token }}

      # build.sh names the kernel bzImage-<release>; the boot checks take it as bzImage.
      - name: Name the kernel bzImage
        run: |
          kernel="$(ls .scratch/kernel-boot/bzImage-*)"
          cp "$kernel" .scratch/kernel-boot/bzImage

      - name: Keep the kernel for the boot checks
        uses: actions/upload-artifact@v4
        with:
          name: boot-kernel
          path: .scratch/kernel-boot/bzImage
          retention-days: 1
          if-no-files-found: error

  # The image booted under crosvm by the service, once per check, each on a runner of its own
  # and all at once. Each check runs even when another failed, so one failure does not hide
  # the others; the workflow still fails.
  #
  # widgets: the digital clock widget placed through the local API. Its pictures must reach the
  # client, show something and change as the clock ticks, and the guest log must not say a
  # widget failed to draw. Then the widget probe's widgets, which need a setup: each setup must
  # open as the probe's own focused task window, a finished one places its widget, a canceled
  # one does not, one that finishes at once places it, and an optional one is skipped.
  #
  # system_screens: Settings opened in a window 800 dp tall and one 520 dp tall and read
  # through adb in developer mode: its view hierarchy and the screen. The home page's large
  # title must open expanded in the tall window and fold when the list scrolls, and open folded
  # in the short one, and the rows of a Settings list must be grouped in rounded cards on the
  # screen.
  #
  # media: SELinux enforcing, and an ordinary app (the media probe) installed through adb. In
  # its own process it must play sound through a streaming and a static track, which share
  # memory with the audio server, and encode a second of H.264 and AAC and decode each with
  # every decoder the guest lists, and the guest log must show no denial of a media service's
  # shared memory.
  #
  # root: the same probe, SELinux enforcing, three boots. With root elevation on and the probe
  # set to ask, su is visible to it; a refused call fails once and the approval request names
  # the app, its icon and the command; an unanswered call times out after about a minute; an
  # approved one runs as uid 0, and the next call within the grace runs without asking again.
  # With root elevation off, su is absent at every path for every way of looking and the
  # helper is not running. The kernel's su guard is in the kernel the boot-kernel job built.
  #
  # overlays: SELinux enforcing, two boots. First with the image's default ARM translator: the
  # package must be mounted, each part of it bound onto its own empty place (nothing on
  # /system/bin, /system/lib64 or /system/etc), binfmt_misc mounted, a small ARM64 program for
  # each of the package's rules running through the translator (the shell may not read
  # binfmt_misc, so a program that runs is what proves its rule registered), the bridge where
  # the zygote loads it, and arm64-v8a offered. Then with a small
  # Google apps build, installed through the local API from a mirror in the check's folder:
  # after Android starts again the image must be mounted and laid over each folder of /product
  # and /system_ext it fills, never a partition's root. Both images must be mounted straight
  # from their files with directio, with no loop device behind them. Google Play services must
  # be the framework's device configurator, the compile of the Google apps without an app image
  # must end with the app image format restored, and no alarm may fire as a storm. In neither
  # boot may init log a failed command of the scripts, a denial of a mount or of the
  # translator, or overlayfs a failure.
  #
  # idle reclaim: a measurement, which fails when it cannot measure and when an alarm fired as
  # a storm (Play services' flag sync retried every second while it could not write
  # DeviceConfig). LiteGapps' own build
  # is downloaded into the mirror (the small one stands in, with a warning, when LiteGapps
  # cannot be reached) and installed, Android starts again with no app window, and a sampler in
  # the guest looks once a second for five minutes: how often the idle reclaim and the trim
  # run, the kernel time init spends in each, the guest's processor time, the refaults and
  # reads around each run, and which processes faulted file pages in between. The report goes
  # to the job summary and the artifact, with the raw samples and the guest log.
  #
  # graphics: the host renderer on Mesa's software Vulkan driver. hello-gl2 (OpenGL ES through
  # ANGLE) and hello-vulkan are installed through the local API and opened in task windows,
  # whose pictures must show each app's triangle on its fading grey background, neither app may
  # be relaunched after it opens (Android starts at the density its window asks for), and the fixed
  # Vulkan CTS subset runs, each case with its own result. The two share one boot; the CTS
  # takes most of the step.
  boot-check:
    name: ${{ matrix.check }} (ubuntu-latest, Android 17, x86_64)
    needs: [boot-image, boot-checks, graphics-test-apps, boot-kernel, direct-mapped-image]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: Place a widget on the booted image
            test: widgets
            timeout: 15
            keep: Keep the widget boot check's logs
            artifact: widget-boot-logs
            logs: |
              /tmp/widget-test-*/hostd.log
              /tmp/widget-test-*/compositor.log
              /tmp/widget-test-*/devices.log
              /tmp/widget-test-*/guest.log
              /tmp/widget-test-*/first.png
              ~/.local/share/dsa/**/*.log
          - check: Check Android's system screens on the booted image
            test: system_screens
            timeout: 14
            keep: Keep the system screens' captures
            artifact: system-screens-captures
            logs: |
              /tmp/screens-test-*/*.png
              /tmp/screens-test-*/*.xml
              /tmp/screens-test-*/*.log
          - check: Play sound and run codecs in an app on the booted image
            test: media
            timeout: 18
            keep: Keep the media check's logs
            artifact: media-check-logs
            # The root check boots on a runner of its own, below.
            filter: --skip fr35_an_app_needs_approval_and_su_is_hidden_when_disabled
            logs: |
              .scratch/media-*/*.log
              .scratch/media-*/*.txt
          - check: Approve and refuse root for an app on the booted image
            test: media
            timeout: 23
            keep: Keep the root check's logs
            artifact: root-check-logs
            filter: fr35_
            logs: |
              .scratch/root-*/*.log
              .scratch/root-*/*.txt
              ~/.local/share/dsa/logs/android-console.log*
          - check: Run the Vulkan CTS subset and the graphics test apps on the booted image
            test: graphics
            timeout: 28
            keep: Keep the graphics check's results
            artifact: graphics-check-results
            logs: |
              /tmp/graphics-test-*/cts/
              /tmp/graphics-test-*/*.png
              /tmp/graphics-test-*/*.log
          - check: Lay the ARM translator and Google Play over the booted system
            test: overlays
            timeout: 18
            keep: Keep the overlay check's logs
            artifact: overlay-check-logs
            # The idle reclaim and memory measurements boot on runners of their own, below.
            filter: --skip nfr3_the_idle_reclaim_with_google_apps_is_measured --skip nfr1_the_memory_with_google_play_and_one_app_window_is_measured --skip nfr1_nfr2_the_direct_mapped_disks_are_measured_against_the_cached_ones
            logs: |
              /tmp/overlays-test-*/*.log
              /tmp/overlays-test-*/*.txt
          - check: Measure the idle reclaim with Google Play on the booted image
            test: overlays
            timeout: 25
            keep: Keep the idle reclaim measurement
            artifact: idle-reclaim-measurement
            filter: nfr3_the_idle_reclaim_with_google_apps_is_measured
            summary: /tmp/overlays-test-*/idle-reclaim.md
            logs: |
              /tmp/overlays-test-*/*.log
              /tmp/overlays-test-*/idle-reclaim*
              /tmp/overlays-test-*/google-play-mounts.txt
          # Every release shows its memory with Google Play and one app window; the check fails
          # only on a large regression against the recorded baseline.
          - check: Measure the memory with Google Play and one app window on the booted image
            test: overlays
            timeout: 25
            keep: Keep the memory measurement
            artifact: memory-measurement
            filter: nfr1_the_memory_with_google_play_and_one_app_window_is_measured
            summary: /tmp/overlays-test-*/memory.md
            logs: |
              /tmp/overlays-test-*/*.log
              /tmp/overlays-test-*/memory*
              /tmp/overlays-test-*/google-play-mounts.txt
          # The host's direct-mapped mode (off by default) against the cached disks: the image
          # with uncompressed partitions, booted with its read-only disks on virtio-pmem, mapped
          # with DAX, and then on virtio-blk, with Google Play and one app window each time. The
          # guest's page cache and the VM's memory of both go on the job's page.
          - check: Measure the direct-mapped read-only disks against the cached ones on the booted image
            test: overlays
            image: direct-mapped
            timeout: 40
            keep: Keep the direct-mapped measurement
            artifact: direct-mapped-measurement
            filter: nfr1_nfr2_the_direct_mapped_disks_are_measured_against_the_cached_ones
            summary: /tmp/overlays-test-*/direct-mapped.md
            logs: |
              /tmp/overlays-test-*/*.log
              /tmp/overlays-test-*/direct-mapped*
              /tmp/overlays-test-*/cached*
              /tmp/overlays-test-*/google-play-mounts.txt
    steps:
      - uses: actions/checkout@v4

      - name: Download the VM programs
        uses: actions/download-artifact@v4
        with:
          name: boot-check-vm-programs
          path: .scratch/vm-programs

      # Where the package puts them, so the package's AppArmor profile lets crosvm and passt
      # make their sandboxes' user namespaces, as on an installed system.
      - name: Install the VM programs as the package does
        run: |
          sudo install -d /usr/lib/dsa/bin
          sudo install -m 0755 .scratch/vm-programs/crosvm .scratch/vm-programs/passt .scratch/vm-programs/libgfxstream_backend.so /usr/lib/dsa/bin/
          sudo install -m 0644 dsa/host/platform/linux/packaging/apparmor/dsa-vm /etc/apparmor.d/dsa-vm
          sudo apparmor_parser -r -W /etc/apparmor.d/dsa-vm
          echo "DSA_CROSVM=/usr/lib/dsa/bin/crosvm" >> "$GITHUB_ENV"

      - name: Load KVM and vhost-vsock
        run: |
          sudo modprobe vhost_vsock
          sudo chmod 666 /dev/kvm /dev/vhost-vsock
          ls -l /dev/kvm /dev/vhost-vsock

      # Out of Cargo's target folder: the image is never kept where rust-cache cleans.
      - name: Download the image
        if: matrix.image != 'direct-mapped'
        uses: actions/download-artifact@v4
        with:
          name: boot-image
          path: .scratch/boot-image

      - name: Download the image with uncompressed partitions
        if: matrix.image == 'direct-mapped'
        uses: actions/download-artifact@v4
        with:
          name: direct-mapped-boot-image
          path: .scratch/direct-mapped-image

      - name: Download the kernel built from this commit
        uses: actions/download-artifact@v4
        with:
          name: boot-kernel
          path: .scratch/boot-kernel

      - name: Select the boot check image and kernel
        run: |
          test -f .scratch/boot-kernel/bzImage || { echo "the boot-kernel job left no bzImage"; exit 1; }
          echo "DSA_WIDGET_TEST_KERNEL=$PWD/.scratch/boot-kernel/bzImage" >> "$GITHUB_ENV"
          if [[ "${{ matrix.image }}" == direct-mapped ]]; then
            image="$(ls -d "$PWD"/.scratch/direct-mapped-image/*/ | head -1)"
            jq -e '.direct_mapped.uncompressed_erofs == true' "$image/image.json" \
              || { echo "the direct-mapped measurement's image is not uncompressed"; exit 1; }
          else
            image="$(ls -d "$PWD"/.scratch/boot-image/*/ | head -1)"
          fi
          test -f "$image/system.vhdx" || { echo "the downloaded image has no system.vhdx"; exit 1; }
          ls -l "$image"
          echo "DSA_WIDGET_TEST_IMAGE=$image" >> "$GITHUB_ENV"

      # The host's programs go back to the paths the check was built to start them from.
      - name: Download the boot checks
        uses: actions/download-artifact@v4
        with:
          name: boot-check-programs
          path: .scratch/boot-checks

      - name: Install the boot checks
        run: |
          chmod +x .scratch/boot-checks/tests/* .scratch/boot-checks/bin/*
          while IFS=$'\t' read -r name executable; do
            mkdir -p "$(dirname "$executable")"
            cp .scratch/boot-checks/bin/"$name" "$executable"
            echo "$name: $executable"
          done < .scratch/boot-checks/bin/programs.tsv

      # adb reads the booted image's screens and installs the media probe.
      - name: Find adb
        run: |
          mkdir -p .scratch
          cp -r "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools" .scratch/platform-tools
          .scratch/platform-tools/adb version

      - name: Download the media probe
        if: matrix.test == 'media'
        uses: actions/download-artifact@v4
        with:
          name: guest-media-probe
          path: .scratch/media-probe

      - name: Download the widget probe
        if: matrix.test == 'widgets'
        uses: actions/download-artifact@v4
        with:
          name: guest-widget-probe
          path: .scratch/widget-probe

      - name: Download the ARM probe
        if: matrix.test == 'overlays'
        uses: actions/download-artifact@v4
        with:
          name: guest-arm-probe
          path: .scratch/arm-probe

      - name: Download the Play services probe
        if: matrix.test == 'overlays'
        uses: actions/download-artifact@v4
        with:
          name: guest-gms-probe
          path: .scratch/gms-probe

      - name: Download the graphics test apps
        if: matrix.test == 'graphics'
        uses: actions/download-artifact@v4
        with:
          name: graphics-test-apps
          path: .scratch/graphics-test-apps

      # verify.py fetches and runs the Vulkan CTS through uv.
      - name: Set up uv
        if: matrix.test == 'graphics'
        uses: astral-sh/setup-uv@v5

      # Only the CTS APK, which verify.py pins by size and checksum; the mustpass lists it
      # reads are small and fetched again, so a new pin never meets an old list.
      - name: Keep the Vulkan CTS between runs
        if: matrix.test == 'graphics'
        uses: actions/cache@v4
        with:
          path: .scratch/graphics-verify/com.drawelements.deqp.apk
          key: vk-cts-apk-${{ hashFiles('dsa/graphics/verify/verify.py') }}
          restore-keys: vk-cts-apk-

      - name: Fetch the Vulkan CTS and expand the subset
        if: matrix.test == 'graphics'
        run: uv run dsa/graphics/verify/verify.py fetch-cts

      # Android's renderer runs in the window manager (dsa-compositor), which needs a desktop
      # session: a headless Wayland compositor stands in for it, with Mesa's software Vulkan
      # driver in place of a GPU.
      - name: Install a headless Wayland compositor and a software Vulkan driver
        timeout-minutes: 20
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections
          sudo apt-get update
          for try in 1 2 3; do
            timeout 300 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              weston libxkbcommon0 mesa-vulkan-drivers libvulkan1 dbus-daemon && break
            test "$try" -lt 3 || exit 1
          done

      # Cargo runs a check from its package's folder, so the check runs from there too. A check
      # that finds no crosvm or image says it was skipped and passes; here that is a failure.
      - name: ${{ matrix.check }}
        timeout-minutes: ${{ matrix.timeout }}
        working-directory: dsa/host/platform/linux
        run: |
          # The service finds the user's session in /run/user/<uid>, as on a desktop.
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          chmod 0700 "$XDG_RUNTIME_DIR"
          export GFXSTREAM_BACKEND_PATH=/usr/lib/dsa/bin/libgfxstream_backend.so
          # A session bus at the place a desktop has it.
          dbus-daemon --session --address="unix:path=$XDG_RUNTIME_DIR/bus" --fork
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          weston --backend=headless --socket=wayland-dsa --idle-time=0 --width=1920 --height=1080 &
          for _ in $(seq 50); do
            [[ -S "$XDG_RUNTIME_DIR/wayland-dsa" ]] && break
            sleep 0.2
          done
          export WAYLAND_DISPLAY=wayland-dsa
          export DSA_ADB="$GITHUB_WORKSPACE/.scratch/platform-tools/adb"
          if [[ "${{ matrix.test }}" == media ]]; then
            export DSA_MEDIA_PROBE="$GITHUB_WORKSPACE/.scratch/media-probe/dsa-media-probe.apk"
          fi
          if [[ "${{ matrix.test }}" == widgets ]]; then
            export DSA_WIDGET_PROBE="$GITHUB_WORKSPACE/.scratch/widget-probe/dsa-widget-probe.apk"
          fi
          if [[ "${{ matrix.test }}" == overlays ]]; then
            export DSA_ARM_PROBE="$GITHUB_WORKSPACE/.scratch/arm-probe/dsa-arm-probe.apk"
            export DSA_GMS_PROBE="$GITHUB_WORKSPACE/.scratch/gms-probe/dsa-gms-probe.apk"
          fi
          if [[ "${{ matrix.test }}" == graphics ]]; then
            # Lavapipe is the only Vulkan driver on the runner; naming it keeps it so.
            icd="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)"
            export VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd"
            export DSA_GRAPHICS_TEST_APPS="$GITHUB_WORKSPACE/.scratch/graphics-test-apps"
          fi
          set -o pipefail
          "$GITHUB_WORKSPACE/.scratch/boot-checks/tests/${{ matrix.test }}" --nocapture --test-threads 1 ${{ matrix.filter }} 2>&1 |
            tee "$RUNNER_TEMP/check.log"
          if grep -q 'skipped: DSA_' "$RUNNER_TEMP/check.log"; then
            echo "::error::the ${{ matrix.test }} boot check found nothing to boot and skipped"
            exit 1
          fi

      # A measurement's report goes on the job's page as well as into its artifact.
      - name: Write the measurement to the job summary
        if: always() && matrix.summary
        run: |
          for report in ${{ matrix.summary }}; do
            if [[ -f "$report" ]]; then
              cat "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: ${{ matrix.keep }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.logs }}
          include-hidden-files: true
          if-no-files-found: ignore
